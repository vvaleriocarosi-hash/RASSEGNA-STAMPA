<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rassegna Stampa Inglese — World News Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" onerror="this.remove()">
<style>
:root{
  --navy:#10233F;
  --navy-2:#1F3A5F;
  --white:#FFFFFF;
  --paper:#FBFBFA;
  --red:#8C1D24;
  --yellow:#F5C518;
  --border:#E4E1D9;
  --shadow:0 2px 10px rgba(16,35,63,0.08);
  --geo:#8C1D24;
  --eco:#F5C518;
  --tec:#1F3A5F;
  --pol:#C1443B;
  --soc:#E0A106;
  --med:#3D6690;
  --font-body:'Poppins','Segoe UI',system-ui,sans-serif;
  --font-head:'Avenir','Avenir Next','Poppins','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--white);
  color:var(--navy);
  font-family:var(--font-body);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:var(--font-head);margin:0 0 .4em;}
a{color:inherit;}
button{font-family:var(--font-body);cursor:pointer;}
::selection{background:var(--yellow);color:var(--navy);}

/* ---------- topbar ---------- */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--navy);
  color:#fff;
  padding:10px 20px;
  display:flex;align-items:center;gap:16px;
  flex-wrap:wrap;
  box-shadow:0 2px 8px rgba(0,0,0,0.15);
}
.brand{
  font-family:var(--font-head);
  font-weight:700;
  font-size:1.15rem;
  letter-spacing:.02em;
  white-space:nowrap;
  margin-right:8px;
}
.brand .dot{color:var(--yellow);}
.pillnav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1;}
.pill{
  border:1px solid rgba(255,255,255,0.25);
  background:transparent;
  color:#fff;
  border-radius:999px;
  padding:6px 14px;
  font-size:.82rem;
  display:flex;align-items:center;gap:6px;
  white-space:nowrap;
  transition:background .15s,border-color .15s,color .15s;
}
.pill:hover{background:rgba(255,255,255,0.12);}
.pill.active{background:var(--yellow);color:var(--navy);border-color:var(--yellow);font-weight:600;}
.pill .cat-dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
.pill.daily{border-color:var(--yellow);color:var(--yellow);margin-left:6px;padding-left:14px;position:relative;}
.pill.daily::before{content:'';position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:1px;height:20px;background:rgba(255,255,255,0.25);}
.pill.daily.active{background:var(--yellow);color:var(--navy);}
.langswitch{display:flex;border:1px solid rgba(255,255,255,0.3);border-radius:999px;overflow:hidden;margin-left:auto;}
.langswitch button{background:transparent;color:#fff;border:none;padding:6px 12px;font-size:.8rem;font-weight:600;}
.langswitch button.active{background:var(--yellow);color:var(--navy);}

/* ---------- hero ---------- */
.hero{
  padding:44px 20px 30px;
  max-width:1100px;margin:0 auto;
  text-align:left;
}
.hero h1{font-size:2rem;color:var(--navy);}
.hero p{color:#45536b;max-width:640px;font-size:1rem;}
.hero .stats{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap;}
.hero .stat{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:10px 16px;min-width:110px;}
.hero .stat b{display:block;font-size:1.3rem;color:var(--red);font-family:var(--font-head);}
.hero .stat span{font-size:.75rem;color:#66748c;}

section{max-width:1100px;margin:0 auto;padding:26px 20px;}
.section-title{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
.section-title h2{font-size:1.3rem;border-bottom:3px solid var(--yellow);padding-bottom:4px;display:inline-block;}
.section-sub{color:#66748c;font-size:.85rem;margin-bottom:14px;}

/* ---------- view-all control ---------- */
.viewall-row{display:flex;justify-content:center;margin-top:16px;}
.viewall-btn{
  display:none;
  background:var(--white);border:1.5px solid var(--navy-2);color:var(--navy-2);
  border-radius:999px;padding:9px 22px;font-size:.85rem;font-weight:600;
  transition:background .15s,color .15s;
}
.viewall-btn:hover{background:var(--navy-2);color:#fff;}
.viewall-btn.expanded{border-color:var(--red);color:var(--red);}
.viewall-btn.expanded:hover{background:var(--red);color:#fff;}

/* ---------- daily update ---------- */
.topic-tabs{display:flex;gap:10px;margin-bottom:8px;flex-wrap:wrap;overflow:hidden;}
.topic-tabs.expanded{overflow:visible;}
.topic-tab{
  border:1px solid var(--border);background:var(--paper);color:var(--navy);
  border-radius:10px;padding:10px 18px;font-size:.85rem;font-weight:600;
  text-align:left;min-width:170px;
}
.topic-tab .tt-name{display:block;font-family:var(--font-head);font-size:.92rem;}
.topic-tab .tt-count{display:block;font-weight:400;font-size:.72rem;color:#66748c;margin-top:2px;}
.topic-tab.active{background:var(--navy);color:#fff;border-color:var(--navy);}
.topic-tab.active .tt-count{color:#c9d4e6;}
.topic-desc{font-size:.85rem;color:#45536b;margin:10px 0 14px;font-style:italic;}
.daily-feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;overflow:hidden;}

/* ---------- cards ---------- */
.feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;overflow:hidden;}
.card{
  background:var(--white);
  border:1px solid var(--border);
  border-radius:12px;
  padding:16px;
  box-shadow:var(--shadow);
  cursor:pointer;
  display:flex;flex-direction:column;gap:10px;
  transition:transform .12s,box-shadow .12s;
}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,35,63,0.13);}
.card-head{display:flex;align-items:center;gap:10px;}
.avatar{
  width:36px;height:36px;border-radius:50%;
  background:var(--navy);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:700;flex-shrink:0;
  font-family:var(--font-head);
}
.card-head-meta{flex:1;min-width:0;}
.card-country{font-size:.78rem;color:#66748c;}
.card-date{font-size:.72rem;color:#9aa5b8;}
.cat-chip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:600;color:var(--navy);background:var(--paper);border:1px solid var(--border);border-radius:999px;padding:3px 10px;}
.cat-chip .cat-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.card h3{font-size:1rem;line-height:1.35;}
.card .summary{font-size:.88rem;color:#33415c;}
mark.term{background:var(--yellow);color:var(--navy);padding:0 3px;border-radius:3px;cursor:pointer;font-weight:600;box-decoration-break:clone;}
mark.term:hover{background:#ffd84d;}
.card-footer{margin-top:auto;padding-top:8px;border-top:1px solid var(--border);}

.sources-row{display:flex;flex-direction:column;gap:5px;}
.source-item{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:.74rem;}
.source-link{color:var(--navy-2);text-decoration:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.source-link:hover{text-decoration:underline;color:var(--red);}
.stars{color:var(--yellow);letter-spacing:1px;font-size:.8rem;flex-shrink:0;}
.stars .off{color:#dcdcdc;}

/* ---------- calendar ---------- */
.cal-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.cal-head button{background:var(--paper);border:1px solid var(--border);border-radius:8px;padding:6px 12px;font-size:.9rem;color:var(--navy);}
.cal-head button:hover{background:#f0ede4;}
.cal-head .cal-label{font-weight:600;font-family:var(--font-head);min-width:150px;text-align:center;}
.cal-reset{margin-left:auto;background:var(--yellow)!important;border-color:var(--yellow)!important;font-weight:600;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{text-align:center;font-size:.7rem;color:#9aa5b8;font-weight:600;padding-bottom:4px;}
.cal-day{
  min-height:56px;border:1px solid var(--border);border-radius:8px;
  padding:6px;font-size:.78rem;background:var(--paper);
  display:flex;flex-direction:column;gap:4px;position:relative;
}
.cal-day.has-items{cursor:pointer;background:#fff;}
.cal-day.has-items:hover{border-color:var(--yellow);}
.cal-day.empty{visibility:hidden;}
.cal-day.selected{border:2px solid var(--red);background:#fdf1f1;}
.cal-daynum{font-weight:600;color:var(--navy);}
.cal-dots{display:flex;flex-wrap:wrap;gap:3px;}
.cal-dot{width:6px;height:6px;border-radius:50%;}

/* ---------- map ---------- */
#map-wrap{position:relative;width:100%;height:480px;background:var(--paper);border:1px solid var(--border);border-radius:12px;overflow:hidden;}
#map-svg{width:100%;height:100%;}
.map-fallback{display:flex;align-items:center;justify-content:center;height:100%;color:#66748c;font-size:.9rem;text-align:center;padding:20px;}
.map-pin{cursor:pointer;}
.map-pin circle{stroke:#fff;stroke-width:1.5px;}
.map-pin text{font-size:9px;font-family:var(--font-body);fill:var(--navy);pointer-events:none;}
.map-tooltip{
  position:absolute;pointer-events:none;background:var(--navy);color:#fff;
  padding:8px 12px;border-radius:8px;font-size:.78rem;max-width:240px;
  box-shadow:0 4px 14px rgba(0,0,0,0.25);opacity:0;transition:opacity .1s;z-index:5;
}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:.78rem;color:#45536b;}
.legend .item{display:flex;align-items:center;gap:6px;}
.legend .cat-dot{width:9px;height:9px;border-radius:50%;}
.legend .item.special .cat-dot{border:2px dashed #fff;box-shadow:0 0 0 1px currentColor;}

/* ---------- timeline ---------- */
.tl-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:var(--paper);padding:16px;}
.tl-lane{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--border);min-width:900px;}
.tl-lane:last-child{border-bottom:none;}
.tl-lane-label{width:130px;flex-shrink:0;font-size:.78rem;font-weight:600;color:var(--navy);}
.tl-track{position:relative;flex:1;height:22px;}
.tl-dot{position:absolute;top:2px;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,0.1);cursor:pointer;}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(16,35,63,0.55);z-index:50;display:none;align-items:flex-start;justify-content:center;overflow-y:auto;padding:40px 16px;}
.overlay.open{display:flex;}
.modal{background:#fff;border-radius:14px;max-width:640px;width:100%;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,0.3);position:relative;}
.modal .close-btn{position:absolute;top:14px;right:14px;background:var(--paper);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;font-size:1rem;color:var(--navy);}
.modal-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.modal h2{font-size:1.3rem;margin-bottom:10px;}
.modal .detail{font-size:.92rem;color:#33415c;margin:14px 0;}
.modal .cta{display:inline-block;background:var(--navy);color:#fff;text-decoration:none;padding:10px 18px;border-radius:8px;font-size:.85rem;font-weight:600;margin:6px 0 18px;}
.modal .cta:hover{background:var(--red);}
.verify-box{background:var(--paper);border:1px solid var(--border);border-radius:10px;padding:14px;}
.verify-box h4{font-size:.85rem;color:var(--red);margin-bottom:8px;}
.verify-note{font-size:.72rem;color:#66748c;margin-top:8px;}

/* ---------- drawer ---------- */
.drawer{position:fixed;top:0;right:-380px;width:360px;max-width:88vw;height:100%;background:#fff;box-shadow:-6px 0 24px rgba(0,0,0,0.2);z-index:60;transition:right .22s ease;padding:26px 22px;overflow-y:auto;border-left:4px solid var(--yellow);}
.drawer.open{right:0;}
.drawer .close-btn{position:absolute;top:14px;right:14px;background:var(--paper);border:1px solid var(--border);border-radius:50%;width:32px;height:32px;font-size:1rem;color:var(--navy);}
.drawer h3{color:var(--red);font-size:1.05rem;margin-top:10px;}
.drawer p{font-size:.88rem;color:#33415c;}
.drawer .tag{display:inline-block;background:var(--yellow);color:var(--navy);font-size:.7rem;font-weight:700;padding:3px 10px;border-radius:999px;letter-spacing:.03em;text-transform:uppercase;}

footer{text-align:center;padding:30px 20px 50px;color:#9aa5b8;font-size:.78rem;}
.empty-msg{color:#9aa5b8;font-size:.88rem;padding:20px 0;}

@media(max-width:640px){
  .topbar{padding:10px 12px;}
  .brand{font-size:1rem;}
  .hero h1{font-size:1.5rem;}
  .tl-lane-label{width:90px;font-size:.7rem;}
}
</style>
</head>

</section>

  <div class="tl-wrap" id="tl-wrap"></div>
</section>

<footer id="footer-text"></footer>

<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <div id="modal-body"></div>
  </div>
</div>

<div class="drawer" id="drawer">
  <button class="close-btn" onclick="closeDrawer()">✕</button>
  <div id="drawer-body"></div>
</div>
