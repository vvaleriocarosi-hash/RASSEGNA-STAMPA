ionale", "en": {"label": "International Politics", "description": "Political developments from around the world outside Italy — elections, governments, diplomacy."}, "it": {"label": "Politica Internazionale", "description": "Sviluppi politici nel mondo al di fuori dell'Italia — elezioni, governi, diplomazia."}}, {"id": "violenza-donne", "en": {"label": "International Violence Against Women", "description": "Femicide and gender-based violence cases from Italy and around the world, tracked together to help spot patterns."}, "it": {"label": "Violenza sulle donne internazionale", "description": "Casi di femminicidio e violenza di genere in Italia e nel mondo, raccolti insieme per individuare pattern."}}, {"id": "ai", "en": {"label": "AI", "description": "Artificial intelligence: models, companies, chips, investment and regulation."}, "it": {"label": "AI", "description": "Intelligenza artificiale: modelli, aziende, chip, investimenti e regolamentazione."}}, {"id": "mercato-investimenti", "en": {"label": "International Investment Markets", "description": "Stock markets, central banks, oil prices, tariffs and global investment flows."}, "it": {"label": "Mercato internazionale degli investimenti", "description": "Mercati azionari, banche centrali, prezzo del petrolio, dazi e flussi di investimento globali."}}], "deepdives": {"hormuz": {"en": {"title": "Strait of Hormuz", "text": "The maritime passage between the Persian Gulf and the Gulf of Oman, crucial for the world's oil transport: roughly a fifth of global crude output passes through here every day. Any blockade or attack in this area almost immediately drives up energy prices worldwide."}, "it": {"title": "Stretto di Hormuz", "text": "Il punto di passaggio marittimo tra il Golfo Persico e il Golfo dell'Oman, cruciale per il trasporto mondiale di petrolio: circa un quinto della produzione globale di greggio transita da qui ogni giorno. Qualsiasi blocco o attacco in quest'area fa salire quasi immediatamente i prezzi dell'energia in tutto il mondo."}}, "irgc": {"en": {"title": "IRGC — Islamic Revolutionary Guard Corps", "text": "The Islamic Revolutionary Guard Corps (IRGC) is an Iranian military force that runs parallel to the regular army and answers directly to the Supreme Leader. It also controls significant economic assets and plays a key role in projecting Iran's power across the region."}, "it": {"title": "IRGC — Guardiani della Rivoluzione", "text": "Il Corpo delle Guardie della Rivoluzione Islamica (IRGC) è una forza militare iraniana parallela all'esercito regolare, che risponde direttamente alla Guida Suprema. Controlla anche importanti asset economici e ha un ruolo chiave nella proiezione di potenza dell'Iran nella regione."}}, "icc": {"en": {"title": "International Criminal Court (ICC)", "text": "Based in The Hague, the International Criminal Court can issue arrest warrants for war crimes or crimes against humanity. Member states are technically obligated to enforce them, but in practice enforcement often depends on individual countries' political will."}, "it": {"title": "Corte Penale Internazionale (ICC)", "text": "Con sede all'Aia, la Corte Penale Internazionale può emettere mandati di arresto per crimini di guerra o contro l'umanità. Gli Stati membri sono in teoria obbligati a eseguirli, ma l'applicazione pratica dipende spesso dalla volontà politica dei singoli paesi."}}, "fed": {"en": {"title": "Federal Reserve", "text": "The United States' central bank, responsible for monetary policy: it sets the interest rates that influence loans, mortgages and inflation worldwide, given the dollar's role as the global reserve currency."}, "it": {"title": "Federal Reserve", "text": "La banca centrale degli Stati Uniti, responsabile della politica monetaria: decide i tassi di interesse che influenzano prestiti, mutui e inflazione in tutto il mondo, dato il ruolo del dollaro come valuta di riserva globale."}}, "tariff": {"en": {"title": "15% reciprocal tariff", "text": "A tariff is a tax on imported goods. A 15% reciprocal rate means both the US and the EU apply the same tax percentage to each other's imports, in an attempt to rebalance trade and avoid an escalation into even higher tariffs."}, "it": {"title": "Dazio reciproco al 15%", "text": "Un dazio è un'imposta sulle merci importate. Un tasso reciproco del 15% significa che sia gli USA sia l'UE applicano la stessa percentuale di tassazione sulle rispettive importazioni, nel tentativo di riequilibrare la bilancia commerciale ed evitare un'escalation di tariffe più alte."}}, "ice": {"en": {"title": "ICE — Immigration and Customs Enforcement", "text": "The US federal agency responsible for immigration enforcement and customs law, including deportations of people without valid legal status. Its operations are frequently at the center of political controversy and protest."}, "it": {"title": "ICE — Immigration and Customs Enforcement", "text": "L'agenzia federale statunitense responsabile del controllo dell'immigrazione e dell'applicazione delle leggi doganali, incluse le espulsioni di persone senza un regolare permesso di soggiorno. Le sue operazioni sono spesso al centro di controversie politiche e proteste."}}, "measles-status": {"en": {"title": "Measles elimination status", "text": "An official designation given by the WHO to countries that record no continuous measles transmission for at least 12 consecutive months. Losing it means the virus has returned to circulating steadily within the country, often due to falling vaccination coverage."}, "it": {"title": "Stato di eliminazione del morbillo", "text": "Uno status ufficiale assegnato dall'OMS ai paesi che non registrano trasmissione continua del morbillo per almeno 12 mesi consecutivi. Perderlo significa che il virus è tornato a circolare stabilmente nel paese, spesso a causa del calo delle coperture vaccinali."}}, "alzheimer": {"en": {"title": "Alzheimer's disease", "text": "A progressive neurodegenerative disease that causes memory loss and cognitive decline: it's the most common form of dementia in older adults. Current research focuses on the molecular mechanisms that trigger it and on drugs that could slow its progression."}, "it": {"title": "Malattia di Alzheimer", "text": "Una malattia neurodegenerativa progressiva che causa perdita di memoria e declino cognitivo: è la forma più comune di demenza negli anziani. La ricerca attuale si concentra su meccanismi molecolari che ne innescano l'insorgenza e su farmaci in grado di rallentarla."}}, "irgc-jordan": {"en": {"title": "Muwaffaq Salti Air Base (Jordan)", "text": "A Jordanian air base also used by US military personnel as part of regional cooperation against threats in the Gulf area. It became a symbol of the escalation because the Iranian attack directly hit US troops on allied soil."}, "it": {"title": "Base di Muwaffaq Salti (Giordania)", "text": "Una base aerea giordana utilizzata anche da personale militare statunitense nell'ambito della cooperazione regionale contro le minacce nell'area del Golfo. È diventata un simbolo dell'escalation perché l'attacco iraniano ha colpito direttamente truppe USA su suolo alleato."}}, "mamdani": {"en": {"title": "Zohran Mamdani", "text": "Mayor of New York City, elected on a progressive platform. His willingness to consider arresting Netanyahu during a future visit to the city for the UN General Assembly has sparked intense political and diplomatic debate."}, "it": {"title": "Zohran Mamdani", "text": "Sindaco di New York, eletto con una piattaforma progressista. La sua apertura a valutare un arresto di Netanyahu durante una futura visita alla città in occasione dell'Assemblea Generale ONU ha acceso un forte dibattito politico e diplomatico."}}, "desalination": {"en": {"title": "Desalination plant", "text": "A facility that removes salt from seawater to produce fresh drinking water. Gulf states such as Kuwait rely on desalination for the vast majority of their water supply, so strikes on these plants threaten a humanitarian crisis, not just an energy one."}, "it": {"title": "Impianto di desalinizzazione", "text": "Un impianto che rimuove il sale dall'acqua di mare per produrre acqua potabile. Paesi del Golfo come il Kuwait dipendono dalla desalinizzazione per la grande maggioranza del proprio approvvigionamento idrico, quindi gli attacchi a questi impianti minacciano una crisi umanitaria, non solo energetica."}}, "imf": {"en": {"title": "International Monetary Fund (IMF)", "text": "A UN-affiliated institution of 190 member countries that monitors the global economy, lends to countries in financial distress, and publishes influential forecasts like the World Economic Outlook used by governments and investors worldwide."}, "it": {"title": "Fondo Monetario Internazionale (FMI)", "text": "Un'istituzione affiliata all'ONU con 190 paesi membri che monitora l'economia globale, presta fondi ai paesi in difficoltà finanziaria e pubblica previsioni influenti come il World Economic Outlook, usate da governi e investitori in tutto il mondo."}}, "burnham": {"en": {"title": "Andy Burnham", "text": "Former mayor of Greater Manchester and long-time Labour MP, known for his focus on devolving power away from London. He was declared Labour leader in July 2026 after Keir Starmer's resignation, putting him on track to become UK Prime Minister."}, "it": {"title": "Andy Burnham", "text": "Ex sindaco della Greater Manchester e deputato laburista di lunga data, noto per il suo impegno a favore del decentramento dei poteri da Londra. È stato proclamato leader laburista nel luglio 2026 dopo le dimissioni di Keir Starmer, avviandosi a diventare primo ministro del Regno Unito."}}, "wangchuk": {"en": {"title": "Sonam Wangchuk", "text": "A 59-year-old Indian educator and engineer from Ladakh known for his climate and education activism. His hunger strike over exam-paper leaks and student welfare became a rallying point for India's youth-led protest movement."}, "it": {"title": "Sonam Wangchuk", "text": "Educatore e ingegnere indiano di 59 anni originario del Ladakh, noto per il suo attivismo su clima e istruzione. Il suo sciopero della fame contro le fughe di notizie sui test d'esame e per il benessere degli studenti è diventato un punto di riferimento per il movimento di protesta giovanile indiano."}}, "ebola": {"en": {"title": "Ebola virus disease", "text": "A severe, often fatal viral hemorrhagic fever first identified in the Democratic Republic of Congo in 1976. Outbreaks are contained through rapid contact tracing, isolation and, more recently, experimental vaccines and antibody treatments — but conflict and displacement can make containment far harder."}, "it": {"title": "Malattia da virus Ebola", "text": "Una grave febbre emorragica virale, spesso letale, identificata per la prima volta nella Repubblica Democratica del Congo nel 1976. I focolai vengono contenuti tramite tracciamento rapido dei contatti, isolamento e, più di recente, vaccini sperimentali e trattamenti con anticorpi — ma conflitti e sfollamenti possono rendere il contenimento molto più difficile."}}, "bab-el-mandeb": {"en": {"title": "Bab el-Mandeb Strait", "text": "A narrow chokepoint, only about 18 miles wide, between Yemen and the Horn of Africa linking the Red Sea to the Gulf of Aden. Roughly 7% of global oil output transits here, so any blockade or attack threatens to disrupt trade between Europe, Asia and the Gulf."}, "it": {"title": "Stretto di Bab el-Mandeb", "text": "Uno stretto passaggio, largo appena circa 29 km, tra lo Yemen e il Corno d'Africa che collega il Mar Rosso al Golfo di Aden. Circa il 7% della produzione mondiale di petrolio transita da qui, quindi qualsiasi blocco o attacco rischia di interrompere i commerci tra Europa, Asia e Golfo."}}, "section-338": {"en": {"title": "Section 338 (Trade Act of 1930)", "text": "A rarely invoked US trade law provision that lets the president impose tariffs of up to 50% on countries found to discriminate against American commerce, without the lengthier investigations normally required. Trade experts call it the 'nuclear option' because of its breadth and speed."}, "it": {"title": "Sezione 338 (Trade Act del 1930)", "text": "Una disposizione della legge commerciale statunitense raramente invocata, che consente al presidente di imporre dazi fino al 50% ai paesi ritenuti discriminatori verso il commercio americano, senza le indagini più lunghe normalmente richieste. Gli esperti di commercio la definiscono l'\"opzione nucleare\" per la sua portata e rapidità."}}, "tsmc": {"en": {"title": "TSMC — Taiwan Semiconductor Manufacturing Company", "text": "The world's largest contract chipmaker, producing the majority of the most advanced semiconductors used by companies like Apple, Nvidia and AMD. Its expansion decisions are closely watched as a barometer of the global chip industry and of US-Taiwan economic ties."}, "it": {"title": "TSMC — Taiwan Semiconductor Manufacturing Company", "text": "Il più grande produttore di chip su commissione al mondo, che realizza la maggior parte dei semiconduttori più avanzati usati da aziende come Apple, Nvidia e AMD. Le sue decisioni di espansione sono seguite attentamente come barometro dell'industria mondiale dei chip e dei legami economici USA-Taiwan."}}, "cockroach-party": {"en": {"title": "Cockroach Janta Party", "text": "A satirical Indian youth movement founded in May 2026 after India's Chief Justice compared unemployed young people to 'cockroaches.' It has grown into a mass protest movement demanding accountability for exam-paper leaks and addressing youth unemployment."}, "it": {"title": "Cockroach Janta Party", "text": "Un movimento giovanile indiano nato come satira nel maggio 2026, dopo che il presidente della Corte Suprema indiana aveva paragonato i giovani disoccupati a \"scarafaggi\". È cresciuto fino a diventare un movimento di protesta di massa che chiede responsabilità per le fughe di notizie sui test d'esame e risposte alla disoccupazione giovanile."}}, "natanz": {"en": {"title": "Natanz nuclear facility", "text": "Iran's main uranium enrichment site, built partly underground to withstand airstrikes. Intelligence reports of centrifuges being moved deeper into the mountain above the facility (sometimes called 'Pickaxe Mountain') point to Iran trying to preserve its enrichment capability despite the bombing campaign."}, "it": {"title": "Impianto nucleare di Natanz", "text": "Il principale sito di arricchimento dell'uranio dell'Iran, costruito in parte sottoterra per resistere ai raid aerei. Le informazioni di intelligence su centrifughe spostate più in profondità nella montagna sopra l'impianto (a volte chiamata 'Pickaxe Mountain') indicano il tentativo dell'Iran di preservare la propria capacità di arricchimento nonostante i bombardamenti."}}, "section-301": {"en": {"title": "Section 301 (Trade Act of 1974)", "text": "A US trade law tool that lets the president impose tariffs after an investigation finds a foreign country's trade practices 'unreasonable or discriminatory.' It requires a formal probe, often lasting months or years, unlike the faster Section 338 provision."}, "it": {"title": "Sezione 301 (Trade Act del 1974)", "text": "Uno strumento della legge commerciale statunitense che consente al presidente di imporre dazi dopo che un'indagine ha accertato pratiche commerciali di un paese estero 'irragionevoli o discriminatorie'. Richiede un'indagine formale, spesso lunga mesi o anni, a differenza della più rapida Sezione 338."}}, "yellow-line": {"en": {"title": "Gaza 'yellow line'", "text": "An informal demarcation line agreed as part of the October 2025 ceasefire, marking how far Israeli forces are meant to withdraw inside Gaza. Israeli control has expanded well beyond this line in practice, according to the UN, fueling accusations of ceasefire violations."}, "it": {"title": "'Linea gialla' di Gaza", "text": "Una linea di demarcazione informale concordata nell'ambito del cessate il fuoco dell'ottobre 2025, che segna fin dove le forze israeliane dovrebbero ritirarsi all'interno di Gaza. Il controllo israeliano si è esteso ben oltre questa linea nella pratica, secondo l'ONU, alimentando accuse di violazioni del cessate il fuoco."}}, "hegseth": {"en": {"title": "Pete Hegseth — US Secretary of Defense", "text": "Pete Hegseth is the US Secretary of Defense under President Trump, overseeing the Pentagon's military campaign against Iran. He has repeatedly defended the administration's war-funding requests to Congress amid growing questions about the conflict's total cost."}, "it": {"title": "Pete Hegseth — Segretario alla Difesa USA", "text": "Pete Hegseth è il Segretario alla Difesa degli Stati Uniti sotto la presidenza Trump, responsabile della supervisione della campagna militare del Pentagono contro l'Iran. Ha più volte difeso davanti al Congresso le richieste di finanziamento della guerra dell'amministrazione, in un contesto di crescenti interrogativi sul costo totale del conflitto."}}, "storm-fighter": {"en": {"title": "Storm Fighter programme", "text": "A UK autonomous combat aircraft programme unveiled at the 2026 Farnborough Airshow, intended to give Britain a domestically built, uncrewed 'loyal wingman'-style fighter capability alongside its crewed jet programmes."}, "it": {"title": "Programma Storm Fighter", "text": "Un programma britannico di aereo da combattimento autonomo presentato al Farnborough Airshow 2026, pensato per dare al Regno Unito una capacità di caccia senza pilota di tipo 'gregario fedele' prodotta internamente, accanto ai programmi di velivoli con equipaggio."}}, "number-10-north": {"en": {"title": "'Number 10 North'", "text": "A satellite office of the UK prime minister opened in Manchester in July 2026 by PM Andy Burnham, intended to relocate devolution and regional-growth policymaking away from Westminster. Critics note it currently lacks the fiscal powers needed for genuine devolution."}, "it": {"title": "'Number 10 North'", "text": "Un ufficio satellite del primo ministro britannico aperto a Manchester nel luglio 2026 dal premier Andy Burnham, pensato per spostare le decisioni su decentramento e crescita regionale lontano da Westminster. I critici osservano che manca ancora dei poteri fiscali necessari per un decentramento reale."}}, "board-of-peace": {"en": {"title": "Board of Peace", "text": "An international governance body proposed by the Trump administration to oversee Gaza's post-war reconstruction and Hamas's disarmament. Chaired by Trump, its founding board includes figures such as former UK PM Tony Blair, Jared Kushner and Secretary of State Marco Rubio. It is meant to work alongside a technocratic Palestinian committee and an International Stabilization Force during the transition."}, "it": {"title": "Board of Peace", "text": "Un organo di governance internazionale proposto dall'amministrazione Trump per supervisionare la ricostruzione post-bellica di Gaza e il disarmo di Hamas. Presieduto da Trump, il suo consiglio fondatore include figure come l'ex premier britannico Tony Blair, Jared Kushner e il Segretario di Stato Marco Rubio. Dovrebbe lavorare insieme a un comitato tecnocratico palestinese e a una Forza Internazionale di Stabilizzazione durante la transizione."}}, "taiwan-patrols": {"en": {"title": "Taiwan Strait blockade risk", "text": "Analysts describe China's stepped-up coast guard patrols east of Taiwan as a possible 'boa constrictor' strategy — gradually tightening control over the waters around the island without a single decisive military move. Because Taiwan imports nearly all its energy and much of its food, a sustained blockade could cripple the island economically well before any invasion, which is why Western governments treat the patrols as a serious escalation risk even short of open conflict."}, "it": {"title": "Rischio di blocco navale nello Stretto di Taiwan", "text": "Gli analisti descrivono l'intensificarsi delle pattuglie della guardia costiera cinese a est di Taiwan come una possibile strategia 'a costrittore' — un progressivo inasprimento del controllo sulle acque attorno all'isola senza un'unica mossa militare decisiva. Poiché Taiwan importa quasi tutta la propria energia e gran parte del cibo, un blocco prolungato potrebbe paralizzare economicamente l'isola ben prima di qualsiasi invasione, motivo per cui i governi occidentali considerano le pattuglie un serio rischio di escalation anche senza un conflitto aperto."}}, "hbm-shortage": {"en": {"title": "AI chip / memory shortage", "text": "Surging demand for high-bandwidth memory (HBM) chips used in AI accelerators has outpaced production capacity at the world's top memory makers — Samsung, SK Hynix and Micron. Firms are pre-selling years of future output to AI infrastructure buyers, and analysts warn the resulting supply crunch could keep memory prices elevated and delay some AI data-center buildouts until 2028."}, "it": {"title": "Carenza di chip AI / memorie", "text": "La domanda in forte crescita di chip di memoria ad alta larghezza di banda (HBM), usati negli acceleratori AI, ha superato la capacità produttiva dei principali produttori mondiali di memorie — Samsung, SK Hynix e Micron. Le aziende stanno pre-vendendo anni di produzione futura agli acquirenti di infrastrutture AI, e gli analisti avvertono che la conseguente carenza di offerta potrebbe mantenere elevati i prezzi delle memorie e ritardare alcuni progetti di data center AI fino al 2028."}}, "patriot": {"en": {"title": "Patriot missile system", "text": "The MIM-104 Patriot is a US-made surface-to-air missile system that Ukraine relies on to intercept Russian ballistic missiles, the hardest threat for other air-defense systems to stop. Interceptor missiles are expensive and in short supply worldwide, and only the US currently licenses their production — which is why Ukraine has repeatedly asked Washington for a local manufacturing license rather than relying solely on donated stockpiles."}, "it": {"title": "Sistema missilistico Patriot", "text": "Il Patriot MIM-104 è un sistema missilistico terra-aria di produzione statunitense su cui l'Ucraina fa affidamento per intercettare i missili balistici russi, la minaccia più difficile da fermare per gli altri sistemi di difesa aerea. I missili intercettori sono costosi e scarsi in tutto il mondo, e solo gli USA attualmente concedono licenze per la loro produzione — motivo per cui l'Ucraina ha più volte chiesto a Washington una licenza di produzione locale invece di affidarsi soltanto alle scorte donate."}}, "gulf-allies": {"en": {"title": "Gulf allies", "text": "The Gulf Cooperation Council states — Saudi Arabia, the UAE, Kuwait, Qatar, Bahrain and Oman — host US military bases and have been repeatedly caught in the crossfire of the US-Iran war, from Iranian strikes on their infrastructure to disrupted shipping through the Strait of Hormuz. Several have pushed Washington toward de-escalation to protect their economies and populations."}, "it": {"title": "Alleati del Golfo", "text": "Gli stati del Consiglio di Cooperazione del Golfo — Arabia Saudita, Emirati Arabi Uniti, Kuwait, Qatar, Bahrein e Oman — ospitano basi militari statunitensi e sono stati ripetutamente coinvolti nel fuoco incrociato della guerra USA-Iran, dagli attacchi iraniani alle loro infrastrutture alle interruzioni del traffico marittimo nello Stretto di Hormuz. Diversi di essi hanno spinto Washington verso la de-escalation per proteggere le proprie economie e popolazioni."}}, "aws": {"en": {"title": "AWS (Amazon Web Services)", "text": "AWS is Amazon's cloud computing division, renting out data-center capacity, storage and AI infrastructure to businesses worldwide. It is Amazon's most profitable segment and a key battleground in the AI investment race against Microsoft Azure and Google Cloud."}, "it": {"title": "AWS (Amazon Web Services)", "text": "AWS è la divisione di cloud computing di Amazon, che affitta capacità dei data center, storage e infrastrutture AI ad aziende di tutto il mondo. È il segmento più redditizio di Amazon e un campo di battaglia chiave nella corsa agli investimenti in AI contro Microsoft Azure e Google Cloud."}}, "schengen": {"en": {"title": "Schengen Area", "text": "The Schengen Area is a zone of 29 mostly-EU European countries that have abolished passport and border controls at their mutual borders, allowing free movement of people. Countries can temporarily suspend Schengen rules and reinstate border checks during emergencies, as Italy did with Spain during the Ceuta migrant surge."}, "it": {"title": "Area Schengen", "text": "L'Area Schengen è una zona di 29 paesi europei, in gran parte UE, che hanno abolito i controlli di passaporto e di frontiera ai confini reciproci, consentendo la libera circolazione delle persone. I paesi possono sospendere temporaneamente le regole di Schengen e ripristinare i controlli di frontiera in caso di emergenza, come ha fatto l'Italia con la Spagna durante l'ondata migratoria di Ceuta."}}, "ceuta": {"en": {"title": "Ceuta", "text": "Ceuta is a Spanish autonomous city on the North African coast, bordering Morocco, and one of the EU's only land borders with Africa. It has long been a flashpoint for irregular migration attempts by land and sea."}, "it": {"title": "Ceuta", "text": "Ceuta è una città autonoma spagnola sulla costa nordafricana, confinante con il Marocco, ed è uno dei pochi confini terrestri dell'UE con l'Africa. È da tempo un punto caldo per i tentativi di migrazione irregolare via terra e via mare."}}, "bundibugyo": {"en": {"title": "Bundibugyo ebolavirus", "text": "One of six known species of the Ebola virus, first identified in Uganda in 2007. It is generally considered less lethal than the Zaire strain responsible for the 2014-2016 West African epidemic, though the current DR Congo outbreak has still produced a roughly 45% case fatality rate."}, "it": {"title": "Ebolavirus Bundibugyo", "text": "Una delle sei specie note del virus Ebola, identificata per la prima volta in Uganda nel 2007. È generalmente considerata meno letale del ceppo Zaire responsabile dell'epidemia dell'Africa occidentale del 2014-2016, anche se l'attuale focolaio in RD Congo ha comunque prodotto un tasso di letalità di circa il 45%."}}, "ai-sovereignty": {"en": {"title": "AI sovereignty", "text": "\"AI sovereignty\" refers to a government's or company's ability to build, control and secure its own artificial-intelligence infrastructure and data — training and running models on domestic or proprietary systems — rather than depending on foreign cloud providers or AI firms. The concept has driven a wave of government contracts for companies like Palantir, as states seek to avoid depending on rivals for a technology increasingly seen as strategically critical."}, "it": {"title": "Sovranità AI", "text": "La \"sovranità AI\" indica la capacità di un governo o di un'azienda di costruire, controllare e proteggere la propria infrastruttura e i propri dati di intelligenza artificiale — addestrando ed eseguendo i modelli su sistemi nazionali o proprietari — invece di dipendere da fornitori cloud o aziende AI straniere. Il concetto ha alimentato un'ondata di contratti governativi per aziende come Palantir, mentre gli stati cercano di non dipendere da rivali per una tecnologia considerata sempre più strategicamente critica."}}, "thaad": {"en": {"title": "THAAD (Terminal High Altitude Area Defense)", "text": "THAAD is a US missile defense system designed to intercept short, medium and intermediate-range ballistic missiles during the final phase of their flight. Each battery carries a limited number of costly interceptors that can only be resupplied slowly, making sustained use during a prolonged conflict like the Iran war a serious strain on US military readiness."}, "it": {"title": "THAAD (Terminal High Altitude Area Defense)", "text": "Il THAAD è un sistema statunitense di difesa missilistica progettato per intercettare missili balistici a corto, medio e medio-lungo raggio nella fase finale del volo. Ogni batteria dispone di un numero limitato di intercettori costosi, che possono essere riforniti solo lentamente, rendendo l'uso prolungato durante un conflitto come la guerra con l'Iran un serio problema per la prontezza operativa militare USA."}}, "ai-safety-framework": {"en": {"title": "Voluntary AI safety testing framework", "text": "A set of cybersecurity evaluations the White House asked leading US AI developers to run on their most advanced models, checking for dangerous hacking capabilities before wider release. Participation is voluntary, and details on metrics or public disclosure of results have not yet been made public, raising questions about how much oversight the tests actually provide."}, "it": {"title": "Test volontari di sicurezza AI", "text": "Un insieme di verifiche di sicurezza informatica che la Casa Bianca ha chiesto ai principali sviluppatori statunitensi di intelligenza artificiale di eseguire sui loro modelli più avanzati, per individuare pericolose capacità di hacking prima di un rilascio più ampio. La partecipazione è volontaria e i dettagli su metriche o divulgazione pubblica dei risultati non sono ancora stati resi noti, sollevando dubbi sull'effettiva efficacia di controllo dei test."}}, "continuing-resolution": {"en": {"title": "Continuing Resolution (CR)", "text": "A continuing resolution is a stopgap spending bill the US Congress passes to keep federal agencies funded at existing levels when it hasn't finished full-year appropriations bills, avoiding a government shutdown for a set period."}, "it": {"title": "Continuing Resolution (CR)", "text": "Una 'continuing resolution' è una legge di spesa temporanea che il Congresso USA approva per mantenere finanziate le agenzie federali ai livelli esistenti quando non ha completato le leggi di bilancio annuali, evitando uno shutdown del governo per un periodo definito."}}, "marib-hadhramaut": {"en": {"title": "Marib and Hadhramaut", "text": "Marib and Hadhramaut are provinces in central and eastern Yemen controlled by the internationally recognized Yemeni government, in contrast to Houthi-held Sanaa and the northwest. Marib in particular has been a key front line and the government's main oil-producing stronghold since Yemen's civil war began in 2014-2015, making renewed fighting there especially significant."}, "it": {"title": "Marib e Hadhramaut", "text": "Marib e Hadhramaut sono province nel centro e nell'est dello Yemen controllate dal governo yemenita internazionalmente riconosciuto, in contrapposizione a Sana'a e al nord-ovest in mano Houthi. Marib in particolare è stata una linea del fronte chiave e la principale roccaforte petrolifera del governo dall'inizio della guerra civile yemenita nel 2014-2015, rendendo la ripresa dei combattimenti lì particolarmente significativa."}}, "yemen-2022-truce": {"en": {"title": "Yemen's 2022 truce", "text": "A UN-brokered truce in April 2022 paused large-scale fighting between Yemen's Houthi rebels and the Saudi-backed government coalition after seven years of civil war. Though the formal truce expired later that year, its terms mostly held informally, keeping the front line largely frozen until this week's escalation."}, "it": {"title": "La tregua yemenita del 2022", "text": "Una tregua mediata dall'ONU nell'aprile 2022 ha messo in pausa i combattimenti su larga scala tra i ribelli Houthi yemeniti e la coalizione governativa sostenuta dai sauditi dopo sette anni di guerra civile. Sebbene la tregua formale sia scaduta più tardi quello stesso anno, i suoi termini sono rimasti in gran parte validi in modo informale, mantenendo la linea del fronte largamente congelata fino all'escalation di questa settimana."}}, "iran-parliament-security": {"en": {"title": "Iran's Parliament National Security Commission", "text": "A standing committee of Iran's parliament (Majlis) responsible for reviewing foreign policy, defense and security matters. Its public statements often signal the views of hardline factions and can constrain what concessions Iranian negotiators are able to offer in talks like those over the Strait of Hormuz."}, "it": {"title": "La Commissione di sicurezza nazionale del Parlamento iraniano", "text": "Una commissione permanente del parlamento iraniano (Majlis) responsabile della revisione delle questioni di politica estera, difesa e sicurezza. Le sue dichiarazioni pubbliche spesso segnalano le posizioni delle fazioni più intransigenti e possono limitare le concessioni che i negoziatori iraniani sono in grado di offrire in colloqui come quelli sullo Stretto di Hormuz."}}, "deepmind": {"en": {"title": "Google DeepMind", "text": "Google DeepMind is the company's AI research lab, formed in 2023 by merging London-based DeepMind with Google Brain. It develops the Gemini family of AI models and has historically operated with significant autonomy from Google's core California operations."}, "it": {"title": "Google DeepMind", "text": "Google DeepMind è il laboratorio di ricerca sull'AI dell'azienda, nato nel 2023 dalla fusione tra DeepMind (con sede a Londra) e Google Brain. Sviluppa la famiglia di modelli AI Gemini e ha storicamente operato con un'autonomia significativa rispetto alle attività principali di Google in California."}}, "gemini-model": {"en": {"title": "Gemini", "text": "Gemini is Google's flagship family of AI models, positioned as its primary competitor to OpenAI's GPT and Anthropic's Claude. Its development strategy and pace are central to Google's standing in the AI race."}, "it": {"title": "Gemini", "text": "Gemini è la famiglia di modelli AI di punta di Google, posizionata come sua principale concorrente rispetto a GPT di OpenAI e Claude di Anthropic. La sua strategia di sviluppo e il ritmo dei rilasci sono centrali per la posizione di Google nella corsa all'AI."}}, "birthright-citizenship": {"en": {"title": "Birthright citizenship and the 14th Amendment", "text": "The 14th Amendment to the US Constitution (1868) guarantees citizenship to nearly everyone born on US soil, regardless of their parents' immigration status. Trump has sought since January 2025 to narrow this guarantee via executive action, arguing it does not apply to children of undocumented immigrants; the Supreme Court rejected his first attempt in June 2026, prompting this narrower follow-up order."}, "it": {"title": "La cittadinanza per nascita e il XIV Emendamento", "text": "Il XIV Emendamento della Costituzione USA (1868) garantisce la cittadinanza a quasi tutte le persone nate sul suolo statunitense, indipendentemente dallo status migratorio dei genitori. Dal gennaio 2025 Trump ha cercato di restringere questa garanzia tramite ordini esecutivi, sostenendo che non si applichi ai figli di immigrati irregolari; la Corte Suprema ha respinto il suo primo tentativo nel giugno 2026, portando a questo nuovo ordine più circoscritto."}}, "drc-inrb": {"en": {"title": "DR Congo's National Institute of Biomedical Research (INRB)", "text": "The INRB is the Democratic Republic of Congo's public health institute responsible for confirming and reporting outbreak case and death figures, including for the current Ebola epidemic, in coordination with the WHO."}, "it": {"title": "Istituto Nazionale di Ricerca Biomedica della RD Congo (INRB)", "text": "L'INRB è l'istituto di sanità pubblica della Repubblica Democratica del Congo responsabile della conferma e comunicazione dei dati su casi e morti dei focolai epidemici, incluso l'attuale focolaio di Ebola, in coordinamento con l'OMS."}}, "wildberries": {"en": {"title": "Wildberries", "text": "Russia's largest e-commerce platform, often dubbed the \"Amazon of Russia.\" Since mid-July 2026, Ukraine has struck roughly 20 of its warehouses across Russian regions and occupied Crimea, arguing the company distributes dual-use goods that can end up in weapons production. Moscow and Wildberries deny the claim."}, "it": {"title": "Wildberries", "text": "La piu' grande piattaforma di e-commerce russa, spesso soprannominata \"l'Amazon russa\". Dalla meta' di luglio 2026 l'Ucraina ha colpito circa 20 dei suoi magazzini in diverse regioni russe e in Crimea occupata, sostenendo che l'azienda distribuisca beni a duplice uso che possono finire nella produzione di armi. Mosca e Wildberries negano l'accusa."}}, "ai-red-team": {"en": {"title": "AI red-teaming / AISI", "text": "Government and independent bodies, such as the UK AI Security Institute (AISI) and the nonprofit Irregular, run controlled evaluations (\"red-teaming\") in which advanced AI models are given simulated hacking tasks, to uncover dangerous capabilities before they reach the public."}, "it": {"title": "AI red-teaming / AISI", "text": "Enti governativi e indipendenti, come l'AI Security Institute britannico (AISI) e l'organizzazione no-profit Irregular, conducono valutazioni controllate (\"red-teaming\") in cui ai modelli AI avanzati vengono assegnati compiti di hacking simulato, per scoprire capacita' pericolose prima che raggiungano il pubblico."}}, "flavio-bolsonaro": {"en": {"title": "Flávio Bolsonaro", "text": "A Brazilian senator and son of former president Jair Bolsonaro, who was convicted of attempting a coup to block Lula's 2023 inauguration. Flávio is the main opposition candidate against Lula in Brazil's October 2026 presidential election."}, "it": {"title": "Flávio Bolsonaro", "text": "Senatore brasiliano e figlio dell'ex presidente Jair Bolsonaro, condannato per aver tentato un colpo di stato per impedire l'insediamento di Lula nel 2023. Flávio e' il principale candidato dell'opposizione contro Lula nelle elezioni presidenziali brasiliane di ottobre 2026."}}, "hormuz-strait": {"en": {"title": "Strait of Hormuz", "text": "The maritime passage between the Persian Gulf and the Gulf of Oman, crucial for the world's oil transport: roughly a fifth of global crude output passes through here every day. Any blockade or attack in this area almost immediately drives up energy prices worldwide."}, "it": {"title": "Stretto di Hormuz", "text": "Il punto di passaggio marittimo tra il Golfo Persico e il Golfo dell'Oman, cruciale per il trasporto mondiale di petrolio: circa un quinto della produzione globale di greggio transita da qui ogni giorno. Qualsiasi blocco o attacco in quest'area fa salire quasi immediatamente i prezzi dell'energia in tutto il mondo."}}, "brent-crude": {"en": {"title": "Brent crude", "text": "The international benchmark price for oil, based on crude extracted from the North Sea. Along with WTI (West Texas Intermediate), it is one of the two most widely used reference prices in global oil trading."}, "it": {"title": "Brent (petrolio)", "text": "Il prezzo di riferimento internazionale del petrolio, basato sul greggio estratto nel Mare del Nord. Insieme al WTI (West Texas Intermediate), è uno dei due prezzi di riferimento più usati nel commercio mondiale di petrolio."}}, "adnoc": {"en": {"title": "ADNOC", "text": "The Abu Dhabi National Oil Company is the state-owned oil and gas producer of the United Arab Emirates, one of the largest oil companies in the world. Its tankers have been repeatedly targeted since the Strait of Hormuz conflict began in February 2026, making the UAE one of the states most affected by disruption to Gulf shipping despite not being a direct party to the US-Iran war."}, "it": {"title": "ADNOC", "text": "L'Abu Dhabi National Oil Company è la compagnia petrolifera e del gas di stato degli Emirati Arabi Uniti, una delle più grandi aziende petrolifere al mondo. Le sue petroliere sono state ripetutamente colpite dall'inizio del conflitto nello Stretto di Hormuz a febbraio 2026, rendendo gli Emirati uno degli stati più colpiti dalle interruzioni al traffico marittimo del Golfo pur non essendo parte diretta della guerra USA-Iran."}}, "taalas": {"en": {"title": "Taalas / structured-ASIC inference chips", "text": "Taalas is a Toronto AI-chip startup that builds structured application-specific integrated circuits (ASICs) with a specific AI model's parameters etched directly into the silicon, rather than running models in software on general-purpose GPUs. This trades flexibility for dramatic gains in speed and energy efficiency, since the chip only ever runs one model."}, "it": {"title": "Taalas / chip di inferenza ASIC strutturati", "text": "Taalas è una startup di chip AI con sede a Toronto che produce circuiti integrati ASIC strutturati con i parametri di uno specifico modello AI incisi direttamente nel silicio, invece di eseguire i modelli via software su GPU generiche. Questo scambia flessibilità con enormi guadagni di velocità ed efficienza energetica, poiché il chip esegue sempre e solo un modello."}}, "paks-nuclear": {"en": {"title": "Paks Nuclear Power Plant", "text": "Paks is Hungary's only nuclear power plant, supplying around 40% of the country's electricity. It draws Danube river water for cooling, so historically low water levels during Europe's 2026 heatwaves have repeatedly threatened to force partial shutdowns."}, "it": {"title": "Centrale nucleare di Paks", "text": "Paks è l'unica centrale nucleare dell'Ungheria e fornisce circa il 40% dell'elettricità del paese. Utilizza l'acqua del Danubio per il raffreddamento, quindi i livelli storicamente bassi del fiume durante le ondate di caldo europee del 2026 hanno più volte rischiato di costringere a chiusure parziali."}}, "jazan-refinery": {"en": {"title": "Jazan Refinery", "text": "The Jazan refinery is a major Saudi Aramco oil-processing complex on Saudi Arabia's southwestern Red Sea coast, near the Yemeni border — making it a recurring target for cross-border Houthi drone and missile attacks."}, "it": {"title": "Raffineria di Jazan", "text": "La raffineria di Jazan è un grande complesso di lavorazione petrolifera di Saudi Aramco sulla costa sud-occidentale saudita del Mar Rosso, vicino al confine con lo Yemen — il che ne fa un bersaglio ricorrente degli attacchi transfrontalieri con droni e missili degli Houthi."}}, "federal-reserve": {"en": {"title": "Federal Reserve", "text": "The Federal Reserve is the US central bank, responsible for setting interest rates to balance its dual mandate of stable prices and maximum employment. Weak jobs data typically makes the Fed more likely to hold or cut rates rather than raise them."}, "it": {"title": "Federal Reserve", "text": "La Federal Reserve è la banca centrale statunitense, responsabile della fissazione dei tassi di interesse per bilanciare il suo duplice mandato di stabilità dei prezzi e massima occupazione. Dati sul lavoro deboli in genere rendono più probabile che la Fed mantenga invariati o tagli i tassi anziché alzarli."}}, "sia": {"en": {"title": "Semiconductor Industry Association (SIA)", "text": "The SIA is the main US trade association representing semiconductor companies, publishing widely cited monthly and quarterly data on global chip sales that the industry and investors use to track the health of the AI-driven chip boom."}, "it": {"title": "Semiconductor Industry Association (SIA)", "text": "La SIA è la principale associazione di categoria statunitense che rappresenta le aziende di semiconduttori, e pubblica dati mensili e trimestrali ampiamente citati sulle vendite globali di chip, usati dal settore e dagli investitori per monitorare la salute del boom dei chip legato all'AI."}}, "darfur": {"en": {"title": "Darfur", "text": "Darfur is a vast region in western Sudan that has been a epicenter of ethnic violence and mass displacement since the early 2000s, and again since Sudan's 2023 civil war, with the paramilitary RSF accused of atrocities against civilians there."}, "it": {"title": "Darfur", "text": "Il Darfur è una vasta regione del Sudan occidentale, epicentro di violenze etniche e sfollamenti di massa fin dai primi anni 2000, e di nuovo dalla guerra civile scoppiata nel 2023, con le forze paramilitari RSF accusate di atrocità contro i civili."}}, "colombia-total-peace": {"en": {"title": "Colombia's 'Total Peace' strategy", "text": "\"Total Peace\" (Paz Total) was outgoing President Gustavo Petro's signature policy, launched in 2022, aiming to negotiate simultaneous ceasefires and disarmament deals with all of Colombia's remaining armed groups — guerrilla remnants, paramilitary successors and drug-trafficking militias — rather than fighting them militarily. Researchers found the approach reduced some violence early on, but several groups used the ceasefires to regroup, rearm and expand into new territory, fueling the rightward political backlash that carried Abelardo de la Espriella to power in 2026."}, "it": {"title": "La strategia della 'Pace Totale' colombiana", "text": "\"Pace Totale\" (Paz Total) è stata la politica di punta del presidente uscente Gustavo Petro, lanciata nel 2022, con l'obiettivo di negoziare cessate il fuoco e accordi di disarmo simultanei con tutti i gruppi armati rimasti in Colombia — resti della guerriglia, eredi dei paramilitari e milizie del narcotraffico — invece di combatterli militarmente. Alcuni ricercatori hanno rilevato che l'approccio ha ridotto la violenza nelle fasi iniziali, ma diversi gruppi hanno usato i cessate il fuoco per riorganizzarsi, riarmarsi ed espandersi in nuovi territori, alimentando la reazione politica di destra che ha portato al potere Abelardo de la Espriella nel 2026."}}, "epstein-uk-fallout": {"en": {"title": "Epstein files fallout (UK)", "text": "The political crisis around Keir Starmer's Labour government stemming from revelations tied to Jeffrey Epstein's associates, including the appointment (and later resignation) of Peter Mandelson as ambassador to the US, which triggered resignation calls and an internal leadership challenge against Starmer."}, "it": {"title": "Ricadute del caso Epstein (UK)", "text": "La crisi politica attorno al governo laburista di Keir Starmer nata da rivelazioni legate ai collaboratori di Jeffrey Epstein, inclusa la nomina (e le successive dimissioni) di Peter Mandelson come ambasciatore negli USA, che ha innescato richieste di dimissioni e una sfida interna alla leadership di Starmer."}}, "izmail-port": {"en": {"title": "Izmail port", "text": "Ukraine's largest port on the Danube River, near the Romanian border, used to export grain and other commodities by river after Russia's Black Sea blockade made Odesa's main sea routes riskier."}, "it": {"title": "Porto di Izmail", "text": "Il più grande porto ucraino sul fiume Danubio, vicino al confine con la Romania, usato per esportare grano e altre materie prime via fiume dopo che il blocco russo del Mar Nero ha reso più rischiose le principali rotte marittime di Odesa."}}, "qusra": {"en": {"title": "Qusra", "text": "A Palestinian town in the northern West Bank that has repeatedly been the site of confrontations between residents and nearby Israeli settlers, including land seizures and violent attacks documented by rights groups."}, "it": {"title": "Qusra", "text": "Una città palestinese nel nord della Cisgiordania, teatro ripetuto di scontri tra residenti e coloni israeliani vicini, compresi sequestri di terra e attacchi violenti documentati da organizzazioni per i diritti umani."}}, "west-bank": {"en": {"title": "West Bank", "text": "A Palestinian territory occupied by Israel since 1967, home to about 3 million Palestinians and roughly 500,000 Israeli settlers living in settlements considered illegal under international law."}, "it": {"title": "Cisgiordania", "text": "Territorio palestinese occupato da Israele dal 1967, abitato da circa 3 milioni di palestinesi e da circa 500.000 coloni israeliani che vivono in insediamenti considerati illegali dal diritto internazionale."}}, "rsf": {"en": {"title": "Rapid Support Forces (RSF)", "text": "A Sudanese paramilitary group fighting the Sudanese Armed Forces since April 2023 in a civil war that has killed tens of thousands, displaced roughly 14 million people and pushed an estimated 20 million into hunger."}, "it": {"title": "Forze di Supporto Rapido (RSF)", "text": "Un gruppo paramilitare sudanese in guerra contro le Forze Armate Sudanesi dall'aprile 2023, in un conflitto civile che ha ucciso decine di migliaia di persone, sfollato circa 14 milioni di persone e spinto stimati 20 milioni verso la fame."}}, "cpi": {"en": {"title": "Consumer Price Index (CPI)", "text": "The main US government measure of inflation, tracking the average change in prices paid by consumers for a basket of goods and services, closely watched by the Federal Reserve when setting interest rates."}, "it": {"title": "Indice dei Prezzi al Consumo (CPI)", "text": "La principale misura governativa statunitense dell'inflazione, che traccia la variazione media dei prezzi pagati dai consumatori per un paniere di beni e servizi, seguita da vicino dalla Federal Reserve nel fissare i tassi d'interesse."}}, "decart-ai": {"en": {"title": "Decart", "text": "An Israeli AI startup founded in 2023 building 'world models' that simulate physical environments, best known for its Lucy AI model that generates real-time synthetic video, used by e-commerce sites and livestreamers."}, "it": {"title": "Decart", "text": "Una startup israeliana di intelligenza artificiale fondata nel 2023 che sviluppa 'modelli del mondo' capaci di simulare ambienti fisici, nota soprattutto per il modello Lucy AI che genera video sintetici in tempo reale, usato da siti di e-commerce e streamer."}}, "leavitt-departure": {"en": {"title": "White House press secretary", "text": "The president's chief spokesperson, who briefs reporters on behalf of the administration; Karoline Leavitt became the youngest person ever to hold the role when she took over in 2025 at age 27."}, "it": {"title": "Portavoce della Casa Bianca", "text": "Il principale portavoce del presidente, che tiene i briefing con i giornalisti per conto dell'amministrazione; Karoline Leavitt è diventata la persona più giovane di sempre a ricoprire questo ruolo, assumendolo nel 2025 a 27 anni."}}, "gaza-healthcare-collapse": {"en": {"title": "Gaza's healthcare collapse", "text": "Nearly three years of war have destroyed or disabled most of Gaza's hospitals, including its only specialized cancer treatment centre, leaving patients with chronic and non-combat illnesses — not just war wounded — facing a mounting, largely uncounted death toll."}, "it": {"title": "Il collasso sanitario di Gaza", "text": "Quasi tre anni di guerra hanno distrutto o reso inutilizzabili la maggior parte degli ospedali di Gaza, incluso l'unico centro specializzato per la cura del cancro, lasciando i pazienti con malattie croniche e non legate ai combattimenti — non solo i feriti di guerra — di fronte a un bilancio di morti crescente e in gran parte non conteggiato."}}, "ustluga": {"en": {"title": "Ust-Luga port", "text": "Ust-Luga is one of Russia's largest Baltic Sea ports, roughly 110km west of St Petersburg, and a major hub for exporting crude oil and refined petroleum products. It has been repeatedly targeted by Ukrainian long-range drones since early 2026 as part of Kyiv's campaign to disrupt Russian energy revenue."}, "it": {"title": "Porto di Ust-Luga", "text": "Ust-Luga è uno dei più grandi porti russi sul Baltico, a circa 110 km a ovest di San Pietroburgo, e un importante hub per l'esportazione di petrolio greggio e prodotti raffinati. È stato ripetutamente colpito dai droni a lungo raggio ucraini dall'inizio del 2026, nell'ambito della campagna di Kiev per interrompere le entrate energetiche russe."}}, "halkidiki": {"en": {"title": "Halkidiki peninsula", "text": "Halkidiki is a popular tourist peninsula in northern Greece near Thessaloniki, known for its beach resorts. Its pine forests are highly flammable, making it a recurring hotspot for wildfires during Greece's hot, dry summers."}, "it": {"title": "Penisola calcidica (Halkidiki)", "text": "La Calcidica è una popolare penisola turistica nel nord della Grecia, vicino a Salonicco, nota per le sue località balneari. Le sue pinete sono altamente infiammabili, rendendola un punto critico ricorrente per gli incendi durante le estati calde e secche greche."}}, "sb-energy": {"en": {"title": "SB Energy", "text": "A SoftBank-backed developer of large-scale power and data-center infrastructure, also backed by OpenAI, building the giant Ohio computing campus that will host OpenAI's AI workloads."}, "it": {"title": "SB Energy", "text": "Una società di sviluppo di infrastrutture energetiche e data center su larga scala sostenuta da SoftBank e dalla stessa OpenAI, che sta costruendo il grande campus informatico in Ohio destinato a ospitare i carichi di lavoro AI di OpenAI."}}, "spaza-shops": {"en": {"title": "Spaza shops", "text": "Spaza shops are small, informal convenience stores that operate out of homes, shipping containers or shacks in South African townships, typically selling everyday groceries and household goods. Historically run by South Africans, in recent years many have been taken over by migrant entrepreneurs — especially Somali, Ethiopian and Bangladeshi traders — who are often able to source stock more cheaply through informal networks. The roughly 150,000-200,000 spaza shops nationwide support close to 3 million jobs and contribute just over 5% of GDP, making them a significant part of the informal economy even though they are frequently targeted during anti-migrant unrest."}, "it": {"title": "Spaza shop", "text": "Gli spaza shop sono piccoli negozi di alimentari informali che operano in abitazioni, container o baracche nei township sudafricani, vendendo tipicamente generi alimentari e beni di uso quotidiano. Storicamente gestiti da sudafricani, negli ultimi anni molti sono passati nelle mani di imprenditori migranti — in particolare commercianti somali, etiopi e bangladesi — spesso in grado di approvvigionarsi a prezzi più bassi attraverso reti informali. I circa 150.000-200.000 spaza shop del Paese sostengono quasi 3 milioni di posti di lavoro e contribuiscono per poco più del 5% al PIL, rendendoli una parte significativa dell'economia informale, pur essendo spesso bersaglio durante i disordini anti-migranti."}}, "e1-settlement": {"en": {"title": "E1 settlement", "text": "E1 is a roughly 12-square-kilometer area of the occupied West Bank between East Jerusalem and the Israeli settlement of Ma'ale Adumim. Building there has long been considered one of the most sensitive settlement projects because it would effectively cut the West Bank in two, separating the northern and southern parts and isolating East Jerusalem from its Palestinian hinterland — widely seen as making a contiguous, viable Palestinian state impossible. Israeli governments shelved E1 construction for decades under international pressure before reviving and approving it in 2025-2026."}, "it": {"title": "Insediamento E1", "text": "E1 è un'area di circa 12 chilometri quadrati della Cisgiordania occupata, tra Gerusalemme Est e l'insediamento israeliano di Ma'ale Adumim. Costruirvi è da tempo considerato uno dei progetti di colonizzazione più delicati perché taglierebbe di fatto in due la Cisgiordania, separando la parte settentrionale da quella meridionale e isolando Gerusalemme Est dal suo retroterra palestinese — una mossa ampiamente vista come un ostacolo decisivo a uno Stato palestinese contiguo e vitale. I governi israeliani avevano accantonato il progetto per decenni sotto la pressione internazionale, prima di rilanciarlo e approvarlo nel 2025-2026."}}, "h200-export-controls": {"en": {"title": "Nvidia H200 export controls", "text": "The H200 is a high-end Nvidia AI chip whose export to China has been a flashpoint in the US-China tech rivalry. Washington restricted its sale on national-security grounds, then eased curbs in December 2025 under a deal letting Nvidia sell to approved Chinese buyers if it shares 25% of the resulting revenue with the US government. Beijing, in turn, has been wary of dependence on foreign chips and has pushed firms to favor domestic alternatives, while also directing some approved shipments to Hong Kong rather than the mainland to limit exposure."}, "it": {"title": "Controlli export chip H200 di Nvidia", "text": "L'H200 è un chip AI di fascia alta di Nvidia la cui esportazione verso la Cina è un punto di attrito nella rivalità tecnologica USA-Cina. Washington ne aveva limitato la vendita per motivi di sicurezza nazionale, poi ha allentato le restrizioni a dicembre 2025 con un accordo che consente a Nvidia di vendere ad acquirenti cinesi approvati a condizione di cedere il 25% dei ricavi al governo americano. Pechino, dal canto suo, è cauta sulla dipendenza da chip stranieri e spinge le aziende verso alternative nazionali, indirizzando parte delle spedizioni approvate verso Hong Kong invece che sulla terraferma per limitare l'esposizione."}}, "economic-dday": {"en": {"title": "\"Economic D-Day\" sanctions on Iran", "text": "Treasury Secretary Scott Bessent's term for a sweeping new US sanctions package against Iran unveiled in August 2026, targeting not just Iranian entities but any country or bank that keeps buying Iranian oil or moving Iranian money — chiefly aimed at China, which purchases roughly 90% of Iran's oil exports. Bessent called it \"the single greatest financial offensive ever marshalled against an adversary,\" layered on top of the existing US naval blockade of Iranian ports."}, "it": {"title": "Sanzioni \"D-Day economico\" contro l'Iran", "text": "Il termine usato dal Segretario al Tesoro USA Scott Bessent per un ampio nuovo pacchetto di sanzioni contro l'Iran presentato ad agosto 2026, che punta non solo a entità iraniane ma a qualsiasi Paese o banca continui ad acquistare petrolio iraniano o a muovere denaro iraniano — mirato soprattutto alla Cina, che acquista circa il 90% delle esportazioni petrolifere iraniane. Bessent l'ha definita \"la più grande offensiva finanziaria mai lanciata contro un avversario\", che si aggiunge al blocco navale USA già in vigore sui porti iraniani."}}, "ervebo-vaccine": {"en": {"title": "Ervebo vaccine trial against Bundibugyo Ebola", "text": "Ervebo (rVSV-ZEBOV) is the only WHO-licensed Ebola vaccine, but it was developed and proven against the Zaire ebolavirus species, not the Bundibugyo strain driving DR Congo's 2026 outbreak. Early lab and animal data suggest it may offer some cross-protection, but this is unproven in humans. In August 2026 the International Coordinating Group approved 70,000 doses for DR Congo — 20,000 for a Phase 3 clinical trial testing effectiveness against Bundibugyo, and 50,000 for frontline health workers — with Gavi funding shipment and rollout."}, "it": {"title": "Sperimentazione del vaccino Ervebo contro l'Ebola Bundibugyo", "text": "Ervebo (rVSV-ZEBOV) è l'unico vaccino anti-Ebola autorizzato dall'OMS, ma è stato sviluppato e testato contro la specie Zaire ebolavirus, non contro il ceppo Bundibugyo che guida l'epidemia 2026 nella RD Congo. I primi dati di laboratorio e sugli animali suggeriscono una possibile protezione incrociata, ma ciò non è provato sull'uomo. Ad agosto 2026 l'International Coordinating Group ha approvato 70.000 dosi per la RD Congo — 20.000 per uno studio clinico di Fase 3 che ne testa l'efficacia contro il Bundibugyo, e 50.000 per gli operatori sanitari in prima linea — con Gavi che finanzia spedizione e distribuzione."}}, "maga-split": {"en": {"title": "The Trump–Tucker Carlson MAGA split", "text": "A rift within Trump's MAGA base that opened after the February 2026 Iran war, which Tucker Carlson and allies like Marjorie Taylor Greene and Thomas Massie saw as fought for Israel's benefit rather than American interests. Carlson floated launching a breakaway \"America First\" third party; Greene resigned from Congress and Massie lost a primary, both citing rifts with Trump, including over releasing the Epstein files. Trump has mocked the group as \"losers\" with no political future, while polling shows Carlson far behind Vance and Rubio for the 2028 GOP nomination."}, "it": {"title": "La spaccatura MAGA tra Trump e Tucker Carlson", "text": "Una frattura nella base MAGA di Trump apertasi dopo la guerra in Iran di febbraio 2026, che Tucker Carlson e alleati come Marjorie Taylor Greene e Thomas Massie considerano combattuta a beneficio di Israele più che degli interessi americani. Carlson ha ipotizzato di lanciare un terzo partito \"America First\"; Greene si è dimessa dal Congresso e Massie ha perso una primaria, entrambi citando contrasti con Trump, anche sul rilascio dei file Epstein. Trump ha deriso il gruppo come \"perdenti\" senza futuro politico, mentre i sondaggi danno Carlson molto indietro rispetto a Vance e Rubio per la nomination repubblicana 2028."}}, "storm-shadow": {"en": {"title": "Storm Shadow missile", "text": "The Storm Shadow (also known as SCALP) is a long-range, air-launched cruise missile jointly developed by the UK and France, capable of striking targets over 250km away. The UK has supplied Ukraine with the missile since 2023; sharing its design blueprints would let Ukraine begin building similar long-range weapons domestically, reducing its dependence on Western stockpiles."}, "it": {"title": "Missile Storm Shadow", "text": "Lo Storm Shadow (noto anche come SCALP) è un missile da crociera a lungo raggio lanciato da aerei, sviluppato congiuntamente da Regno Unito e Francia, capace di colpire bersagli a oltre 250 km di distanza. Il Regno Unito lo fornisce all'Ucraina dal 2023; condividerne i progetti permetterebbe a Kyiv di iniziare a costruire armi a lungo raggio simili in autonomia, riducendo la dipendenza dalle scorte occidentali."}}, "mail-in-voting-order": {"en": {"title": "Trump's mail-in voting executive order", "text": "An executive order signed by President Trump seeking to tighten rules around mail-in ballots, including stricter deadlines and identification requirements, on the unproven claim that mail voting is especially prone to fraud. Voting-rights groups and Democratic-led states have challenged the order in court, arguing it could disenfranchise voters who rely on mail ballots, including the elderly, disabled and rural voters."}, "it": {"title": "Ordine esecutivo di Trump sul voto per posta", "text": "Un ordine esecutivo firmato dal presidente Trump che punta a inasprire le regole sul voto per posta, incluse scadenze più rigide e requisiti di identificazione, sulla base della tesi non dimostrata che il voto postale sia particolarmente soggetto a frodi. Gruppi per i diritti di voto e stati a guida democratica hanno impugnato l'ordine in tribunale, sostenendo che potrebbe privare del diritto di voto elettori che dipendono dalle schede postali, tra cui anziani, disabili ed elettori delle aree rurali."}}, "boston-dynamics": {"en": {"title": "Boston Dynamics", "text": "Boston Dynamics is a US robotics company, owned by Hyundai Motor Group since 2021, best known for its agile robots like Atlas and Spot. Hyundai plans to deploy Boston Dynamics' humanoid robots on its own factory floors starting in 2028, a key point of friction in labor talks as unions seek job-protection guarantees against automation."}, "it": {"title": "Boston Dynamics", "text": "Boston Dynamics è un'azienda statunitense di robotica, di proprietà di Hyundai Motor Group dal 2021, nota soprattutto per i suoi robot agili come Atlas e Spot. Hyundai prevede di impiegare i robot umanoidi di Boston Dynamics nelle proprie fabbriche a partire dal 2028, un punto di attrito chiave nelle trattative sindacali, dove i lavoratori chiedono garanzie di tutela occupazionale contro l'automazione."}}, "abraham-accords": {"en": {"title": "Abraham Accords", "text": "A set of US-brokered agreements, signed starting in 2020, under which the UAE, Bahrain, Morocco and Sudan normalized diplomatic relations with Israel without requiring a prior resolution of the Israeli-Palestinian conflict. Saudi Arabia has so far declined to join, insisting on a credible pathway to Palestinian statehood first, making it the biggest prize the US has been trying to secure for the framework."}, "it": {"title": "Accordi di Abramo", "text": "Un insieme di accordi mediati dagli Stati Uniti, firmati a partire dal 2020, con cui Emirati Arabi Uniti, Bahrein, Marocco e Sudan hanno normalizzato le relazioni diplomatiche con Israele senza richiedere una previa risoluzione del conflitto israelo-palestinese. L'Arabia Saudita finora ha rifiutato di aderire, chiedendo prima un percorso credibile verso uno Stato palestinese, il che ne fa il traguardo più ambito che gli Stati Uniti cercano di ottenere per l'iniziativa."}}, "glof": {"en": {"title": "Glacial Lake Outburst Flood (GLOF)", "text": "A sudden, often catastrophic release of water from a lake dammed by glacier ice or moraine, triggered when the natural dam fails or an ice/rock avalanche displaces the water. Himalayan glaciers are retreating rapidly due to climate change, creating and destabilizing more such lakes and making GLOF events more frequent and severe across Nepal, Tibet and neighboring countries."}, "it": {"title": "Alluvione da collasso di lago glaciale (GLOF)", "text": "Un rilascio improvviso, spesso catastrofico, di acqua da un lago trattenuto da ghiaccio glaciale o morena, innescato quando la diga naturale cede o una valanga di ghiaccio/roccia sposta l'acqua. I ghiacciai himalayani si ritirano rapidamente a causa del cambiamento climatico, creando e destabilizzando un numero crescente di questi laghi e rendendo gli eventi GLOF più frequenti e gravi in Nepal, Tibet e nei paesi vicini."}}, "femicide-law-it": {"en": {"title": "Article 577-bis (Italian Penal Code)", "text": "A standalone femicide offence introduced into Italy's penal code, in force since December 17, 2025, which recognizes the killing of a woman because of her gender as a distinct, aggravated crime carrying life imprisonment. It followed years of advocacy after Italy's official interior-ministry statistics and the independent 'Non Una Di Meno' observatory tracked dozens of such killings every year."}, "it": {"title": "Articolo 577-bis del Codice Penale", "text": "Il reato autonomo di femminicidio introdotto nel codice penale italiano, in vigore dal 17 dicembre 2025, che riconosce l'uccisione di una donna a causa del suo genere come reato distinto e aggravato, punito con l'ergastolo. È arrivato dopo anni di mobilitazione, mentre le statistiche ufficiali del ministero dell'Interno e l'osservatorio indipendente 'Non Una Di Meno' registravano ogni anno decine di casi."}}, "ex-ilva": {"en": {"title": "Ex Ilva", "text": "The former Ilva steelworks in Taranto, southern Italy — once Europe's largest steel plant — has been under special state administration for years amid environmental and financial crises, with the government repeatedly intervening on financing, environmental cleanup and waste-management rules while a buyer for the site is sought."}, "it": {"title": "Ex Ilva", "text": "L'ex stabilimento siderurgico Ilva di Taranto, un tempo il più grande impianto d'acciaio d'Europa, è da anni sotto amministrazione straordinaria tra crisi ambientali e finanziarie, con il governo intervenuto più volte su finanziamenti, bonifiche ambientali e regole di gestione dei rifiuti mentre si cerca un acquirente per lo stabilimento."}}, "shadow-fleet": {"en": {"title": "Russian \"shadow fleet\"", "text": "An armada of hundreds of aging, often uninsured oil tankers that Russia uses to keep exporting crude despite Western sanctions and the G7 price cap, typically by flying flags of convenience, disabling tracking transponders, and repeatedly renaming or re-flagging vessels. It has become both an economic lifeline for the Kremlin's war in Ukraine and an environmental and security risk given the vessels' poor maintenance."}, "it": {"title": "\"Flotta ombra\" russa", "text": "Un'armata di centinaia di petroliere datate e spesso non assicurate che la Russia utilizza per continuare a esportare greggio nonostante le sanzioni occidentali e il tetto di prezzo del G7, tipicamente battendo bandiere di comodo, disattivando i transponder di tracciamento e cambiando ripetutamente nome o bandiera alle navi. È diventata sia un'ancora di salvezza economica per la guerra del Cremlino in Ucraina sia un rischio ambientale e di sicurezza vista la scarsa manutenzione delle navi."}}}, "items": [{"id": "iran-strikes", "date": "2026-07-19", "country": "Iran", "category": "Geopolitics", "topics": ["us-iran"], "en": {"title": "US completes 8th night of strikes on Iran", "summary": "US strikes targeted IRGC forces, coastal surveillance and air-defense sites after an Iranian attack killed 2 US soldiers in Jordan. Ship traffic through the Strait of Hormuz has dropped to a three-week low.", "detail": "Iran's new Supreme Leader, Mojtaba Khamenei, warned Washington of \"unforgettable lessons\" if the strikes continue, calling President Trump's past commitments \"utterly worthless.\" Regional allies have been hit too: Kuwait's desalination and oil facilities were damaged, a child was wounded by shrapnel in Qatar, and Jordan intercepted ten Iranian missiles. Brent crude has surged to around $88 a barrel as a direct consequence. The UN Secretary-General condemned strikes on civilian infrastructure as \"unacceptable,\" and the Gulf Cooperation Council called Iran's actions \"war crimes.\"", "terms": [{"match": "IRGC", "id": "irgc"}, {"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "Gli USA completano l'ottava notte di raid sull'Iran", "summary": "I raid statunitensi hanno colpito forze dell'IRGC, siti di sorveglianza costiera e difesa aerea, dopo che un attacco iraniano ha ucciso 2 soldati USA in Giordania. Il traffico navale nello Stretto di Hormuz è sceso al livello più basso delle ultime tre settimane.", "detail": "Il nuovo Guida Suprema iraniana, Mojtaba Khamenei, ha avvertito Washington di \"lezioni indimenticabili\" se gli attacchi continueranno, definendo gli impegni passati del presidente Trump \"del tutto privi di valore\". Anche gli alleati regionali sono stati colpiti: sono stati danneggiati gli impianti di desalinizzazione e petroliferi del Kuwait, un bambino è rimasto ferito da schegge in Qatar, e la Giordania ha intercettato dieci missili iraniani. Il greggio Brent è salito a circa 88 dollari al barile come conseguenza diretta. Il Segretario generale dell'ONU ha condannato gli attacchi alle infrastrutture civili come \"inaccettabili\", e il Consiglio di Cooperazione del Golfo ha definito le azioni iraniane \"crimini di guerra\".", "terms": [{"match": "IRGC", "id": "irgc"}, {"match": "Stretto di Hormuz", "id": "hormuz"}]}, "sources": [{"name": "CBS News", "url": "https://www.cbsnews.com/live-updates/iran-war-trump-strait-of-hormuz-attacks-persian-gulf/", "reliability": 4}, {"name": "CNN", "url": "https://www.cnn.com/2026/07/19/world/live-news/iran-war-trump", "reliability": 4}]}, {"id": "jordan-attack", "date": "2026-07-18", "country": "USA", "category": "Geopolitics", "topics": ["us-iran"], "en": {"title": "Two US soldiers killed in Iranian strike on Jordan base", "summary": "An Iranian attack on Muwaffaq Salti Air Base killed two US service members; a third is missing.", "detail": "The strike marks a major escalation: it is the first time Iranian forces have directly killed US troops on allied soil during this conflict. In response, the US targeted Islamic Revolutionary Guard Corps units believed responsible, along with coastal surveillance sites, air-defense facilities and maritime assets across the region. The State Department has since issued expanded travel warnings for Americans worldwide.", "terms": [{"match": "Muwaffaq Salti Air Base", "id": "irgc-jordan"}]}, "it": {"title": "Due soldati USA uccisi in un attacco iraniano a una base in Giordania", "summary": "Un attacco iraniano alla base aerea di Muwaffaq Salti ha ucciso due militari statunitensi; un terzo risulta disperso.", "detail": "L'attacco segna un'escalation importante: è la prima volta che le forze iraniane uccidono direttamente truppe statunitensi su suolo alleato in questo conflitto. In risposta, gli USA hanno colpito unità del Corpo delle Guardie della Rivoluzione Islamica ritenute responsabili, oltre a siti di sorveglianza costiera, strutture di difesa aerea e asset marittimi in tutta la regione. Il Dipartimento di Stato ha da allora emesso avvisi di viaggio ampliati per i cittadini americani in tutto il mondo.", "terms": [{"match": "base aerea di Muwaffaq Salti", "id": "irgc-jordan"}]}, "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/07/18/nx-s1-5898916/us-iran-escalate-strikes", "reliability": 5}, {"name": "NBC News", "url": "https://www.nbcnews.com/world/middle-east/two-us-service-members-killed-jordan-another-missing-centom-says-rcna588181", "reliability": 4}]}, {"id": "iran-qatar-talks", "date": "2026-07-01", "country": "Iran", "category": "Geopolitics", "topics": ["us-iran"], "en": {"title": "Iran to open communication channel with US after Qatar talks", "summary": "Tehran agrees to open a channel of communication on a memorandum of understanding with Washington following mediated talks in Qatar.", "detail": "The agreement came after indirect talks brokered by Qatari officials, seen as the first tentative step toward de-escalation before the conflict reignited later in the month. Analysts cautioned the channel was fragile and dependent on both sides refraining from further strikes.", "terms": []}, "it": {"title": "L'Iran apre un canale di comunicazione con gli USA dopo i colloqui in Qatar", "summary": "Teheran accetta di aprire un canale di comunicazione su un memorandum d'intesa con Washington, dopo colloqui mediati in Qatar.", "detail": "L'accordo arriva dopo colloqui indiretti mediati da funzionari qatarioti, visto come primo timido passo verso la de-escalation prima che il conflitto si riaccendesse più avanti nel mese. Gli analisti hanno avvertito che il canale era fragile e dipendeva dal fatto che entrambe le parti si astenessero da nuovi attacchi.", "terms": []}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/1/iran-to-open-communication-channel-on-mou-with-us-after-talks-in-qatar", "reliability": 4}, {"name": "CNN", "url": "https://www.cnn.com/2026/07/01/world/live-news/iran-war-trump", "reliability": 4}]}, {"id": "trump-ceasefire-over", "date": "2026-07-10", "country": "USA", "category": "Geopolitics", "topics": ["us-iran"], "en": {"title": "Trump declares Iran ceasefire 'OVER!' but says talks will continue", "summary": "Trump says the US and Iran will keep talking even as he declares the ceasefire finished, deepening uncertainty over the conflict's trajectory.", "detail": "The mixed messaging came as mediators worked to de-escalate tensions and revive nuclear talks, even as fighting on the ground continued to intensify. The declaration foreshadowed the sharper escalation seen later in the month, culminating in the Jordan base attack and the retaliatory US strikes.", "terms": []}, "it": {"title": "Trump dichiara finito il cessate il fuoco con l'Iran, ma i colloqui continueranno", "summary": "Trump afferma che USA e Iran continueranno a negoziare, pur dichiarando concluso il cessate il fuoco, aumentando l'incertezza sull'evoluzione del conflitto.", "detail": "Il messaggio contraddittorio arriva mentre i mediatori lavoravano per allentare le tensioni e far ripartire i negoziati nucleari, anche se gli scontri sul terreno continuavano a intensificarsi. La dichiarazione ha anticipato l'escalation più dura vista più avanti nel mese, culminata nell'attacco alla base in Giordania e nei raid di rappresaglia statunitensi.", "terms": []}, "sources": [{"name": "Washington Post", "url": "https://www.washingtonpost.com/world/2026/07/10/trump-says-us-iran-will-keep-talking-declares-ceasefire-over/", "reliability": 5}, {"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-10/trump-says-iran-ceasefire-over-but-talks-on-deal-to-continue", "reliability": 5}]}, {"id": "netanyahu-nyc", "date": "2026-07-18 aeli strikes on Gaza kill eight people, among them two children, despite the nominal ceasefire in place.", "terms": [], "detail": "New Israeli strikes on Gaza kill eight people, among them two children, despite the nominal ceasefire in place."}, "it": {"title": "Raid aerei israeliani a Gaza uccidono otto persone, tra cui due bambini", "summary": "Nuovi raid israeliani su Gaza uccidono otto persone, tra cui due bambini, nonostante il cessate il fuoco nominalmente in vigore.", "terms": [], "detail": "Nuovi raid israeliani su Gaza uccidono otto persone, tra cui due bambini, nonostante il cessate il fuoco nominalmente in vigore."}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/8/israeli-air-strikes-in-gaza-kill-eight-including-two-children", "reliability": 4}, {"name": "U.S. News", "url": "https://www.usnews.com/news/world/articles/2026-07-08/israeli-fire-kills-five-people-including-a-child-in-gaza-medics-say", "reliability": 4}]}, {"id": "gaza-strikes-july9", "date": "2026-07-09", "country": "Palestine", "category": "Geopolitics", "topics": ["israel-palestine"], "en": {"title": "Israeli attacks on Gaza kill 10 people in 24 hours despite 'ceasefire'", "summary": "Ceasefire violations continue, with a further ten deaths recorded in a single day across the strip.", "terms": [], "detail": "Ceasefire violations continue, with a further ten deaths recorded in a single day across the strip."}, "it": {"title": "Gli attacchi israeliani a Gaza uccidono 10 persone in 24 ore nonostante il 'cessate il fuoco'", "summary": "Continuano le violazioni del cessate il fuoco, con altri dieci morti registrati in un solo giorno nella Striscia.", "terms": [], "detail": "Continuano le violazioni del cessate il fuoco, con altri dieci morti registrati in un solo giorno nella Striscia."}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/9/israeli-attacks-on-gaza-kill-10-people-in-24-hours-despite-ceasefire", "reliability": 4}, {"n {"name": "PBS NewsHour", "url": "https://www.pbs.org/newshour/world/israels-latest-strikes-kill-at-least-a-dozen-people-in-gaza-including-police-officers", "reliability": 5}]}, {"id": "oil-surge", "date": "2026-07-09", "country": "Global", "category": "Economy", "en": {"title": "Oil surges to $88/barrel as Iran war widens", "summary": "Asian stocks slip and oil jumps as the Strait of Hormuz conflict disrupts shipping and rattles global markets.", "detail": "Ship traffic through the Strait has dropped to its lowest level in three weeks, with maritime experts describing conditions as returning to \"the worst case scenario.\" Economists warn the escalation adds fresh uncertainty to an already fragile global economy, complicating the inflation and growth picture the Federal Reserve must weigh at its next meeting.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "Il petrolio sale a 88 dollari al barile mentre la guerra con l'Iran si allarga", "summary": "I mercati asiatici scendono e il petrolio sale, mentre il conflitto nello Stretto di Hormuz interrompe le rotte commerciali e scuote i mercati globali.", "detail": "Il traffico navale nello Stretto è sceso al livello più basso delle ultime tre settimane, con gli esperti marittimi che descrivono la situazione come un ritorno allo \"scenario peggiore possibile\". Gli economisti avvertono che l'escalation aggiunge nuova incertezza a un'economia globale già fragile, complicando il quadro di inflazione e crescita che la Federal Reserve dovrà valutare al prossimo incontro.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}]}, "sources": [{"name": "Washington Post", "url": "https://www.washingtonpost.com/business/2026/07/09/stock-markets-oil-iran-ai/2a3410ae-7b51-11f1-b194-f872dd4ec5aa_story.html", "reliability": 5}, {"name": "CNBC", "url": "https://www.cnbc.com/2026/07/17/oil-price-today-brent-wti.html", "reliability": 4}], "topics": ["mercato-investimenti"]}, {"id": "fed-report", "date": "2
