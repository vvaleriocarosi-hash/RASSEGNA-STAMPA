026-07-10", "country": "USA", "category": "Economy", "en": {"title": "Fed releases July Monetary Policy Report ahead of July 29 decision", "summary": "The Federal Reserve's report to Congress sets the stage for the July 29 rate decision amid oil-driven inflation risk.", "detail": "Markets are watching closely for signs of a rate cut, though the Iran-driven oil price spike may complicate the inflation outlook the committee has to weigh. The new 15% EU-US tariff rate is another variable factored into the report, adding to uncertainty around price pressures heading into the second half of the year.", "terms": [{"match": "Federal Reserve", "id": "fed"}]}, "it": {"title": "La Fed pubblica il rapporto di politica monetaria di luglio in vista della decisione del 29", "summary": "Il rapporto della Federal Reserve al Congresso prepara il terreno per la decisione sui tassi del 29 luglio, in un contesto di rischio inflazionistico legato al petrolio.", "detail": "I mercati osservano con attenzione eventuali segnali di un taglio dei tassi, anche se l'impennata dei prezzi del petrolio legata all'Iran potrebbe complicare le prospettive di inflazione che il comitato deve valutare. Il nuovo dazio UE-USA al 15% è un'altra variabile inclusa nel rapporto, che si aggiunge all'incertezza sulle pressioni sui prezzi nella seconda metà dell'anno.", "terms": [{"match": "Federal Reserve", "id": "fed"}]}, "sources": [{"name": "Federal Reserve", "url": "https://www.federalreserve.gov/monetarypolicy/files/20260710_mprfullreport.pdf", "reliability": 5}, {"name": "Forbes", "url": "https://www.forbes.com/sites/investor-hub/article/fed-meeting-tracker-interest-rate-strategy/", "reliability": 3}], "topics": ["mercato-investimenti"]}, {"id": "eu-us-tariff", "date": "2026-07-01", "country": "EU", "category": "Economy", "en": {"title": "EU-US 15% tariff deal takes effect", "summary": "After Trump's July 4 deadline threat, the EU-US trade agreement setting a 15% reciprocal tariff rate goes live, aiming to restore trade stability.", "detail": "The agreement follows months of tense negotiations that came close to collapsing when Washington threatened much higher tariffs unless a deal was implemented by July 4. The European Parliament gave its final green light to the tariff legislation in mid-June, and businesses on both sides of the Atlantic have welcomed the increased predictability after a turbulent year of trade threats.", "terms": [{"match": "15% reciprocal tariff rate", "id": "tariff"}]}, "it": {"title": "Entra in vigore l'accordo sui dazi UE-USA al 15%", "summary": "Dopo l'ultimatum di Trump del 4 luglio, entra in vigore l'accordo commerciale UE-USA che fissa un dazio reciproco al 15%, con l'obiettivo di ripristinare la stabilità commerciale.", "detail": "L'accordo arriva dopo mesi di trattative tese, vicine a saltare quando Washington aveva minacciato dazi molto più alti in assenza di un'intesa entro il 4 luglio. Il Parlamento europeo ha dato il via libera definitivo alla normativa sui dazi a metà giugno, e le imprese su entrambe le sponde dell'Atlantico hanno accolto con favore la maggiore prevedibilità dopo un anno turbolento di minacce commerciali.", "terms": [{"match": "dazio reciproco al 15%", "id": "tariff"}]}, "sources": [{"name": "European Commission", "url": "https://commission.europa.eu/topics/trade/eu-us-trade-deal_en", "reliability": 5}, {"name": "RTE", "url": "https://www.rte.ie/news/business/2026/0630/1581078-eu-to-implement-trade-deal-with-us-from-tomorrow/", "reliability": 4}], "topics": ["mercato-investimenti"]}, {"id": "eu-tariff-deadline", "date": "2026-05-07", "country": "EU", "category": "Politics", "en": {"title": "Trump sets July 4 deadline for EU tariff hike decision", "summary": "Washington threatens much higher tariffs on the EU unless a trade deal is implemented by July 4, raising transatlantic tensions.", "detail": "The ultimatum reignited fears of a full-blown trade war between the two blocs, with European officials warning of retaliatory measures if talks failed. In the end, negotiators reached a compromise just before the deadline, settling on the 15% reciprocal tariff rate that took effect July 1.", "terms": []}, "it": {"title": "Trump fissa al 4 luglio l'ultimatum per l'aumento dei dazi sull'UE", "summary": "Washington minaccia dazi molto più alti sull'UE se non verrà raggiunto un accordo commerciale entro il 4 luglio, alzando la tensione transatlantica.", "detail": "L'ultimatum ha riacceso i timori di una vera e propria guerra commerciale tra i due blocchi, con i funzionari europei che minacciavano contromisure in caso di fallimento dei negoziati. Alla fine i negoziatori hanno raggiunto un compromesso poco prima della scadenza, fissando il dazio reciproco al 15% entrato in vigore il 1° luglio.", "terms": []}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/economy/2026/5/7/trump-sets-july-4-deadline-for-eu-tariff-hike-decision", "reliability": 4}, {"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-05-07/trump-gives-eu-until-july-4-to-ratify-deal-extending-deadline", "reliability": 5}], "topics": ["politica-internazionale"]}, {"id": "ms-ai", "date": "2026-07-07", "country": "USA", "category": "Technology", "en": {"title": "Microsoft replaces OpenAI/Anthropic with its own AI in some apps", "summary": "Microsoft shifts some consumer apps to in-house AI models, a notable step away from its OpenAI partnership.", "detail": "The move is notable given Microsoft's multi-billion-dollar partnership with OpenAI, and signals a broader push toward AI independence as competition among Big Tech AI labs intensifies. Other major developments this month include continued jockeying between Anthropic, Apple, Google, Meta, Moonshot AI and Nvidia over new model releases and chip supply deals.", "terms": []}, "it": {"title": "Microsoft sostituisce OpenAI/Anthropic con una propria AI in alcune app", "summary": "Microsoft sposta alcune app consumer verso modelli di intelligenza artificiale sviluppati internamente, un passo significativo di allontanamento dalla partnership con OpenAI.", "detail": "La mossa è significativa considerando la partnership multimiliardaria di Microsoft con OpenAI, e segnala una spinta più ampia verso l'indipendenza nell'AI mentre la concorrenza tra i grandi laboratori tecnologici si intensifica. Altri sviluppi rilevanti del mese includono il continuo confronto tra Anthropic, Apple, Google, Meta, Moonshot AI e Nvidia su nuovi modelli e accordi per le forniture di chip.", "terms": []}, "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-07/microsoft-replaces-openai-anthropic-with-own-ai-in-some-apps", "reliability": 5}, {"name": "CNBC", "url": "https://www.cnbc.com/2026/06/02/microsoft-unveils-new-ai-models-lessen-reliance-on-openai-lower-costs.html", "reliability": 4}], "topics": ["ai"]}, {"id": "ice-deportation", "date": "2026-07-15", "country": "USA", "category": "Politics", "en": {"title": "Trump's deportation push falters after fatal ICE encounters", "summary": "Deadly ICE shootings in Los Angeles spark protests and collapsing prosecutions, straining the administration's deportation campaign.", "detail": "Following the shootings, \"ICE Out\" protests have erupted in downtown Los Angeles, and reporting indicates many prosecutions tied to anti-ICE demonstration arrests have been collapsing in court as judges question the evidence presented. The episode has become a rallying point for critics of the administration's immigration enforcement strategy nationwide.", "terms": [{"match": "ICE", "id": "ice"}]}, "it": {"title": "La stretta sulle espulsioni di Trump vacilla dopo scontri fatali con l'ICE", "summary": "Sparatorie fatali dell'ICE a Los Angeles scatenano proteste e fanno crollare i procedimenti giudiziari, mettendo sotto pressione la campagna di espulsioni dell'amministrazione.", "detail": "In seguito alle sparatorie, sono scoppiate proteste \"ICE Out\" nel centro di Los Angeles, e diverse fonti indicano che molti procedimenti legati agli arresti durante le manifestazioni anti-ICE stanno cadendo in tribunale, con i giudici che mettono in dubbio le prove presentate. L'episodio è diventato un punto di riferimento per i critici della strategia di applicazione delle leggi sull'immigrazione dell'amministrazione a livello nazionale.", "terms": [{"match": "ICE", "id": "ice"}]}, "sources": [{"name": "Washington Post", "url": "https://www.washingtonpost.com/politics/2026/07/15/trump-deportation-push-falters-after-fatal-ice-encounters/", "reliability": 5}, {"name": "CNN", "url": "https://www.cnn.com/us/trump-immigration-crackdown-shootings", "reliability": 4}], "topics": ["politica-internazionale"]}, {"id": "sa-protests", "date": "2026-07-02", "country": "South Africa", "category": "Social", "en": {"title": "900+ arrested in anti-migrant protests", "summary": "One of the largest migration-related crackdowns of the year, part of a wider wave of anti-immigration unrest globally.", "detail": "The protests reflect rising anti-immigration sentiment flaring in multiple countries simultaneously, echoed by similar unrest in the UK (Birmingham) and the ongoing anti-ICE demonstrations in the US. Rights groups have criticized the scale of the arrests, while some South African officials defended the crackdown as necessary to maintain public order.", "terms": []}, "it": {"title": "Oltre 900 arresti nelle proteste anti-migranti", "summary": "Una delle più grandi operazioni di repressione legate alla migrazione dell'anno, parte di un'ondata più ampia di tensioni anti-immigrazione a livello globale.", "detail": "Le proteste riflettono un crescente sentimento anti-immigrazione che divampa contemporaneamente in più paesi, con eco in disordini simili nel Regno Unito (Birmingham) e nelle proteste anti-ICE in corso negli Stati Uniti. Le organizzazioni per i diritti umani hanno criticato la portata degli arresti, mentre alcuni funzionari sudafricani hanno difeso la repressione come necessaria per mantenere l'ordine pubblico.", "terms": []}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/2/more-than-900-arrested-during-south-africas-antimigrant-protests", "reliability": 4}, {"name": "NBC News", "url": "https://www.nbcnews.com/world/africa/south-africa-arrests-nationwide-anti-migrant-protests-rcna352529", "reliability": 4}], "topics": []}, {"id": "measles", "date": "2026-07-15", "country": "USA", "category": "Medicine", "en": {"title": "US measles cases near full 2025 total, 6 months still remaining", "summary": "Rising vaccine exemptions drive a surge in cases, putting the US measles elimination status at risk.", "detail": "CDC data show the 2026 case count has already reached roughly 91% of all of 2025's total. Separately, PAHO/WHO reported that routine immunization has rebounded across the Americas overall, even as measles coverage gaps persist in specific communities — a sign the crisis is uneven rather than universal.", "terms": [{"match": "measles elimination status", "id": "measles-status"}]}, "it": {"title": "I casi di morbillo negli USA vicini al totale 2025, con ancora 6 mesi da contare", "summary": "L'aumento delle esenzioni vaccinali fa crescere i contagi, mettendo a rischio lo stato di eliminazione del morbillo negli Stati Uniti.", "detail": "I dati del CDC mostrano che il numero di casi del 2026 ha già raggiunto circa il 91% del totale dell'intero 2025. Separatamente, PAHO/OMS ha riferito che l'immunizzazione di routine è in ripresa in tutte le Americhe nel complesso, anche se permangono lacune di copertura contro il morbillo in comunità specifiche — segno che la crisi è irregolare più che generalizzata.", "terms": [{"match": "stato di eliminazione del morbillo", "id": "measles-status"}]}, "sources": [{"name": "U.S. News", "url": "https://www.usnews.com/news/health-news/articles/tracking-the-2026-u-s-measles-outbreaks", "reliability": 4}, {"name": "CDC", "url": "https://www.cdc.gov/measles/data-research/index.html", "reliability": 5}], "topics": []}, {"id": "alzheimers", "date": "2026-06-08", "country": "USA", "category": "Medicine", "en": {"title": "Scientists identify new Alzheimer's trigger and blocking drug", "summary": "New research points to a fresh Alzheimer's disease mechanism and a drug candidate that halts it in early studies.", "detail": "The finding is one of several promising results this year, including a surprising link between certain cancer drugs and reduced Alzheimer's risk, and new research on sleep's role in clearing disease-linked proteins from the brain. Researchers caution the drug candidate is still in early-stage studies and years away from clinical use.", "terms": [{"match": "Alzheimer's", "id": "alzheimer"}]}, "it": {"title": "Gli scienziati identificano un nuovo fattore scatenante dell'Alzheimer e un farmaco in grado di bloccarlo", "summary": "Una nuova ricerca sull'Alzheimer individua un meccanismo scatenante inedito e un farmaco candidato che lo blocca negli studi preliminari.", "detail": "La scoperta è uno dei numerosi risultati promettenti di quest'anno, incluso un sorprendente legame tra alcuni farmaci oncologici e la riduzione del rischio di Alzheimer, oltre a nuove ricerche sul ruolo del sonno nella rimozione delle proteine associate alla malattia dal cervello. I ricercatori avvertono che il farmaco candidato è ancora in fase di studio preliminare e lontano anni dall'uso clinico.", "terms": [{"match": "Alzheimer", "id": "alzheimer"}]}, "sources": [{"name": "ScienceDaily", "url": "https://www.sciencedaily.com/releases/2026/06/260608035959.htm", "reliability": 4}, {"name": "ScienceAlert", "url": "https://www.sciencealert.com/scientists-found-a-new-alzheimers-trigger-and-a-drug-to-slow-it-in-mice", "reliability": 3}], "topics": []}, {"id": "omsk-refinery-strike", "date": "2026-07-06", "country": "Russia", "category": "Geopolitics", "topics": ["russia-ukraine"], "en": {"title": "Ukraine strikes Russia's largest oil refinery in Omsk, Siberia", "summary": "Ukrainian drones hit the Omsk refinery for the first time, roughly 2,500km from Ukraine, in one of the deepest strikes of the war on Russian energy infrastructure.", "detail": "Analysts estimate Ukrainian strikes have disabled 20-40% of Russian refining capacity over recent months, pushing Russian oil refining down to about 3.8 million barrels a day — the lowest level in 21 years, according to the Oxford Institute for Energy Studies. The Omsk strike underscores Kyiv's growing long-range drone capability.", "terms": []}, "it": {"title": "L'Ucraina colpisce la più grande raffineria russa, a Omsk in Siberia", "summary": "I droni ucraini colpiscono per la prima volta la raffineria di Omsk, a circa 2.500 km dall'Ucraina, in uno degli attacchi più profondi della guerra contro le infrastrutture energetiche russe.", "detail": "Gli analisti stimano che gli attacchi ucraini abbiano messo fuori uso il 20-40% della capacità di raffinazione russa negli ultimi mesi, facendo scendere la raffinazione di petrolio russa a circa 3,8 milioni di barili al giorno — il livello più basso degli ultimi 21 anni, secondo l'Oxford Institute for Energy Studies. L'attacco a Omsk sottolinea la crescente capacità di Kiev nei droni a lungo raggio.", "terms": []}, "sources": [{"name": "The Moscow Times", "url": "https://www.themoscowtimes.com/2026/07/06/ukraine-strikes-russias-largest-oil-refinery-in-western-siberia-a93177", "reliability": 4}, {"name": "CNBC", "url": "https://www.cnbc.com/2026/07/07/ukraine-russia-omsk-oil-refinery-putin-nato.html", "reliability": 4}]}, {"id": "kyiv-strike-july15", "date": "2026-07-15", "country": "Ukraine", "category": "Geopolitics", "topics": ["russia-ukraine"], "en": {"title": "Kyiv hit again as Ukraine reports two dead in Russian strike", "summary": "A fresh Russian strike on Kyiv kills two people, part of continued attacks on the Ukrainian capital.", "terms": [], "detail": "A fresh Russian strike on Kyiv kills two people, part of continued attacks on the Ukrainian capital."}, "it": {"title": "Kiev colpita di nuovo, l'Ucraina segnala due morti in un attacco russo", "summary": "Un nuovo attacco russo su Kiev uccide due persone, nell'ambito degli attacchi continui contro la capitale ucraina.", "terms": [], "detail": "Un nuovo attacco russo su Kiev uccide due persone, nell'ambito degli attacchi continui contro la capitale ucraina."}, "sources": [{"name": "Euronews", "url": "https://www.euronews.com/video/2026/07/16/kyiv-hit-again-as-ukraine-reports-two-dead-in-russian-strike", "reliability": 4}, {"name": "UNN", "url": "https://unn.ua/en/news/attack-on-kyiv-two-dead-six-wounded", "reliability": 3}]}, {"id": "ukraine-hits-vessels", "date": "2026-07-15", "country": "Ukraine", "category": "Geopolitics", "topics": ["russia-ukraine"], "en": {"title": "Ukraine strikes 20 Russian vessels", "summary": "Kyiv claims a wide-ranging strike on Russia's so-called \"shadow fleet\" and naval assets, part of its campaign to pressure Russian logistics.", "terms": [], "detail": "Kyiv claims a wide-ranging strike on Russia's so-called \"shadow fleet\" and naval assets, part of its campaign to pressure Russian logistics."}, "it": {"title": "L'Ucraina colpisce 20 navi russe", "summary": "Kiev rivendica un attacco su vasta scala contro la cosiddetta \"flotta ombra\" russa e altri asset navali, nell'ambito della sua campagna per mettere sotto pressione la logistica russa.", "terms": [], "detail": "Kiev rivendica un attacco su vasta scala contro la cosiddetta \"flotta ombra\" russa e altri asset navali, nell'ambito della sua campagna per mettere sotto pressione la logistica russa."}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/video/newsfeed/2026/7/15/ukraine-strikes-20-russian-vessels", "reliability": 4}, {"name": "Kyiv Independent", "url": "https://kyivindependent.com/ukraine-expands-maritime-campaign-to-black-sea-hits-20-russian-vessels-including-oil-tankers-madyar-says/", "reliability": 3}]}, {"id": "war-report-card", "date": "2026-07-14", "country": "Russia", "category": "Social", "topics": ["russia-ukraine"], "en": {"title": "Majority in both Russia and Ukraine now favor peace talks, polls show", "summary": "64% of Russians and 66% of Ukrainians say they favor pursuing peace negotiations, even as fighting and small territorial changes continue at the margins.", "detail": "Russia has gained an estimated 1,100-1,130 square miles of Ukrainian territory over the past year — roughly 0.5% of the country. Military casualties are estimated at around 1,000,000 for Russia and 250,000-300,000 for Ukraine (killed and wounded) since the war began, according to the Russia Matters War Report Card.", "terms": []}, "it": {"title": "La maggioranza in Russia e Ucraina è ora favorevole ai negoziati di pace, secondo i sondaggi", "summary": "Il 64% dei russi e il 66% degli ucraini si dice favorevole a proseguire i negoziati di pace, anche se gli scontri e piccoli cambiamenti territoriali continuano ai margini del fronte.", "detail": "La Russia ha guadagnato circa 1.100-1.130 miglia quadrate di territorio ucraino nell'ultimo anno — circa lo 0,5% del paese. Le perdite militari sono stimate intorno a 1.000.000 per la Russia e 250.000-300.000 per l'Ucraina (morti e feriti) dall'inizio della guerra, secondo il Russia Matters War Report Card.", "terms": []}, "sources": [{"name": "Russia Matters", "url": "https://www.russiamatters.org/news/russia-ukraine-war-report-card/russia-ukraine-war-report-card-july-15-2026", "reliability": 4}, {"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-03-04/russian-support-for-peace-with-ukraine-hits-new-high-poll-shows", "reliability": 5}]}, {"id": "iran-strikes-day9", "date": "2026-07-19", "country": "Iran", "category": "Geopolitics", "topics": ["us-iran"], "en": {"title": "US conducts ninth straight night of strikes on Iran", "summary": "The US carried out a ninth consecutive night of airstrikes on Iranian military and infrastructure targets. Secretary of State Marco Rubio said Iran is trying to use the Strait of Hormuz as \"leverage against the world,\" as the conflict shows no sign of de-escalating.", "detail": "The war resumed after President Trump declared the June ceasefire agreement over at a NATO summit, reimposing a naval blockade and revoking sanctions waivers on Iranian oil. US strikes have expanded from military sites to bridges and energy and water infrastructure, drawing accusations from Tehran of war crimes. More than 50 people have been killed in Iran by the strikes, and 15-16 US service members have died since the conflict restarted, including two soldiers killed in an Iranian strike on a US base in Jordan.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "Gli USA conducono la nona notte consecutiva di raid sull'Iran", "summary": "Gli Stati Uniti hanno condotto una nona notte consecutiva di raid aerei su obiettivi militari e infrastrutturali iraniani. Il Segretario di Stato Marco Rubio ha detto che l'Iran sta cercando di usare lo Stretto di Hormuz come \"leva contro il mondo\", mentre il conflitto non mostra segni di allentamento.", "detail": "La guerra è ripresa dopo che il presidente Trump ha dichiarato concluso l'accordo di cessate il fuoco di giugno durante un vertice NATO, reimponendo un blocco navale e revocando le esenzioni sulle sanzioni al petrolio iraniano. I raid statunitensi si sono estesi da obiettivi militari a ponti e infrastrutture energetiche e idriche, suscitando accuse di crimini di guerra da parte di Teheran. Più di 50 persone sono state uccise in Iran dai raid, e 15-16 militari USA sono morti da quando il conflitto è ripreso, inclusi due soldati uccisi in un attacco iraniano a una base USA in Giordania.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}]}, "sources": [{"name": "CBS News", "url": "https://www.cbsnews.com/live-updates/iran-war-trump-strait-of-hormuz-attacks-persian-gulf/", "reliability": 4}, {"name": "The Times of Israel", "url": "https://www.timesofisrael.com/liveblog-july-20-2026/", "reliability": 3}]}, {"id": "iran-gulf-desalination", "date": "2026-07-18", "country": "Iran", "category": "Geopolitics", "topics": ["us-iran"], "en": {"title": "Iran strikes water and power infrastructure in Kuwait and Jordan", "summary": "Iran retaliated against US-allied Gulf states by striking desalination plants and power facilities in Kuwait, alongside missile attacks intercepted by Jordan. About 10,000 people lost water access after a Kuwaiti desalination plant supplying roughly 90% of the country's drinking water was damaged.", "detail": "The attacks mark a dangerous widening of the conflict beyond Iran and the US, drawing in Gulf states that host American forces. Kuwait closed its airspace after two power and water plants were struck; firefighters were wounded battling the resulting blazes. Jordan said it intercepted ten Iranian ballistic missiles. Regional water infrastructure experts warn the strikes threaten a humanitarian crisis in a region almost entirely dependent on desalination for drinking water.", "terms": [{"match": "desalination plants", "id": "desalination"}]}, "it": {"title": "L'Iran colpisce infrastrutture idriche ed elettriche in Kuwait e Giordania", "summary": "L'Iran ha reagito contro gli stati del Golfo alleati degli USA colpendo impianti di desalinizzazione e centrali elettriche in Kuwait, oltre ad attacchi missilistici intercettati dalla Giordania. Circa 10.000 persone hanno perso l'accesso all'acqua dopo il danneggiamento di un impianto di desalinizzazione kuwaitiano che fornisce circa il 90% dell'acqua potabile del paese.", "detail": "Gli attacchi segnano un pericoloso allargamento del conflitto oltre Iran e Stati Uniti, coinvolgendo stati del Golfo che ospitano forze americane. Il Kuwait ha chiuso il proprio spazio aereo dopo che due centrali elettriche e idriche sono state colpite; alcuni vigili del fuoco sono rimasti feriti nello spegnere gli incendi. La Giordania ha dichiarato di aver intercettato dieci missili balistici iraniani. Gli esperti di infrastrutture idriche regionali avvertono che gli attacchi minacciano una crisi umanitaria in una regione quasi interamente dipendente dalla desalinizzazione per l'acqua potabile.", "terms": [{"match": "impianti di desalinizzazione", "id": "desalination"}]}, "sources": [{"name": "PBS NewsHour", "url": "https://www.pbs.org/newshour/world/as-u-s-strikes-bridges-in-iran-it-targets-a-water-desalination-plant-in-kuwait", "reliability": 5}, {"name": "NBC News", "url": "https://www.nbcnews.com/world/iran/water-energy-sites-hit-us-iran-strikes-escalate-rcna588143", "reliability": 4}]}, {"id": "russia-kyiv-missile-barrage", "date": "2026-07-19", "country": "Ukraine", "category": "Geopolitics", "topics": ["russia-ukraine"], "en": {"title": "Russian missile and drone barrage on Kyiv kills one, wounds 16", "summary": "Russia launched a major overnight assault on Kyiv, firing 41 missiles and 125 attack drones, killing one person and wounding 16. Fires broke out in five city districts, while Ukraine intercepted the majority of the incoming weapons.", "detail": "The barrage, which began around 1:30 a.m. local time, included 25 ballistic missiles primarily aimed at the capital. Ukrainian forces shot down 108 drones and 18 missiles, suggesting recently replenished Patriot interceptor stocks. President Zelensky confirmed most missiles targeted Kyiv. Russia's defense ministry claimed it hit military-related facilities including drone production plants, while Ukraine has been pressing the US for more Patriot systems amid depleted air-defense stockpiles.", "terms": []}, "it": {"title": "Un'ondata di missili e droni russi su Kiev uccide una persona e ne ferisce 16", "summary": "La Russia ha lanciato un massiccio assalto notturno su Kiev, sparando 41 missili e 125 droni d'attacco, uccidendo una persona e ferendone 16. Sono scoppiati incendi in cinque distretti della città, mentre l'Ucraina ha intercettato la maggior parte delle armi in arrivo.", "detail": "L'ondata di attacchi, iniziata intorno all'1:30 ora locale, ha incluso 25 missili balistici diretti principalmente sulla capitale. Le forze ucraine hanno abbattuto 108 droni e 18 missili, un segnale di scorte di intercettori Patriot recentemente rifornite. Il presidente Zelensky ha confermato che la maggior parte dei missili era diretta su Kiev. Il ministero della Difesa russo ha dichiarato di aver colpito strutture militari, inclusi impianti di produzione di droni, mentre l'Ucraina continua a chiedere agli USA altri sistemi Patriot in un contesto di scorte di difesa aerea in esaurimento.", "terms": []}, "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/07/19/nx-s1-5899518/russia-attack-kyiv", "reliability": 5}, {"name": "U.S. News & World Report", "url": "https://www.usnews.com/news/world/articles/2026-07-19/1-killed-8-injured-in-an-overnight-russian-attack-on-kyiv", "reliability": 4}]}, {"id": "gaza-strikes-nasr-zeitoun", "date": "2026-07-18", "country": "Palestine", "category": "Geopolitics", "topics": ["israel-palestine"], "en": {"title": "Israeli strikes kill eight in Gaza City despite ceasefire", "summary": "Israeli warplane and artillery strikes on residential areas of Gaza City killed at least eight Palestinians. The attacks hit areas beyond the line Israeli forces are meant to hold under the ceasefire agreement.", "detail": "Israeli military control now extends to roughly 70% of Gaza, well beyond the approximately 50% outlined in the ceasefire. Since the October ceasefire began, Israeli strikes have killed at least 1,127 Palestinians, including at least 260 children, according to Gaza health officials. The UN has separately warned that the expanding Israeli-controlled areas are fragmenting Gaza and increasing risks to civilians.", "terms": []}, "it": {"title": "Raid israeliani uccidono otto persone a Gaza City nonostante il cessate il fuoco", "summary": "Raid aerei e attacchi di artiglieria israeliani su aree residenziali di Gaza City hanno ucciso almeno otto palestinesi. Gli attacchi hanno colpito zone oltre la linea che le forze israeliane dovrebbero rispettare secondo l'accordo di cessate il fuoco.", "detail": "Il controllo militare israeliano si estende ora a circa il 70% di Gaza, ben oltre il circa 50% previsto dal cessate il fuoco. Da quando è iniziato il cessate il fuoco di ottobre, i raid israeliani hanno ucciso almeno 1.127 palestinesi, tra cui almeno 260 bambini, secondo le autorità sanitarie di Gaza. L'ONU ha inoltre avvertito che l'espansione delle aree sotto controllo israeliano sta frammentando Gaza e aumentando i rischi per i civili.", "terms": []}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/18/israeli-attacks-on-residential-areas-in-gaza-kill-eight", "reliability": 4}, {"name": "UN News", "url": "https://news.un.org/en/story/2026/07/1167852", "reliability": 5}]}, {"id": "oil-surge-90", "date": "2026-07-20", "country": "Global", "category": "Economy", "topics": ["mercato-investimenti", "us-iran"], "en": {"title": "Oil prices surge past $90 a barrel as US-Iran conflict escalates", "summary": "Brent crude breached $90 a barrel as the US-Iran conflict intensified, with bonds also falling as markets priced in wider Middle East disruption. Shipping traffic through the Strait of Hormuz has fallen sharply as tensions rise.", "detail": "The escalation has repeatedly whipsawed oil markets over the past month as ceasefire talks collapsed and US strikes resumed. Analysts note tanker transits through Hormuz — a corridor carrying roughly a fifth of global oil supply — have dropped to their lowest level in weeks. Investors are increasingly worried a swift resolution is unlikely, raising the risk of prolonged inflationary pressure on energy costs worldwide.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "Il petrolio supera i 90 dollari al barile mentre il conflitto USA-Iran si aggrava", "summary": "Il greggio Brent ha superato i 90 dollari al barile con l'intensificarsi del conflitto USA-Iran, mentre anche le obbligazioni scendevano man mano che i mercati scontavano un più ampio disordine in Medio Oriente. Il traffico navale nello Stretto di Hormuz è calato bruscamente con l'aumentare delle tensioni.", "detail": "L'escalation ha più volte scosso i mercati petroliferi nell'ultimo mese, con il fallimento dei colloqui di cessate il fuoco e la ripresa dei raid statunitensi. Gli analisti osservano che i transiti di petroliere nello Stretto di Hormuz — un corridoio che trasporta circa un quinto della fornitura globale di petrolio — sono scesi al livello più basso delle ultime settimane. Gli investitori temono sempre più che una risoluzione rapida sia improbabile, aumentando il rischio di pressioni inflazionistiche prolungate sui costi energetici a livello mondiale.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}]}, "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-19/oil-climbs-as-middle-east-conflict-escalates-markets-wrap", "reliability": 5}, {"name": "CNBC", "url": "https://www.cnbc.com/2026/07/20/oil-prices-today-brent-wti-crude-us-iran-centcom-hormuz.html", "reliability": 4}]}, {"id": "imf-growth-downgrade", "date": "2026-07-09", "country": "Global", "category": "Economy", "topics": ["mercato-investimenti", "us-iran"], "en": {"title": "IMF cuts 2026 global growth forecast over Iran war fallout", "summary": "The IMF trimmed its 2026 global growth forecast to 3.0% from 3.1%, citing the lingering effects of the energy shock from the US-Israel war on Iran, while raising its inflation forecast to 4.7%. The Fund said AI-driven investment is partly offsetting the drag from the conflict.", "detail": "The IMF's World Economic Outlook update highlighted that Strait of Hormuz shipping has fallen sharply, disrupting global energy trade. Brent crude has surged in the wake of renewed US strikes. Among major economies, the US is forecast to grow fastest at 2.3%, while China is projected to expand 4.6% even as global uncertainty rises heading into the second half of the year.", "terms": [{"match": "IMF", "id": "imf"}]}, "it": {"title": "Il FMI taglia le previsioni di crescita globale 2026 per l'impatto della guerra con l'Iran", "summary": "Il FMI ha ridotto la previsione di crescita globale 2026 al 3,0% dal 3,1%, citando gli effetti persistenti dello shock energetico causato dalla guerra USA-Israele contro l'Iran, alzando al contempo la previsione di inflazione al 4,7%. Il Fondo ha detto che gli investimenti legati all'AI stanno in parte compensando il freno del conflitto.", "detail": "L'aggiornamento del World Economic Outlook del FMI ha evidenziato che il traffico marittimo nello Stretto di Hormuz è crollato bruscamente, disturbando il commercio energetico globale. Il greggio Brent è salito sensibilmente dopo la ripresa dei raid statunitensi. Tra le principali economie, gli USA dovrebbero crescere più rapidamente al 2,3%, mentre la Cina è prevista in espansione del 4,6%, anche se l'incertezza globale aumenta nella seconda metà dell'anno.", "terms": [{"match": "FMI", "id": "imf"}]}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/economy/2026/7/9/imf-cuts-2026-world-growth-forecast-citing-iran-war-fallout", "reliability": 4}, {"name": "PBS NewsHour", "url": "https://www.pbs.org/newshour/economy/imf-cuts-the-outlook-for-global-growth-in-the-fallout-from-from-iran-war", "reliability": 5}]}, {"id": "fairlife-cyberattack", "date": "2026-07-17", "country": "USA", "category": "Economy", "en": {"title": "Coca-Cola halts US Fairlife production after cyberattack", "summary": "Coca-Cola suspended US production of its billion-dollar Fairlife milk brand after a suspected ransomware attack breached the company's production systems. Canadian operations continued normally, and Coca-Cola said product safety was not affected.", "detail": "Fairlife, which Coca-Cola acquired in 2020 for roughly $7 billion, generates over $3 billion in annual sales from milk and protein shakes. The company said the \"full scope, nature and impacts\" of the breach were still under investigation with external cybersecurity experts and law enforcement involved. The incident highlights growing cybersecurity vulnerabilities in the food and beverage manufacturing sector.", "terms": []}, "it": {"title": "Coca-Cola sospende la produzione USA di Fairlife dopo un attacco informatico", "summary": "Coca-Cola ha sospeso la produzione statunitense del suo marchio di latte Fairlife, dal valore miliardario, dopo un sospetto attacco ransomware che ha violato i sistemi di produzione dell'azienda. Le operazioni canadesi sono proseguite normalmente, e Coca-Cola ha dichiarato che la sicurezza dei prodotti non è stata compromessa.", "detail": "Fairlife, acquisita da Coca-Cola nel 2020 per circa 7 miliardi di dollari, genera oltre 3 miliardi di dollari di vendite annue tra latte e frullati proteici. L'azienda ha dichiarato che \"la piena portata, natura e impatto\" della violazione sono ancora sotto indagine, con il coinvolgimento di esperti esterni di cybersicurezza e delle forze dell'ordine. L'episodio evidenzia le crescenti vulnerabilità informatiche nel settore alimentare e delle bevande.", "terms": []}, "sources": [{"name": "CBS News", "url": "https://www.cbsnews.com/news/coca-cola-fairlife-milk-cyberattack/", "reliability": 4}, {"name": "ABC News", "url": "https://abcnews.com/Business/wireStory/fairlife-pauses-us-production-after-cyberattack-breached-milk-134853368", "reliability": 4}], "topics": ["mercato-investimenti"]}, {"id": "apple-overtakes-nvidia", "date": "2026-07-17", "country": "USA", "category": "Technology", "en": {"title": "Apple overtakes Nvidia as world's most valuable company", "summary": "Apple's market capitalization reached $4.88 trillion, surpassing Nvidia's $4.86 trillion, as investors rotated from AI infrastructure firms toward companies converting AI into consumer products. It is Apple's first time atop the rankings in over a year.", "detail": "The shift followed a roughly 3.5% drop in Nvidia's share price amid growing doubts about near-term returns on massive AI infrastructure spending. Analysts said investors now favor Apple's lower AI capital expenditure and its recently launched enhanced Siri, which offers improved contextual understanding and real-time web access. Apple CEO Tim Cook is due to hand leadership to John Ternus in September, with Apple's Q3 earnings scheduled for July 30.", "terms": []}, "it": {"title": "Apple supera Nvidia come azienda più valutata al mondo", "summary": "La capitalizzazione di mercato di Apple ha raggiunto 4.880 miliardi di dollari, superando i 4.860 miliardi di Nvidia, mentre gli investitori si spostavano dalle aziende di infrastrutture AI verso quelle che trasformano l'AI in prodotti di consumo. È la prima volta in oltre un anno che Apple torna al vertice della classifica.", "detail": "Il sorpasso è arrivato dopo un calo di circa il 3,5% del titolo Nvidia, in un contesto di crescenti dubbi sui ritorni a breve termine dei massicci investimenti in infrastrutture AI. Gli analisti dicono che gli investitori ora preferiscono la minore spesa in conto capitale di Apple sull'AI e la sua recente Siri potenziata, che offre una comprensione contestuale migliorata e accesso al web in tempo reale. Il CEO di Apple Tim Cook cederà la guida a John Ternus a settembre, con i risultati del terzo trimestre di Apple attesi per il 30 luglio.", "terms": []}, "sources": [{"name": "CNBC", "url": "https://www.cnbc.com/2026/07/17/apple-nvidia-aapl-nvda-market-cap.html", "reliability": 4}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/economy/2026/7/17/apple-regains-top-spot-as-worlds-most-valuable-company", "reliability": 4}], "topics": ["ai"]}, {"id": "ai-capex-selloff", "date": "2026-07-19", "country": "Global", "category": "Technology", "en": {"title": "Tech and chip stocks slide as investors question AI spending", "summary": "Global tech and semiconductor stocks sold off as investors questioned whether roughly $600 billion in AI capital expenditure is justified, following weaker-than-expected earnings signals. Analysts warned a slowdown in AI-driven investment could even dent the broader economy.", "detail": "The selloff follows a string of warnings from market strategists, including Apollo Global Management's Torsten Sløk, that slower returns on AI infrastructure spending could risk tipping the economy into recession if capital expenditure keeps outpacing revenue growth. The episode adds to a broader debate over whether the AI investment boom of the past two years is sustainable at its current scale.", "terms": []}, "it": {"title": "I titoli tecnologici e dei chip scendono mentre gli investitori mettono in dubbio la spesa sull'AI", "summary": "I titoli tecnologici e dei semiconduttori a livello globale sono scesi mentre gli investitori si chiedevano se circa 600 miliardi di dollari di spesa in conto capitale sull'AI siano giustificati, dopo segnali di utili più deboli del previsto. Gli analisti hanno avvertito che un rallentamento degli investimenti legati all'AI potrebbe persino incidere sull'economia più ampia.", "detail": "Il calo segue una serie di avvertimenti da parte di strategist di mercato, incluso Torsten Sløk di Apollo Global Management, secondo cui rendimenti più lenti sugli investimenti in infrastrutture AI potrebbero rischiare di far scivolare l'economia in recessione se la spesa in conto capitale continua a superare la crescita dei ricavi. L'episodio si aggiunge a un dibattito più ampio sulla sostenibilità, alla scala attuale, del boom di investimenti nell'AI degli ultimi due anni.", "terms": []}, "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-19/big-tech-needs-to-justify-ai-spending-as-investors-dump-stocks", "reliability": 4}, {"name": "Fortune", "url": "https://fortune.com/2026/07/17/tech-stocks-global-selloff-as-investors-ai-semiconductor-chips/", "reliability": 4}], "topics": ["ai"]}, {"id": "burnham-uk-labour-leader", "date": "2026-07-17", "country": "United Kingdom", "category": "Politics", "en": {"title": "Andy Burnham declared UK Labour leader, set to become prime minister", "summary": "Andy Burnham, the former mayor of Greater Manchester, was declared leader of Britain's governing Labour Party after securing nominations from 379 of 403 Labour MPs, unopposed. He is set to become the UK's next prime minister after predecessor Keir Starmer resigns.", "detail": "Starmer was forced to resign following internal party rebellion after Labour's popularity collapsed since its landslide 2024 election win, with poor local election results and Labour trailing the anti-immigration Reform UK party in polls. Burnham, seen as one of Labour's strongest communicators, pledged to \"give them hope back\" and prioritize devolving power from London to the regions. He becomes the UK's seventh prime minister since 2016 and inherits the same challenges Starmer faced: a sluggish economy and strained public services.", "terms": [{"match": "Andy Burnham", "id": "burnham"}]}, "it": {"title": "Andy Burnham proclamato leader laburista, pronto a diventare primo ministro britannico", "summary": "Andy Burnham, ex sindaco della Greater Manchester, è stato proclamato leader del Partito Laburista britannico al governo dopo aver ottenuto le candidature di 379 dei 403 deputati laburisti, senza opposizione. È pronto a diventare il prossimo primo ministro del Regno Unito dopo le dimissioni del predecessore Keir Starmer.", "detail": "Starmer è stato costretto a dimettersi dopo una ribellione interna al partito, in seguito al crollo della popolarità laburista dalla vittoria schiacciante alle elezioni del 2024, con scarsi risultati alle elezioni locali e i laburisti in svantaggio nei sondaggi rispetto al partito anti-immigrazione Reform UK. Burnham, considerato uno dei migliori comunicatori laburisti, ha promesso di \"ridare loro speranza\" e di dare priorità al decentramento dei poteri da Londra verso le regioni. Diventa il settimo primo ministro britannico dal 2016 ed eredita le stesse sfide affrontate da Starmer: un'economia debole e servizi pubblici sotto pressione.", "terms": [{"match": "Andy Burnham", "id": "burnham"}]}, "sources": [{"name": "PBS NewsHour", "url": "https://www.pbs.org/newshour/world/andy-burnham-is-declared-leader-of-uks-labour-party-pledges-to-restore-hope", "reliability": 5}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/17/burnham-confirmed-as-leader-of-uks-governing-labour-party-headed-for-pm", "reliability": 4}], "topics": ["politica-internazionale"]}, {"id": "india-gen-z-parliament-march", "date": "2026-07-20", "country": "India", "category": "Politics", "en": {"title": "India's Gen Z protesters march on Parliament after activist hospitalized", "summary": "Indian authorities forcibly removed hunger-striking activist Sonam Wangchuk from a Delhi protest site on July 18, prompting the youth-led \"Cockroach Janta Party\" movement to march on Parliament as its monsoon session opened on July 20. Protesters are demanding accountability for exam-paper leaks and the resignation of top officials.", "detail": "Wangchuk, a 59-year-old Gandhian educator from Ladakh, began a 20-day hunger strike on June 28 in solidarity with students affected by exam leaks and technical failures that triggered national outrage, including deaths by suicide among affected students. Police hospitalized him against his will, citing a court order and his deteriorating health; fellow organizer Abhijeet Dipke has pledged to continue the strike. Tens of thousands of mostly student protesters were expected to march from the Jantar Mantar protest site to Parliament under heavy police and paramilitary deployment.", "terms": [{"match": "Sonam Wangchuk", "id": "wangchuk"}]}, "it": {"title": "I manifestanti della Gen Z indiana marciano sul Parlamento dopo il ricovero di un attivista", "summary": "Le autorità indiane hanno rimosso con la forza l'attivista in sciopero della fame Sonam Wangchuk da un sito di protesta a Delhi il 18 luglio, spingendo il movimento giovanile \"Cockroach Janta Party\" a marciare sul Parlamento all'apertura della sessione monsonica il 20 luglio. I manifestanti chiedono responsabilità per le fughe di notizie sui test d'esame e le dimissioni di alti funzionari.", "detail": "Wangchuk, educatore gandhiano di 59 anni originario del Ladakh, ha iniziato uno sciopero della fame di 20 giorni il 28 giugno in solidarietà con gli studenti colpiti da fughe di notizie sui test e guasti tecnici che hanno scatenato indignazione nazionale, inclusi suicidi tra gli studenti coinvolti. La polizia lo ha ricoverato contro la sua volontà, citando un'ordinanza del tribunale e le sue condizioni di salute in peggioramento; il co-organizzatore Abhijeet Dipke ha promesso di continuare lo sciopero. Decine di migliaia di manifestanti, per lo più studenti, erano attesi marciare dal sito di protesta di Jantar Mantar verso il Parlamento sotto un forte dispiegamento di polizia e paramilitari.", "terms": [{"match": "Sonam Wangchuk", "id": "wangchuk"}]}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/features/2026/7/19/why-have-indias-gen-z-protesters-called-for-a-march-to-parliament", "reliability": 4}, {"name": "Associated Press (via AP News)", "url": "https://www.clickondetroit.com/news/world/2026/07/20/indias-cockroach-movement-supporters-gather-to-attempt-a-march-to-parliament/", "reliability": 5}], "topics": ["politica-internazionale"]}, {"id": "sa-jeffreys-bay-unrest", "date": "2026-07-18", "country": "South Africa", "category": "Social", "en": {"title": "Violent anti-immigrant protest in South Africa leaves 69 arrested", "summary": "A protest by the anti-immigration \"March and March\" movement turned violent in Jeffreys Bay, Eastern Cape, resulting in 69 arrests and the looting of at least 23 foreign-owned shops. The unrest is the latest flare-up in a months-long wave of anti-migrant demonstrations across South Africa.", "detail": "Police said those arrested, aged 18 to 52, face public violence charges and were held in custody pending court appearances. Foreign-owned shops in the area closed as a precaution, and several foreign nationals were placed in temporary shelters. The incident follows a nationwide wave of anti-migrant protests since late June in which more than 900 people were previously arrested, part of a broader pattern of vigilante violence targeting foreign nationals ahead of South Africa's upcoming elections.", "terms": []}, "it": {"title": "Proteste violente anti-immigrati in Sudafrica: 69 arresti", "summary": "Una protesta del movimento anti-immigrazione \"March and March\" è degenerata in violenza a Jeffreys Bay, Eastern Cape, con 69 arresti e il saccheggio di almeno 23 negozi di proprietà straniera. I disordini sono l'ultimo episodio di un'ondata di manifestazioni anti-migranti che dura da mesi in Sudafrica.", "detail": "La polizia ha dichiarato che le persone arrestate, tra i 18 e i 52 anni, devono rispondere di violenza pubblica e sono state trattenute in attesa di comparire in tribunale. I negozi di proprietà straniera nella zona hanno chiuso per precauzione, e diversi cittadini stranieri sono stati collocati in rifugi temporanei. L'episodio segue un'ondata nazionale di proteste anti-migranti dalla fine di giugno, durante la quale erano già state arrestate oltre 900 persone, parte di uno schema più ampio di violenza vigilante contro cittadini stranieri in vista delle prossime elezioni sudafricane.", "terms": []}, "sources": [{"name": "News24", "url": "https://www.news24.com/southafrica/news/69-people-arrested-during-violent-anti-immigration-march-in-eastern-cape-20260718-0644", "reliability": 3}, {"name": "Xinhua", "url": "https://english.news.cn/20260718/1fa0981b8d2e416d94f260f01086f2e2/c.html", "reliability": 3}], "topics": []}, {"id": "ebola-drc-outbreak", "date": "2026-07-16", "country": "DR Congo", "category": "Medicine", "en": {"title": "Ebola outbreak in DR Congo accelerating faster than any previous outbreak", "summary": "The WHO said the current Ebola outbreak in the Democratic Republic of Congo is spreading faster than any previous Ebola outbreak on record, reaching over 2,000 confirmed cases and 600+ deaths within two months. Uganda, by contrast, discharged its last patient and began a 42-day countdown to being declared Ebola-free.", "detail": "More than 80% of new DRC cases are being detected outside known contact-tracing chains, indicating the true scale may be double the official count. The outbreak, caused by the Bundibugyo strain and declared a public health emergency in mid-May, is compounded by active regional conflict, population displacement, and a healthcare worker strike in Ituri province over unpaid compensation. WHO has scaled up testing from 30 to over 2,000 daily tests and launched a clinical trial of a monoclonal antibody and antiviral treatment.", "terms": [{"match": "Ebola outbreak", "id": "ebola"}]}, "it": {"title": "Il focolaio di Ebola in RD Congo accelera più velocemente di ogni precedente epidemia", "summary": "L'OMS ha dichiarato che l'attuale focolaio di Ebola nella Repubblica Democratica del Congo si sta diffondendo più velocemente di qualsiasi precedente epidemia registrata, raggiungendo oltre 2.000 casi confermati e più di 600 morti in due mesi. L'Uganda, al contrario, ha dimesso il suo ultimo paziente e ha iniziato un conto alla rovescia di 42 giorni per essere dichiarato libero da Ebola.", "detail": "Oltre l'80% dei nuovi casi in RD Congo viene individuato al di fuori delle catene note di tracciamento dei contatti, indicando che la portata reale potrebbe essere doppia rispetto al conteggio ufficiale. Il focolaio, causato dal ceppo Bundibugyo e dichiarato emergenza di sanità pubblica a metà maggio, è aggravato da un conflitto regionale attivo, sfollamenti di popolazione e uno sciopero degli operatori sanitari nella provincia dell'Ituri per compensi non pagati. L'OMS ha aumentato i test giornalieri da 30 a oltre 2.000 e ha avviato una sperimentazione clinica di un anticorpo monoclonale e un trattamento antivirale.", "terms": [{"match": "focolaio di Ebola", "id": "ebola"}]}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/16/ebola-spreading-more-quickly-in-drc-while-uganda-is-close-to-being-virus-free", "reliability": 4}, {"name": "UN News", "url": "https://news.un.org/en/story/2026/07/1167882", "reliability": 5}], "topics": []}, {"id": "measles-update-2200", "date": "2026-07-20", "country": "USA", "category": "Medicine", "en": {"title": "US measles cases near 2,200, threatening decades-old elimination status", "summary": "US measles cases in 2026 have climbed to roughly 2,200 across dozens of states, nearly matching the full-year 2025 total with months still remaining, putting the country's measles elimination status — held since 2000 — at serious risk. Rising vaccine exemption rates are the primary driver, experts say.", "detail": "The CDC has confirmed cases in over 40 states, with several outbreaks tied to under-vaccinated communities. Some public health analysts argue the US has already effectively lost elimination status \"in substance if not on paper,\" with the Pan American Health Organization suggesting official loss of status could be confirmed by November 2026. At least three deaths have been linked to the outbreaks so far this year.", "terms": [{"match": "measles elimination status", "id": "measles-status"}]}, "it": {"title": "I casi di morbillo negli USA vicini a 2.200, a rischio lo status di eliminazione", "summary": "I casi di morbillo negli USA nel 2026 sono saliti a circa 2.200 in decine di stati, quasi eguagliando il totale dell'intero 2025 con ancora mesi da contare, mettendo a serio rischio lo status di eliminazione del morbillo del paese, in vigore dal 2000. L'aumento delle esenzioni vaccinali è la causa principale, secondo gli esperti.", "detail": "Il CDC ha confermato casi in oltre 40 stati, con diversi focolai legati a comunità con bassa copertura vaccinale. Alcuni analisti di sanità pubblica sostengono che gli USA abbiano già di fatto perso lo status di eliminazione \"nella sostanza se non sulla carta\", con l'Organizzazione Panamericana della Sanità che suggerisce che la perdita ufficiale dello status potrebbe essere confermata entro novembre 2026. Almeno tre decessi sono stati collegati ai focolai finora quest'anno.", "terms": [{"match": "status di eliminazione del morbillo", "id": "measles-status"}]}, "sources": [{"name": "U.S. News", "url": "https://www.usnews.com/news/health-news/articles/tracking-the-2026-u-s-measles-outbreaks", "reliability": 4}, {"name": "CDC", "url": "https://www.cdc.gov/measles/data-research/index.html", "reliability": 5}], "topics": []}, {"id": "iran-conflict-day10", "date": "2026-07-20", "country": "Iran", "category": "Geopolitics", "topics": ["us-iran"], "en": {"title": "Third US soldier killed as Iran conflict enters 10th day", "summary": "A third US service member was killed in a drone-related incident in Iraq's Kurdistan Region, bringing US military deaths to 17 since the war restarted. Iran struck electricity and desalination facilities in Kuwait and Bahrain in retaliation, and claims to have disabled two oil tankers attempting to cross the Strait of Hormuz.", "detail": "The latest death occurred during the controlled detonation of an Iranian drone, US officials said. Iran maintains that more than 3,000 of its people have died in the US-led bombing campaign, including 168 children killed in a strike on a girls' school — a figure that has not been independently verified. President Trump said the continuing strikes are \"in honor\" of the fallen American troops. A ship fire was also reported off the Omani coast inside the strait, adding to the disruption of regional shipping.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "Un terzo soldato USA ucciso, il conflitto con l'Iran entra nel decimo giorno", "summary": "Un terzo militare statunitense è stato ucciso in un incidente legato a un drone nella regione del Kurdistan iracheno, portando a 17 le vittime militari USA da quando la guerra è ripresa. L'Iran ha colpito impianti elettrici e di desalinizzazione in Kuwait e Bahrein per rappresaglia, e sostiene di aver disabilitato due petroliere che tentavano di attraversare lo Stretto di Hormuz.", "detail": "L'ultima vittima è caduta durante la disattivazione controllata di un drone iraniano, secondo funzionari USA. L'Iran sostiene che oltre 3.000 suoi cittadini siano morti nella campagna di bombardamenti guidata dagli USA, inclusi 168 bambini uccisi in un raid su una scuola femminile — una cifra non verificata in modo indipendente. Il presidente Trump ha detto che i raid continuano \"in onore\" dei soldati americani caduti. È stato segnalato anche un incendio su una nave al largo della costa dell'Oman, all'interno dello stretto, aggravando le interruzioni al traffico marittimo regionale.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}]}, "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/07/20/nx-s1-5900601/us-iran-updates", "reliability": 5}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/liveblog/2026/7/20/iran-war-live-us-military-carries-out-another-wave-of-strikes-on-iran", "reliability": 4}]}, {"id": "houthi-blockade-saudi", "date": "2026-07-20", "country": "Saudi Arabia", "category": "Geopolitics", "topics": ["us-iran"], "en": {"title": "Yemen's Houthis declare naval blockade of Saudi Arabia", "summary": "Iran-aligned Houthi rebels announced a blockade of Saudi Arabian shipping through the Bab el-Mandeb Strait, retaliating for a Saudi-linked strike on Sanaa airport. The strait handles roughly 7% of global oil output, and with the Strait of Hormuz already disrupted, analysts warn the move could restrict up to a quarter of the world's oil and gas supply.", "detail": "The Houthis said they were acting on an \"eye for an eye\" basis after accusing Saudi Arabia of striking Sanaa International Airport on July 13, though Yemen's internationally recognized government claimed responsibility for that strike. The group has already fired ballistic missiles at Saudi Arabia's Abha airport. Riyadh has increased reliance on its overland Petroline pipeline to bypass the Red Sea chokepoint, shipping roughly four million barrels a day from the port of Yanbu on the other side of the country.", "terms": [{"match": "Bab el-Mandeb Strait", "id": "bab-el-mandeb"}, {"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "Gli Houthi yemeniti dichiarano il blocco navale dell'Arabia Saudita", "summary": "I ribelli Houthi, alleati dell'Iran, hanno annunciato un blocco delle navi dirette in Arabia Saudita attraverso lo Stretto di Bab el-Mandeb, per rappresaglia contro un attacco legato all'Arabia Saudita sull'aeroporto di Sanaa. Lo stretto gestisce circa il 7% della produzione mondiale di petrolio, e con lo Stretto di Hormuz già interrotto, gli analisti temono che la mossa possa limitare fino a un quarto della fornitura mondiale di petrolio e gas.", "detail": "Gli Houthi hanno detto di agire secondo il principio \"occhio per occhio\" dopo aver accusato l'Arabia Saudita di aver colpito l'aeroporto internazionale di Sanaa il 13 luglio, anche se il governo yemenita riconosciuto a livello internazionale ha rivendicato quell'attacco. Il gruppo ha già lanciato missili balistici contro l'aeroporto saudita di Abha. Riad ha aumentato l'uso dell'oleodotto Petroline per aggirare il collo di bottiglia del Mar Rosso, trasportando circa quattro milioni di barili al giorno dal porto di Yanbu, sull'altro lato del paese.", "terms": [{"match": "Stretto di Bab el-Mandeb", "id": "bab-el-mandeb"}, {"match": "Stretto di Hormuz", "id": "hormuz"}]}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/20/yemens-houthis-declare-naval-blockade-of-saudi-arabia-what-to-know", "reliability": 4}, {"name": "NBC News", "url": "https://www.nbcnews.com/world/middle-east/yemen-houthis-maritime-embargo-saudi-arabia-oil-rcna588345", "reliability": 4}]}, {"id": "israel-settlers-gaza-march", "date": "2026-07-19", "country": "Israel", "category": "Geopolitics", "topics": ["israel-palestine"], "en": {"title": "Israeli ministers join far-right march demanding return of Gaza settlements", "summary": "Finance Minister Bezalel Smotrich, National Security Minister Itamar Ben-Gvir and dozens of other Israeli officials joined a march led by the settler group Nachala calling for the reconstruction of Jewish settlements evacuated from Gaza in 2005. The march defied military restrictions barring crossings into the strip.", "detail": "Organizers claimed over 10,000 participants, though Israeli media put the real turnout at a few hundred. Marchers carried banners reading \"returning home after 21 years\" and demanded the rebuilding of three former settlements: Elei Sinai, Dugit and Nisanit. Ben-Gvir posted a video declaring \"Gaza is ours,\" while Smotrich called resettlement a \"historic opportunity.\" CNN reported the event reflects how Gaza resettlement, once a fringe position, has moved into the Israeli political mainstream ahead of upcoming elections, despite Prime Minister Netanyahu's public denials of any resettlement plan.", "terms": []}, "it": {"title": "Ministri israeliani si uniscono alla marcia per il ritorno degli insediamenti a Gaza", "summary": "Il ministro delle Finanze Bezalel Smotrich, il ministro della Sicurezza Nazionale Itamar Ben-Gvir e decine di altri funzionari israeliani si sono uniti a una marcia guidata dal gruppo di coloni Nachala, che chiede la ricostruzione degli insediamenti ebraici evacuati da Gaza nel 2005. La marcia ha sfidato le restrizioni militari che vietano l'ingresso nella Striscia.", "detail": "Gli organizzatori hanno dichiarato oltre 10.000 partecipanti, anche se i media israeliani hanno stimato la reale affluenza in poche centinaia di persone. I manifestanti portavano striscioni con la scritta \"torniamo a casa dopo 21 anni\" e chiedevano la ricostruzione di tre ex insediamenti: Elei Sinai, Dugit e Nisanit. Ben-Gvir ha pubblicato un video dichiarando \"Gaza è nostra\", mentre Smotrich ha definito la ricolonizzazione un'\"opportunità storica\". La CNN ha riferito che l'evento riflette come la ricolonizzazione di Gaza, un tempo posizione marginale, sia entrata nel mainstream politico israeliano in vista delle prossime elezioni, nonostante le smentite pubbliche del primo ministro Netanyahu su qualsiasi piano di ricolonizzazione.", "terms": []}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/19/israeli-ministers-join-march-to-gaza-to-demand-return-of-settlements", "reliability": 4}, {"name": "CNN", "url": "https://www.cnn.com/2026/07/20/middleeast/israel-far-right-settlements-gaza-intl", "reliability": 4}]}, {"id": "trump-tariffs-canada", "date": "2026-07-20", "country": "Canada", "category": "Economy", "en": {"title": "Trump imposes 50% tariffs on Canada, invoking 'nuclear option' trade law", "summary": "President Trump ordered 50% tariffs on most Canadian goods under Section 338 of the 1930 Trade Act, a rarely used provision experts call the 'nuclear option.' The tariffs, taking effect in 30 days, exclude energy, potash, fish and critical minerals but hit goods previously protected under the USMCA trade deal.", "detail": "The administration says Canada unfairly discriminates against US autos, alcohol and dairy, pointing to Canada's own 25% tariff on US vehicles imposed in 2025. The US-Mexico-Canada Agreement (USMCA) was not renewed by the Trump administration, opening new negotiations that could stretch to 2036. Ontario Premier Doug Ford called for Canada to \"respond tariff for tariff, dollar for dollar,\" while economists warned of \"massive uncertainty\" for the global economy and renewed inflation risk in the US, where prices have already been rising partly due to tariffs and the Middle East conflict.", "terms": [{"match": "Section 338", "id": "section-338"}]}, "it": {"title": "Trump impone dazi al 50% sul Canada, invocando l'\"opzione nucleare\" commerciale", "summary": "Il presidente Trump ha ordinato dazi al 50% sulla maggior parte delle merci canadesi in base alla Sezione 338 del Trade Act del 1930, una norma raramente usata che gli esperti definiscono l'\"opzione nucleare\". I dazi, in vigore tra 30 giorni, escludono energia, potassa, pesce e minerali critici ma colpiscono beni finora protetti dall'accordo USMCA.", "detail": "L'amministrazione sostiene che il Canada discrimini ingiustamente i prodotti americani, in particolare auto, alcolici e latticini, citando il dazio canadese del 25% sui veicoli USA imposto nel 2025. L'accordo USMCA non è stato rinnovato dall'amministrazione Trump, aprendo nuovi negoziati che potrebbero estendersi fino al 2036. Il premier dell'Ontario Doug Ford ha chiesto al Canada di \"rispondere dazio per dazio, dollaro per dollaro\", mentre gli economisti hanno avvertito di una \"enorme incertezza\" per l'economia globale e di un rinnovato rischio di inflazione negli USA, dove i prezzi sono già saliti in parte a causa dei dazi e del conflitto in Medio Oriente.", "terms": [{"match": "Sezione 338", "id": "section-338"}]}, "sources": [{"name": "Fortune", "url": "https://fortune.com/2026/07/20/trump-tariffs-canada-50-percent-section-338-nuclear-option-inflation-usmca/", "reliability": 3}, {"name": "CBC News", "url": "https://www.cbc.ca/news/world/trump-canada-us-trade-tariffs-cusma-usmca-9.7276973", "reliability": 4}], "topics": ["mercato-investimenti"]}, {"id": "tsmc-100b-us-chips", "date": "2026-07-16", "country": "USA", "category": "Technology", "en": {"title": "TSMC pledges additional $100 billion for US chip plants, total reaches $265 billion", "summary": "Taiwan's TSMC committed another $100 billion to expand US semiconductor manufacturing, bringing its total US investment pledge to $265 billion and adding at least four more advanced chip fabs in Arizona. The announcement helped lift chipmaker stocks even as Middle East tensions weighed on broader markets.", "detail": "The US Commerce Department framed the expansion as a win for the Trump administration's push to reshore advanced chip production. TSMC's 2026 capital expenditure could reach roughly $64 billion following another record quarterly earnings report. The news helped drive a rally in semiconductor stocks, with AMD surging after Microsoft expanded its AI partnership using AMD's Helios systems, even as the ninth night of US strikes on Iran kept investors on edge.", "terms": [{"match": "TSMC", "id": "tsmc"}]}, "it": {"title": "TSMC promette altri 100 miliardi di dollari per impianti di chip negli USA, il totale sale a 265 miliardi", "summary": "La taiwanese TSMC ha impegnato altri 100 miliardi di dollari per espandere la produzione di semiconduttori negli Stati Uniti, portando il suo impegno totale a 265 miliardi di dollari e aggiungendo almeno quattro nuovi stabilimenti avanzati in Arizona. L'annuncio ha sostenuto i titoli dei produttori di chip anche mentre le tensioni in Medio Oriente pesavano sui mercati più ampi.", "detail": "Il Dipartimento del Commercio USA ha presentato l'espansione come un successo della spinta dell'amministrazione Trump per riportare negli Stati Uniti la produzione avanzata di chip. La spesa in conto capitale 2026 di TSMC potrebbe raggiungere circa 64 miliardi di dollari dopo un altro trimestre record. La notizia ha alimentato un rally dei titoli dei semiconduttori, con AMD in forte rialzo dopo che Microsoft ha ampliato la sua partnership sull'AI utilizzando i sistemi Helios di AMD, anche mentre la nona notte di raid statunitensi sull'Iran manteneva gli investitori sotto tensione.", "terms": [{"match": "TSMC", "id": "tsmc"}]}, "sources": [{"name": "U.S. Department of Commerce", "url": "https://www.commerce.gov/news/press-releases/2026/07/trump-administration-secures-additional-100-billion-us-semiconductor", "reliability": 5}, {"name": "The Hill", "url": "https://thehill.com/policy/technology/5971554-tsmc-chip-plant-expansion/", "reliability": 4}], "topics": ["ai"]}, {"id": "india-protests-continue", "date": "2026-07-21", "country": "India", "category": "Politics", "en": {"title": "India's Gen Z protesters vow to continue despite Delhi clashes injuring 180", "summary": "Clashes between riot police and youth protesters in Delhi injured around 180 people, but the Cockroach Janta Party movement said it would continue its campaign against Education Minister Dharmendra Pradhan over exam-paper leaks. Officers used batons and tear gas as they cleared protest encampments.", "detail": "The movement, born as satire after India's Chief Justice compared unemployed youth to \"cockroaches,\" has grown to nearly 22 million Instagram followers under founder Abhijeet Dipke. Protesters accuse the government of shielding the wealthy while ignoring youth unemployment, estimated at 40% among graduates under 25. The Modi administration initially dismissed the movement as a \"B-team of terrorists,\" though Health Minister J.P. Nadda has since held a brief meeting with organizers, a possible sign of dialogue opening up.", "terms": [{"match": "Cockroach Janta Party", "id": "cockroach-party"}]}, "it": {"title": "I manifestanti Gen Z indiani promettono di continuare dopo gli scontri a Delhi con 180 feriti", "summary": "Gli scontri tra la polizia antisommossa e i giovani manifestanti a Delhi hanno ferito circa 180 persone, ma il movimento Cockroach Janta Party ha dichiarato che continuerà la sua campagna contro il ministro dell'Istruzione Dharmendra Pradhan per le fughe di notizie sui test d'esame. Gli agenti hanno usato manganelli e gas lacrimogeni per sgomberare gli accampamenti di protesta.", "detail": "Il movimento, nato come satira dopo che il presidente della Corte Suprema indiana aveva paragonato i giovani disoccupati a \"scarafaggi\", è cresciuto fino a quasi 22 milioni di follower su Instagram sotto la guida del fondatore Abhijeet Dipke. I manifestanti accusano il governo di proteggere i ricchi ignorando la disoccupazione giovanile, stimata al 40% tra i laureati under 25. L'amministrazione Modi aveva inizialmente liquidato il movimento come una \"squadra B di terroristi\", anche se il ministro della Salute J.P. Nadda ha da allora tenuto un breve incontro con gli organizzatori, un possibile segnale di apertura al dialogo.", "terms": [{"match": "Cockroach Janta Party", "id": "cockroach-party"}]}, "sources": [{"name": "U.S. News & World Report (Reuters)", "url": "https://www.usnews.com/news/world/articles/2026-07-21/india-youth-group-says-protest-to-continue-after-delhi-clashes-injure-180", "reliability": 4}, {"name": "NPR", "url": "https://www.npr.org/2026/07/20/nx-s1-5889515/india-gen-z-cockroach-party-protests", "reliability": 5}], "topics": ["politica-internazionale"]}, {"id": "who-heatwave-europe", "date": "2026-07-07", "country": "EU", "category": "Social", "en": {"title": "WHO warns more deadly heat weeks may lie ahead for Europe", "summary": "The World Health Organization's European office warned that extreme heat could bring further deadly weeks to the region, with temperatures forecast to hit 43°C in Portugal and southern Spain. Officials from 41 countries joined an emergency consultation on the crisis.", "detail": "WHO Europe said fewer than half of its 53 member states have formal heat-health action plans in place, despite evidence that such plans save lives by linking weather warnings to public-health responses. The organization called on countries to treat extreme heat as a \"health security threat\" requiring coordination between emergency management, urban planning, environmental and health authorities, and urged expanded cooling infrastructure for at-risk groups such as older adults living alone, homeless people and long-term care residents.", "terms": []}, "it": {"title": "L'OMS avverte: settimane di caldo ancora più letali potrebbero attendere l'Europa", "summary": "L'ufficio europeo dell'Organizzazione Mondiale della Sanità ha avvertito che il caldo estremo potrebbe portare ad altre settimane letali nella regione, con temperature previste fino a 43°C in Portogallo e nel sud della Spagna. Funzionari di 41 paesi hanno partecipato a una consultazione d'emergenza sulla crisi.", "detail": "L'OMS Europa ha detto che meno della metà dei suoi 53 stati membri dispone di piani d'azione formali contro il caldo, nonostante le prove che tali piani salvano vite collegando gli allarmi meteo alle risposte di sanità pubblica. L'organizzazione ha invitato i paesi a trattare il caldo estremo come una \"minaccia alla sicurezza sanitaria\" che richiede il coordinamento tra gestione delle emergenze, pianificazione urbana, ambiente e sanità, sollecitando l'ampliamento delle infrastrutture di raffrescamento per i gruppi a rischio come anziani soli, senzatetto e residenti di strutture di lungodegenza.", "terms": []}, "sources": [{"name": "WHO Europe", "url": "https://www.who.int/europe/news/item/07-07-2026-statement---extreme-heat--more-deadly-weeks-may-still-lie-ahead-for-the-european-region", "reliability": 5}, {"name": "World Meteorological Organization", "url": "https://wmo.int/media/news/record-breaking-heat-spreads-through-europe", "reliability": 5}], "topics": []}, {"id": "ebola-update-1963", "date": "2026-07-13", "country": "DR Congo", "category": "Medicine", "en": {"title": "DR Congo Ebola outbreak passes 1,960 cases as death toll nears 720", "summary": "The European Centre for Disease Prevention and Control reported 1,963 confirmed Ebola cases and 719 deaths in the Democratic Republic of Congo as of July 13, a case fatality rate of roughly 37%. Ituri province remains the epicenter, while Uganda has reported no new cases since June 21.", "detail": "Of the DRC total, 1,772 cases and 608 deaths are concentrated in Ituri province, with smaller clusters in North Kivu, South Kivu, Haut-Uele and Tshopo. At least 333 patients have recovered. Three cases have been exported internationally — two US aid workers evacuated to Germany and one physician in France — though all were promptly isolated. The World Health Organization has confirmed the outbreak is caused by the Bundibugyo species of Ebola virus, for which no licensed vaccine yet exists.", "terms": [{"match": "Ebola cases", "id": "ebola"}]}, "it": {"title": "Il focolaio di Ebola in RD Congo supera 1.960 casi, i morti si avvicinano a 720", "summary": "Il Centro europeo per la prevenzione e il controllo delle malattie (ECDC) ha riportato 1.963 casi confermati di Ebola e 719 morti nella Repubblica Democratica del Congo al 13 luglio, un tasso di letalità di circa il 37%. La provincia dell'Ituri resta l'epicentro, mentre l'Uganda non registra nuovi casi dal 21 giugno.", "detail": "Del totale della RD Congo, 1.772 casi e 608 morti sono concentrati nella provincia dell'Ituri, con cluster minori nel Nord Kivu, Sud Kivu, Haut-Uele e Tshopo. Almeno 333 pazienti sono guariti. Tre casi sono stati esportati a livello internazionale — due operatori umanitari statunitensi evacuati in Germania e un medico in Francia — anche se tutti sono stati isolati tempestivamente. L'Organizzazione Mondiale della Sanità ha confermato che il focolaio è causato dalla specie Bundibugyo del virus Ebola, per cui non esiste ancora un vaccino approvato.", "terms": [{"match": "casi confermati di Ebola", "id": "ebola"}]}, "sources": [{"name": "ECDC", "url": "https://www.ecdc.europa.eu/en/ebola-outbreak-democratic-republic-congo-and-uganda", "reliability": 5}, {"name": "World Health Organization", "url": "https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON612", "reliability": 5}], "topics": []}, {"id": "iran-conflict-day11", "date": "2026-07-22", "country": "Iran", "category": "Geopolitics", "topics": ["us-iran"], "en": {"title": "US-Iran war enters 11th day as Israel warns Iran is rebuilding Natanz enrichment", "summary": "CENTCOM carried out a tenth/eleventh straight night of strikes on Iran, hitting Bandar Abbas and Qeshm Island, as Israeli intelligence said Iran has moved centrifuges deeper into the mountain above its Natanz facility to keep enriching uranium. President Trump is reportedly considering expanding the campaign to hit the relocated nuclear stockpile directly.", "detail": "CENTCOM says 13 US soldiers have been killed since the war restarted, while Israel has recorded 39 soldiers and 23 civilians killed and over 7,600 injured by Iranian ballistic missiles since February. Iran's Revolutionary Guard claims it struck US positions in Kuwait and disabled two tankers in the Strait of Hormuz, and a Greek-flagged tanker was struck and detained inside the strait. The US State Department has issued a worldwide caution for American citizens, and ASEAN foreign ministers met to discuss the risk of a wider energy-supply shock from the closure of regional shipping lanes.", "terms": [{"match": "Natanz facility", "id": "natanz"}, {"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "La guerra USA-Iran entra nell'11° giorno, Israele avverte che l'Iran sta ricostruendo l'arricchimento a Natanz", "summary": "Il CENTCOM ha condotto una decima/undicesima notte consecutiva di raid sull'Iran, colpendo Bandar Abbas e l'isola di Qeshm, mentre l'intelligence israeliana ha detto che l'Iran ha spostato le centrifughe più in profondità nella montagna sopra l'impianto di Natanz per continuare ad arricchire uranio. Secondo alcune fonti, il presidente Trump starebbe valutando di ampliare la campagna colpendo direttamente lo stock nucleare trasferito.", "detail": "Il CENTCOM afferma che 13 soldati USA sono stati uccisi da quando la guerra è ripresa, mentre Israele ha registrato 39 soldati e 23 civili uccisi e oltre 7.600 feriti dai missili balistici iraniani da febbraio. Le Guardie della Rivoluzione iraniane sostengono di aver colpito posizioni USA in Kuwait e di aver disabilitato due petroliere nello Stretto di Hormuz, e una petroliera battente bandiera greca è stata colpita e trattenuta all'interno dello stretto. Il Dipartimento di Stato USA ha emesso un avviso di massima cautela per i cittadini americani, e i ministri degli Esteri dell'ASEAN si sono riuniti per discutere il rischio di uno shock più ampio nelle forniture energetiche causato dalla chiusura delle rotte marittime regionali.", "terms": [{"match": "impianto di Natanz", "id": "natanz"}, {"match": "Stretto di Hormuz", "id": "hormuz"}]}, "sources": [{"name": "The Jerusalem Post", "url": "https://www.jpost.com/middle-east/iran-news/2026-07-21/live-updates-903126", "reliability": 3}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/liveblog/2026/7/20/iran-war-live-us-military-carries-out-another-wave-of-strikes-on-iran", "reliability": 4}]}, {"id": "odesa-ship-strike", "date": "2026-07-20", "country": "Ukraine", "category": "Geopolitics", "topics": ["russia-ukraine"], "en": {"title": "Russian missile strike on grain ship near Odesa kills 10, Ukraine hits Moscow with 400 drones", "summary": "Russia fired three cruise missiles at the Golden Leo, a Guinea-Bissau-flagged cargo ship carrying corn out of Odesa, killing 10 of its 17 crew members. Ukraine responded overnight with a barrage of more than 400 drones aimed at Moscow, wounding 10 people including a child.", "detail": "The ship's dead included Indian and Syrian crew members; eight survivors were rescued after the vessel caught fire. Odesa's regional governor said the attack brought the region's July death toll to 28, with 13 to 15 air raid alerts a day throughout the month. Moscow's mayor said most of the drones aimed at the Russian capital were intercepted, though fires broke out in three districts around the city. The escalation threatens global grain supplies, with Ukraine having already lost roughly a third of its Black Sea export capacity to Russian strikes.", "terms": []}, "it": {"title": "Un missile russo colpisce una nave di grano vicino a Odesa uccidendo 10 persone, l'Ucraina risponde con 400 droni su Mosca", "summary": "La Russia ha lanciato tre missili da crociera contro la Golden Leo, una nave cargo battente bandiera della Guinea-Bissau che trasportava mais in uscita da Odesa, uccidendo 10 dei 17 membri dell'equipaggio. L'Ucraina ha risposto nella notte con oltre 400 droni diretti su Mosca, ferendo 10 persone tra cui un bambino.", "detail": "Tra le vittime figurano membri dell'equipaggio indiani e siriani; otto sopravvissuti sono stati salvati dopo che la nave ha preso fuoco. Il governatore della regione di Odesa ha detto che l'attacco porta a 28 il bilancio dei morti di luglio nella regione, con 13-15 allarmi aerei al giorno durante tutto il mese. Il sindaco di Mosca ha detto che la maggior parte dei droni diretti sulla capitale russa è stata intercettata, anche se sono scoppiati incendi in tre distretti intorno alla città. L'escalation minaccia le forniture globali di grano, con l'Ucraina che ha già perso circa un terzo della propria capacità di esportazione nel Mar Nero a causa degli attacchi russi.", "terms": []}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/20/russian-strike-on-ship-near-odesa-kills-10-ukraine-hits-moscow-with-drones", "reliability": 4}, {"name": "Associated Press (via Jefferson City News-Tribune)", "url": "https://www.newstribune.com/news/2026/jul/20/russian-attack-on-corn-ship-off-ukraines-odesa-kills-10/", "reliability": 5}]}, {"id": "gaza-family-killed-sabra", "date": "2026-07-21", "country": "Palestine", "category": "Geopolitics", "topics": ["israel-palestine"], "en": {"title": "Israeli strike kills family of six as they slept in Gaza City", "summary": "An overnight Israeli airstrike on the Sabra neighborhood o
