f Gaza City killed Firas Al Masri, his wife and their four children while they slept. Israel's military confirmed the strike, saying it had targeted a Hamas militant and that it was investigating the outcome.", "detail": "The strike is part of a deadly week: between July 13 and July 20, Israeli attacks killed at least 57 Palestinians including six children and eight women, according to the UN, with 34 of those deaths occurring outside the ceasefire's 'yellow line' control zone. Since the October 2025 ceasefire began, Gaza's Ministry of Health says ceasefire violations have killed 1,158 Palestinians and injured 3,756, mostly women and children. The violence comes as Israel's parliament dissolved on July 17 ahead of elections scheduled for October 27, and as the security cabinet approved funding for 34 new settlements in the West Bank.", "terms": [{"match": "yellow line", "id": "yellow-line"}]}, "it": {"title": "Un raid israeliano uccide una famiglia di sei persone nel sonno a Gaza City", "summary": "Un raid aereo israeliano notturno sul quartiere di Sabra, a Gaza City, ha ucciso Firas Al Masri, sua moglie e i loro quattro figli mentre dormivano. L'esercito israeliano ha confermato l'attacco, dicendo di aver preso di mira un miliziano di Hamas e di essere ancora in fase di verifica dell'esito.", "detail": "Il raid fa parte di una settimana letale: tra il 13 e il 20 luglio, gli attacchi israeliani hanno ucciso almeno 57 palestinesi, tra cui sei bambini e otto donne, secondo l'ONU, con 34 di questi decessi avvenuti al di fuori della zona di controllo delimitata dalla \"linea gialla\" del cessate il fuoco. Da quando è iniziato il cessate il fuoco dell'ottobre 2025, il Ministero della Salute di Gaza afferma che le violazioni hanno ucciso 1.158 palestinesi e ferito 3.756, per lo più donne e bambini. La violenza arriva mentre il parlamento israeliano si è sciolto il 17 luglio in vista delle elezioni fissate per il 27 ottobre, e mentre il gabinetto di sicurezza ha approvato i finanziamenti per 34 nuovi insediamenti in Cisgiordania.", "terms": [{"match": "linea gialla", "id": "yellow-line"}]}, "sources": [{"name": "The National", "url": "https://www.thenationalnews.com/news/mena/2026/07/21/israeli-strike-kills-family-of-six-in-gaza-city/", "reliability": 3}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/22/palestine-weekly-ahead-of-elections-israel-doubles-down-on-attacks", "reliability": 4}]}, {"id": "brazil-tariffs-25", "date": "2026-07-22", "country": "Brazil", "category": "Economy", "en": {"title": "US imposes 25% tariffs on Brazil under 'unfair trade practices' probe", "summary": "New 25% US tariffs on thousands of Brazilian products — including sugar, apparel, paper and steel — took effect on July 22, following a year-long Section 301 investigation into Brazil's trade practices. Beef, coffee, rare earths, aircraft parts and some oil and gas products are exempted.", "detail": "US Trade Representative Jamieson Greer said extensive negotiations had failed to resolve concerns over digital trade and deforestation, but that Washington remains open to talks. Brazilian President Lula da Silva called the allegations politically motivated, linking them to Brazil's prosecution of former president Jair Bolsonaro, a Trump ally. Secretary of State Marco Rubio countered that Lula failed to negotiate 'in good faith.' It is the first enforcement action under Section 301 since the Supreme Court struck down Trump's broader tariff authority earlier in 2026, despite the US running a $14.4 billion trade surplus with Brazil in 2025.", "terms": [{"match": "Section 301", "id": "section-301"}]}, "it": {"title": "Gli USA impongono dazi al 25% sul Brasile dopo un'indagine su 'pratiche commerciali sleali'", "summary": "Nuovi dazi USA al 25% su migliaia di prodotti brasiliani — tra cui zucchero, abbigliamento, carta e acciaio — sono entrati in vigore il 22 luglio, dopo un'indagine di un anno ai sensi della Sezione 301 sulle pratiche commerciali del Brasile. Sono esclusi carne bovina, caffè, terre rare, componenti aeronautici e alcuni prodotti petroliferi e del gas.", "detail": "Il rappresentante commerciale USA Jamieson Greer ha detto che ampi negoziati non hanno risolto le preoccupazioni su commercio digitale e deforestazione, ma che Washington resta aperta al dialogo. Il presidente brasiliano Lula da Silva ha definito le accuse politicamente motivate, collegandole al processo in Brasile contro l'ex presidente Jair Bolsonaro, alleato di Trump. Il Segretario di Stato Marco Rubio ha ribattuto che Lula non ha negoziato \"in buona fede\". È la prima azione esecutiva ai sensi della Sezione 301 da quando la Corte Suprema ha bocciato l'autorità tariffaria più ampia di Trump all'inizio del 2026, nonostante gli USA registrino un surplus commerciale di 14,4 miliardi di dollari con il Brasile nel 2025.", "terms": [{"match": "Sezione 301", "id": "section-301"}]}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/economy/2026/7/16/us-to-impose-new-25-percent-tariffs-on-some-brazilian-imports", "reliability": 4}, {"name": "CNN", "url": "https://www.cnn.com/2026/07/16/business/us-brazil-tariffs-trade-intl-hnk", "reliability": 4}], "topics": ["mercato-investimenti"]}, {"id": "chip-stocks-rebound", "date": "2026-07-21", "country": "Global", "category": "Technology", "en": {"title": "Chip stocks rally as Micron surges 12%, snapping a three-day market losing streak", "summary": "Semiconductor stocks rebounded sharply, with Micron up 12% and SanDisk up 14%, after strong South Korean export data pointed to continued AI-chip demand. AMD gained 8% on its expanded AI partnership with Microsoft, helping the Nasdaq climb 1.29% despite ongoing Middle East tensions and tariff uncertainty.", "detail": "The rebound follows days of selling driven by doubts over whether roughly $600 billion in AI capital expenditure is justified. Oil also rose about 2% to near $85 a barrel amid the US-Iran conflict, while gold gained 1.75% as investors hedged geopolitical risk. Analysts described the pullback as 'more of a reset than a wider loss of confidence' in AI spending, with markets now looking ahead to earnings from Alphabet and Tesla for further signals on whether the AI investment boom is paying off.", "terms": []}, "it": {"title": "I titoli dei chip rimbalzano con Micron in rialzo del 12%, interrompendo tre giorni di perdite", "summary": "I titoli dei semiconduttori sono rimbalzati con decisione, con Micron in rialzo del 12% e SanDisk del 14%, dopo dati sulle esportazioni sudcoreane che indicano una domanda di chip per l'AI ancora solida. AMD è salita dell'8% grazie all'ampliamento della partnership sull'AI con Microsoft, aiutando il Nasdaq a salire dell'1,29% nonostante le tensioni in Medio Oriente e l'incertezza sui dazi.", "detail": "Il rimbalzo segue giorni di vendite alimentate dai dubbi sulla giustificabilità di circa 600 miliardi di dollari di spesa in conto capitale sull'AI. Anche il petrolio è salito di circa il 2%, vicino a 85 dollari al barile, nel contesto del conflitto USA-Iran, mentre l'oro è salito dell'1,75% con gli investitori che si coprivano dal rischio geopolitico. Gli analisti hanno descritto il calo precedente come \"più un riassestamento che una più ampia perdita di fiducia\" nella spesa sull'AI, con i mercati ora concentrati sui risultati di Alphabet e Tesla per ulteriori segnali sulla redditività del boom di investimenti nell'AI.", "terms": []}, "sources": [{"name": "The Motley Fool", "url": "https://www.fool.com/coverage/stock-market-today/2026/07/21/stock-market-today-july-21-micron-surges-12-as-semiconductor-strength-lifts-nasdaq/", "reliability": 3}, {"name": "Yahoo Finance", "url": "https://finance.yahoo.com/markets/live/stock-market-today-tuesday-july-21-dow-sp-500-nasdaq-084631499.html", "reliability": 3}], "topics": ["ai"]}, {"id": "burnham-becomes-pm", "date": "2026-07-20", "country": "United Kingdom", "category": "Politics", "en": {"title": "Andy Burnham officially becomes UK's 7th prime minister in a decade", "summary": "Andy Burnham was formally sworn in as UK prime minister on July 20 after King Charles III asked him to form a government, replacing Keir Starmer. In his first remarks, Burnham admitted 'we have not been good enough' and promised cost-of-living measures within days.", "detail": "Burnham, previously known as the 'King of the North' for his long tenure as mayor of Greater Manchester, faces pressure from the anti-immigration Reform UK party on one side and the Green Party on the other. President Trump, who has previously called Burnham 'extremely liberal,' criticized Britain as a 'poverty stricken disaster' following the transition. Because the UK does not require a general election when a governing party changes leader, Burnham took office without a national vote, continuing a pattern of frequent Downing Street turnover.", "terms": [{"match": "Andy Burnham", "id": "burnham"}]}, "it": {"title": "Andy Burnham diventa ufficialmente il 7° primo ministro britannico in un decennio", "summary": "Andy Burnham è stato ufficialmente insediato come primo ministro del Regno Unito il 20 luglio, dopo che re Carlo III gli ha chiesto di formare un governo, sostituendo Keir Starmer. Nelle sue prime dichiarazioni, Burnham ha ammesso che \"non siamo stati abbastanza bravi\" e ha promesso misure sul costo della vita entro pochi giorni.", "detail": "Burnham, noto in precedenza come il \"Re del Nord\" per il suo lungo mandato da sindaco della Greater Manchester, si trova sotto pressione da parte del partito anti-immigrazione Reform UK da un lato e del Green Party dall'altro. Il presidente Trump, che in passato aveva definito Burnham \"estremamente liberale\", ha criticato la Gran Bretagna come un \"disastro impoverito\" dopo la transizione. Poiché nel Regno Unito non sono necessarie elezioni generali quando il partito di governo cambia leader, Burnham ha assunto l'incarico senza un voto nazionale, proseguendo un modello di frequente ricambio a Downing Street.", "terms": [{"match": "Andy Burnham", "id": "burnham"}]}, "sources": [{"name": "CBS News", "url": "https://www.cbsnews.com/news/andy-burnham-new-uk-prime-minister-7th-in-decade-after-keir-starmer/", "reliability": 4}, {"name": "NPR", "url": "https://www.npr.org/2026/07/19/g-s1-134001/andy-burnham-new-british-prime-minister", "reliability": 5}], "topics": ["politica-internazionale"]}, {"id": "india-congress-modi-sit-in", "date": "2026-07-22", "country": "India", "category": "Politics", "en": {"title": "India's opposition joins Cockroach movement's cause as minister talks fail to ease tensions", "summary": "Opposition Congress lawmakers, led by Rahul Gandhi, staged a sit-in outside PM Modi's residence citing 'brutalities against young students,' as the Cockroach Janta Party's sit-in at Jantar Mantar continued into a second day. A meeting between Health Minister J.P. Nadda and movement representatives on Monday failed to defuse the standoff.", "detail": "Movement spokesperson Ashutosh Ranka said Nadda merely promised to raise the group's demands within government rather than offering concrete commitments, and organizers said they would not stand down without action. The core demands remain the resignation of Education Minister Dharmendra Pradhan, reform of the exam system, and roughly $104,000 in compensation for the families of students who died by suicide after May's national medical exam leak, which forced about 2 million students to retake the test. Hunger-striking activist Sonam Wangchuk, hospitalized against his will last week, has offered to end his strike if the government publicly accepts responsibility and lawmakers confirm it in person.", "terms": [{"match": "Cockroach Janta Party", "id": "cockroach-party"}, {"match": "Sonam Wangchuk", "id": "wangchuk"}]}, "it": {"title": "L'opposizione indiana si unisce alla causa del movimento Cockroach mentre i colloqui col ministro falliscono", "summary": "I parlamentari del Congress all'opposizione, guidati da Rahul Gandhi, hanno organizzato un sit-in davanti alla residenza del premier Modi denunciando \"brutalità contro giovani studenti\", mentre il sit-in del Cockroach Janta Party a Jantar Mantar è proseguito per un secondo giorno. Un incontro tra il ministro della Salute J.P. Nadda e i rappresentanti del movimento lunedì non ha allentato la tensione.", "detail": "Il portavoce del movimento Ashutosh Ranka ha detto che Nadda si è limitato a promettere di sollevare le richieste del gruppo all'interno del governo, senza offrire impegni concreti, e gli organizzatori hanno detto che non si ritireranno senza azioni concrete. Le richieste principali restano le dimissioni del ministro dell'Istruzione Dharmendra Pradhan, la riforma del sistema d'esame e circa 104.000 dollari di risarcimento per le famiglie degli studenti morti suicidi dopo la fuga di notizie sull'esame medico nazionale di maggio, che ha costretto circa 2 milioni di studenti a ripetere il test. L'attivista in sciopero della fame Sonam Wangchuk, ricoverato contro la sua volontà la settimana scorsa, ha offerto di interrompere lo sciopero se il governo accetterà pubblicamente la responsabilità e i parlamentari lo confermeranno di persona.", "terms": [{"match": "Cockroach Janta Party", "id": "cockroach-party"}, {"match": "Sonam Wangchuk", "id": "wangchuk"}]}, "sources": [{"name": "The Kathmandu Post (via IANS/agencies)", "url": "https://kathmandupost.com/world/2026/07/21/india-s-cockroach-movement-leaders-say-minister-promises-talks-on-demands-1784597930", "reliability": 3}, {"name": "NPR", "url": "https://www.npr.org/2026/07/21/g-s1-134722/indias-youth-led-cockroach-movement-vows-to-continue-protest-after-police-crackdown", "reliability": 5}], "topics": ["politica-internazionale"]}, {"id": "ebola-drc-2400", "date": "2026-07-22", "country": "DR Congo", "category": "Medicine", "en": {"title": "DR Congo Ebola cases top 2,400 as Africa CDC warns of 'worst outbreak ever documented'", "summary": "Confirmed Ebola cases in the Democratic Republic of Congo reached 2,423 with 967 deaths — a 39.9% fatality rate — 65 days into the outbreak. Africa CDC director-general Jean Kaseya warned that without urgent action, 'this will become the worst outbreak the world has ever documented.'", "detail": "The Bundibugyo-strain outbreak has now spread across five provinces — Ituri, North Kivu, South Kivu, Haut-Uele and Tshopo — with affected health zones expanding from 36 to 42 in the past week alone. Contact tracing has reached 81.1% coverage, but health officials say the true case count is likely far higher given gaps in surveillance in conflict-affected areas. The outbreak, declared May 15, is already spreading faster than any previous Ebola outbreak on record.", "terms": [{"match": "Ebola cases", "id": "ebola"}]}, "it": {"title": "I casi di Ebola in RD Congo superano 2.400, l'Africa CDC avverte: 'la peggiore epidemia mai documentata'", "summary": "I casi confermati di Ebola nella Repubblica Democratica del Congo hanno raggiunto quota 2.423 con 967 morti — un tasso di letalità del 39,9% — a 65 giorni dall'inizio del focolaio. Il direttore generale dell'Africa CDC Jean Kaseya ha avvertito che senza un'azione urgente \"questa diventerà la peggiore epidemia mai documentata al mondo\".", "detail": "Il focolaio, causato dal ceppo Bundibugyo, si è ormai esteso a cinque province — Ituri, Nord Kivu, Sud Kivu, Haut-Uele e Tshopo — con le zone sanitarie colpite passate da 36 a 42 nella sola ultima settimana. Il tracciamento dei contatti ha raggiunto una copertura dell'81,1%, ma i funzionari sanitari affermano che il numero reale di casi è probabilmente molto più alto, viste le lacune nella sorveglianza nelle aree colpite dal conflitto. Il focolaio, dichiarato il 15 maggio, si sta già diffondendo più velocemente di qualsiasi precedente epidemia di Ebola registrata.", "terms": [{"match": "casi confermati di Ebola", "id": "ebola"}]}, "sources": [{"name": "Anadolu Agency (anews)", "url": "https://www.anews.com.tr/africa/2026/07/22/africa-health-body-wants-urgent-action-as-ebola-cases-top-2400-in-dr-congo", "reliability": 3}, {"name": "World Health Organization", "url": "https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON613", "reliability": 5}], "topics": []}, {"id": "measles-2260-jurisdictions", "date": "2026-07-22", "country": "USA", "category": "Medicine", "en": {"title": "US measles cases reach 2,260 across 44 jurisdictions as summer travel raises record risk", "summary": "The CDC confirmed 2,260 measles cases across 44 states and jurisdictions, with 34 active outbreaks and 93% of cases outbreak-associated. The 2026 total is already on track to exceed 2025's 2,289 cases — the highest annual count in 33 years — before summer even ends.", "detail": "Utah alone has recorded more than 400 cases, while a South Carolina outbreak topped 600 before being contained in April. Fifteen of the 2,260 cases involved international visitors. The CDC says two MMR vaccine doses are about 97% effective, but kindergarten vaccination coverage keeps declining nationally, and officials warn that summer travel and the coming school year could be a tipping point for whether the country's measles elimination status, held since 2000, formally lapses.", "terms": [{"match": "measles elimination status", "id": "measles-status"}]}, "it": {"title": "I casi di morbillo negli USA raggiungono 2.260 in 44 giurisdizioni, i viaggi estivi aumentano il rischio record", "summary": "Il CDC ha confermato 2.260 casi di morbillo in 44 stati e giurisdizioni, con 34 focolai attivi e il 93% dei casi legati a focolai in corso. Il totale del 2026 è già destinato a superare i 2.289 casi dell'intero 2025 — il numero annuale più alto in 33 anni — prima ancora della fine dell'estate.", "detail": "Solo lo Utah ha registrato oltre 400 casi, mentre un focolaio in South Carolina ha superato i 600 casi prima di essere contenuto ad aprile. Quindici dei 2.260 casi riguardavano visitatori internazionali. Il CDC afferma che due dosi di vaccino MMR sono efficaci al 97% circa, ma la copertura vaccinale tra i bambini in età scolare continua a calare a livello nazionale, e i funzionari avvertono che i viaggi estivi e il prossimo anno scolastico potrebbero essere il punto di svolta per la perdita formale dello status di eliminazione del morbillo, in vigore dal 2000.", "terms": [{"match": "status di eliminazione del morbillo", "id": "measles-status"}]}, "sources": [{"name": "Medical Daily", "url": "https://www.medicaldaily.com/measles-cases-2260-44-jurisdictions-summer-travel-2026-cdc-record-476175", "reliability": 3}, {"name": "CDC", "url": "https://www.cdc.gov/measles/data-research/index.html", "reliability": 5}], "topics": []}, {"id": "iran-conflict-day12", "date": "2026-07-22", "country": "Iran", "category": "Geopolitics", "topics": ["us-iran"], "en": {"title": "Pentagon chief says Iran war has cost $37.5 billion as Trump threatens Hormuz shipping", "summary": "Defense Secretary Pete Hegseth told a fiery Senate hearing that the US-Iran conflict has cost $37.5 billion so far, defending a new Pentagon funding request. President Trump threatened to \"bomb and destroy critical Iranian infrastructure every time Iran shoots at ships\" passing through the Strait of Hormuz.", "detail": "Hegseth's estimate, delivered alongside Joint Chiefs Chairman Dan Caine, covers munitions, deployments and battle damage since the war restarted, though CBS News reported sources believe the real total could be far higher. New strikes overnight hit Iranian targets after Jordan intercepted several incoming missiles and Kuwait's army said it repelled Iranian attack drones. The escalating price tag adds pressure on Congress as lawmakers weigh further war-funding requests.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}, {"match": "Pete Hegseth", "id": "hegseth"}]}, "it": {"title": "Il capo del Pentagono dice che la guerra con l'Iran è costata 37,5 miliardi di dollari, mentre Trump minaccia le navi nello Hormuz", "summary": "Il Segretario alla Difesa Pete Hegseth ha detto a un'infuocata audizione al Senato che il conflitto USA-Iran è costato finora 37,5 miliardi di dollari, difendendo una nuova richiesta di fondi del Pentagono. Il presidente Trump ha minacciato di \"bombardare e distruggere le infrastrutture iraniane critiche ogni volta che l'Iran spara alle navi\" che attraversano lo Stretto di Hormuz.", "detail": "La stima di Hegseth, presentata insieme al presidente del Comitato dei capi di stato maggiore congiunti Dan Caine, copre munizioni, dispiegamenti e danni di guerra da quando il conflitto è ripreso, anche se CBS News ha riferito che secondo alcune fonti il totale reale potrebbe essere molto più alto. Nuovi raid notturni hanno colpito obiettivi iraniani dopo che la Giordania ha intercettato diversi missili in arrivo e l'esercito del Kuwait ha dichiarato di aver respinto droni d'attacco iraniani. Il costo crescente aumenta la pressione sul Congresso, che valuta ulteriori richieste di finanziamento per la guerra.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}, {"match": "Pete Hegseth", "id": "hegseth"}]}, "sources": [{"name": "CBS News", "url": "https://www.cbsnews.com/news/hegseth-caine-senate-hearing-iran/", "reliability": 4}, {"name": "NBC News", "url": "https://www.nbcnews.com/politics/trump-administration/iran-war-cost-estimate-37-billion-pete-hegseth-senate-hearing-rcna588619", "reliability": 4}]}, {"id": "gaza-death-toll-73000", "date": "2026-07-22", "country": "Palestine", "category": "Social", "topics": ["israel-palestine"], "en": {"title": "Gaza death toll tops 73,000 as Israel 'doubles down' on strikes ahead of its own elections", "summary": "Gaza's Health Ministry says the Palestinian death toll from the war has surpassed 73,000, according to PBS News and other outlets, as Israeli strikes continue despite the nominal ceasefire. Al Jazeera reports Israeli attacks are intensifying as Israel heads toward elections scheduled for October 27.", "detail": "Officials say the majority of victims are civilians, and the ministry does not distinguish between combatants and non-combatants in its count, though it says roughly half were women and children. The renewed intensity coincides with domestic political pressure in Israel following the July 17 dissolution of parliament, with analysts warning that election-season dynamics may be driving harder military action rather than restraint.", "terms": []}, "it": {"title": "Il bilancio delle vittime a Gaza supera 73.000, mentre Israele \"raddoppia\" gli attacchi in vista delle proprie elezioni", "summary": "Il Ministero della Salute di Gaza afferma che il numero di morti palestinesi nella guerra ha superato 73.000, secondo PBS News e altre testate, mentre gli attacchi israeliani continuano nonostante il cessate il fuoco nominale. Al Jazeera riporta che gli attacchi israeliani si stanno intensificando mentre Israele si avvia verso le elezioni fissate per il 27 ottobre.", "detail": "I funzionari affermano che la maggioranza delle vittime sono civili, e il ministero non distingue tra combattenti e non combattenti nel conteggio, anche se dichiara che circa la metà erano donne e bambini. L'intensità rinnovata coincide con la pressione politica interna in Israele dopo lo scioglimento del parlamento il 17 luglio, con gli analisti che avvertono come le dinamiche della stagione elettorale possano spingere verso azioni militari più dure anziché verso la moderazione.", "terms": []}, "sources": [{"name": "PBS NewsHour", "url": "https://www.pbs.org/newshour/world/palestinian-death-toll-in-gaza-tops-73000-officials-say-as-israel-strikes-despite-ceasefire", "reliability": 5}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/22/palestine-weekly-ahead-of-elections-israel-doubles-down-on-attacks", "reliability": 4}]}, {"id": "india-gandhi-detained", "date": "2026-07-22", "country": "India", "category": "Politics", "topics": ["politica-internazionale"], "en": {"title": "India's opposition leader Rahul Gandhi briefly detained at Cockroach protest sit-in", "summary": "Rahul Gandhi was detained by police on July 22 during a sit-in outside PM Modi's residence protesting government inaction on the youth-led Cockroach Janta Party's demands, before being released the same evening. Monday's police crackdown on protesters left 118 officers and 60 others injured.", "detail": "The Cockroach Janta Party (CJP) movement, born as satire after India's Chief Justice compared unemployed youth to \"cockroaches,\" has grown into a mass protest movement over a medical school entrance exam leak that forced two million students to retake tests and has been linked to at least 12 student suicides. Protests have spread beyond Delhi to Mumbai and Bengaluru, while Education Minister Dharmendra Pradhan said students \"deserve certainty over chaos, solutions over slogans, and responsibility over disruption.\"", "terms": [{"match": "Cockroach Janta Party", "id": "cockroach-party"}]}, "it": {"title": "Il leader dell'opposizione indiana Rahul Gandhi brevemente fermato durante il sit-in del movimento Cockroach", "summary": "Rahul Gandhi è stato fermato dalla polizia il 22 luglio durante un sit-in davanti alla residenza del premier Modi per protestare contro l'inazione del governo sulle richieste del movimento giovanile Cockroach Janta Party, prima di essere rilasciato la sera stessa. La repressione della polizia contro i manifestanti di lunedì ha lasciato 118 agenti e 60 altre persone ferite.", "detail": "Il movimento Cockroach Janta Party (CJP), nato come satira dopo che il presidente della Corte Suprema indiana aveva paragonato i giovani disoccupati a \"scarafaggi\", è cresciuto fino a diventare un movimento di protesta di massa dopo la fuga di notizie su un esame di ammissione alla facoltà di medicina che ha costretto due milioni di studenti a ripetere i test ed è stata collegata ad almeno 12 suicidi tra gli studenti. Le proteste si sono estese oltre Delhi fino a Mumbai e Bengaluru, mentre il ministro dell'Istruzione Dharmendra Pradhan ha dichiarato che gli studenti \"meritano certezza al posto del caos, soluzioni al posto degli slogan e responsabilità al posto dei disordini\".", "terms": [{"match": "Cockroach Janta Party", "id": "cockroach-party"}]}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/22/india-opposition-leader-gandhi-freed-after-detention-at-student-led-protest", "reliability": 4}, {"name": "CNN", "url": "https://www.cnn.com/2026/07/22/india/india-cockroach-party-protest-anger-intl-hnk", "reliability": 4}]}, {"id": "uk-burnham-defence-farnborough", "date": "2026-07-22", "country": "United Kingdom", "category": "Politics", "topics": ["politica-internazionale"], "en": {"title": "PM Burnham signals higher UK defence spending at Farnborough Airshow", "summary": "Prime Minister Andy Burnham pledged higher defence spending at the Farnborough International Airshow, announcing £300 million for the Storm Fighter autonomous combat aircraft programme and a target of 500,000 defence and aerospace jobs by 2030, tied to NATO's 3.5%-of-GDP spending commitment by 2035.", "detail": "Burnham said, \"We are going to honour our commitments on defence and use that investment to transform people's lives,\" framing defence spending as an economic growth strategy. Defence Secretary Wes Streeting called the announcement \"the start of autonomous air warfare.\" The pledge follows predecessor Keir Starmer's resignation amid a dispute over defence funding, after the previous government offered the Ministry of Defence £13 billion against a requested £18 billion.", "terms": [{"match": "Storm Fighter", "id": "storm-fighter"}]}, "it": {"title": "Il premier Burnham annuncia un aumento della spesa per la difesa britannica al Farnborough Airshow", "summary": "Il primo ministro Andy Burnham ha promesso un aumento della spesa per la difesa al Farnborough International Airshow, annunciando 300 milioni di sterline per il programma di aereo da combattimento autonomo Storm Fighter e l'obiettivo di 500.000 posti di lavoro nella difesa e aerospazio entro il 2030, legato all'impegno NATO di portare la spesa al 3,5% del PIL entro il 2035.", "detail": "Burnham ha dichiarato: \"Onoreremo i nostri impegni sulla difesa e useremo quell'investimento per trasformare la vita delle persone\", presentando la spesa per la difesa come una strategia di crescita economica. Il ministro della Difesa Wes Streeting ha definito l'annuncio \"l'inizio della guerra aerea autonoma\". L'impegno arriva dopo le dimissioni del predecessore Keir Starmer per una disputa sui finanziamenti della difesa, dopo che il governo precedente aveva offerto al Ministero della Difesa 13 miliardi di sterline a fronte dei 18 richiesti.", "terms": [{"match": "Storm Fighter", "id": "storm-fighter"}]}, "sources": [{"name": "The National", "url": "https://www.thenationalnews.com/news/uk/2026/07/22/uk-prime-minister-burnham-signals-higher-defence-spending/", "reliability": 3}, {"name": "FlightGlobal", "url": "https://www.flightglobal.com/archive/2026/07/uk-opposition-leader-delivers-defence-funding-plea-at-farnborough/", "reliability": 3}]}, {"id": "us-new-tariffs-friday", "date": "2026-07-22", "country": "USA", "category": "Economy", "topics": ["mercato-investimenti"], "en": {"title": "US set to impose new tariffs on dozens of economies as 10% global stopgap rate expires", "summary": "Washington is preparing to impose new duties on dozens of trading partners by Friday, as a temporary 10% global tariff rate put in place earlier this year expires. The move extends Trump's tariff overhaul into a new phase covering countries that have not yet reached bilateral trade deals.", "detail": "The stopgap rate had offered a floor for countries still negotiating with Washington; without a renewal or a finalized deal, those economies now face country-specific duties set by the administration. The new tariffs land alongside the 50% levy already imposed on Canada and the 25% tariff on Brazil, deepening a global trade realignment that economists warn could add fresh inflationary pressure just as the Federal Reserve weighs its next rate decision.", "terms": []}, "it": {"title": "Gli USA impongono nuovi dazi a decine di economie mentre scade la tariffa globale provvisoria del 10%", "summary": "Washington si prepara a imporre nuovi dazi a decine di partner commerciali entro venerdì, mentre scade una tariffa globale provvisoria del 10% introdotta all'inizio dell'anno. La mossa estende la revisione tariffaria di Trump a una nuova fase che coinvolge i paesi che non hanno ancora raggiunto accordi commerciali bilaterali.", "detail": "La tariffa provvisoria aveva offerto una soglia minima per i paesi ancora in negoziato con Washington; senza un rinnovo o un accordo definitivo, queste economie ora affrontano dazi specifici per paese fissati dall'amministrazione. I nuovi dazi si aggiungono al dazio del 50% già imposto al Canada e a quello del 25% sul Brasile, approfondendo un riallineamento commerciale globale che gli economisti avvertono potrebbe aggiungere nuove pressioni inflazionistiche proprio mentre la Federal Reserve valuta la prossima decisione sui tassi.", "terms": []}, "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-21/us-set-to-impose-new-duties-by-friday-with-stopgap-to-expire", "reliability": 5}, {"name": "Yahoo Finance (Bloomberg)", "url": "https://finance.yahoo.com/economy/policy/articles/us-set-impose-tariffs-friday-194016612.html", "reliability": 4}]}, {"id": "alphabet-capex-205b", "date": "2026-07-22", "country": "USA", "category": "Technology", "topics": ["ai"], "en": {"title": "Alphabet shares slide despite earnings beat as AI capex guidance jumps to $205 billion", "summary": "Alphabet reported Q2 revenue of $119.8 billion, up 24% year-over-year, with Google Cloud sales surging 82% to $24.77 billion. But the stock fell almost 5% after hours as the company raised its 2026 capital-expenditure guidance to $195-205 billion, up from $180-190 billion, and warned spending would rise further in 2027.", "detail": "Google Cloud's backlog grew by more than $50 billion in the quarter to reach $514 billion, and Gemini now has 950 million monthly active users, with over 90% of Fortune 500 companies using its AI services. Even so, investors focused on the sharply higher capex figure, extending the debate — also visible in the recent chip-stock selloff and rebound — over whether AI infrastructure spending across Big Tech is being matched by proportional returns.", "terms": []}, "it": {"title": "Le azioni Alphabet scendono nonostante utili sopra le attese, mentre le previsioni di spesa sull'AI salgono a 205 miliardi di dollari", "summary": "Alphabet ha riportato ricavi nel secondo trimestre per 119,8 miliardi di dollari, in crescita del 24% su base annua, con le vendite di Google Cloud salite dell'82% a 24,77 miliardi. Ma il titolo è sceso di quasi il 5% dopo la chiusura, dopo che l'azienda ha alzato la previsione di spesa in conto capitale 2026 a 195-205 miliardi di dollari, dai precedenti 180-190 miliardi, avvertendo che la spesa salirà ulteriormente nel 2027.", "detail": "Il portafoglio ordini di Google Cloud è cresciuto di oltre 50 miliardi di dollari nel trimestre, raggiungendo 514 miliardi, e Gemini conta ora 950 milioni di utenti attivi mensili, con oltre il 90% delle aziende Fortune 500 che utilizzano i suoi servizi di AI. Ciononostante, gli investitori si sono concentrati sulla cifra di capex nettamente più alta, alimentando un dibattito — visibile anche nel recente selloff e rimbalzo dei titoli dei chip — sul fatto che la spesa in infrastrutture AI delle grandi aziende tecnologiche sia accompagnata da ritorni proporzionati.", "terms": []}, "sources": [{"name": "CNBC", "url": "https://www.cnbc.com/2026/07/22/google-earnings-q2-goog-live-updates.html", "reliability": 4}, {"name": "Yahoo Finance", "url": "https://finance.yahoo.com/markets/stocks/articles/googl-drops-nearly-5-hours-212540090.html", "reliability": 3}]}, {"id": "measles-35yr-record", "date": "2026-07-22", "country": "USA", "category": "Medicine", "topics": [], "en": {"title": "US measles cases hit 35-year high with 2,295 confirmed and months still to go", "summary": "US measles cases have reached 2,295 in 2026 — the highest annual total since 1991, when 2,126 cases were recorded — already surpassing all of 2025's 2,289 cases with five months still remaining in the year. Active outbreaks continue in Virginia, Pennsylvania, Utah and several other states.", "detail": "Utah alone has logged 711 cases over a 12-month outbreak (518 of them in 2026), while South Carolina's outbreak infected 997 people before being contained in April. Johns Hopkins epidemiologist Dr. William Moss said 95% vaccination coverage is needed for herd immunity, but many US communities fall well short of that threshold. About 20% of unvaccinated Americans who contract measles require hospitalization, and 1 in 20 develop pneumonia.", "terms": [{"match": "highest annual total since 1991", "id": "measles-status"}]}, "it": {"title": "I casi di morbillo negli USA raggiungono il massimo in 35 anni: 2.295 confermati, con mesi ancora da contare", "summary": "I casi di morbillo negli Stati Uniti nel 2026 hanno raggiunto quota 2.295 — il totale annuale più alto dal 1991, quando furono registrati 2.126 casi — superando già l'intero totale del 2025 (2.289 casi) con ancora cinque mesi dell'anno da contare. I focolai attivi continuano in Virginia, Pennsylvania, Utah e diversi altri stati.", "detail": "Solo lo Utah ha registrato 711 casi in un focolaio durato 12 mesi (518 dei quali nel 2026), mentre il focolaio del South Carolina ha infettato 997 persone prima di essere contenuto ad aprile. L'epidemiologo di Johns Hopkins William Moss ha detto che è necessaria una copertura vaccinale del 95% per l'immunità di gregge, ma molte comunità statunitensi restano ben al di sotto di questa soglia. Circa il 20% degli americani non vaccinati che contraggono il morbillo richiede il ricovero, e 1 su 20 sviluppa una polmonite.", "terms": [{"match": "totale annuale più alto dal 1991", "id": "measles-status"}]}, "sources": [{"name": "CIDRAP (University of Minnesota)", "url": "https://www.cidrap.umn.edu/measles/measles-cases-reach-35-year-high-us", "reliability": 4}, {"name": "The Hill", "url": "https://thehill.com/policy/healthcare/5983731-us-measles-cases-hit-record/", "reliability": 4}]}, {"id": "ebola-drc-1000-deaths", "date": "2026-07-22", "country": "DR Congo", "category": "Medicine", "topics": [], "en": {"title": "DR Congo's Ebola outbreak nears 1,000 deaths in the fastest death toll rise on record", "summary": "DR Congo's National Institute of Public Health confirmed 999 deaths and 2,473 total cases from the Bundibugyo Ebola strain as of July 22, with the WHO recording 2 additional deaths in Uganda. The 2013-2016 West African epidemic took roughly eight months to reach 1,000 deaths; this outbreak has come close in about two months.", "detail": "WHO incident manager Thierno Balde said \"the outbreak remains ahead of us and we are still in a phase of catching up,\" while WHO chief Tedros Adhanom Ghebreyesus warned it had \"expanded faster than any previous outbreak.\" Some 737 patients remain in isolation or hospitalized. Uganda, by contrast, has reported no new infections in about a month and began a 42-day countdown toward being declared Ebola-free after discharging its last patient on July 16.", "terms": [{"match": "Bundibugyo Ebola strain", "id": "ebola"}]}, "it": {"title": "Il focolaio di Ebola in RD Congo si avvicina a 1.000 morti, il ritmo di crescita più veloce mai registrato", "summary": "L'Istituto Nazionale di Sanità Pubblica della RD Congo ha confermato 999 morti e 2.473 casi totali dal ceppo Ebola Bundibugyo al 22 luglio, mentre l'OMS ha registrato altri 2 morti in Uganda. L'epidemia dell'Africa occidentale del 2013-2016 impiegò circa otto mesi per raggiungere 1.000 morti; questo focolaio vi si è avvicinato in circa due mesi.", "detail": "Il responsabile OMS per l'emergenza Thierno Balde ha detto che \"il focolaio resta avanti a noi e siamo ancora in una fase di recupero\", mentre il direttore generale dell'OMS Tedros Adhanom Ghebreyesus ha avvertito che si è \"espanso più velocemente di qualsiasi focolaio precedente\". Circa 737 pazienti restano isolati o ricoverati. L'Uganda, al contrario, non registra nuove infezioni da circa un mese e ha iniziato un conto alla rovescia di 42 giorni per essere dichiarato libero da Ebola dopo aver dimesso l'ultimo paziente il 16 luglio.", "terms": [{"match": "ceppo Ebola Bundibugyo", "id": "ebola"}]}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/22/nearly-1000-people-have-died-from-ebola-in-dr-congo", "reliability": 4}, {"name": "Euronews", "url": "https://www.euronews.com/2026/07/22/congos-ebola-outbreak-kills-more-than-1000-people", "reliability": 4}]}, {"id": "houthi-tankers-attack", "date": "2026-07-23", "country": "Saudi Arabia", "category": "Geopolitics", "topics": ["us-iran"], "en": {"title": "Houthis strike two Saudi oil tankers, oil tops $100 a barrel", "summary": "Yemen's Iran-aligned Houthi rebels attacked two Saudi oil tankers, the Encelia and the Layla, in the Red Sea, setting both alight. It was their first strike since declaring a naval blockade of Saudi shipping, and pushed Brent crude above $100 a barrel for the first time since May.", "detail": "Saudi authorities and the UK Maritime Trade Operations Centre said no casualties were reported, though five Saudi tankers diverted course, four toward the Suez Canal to avoid the Bab el-Mandeb Strait. President Trump threatened to 'bomb and destroy' an Iranian bridge or power plant for every future attack on shipping, while Secretary of State Marco Rubio described the US response as an 'eye for an eye.' The attack opened a second maritime front alongside the Strait of Hormuz, through which Iran has also disrupted traffic, as the US carried out its 12th consecutive night of strikes on Iran. Iraq's prime minister traveled to Tehran seeking de-escalation.", "terms": [{"match": "Bab el-Mandeb Strait", "id": "bab-el-mandeb"}, {"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "Gli Houthi colpiscono due petroliere saudite, il petrolio supera i 100 dollari al barile", "summary": "I ribelli Houthi yemeniti, alleati dell'Iran, hanno attaccato due petroliere saudite, la Encelia e la Layla, nel Mar Rosso, incendiandole entrambe. È il loro primo attacco da quando hanno dichiarato un blocco navale delle navi saudite, e ha fatto salire il greggio Brent oltre i 100 dollari al barile per la prima volta da maggio.", "detail": "Le autorità saudite e lo UK Maritime Trade Operations Centre hanno riferito che non ci sono state vittime, anche se cinque petroliere saudite hanno deviato rotta, quattro verso il Canale di Suez per evitare lo Stretto di Bab el-Mandeb. Il presidente Trump ha minacciato di \"bombardare e distruggere\" un ponte o una centrale elettrica iraniana per ogni futuro attacco alle navi, mentre il Segretario di Stato Marco Rubio ha descritto la risposta USA come \"occhio per occhio\". L'attacco ha aperto un secondo fronte marittimo accanto allo Stretto di Hormuz, dove l'Iran ha già interrotto il traffico, mentre gli USA conducevano la loro dodicesima notte consecutiva di raid sull'Iran. Il primo ministro iracheno si è recato a Teheran per cercare una de-escalation.", "terms": [{"match": "Stretto di Bab el-Mandeb", "id": "bab-el-mandeb"}, {"match": "Stretto di Hormuz", "id": "hormuz"}]}, "sources": [{"name": "PBS NewsHour", "url": "https://www.pbs.org/newshour/world/yemens-houthis-attack-saudi-tankers-in-the-red-sea-threatening-to-widen-iran-war", "reliability": 5}, {"name": "The National", "url": "https://www.thenationalnews.com/business/energy/2026/07/23/oil-hits-100-for-the-first-time-since-may-after-houthi-attacks-on-saudi-ships-in-red-sea/", "reliability": 3}]}, {"id": "oil-surge-100", "date": "2026-07-23", "country": "Global", "category": "Economy", "topics": ["mercato-investimenti", "us-iran"], "en": {"title": "Oil tops $100 a barrel for first time since May as Red Sea risk widens", "summary": "Brent crude jumped more than 6% to above $100 a barrel and WTI rose to roughly $91.50, the highest levels in eight weeks, after Houthi attacks on Saudi tankers compounded disruption already caused by the closure of the Strait of Hormuz.", "detail": "Brent has now rallied more than 30% during July alone. Analysts said the combination of the Hormuz blockade — which normally carries a fifth of global oil supply — and the new Red Sea risk to the Bab el-Mandeb corridor has tightened global supply expectations sharply. Traders are watching whether the Federal Reserve's upcoming rate decision will have to account for a renewed round of energy-driven inflation, on top of the price pressure already flowing from new US tariffs on dozens of trading partners.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}, {"match": "Bab el-Mandeb", "id": "bab-el-mandeb"}]}, "it": {"title": "Il petrolio supera i 100 dollari al barile per la prima volta da maggio, il rischio si allarga al Mar Rosso", "summary": "Il greggio Brent è salito di oltre il 6% superando i 100 dollari al barile, e il WTI è arrivato a circa 91,50 dollari, i livelli più alti in otto settimane, dopo che gli attacchi Houthi alle petroliere saudite si sono aggiunti alle interruzioni già causate dalla chiusura dello Stretto di Hormuz.", "detail": "Il Brent è così salito di oltre il 30% nel solo mese di luglio. Gli analisti dicono che la combinazione del blocco di Hormuz — che normalmente trasporta un quinto della fornitura mondiale di petrolio — e il nuovo rischio nel corridoio di Bab el-Mandeb nel Mar Rosso ha ristretto bruscamente le aspettative sull'offerta globale. I mercati osservano se la prossima decisione della Federal Reserve sui tassi dovrà tenere conto di una nuova ondata di inflazione energetica, che si aggiunge alle pressioni sui prezzi già derivanti dai nuovi dazi USA su decine di partner commerciali.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}, {"match": "Bab el-Mandeb", "id": "bab-el-mandeb"}]}, "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-22/latest-oil-market-news-and-analysis-for-july-23", "reliability": 5}, {"name": "NBC News", "url": "https://www.nbcnews.com/business/markets/oil-prices-rise-red-sea-attacks-houthis-saudi-trump-iran-war-rcna588851", "reliability": 4}]}, {"id": "us-tariffs-60-countries", "date": "2026-07-24", "country": "Global", "category": "Economy", "topics": ["mercato-investimenti"], "en": {"title": "US imposes new 10-12.5% tariffs on 60 countries over forced-labor enforcement", "summary": "The Trump administration imposed new tariffs of 10% to 12.5% on imports from 60 trading partners — covering 99% of US imports — effective July 24, arguing those countries fail to adequately enforce bans on forced-labor goods. Vietnam and China face the higher 12.5% rate; the UK, Canada and Mexico are among 17 countries at 10%.", "detail": "The tariffs rely on Section 301 of the Trade Act of 1974, a legal basis that survived the Supreme Court's February ruling striking down Trump's earlier emergency-powers tariffs. US Trade Representative Jamieson Greer called it 'the most sweeping international labor rights action the United States has ever taken.' Oil, gas, fertilizer and goods already covered by the USMCA are exempted. Human rights advocates gave a mixed response: some welcomed the leverage, while the Human Trafficking Legal Center's Martina Vandenberg warned countries need time to build 'meaningful and enforceable' import-ban systems rather than face immediate penalties. The move replaces an expiring 10% stopgap tariff and follows similar recent actions against Canada and Brazil.", "terms": [{"match": "Section 301", "id": "section-301"}]}, "it": {"title": "Gli USA impongono nuovi dazi al 10-12,5% su 60 paesi per la scarsa applicazione delle norme sul lavoro forzato", "summary": "L'amministrazione Trump ha imposto nuovi dazi dal 10% al 12,5% sulle importazioni da 60 partner commerciali — che coprono il 99% delle importazioni USA — a partire dal 24 luglio, sostenendo che questi paesi non applichino adeguatamente i divieti sui beni prodotti con lavoro forzato. Vietnam e Cina affrontano il tasso più alto del 12,5%; Regno Unito, Canada e Messico sono tra i 17 paesi al 10%.", "detail": "I dazi si basano sulla Sezione 301 del Trade Act del 1974, una base legale sopravvissuta alla sentenza della Corte Suprema di febbraio che aveva bocciato i precedenti dazi di emergenza di Trump. Il rappresentante commerciale USA Jamieson Greer l'ha definita \"l'azione più ampia mai intrapresa dagli Stati Uniti sui diritti del lavoro a livello internazionale\". Sono esclusi petrolio, gas, fertilizzanti e beni già coperti dall'USMCA. Le organizzazioni per i diritti umani hanno reagito in modo contrastante: alcune hanno accolto con favore la leva di pressione, mentre Martina Vandenberg dello Human Trafficking Legal Center ha avvertito che i paesi hanno bisogno di tempo per costruire sistemi di divieto delle importazioni \"significativi ed applicabili\" invece di subire sanzioni immediate. La mossa sostituisce un dazio provvisorio del 10% in scadenza e segue azioni simili recenti contro Canada e Brasile.", "terms": [{"match": "Sezione 301", "id": "section-301"}]}, "sources": [{"name": "CBS News", "url": "https://www.cbsnews.com/news/trump-tariffs-dozens-countries-forced-labor/", "reliability": 4}, {"name": "NPR", "url": "https://www.npr.org/2026/07/23/g-s1-135388/trump-tariffs-trade-country", "reliability": 5}]}, {"id": "india-modi-fast-track-courts", "date": "2026-07-23", "country": "India", "category": "Politics", "topics": ["politica-internazionale"], "en": {"title": "Modi offers fast-track courts for exam leaks; Cockroach movement rejects it as a 'distraction'", "summary": "PM Modi pledged fast-track courts to punish those responsible for exam-paper leaks, but the youth-led Cockroach Janta Party dismissed the offer, with spokesperson Ashutosh Ranka calling it 'not a real solution... merely a distraction' from the Education Minister's failures.", "detail": "Protesters have now occupied Parliament Street in Delhi for three days, with 16 metro stations shut around the site by Thursday. The movement's core demands remain Education Minister Dharmendra Pradhan's resignation, dismissal of cases against peaceful protesters, and 10 million rupees (about $120,000) in compensation per family for at least 12 students who died by suicide after exam cancellations. Smaller solidarity demonstrations have also spread to Mumbai, Bengaluru and Patna.", "terms": [{"match": "Cockroach Janta Party", "id": "cockroach-party"}]}, "it": {"title": "Modi offre tribunali accelerati per le fughe di notizie sugli esami, il movimento Cockroach lo respinge come una \"distrazione\"", "summary": "Il premier Modi ha promesso tribunali accelerati per punire i responsabili delle fughe di notizie sui test d'esame, ma il movimento giovanile Cockroach Janta Party ha respinto l'offerta, con il portavoce Ashutosh Ranka che l'ha definita \"non una soluzione reale... solo una distrazione\" dai fallimenti del ministro dell'Istruzione.", "detail": "I manifestanti occupano ormai da tre giorni Parliament Street a Delhi, con 16 stazioni della metropolitana chiuse intorno al sito giovedì. Le richieste principali del movimento restano le dimissioni del ministro dell'Istruzione Dharmendra Pradhan, l'archiviazione dei procedimenti contro i manifestanti pacifici e un risarcimento di 10 milioni di rupie (circa 120.000 dollari) per famiglia per almeno 12 studenti morti suicidi dopo l'annullamento degli esami. Manifestazioni di solidarietà più piccole si sono estese anche a Mumbai, Bengaluru e Patna.", "terms": [{"match": "Cockroach Janta Party", "id": "cockroach-party"}]}, "sources": [{"name": "NBC News", "url": "https://www.nbcnews.com/world/asia/protesters-india-reject-modis-promise-fast-track-courts-exam-leaks-rcna588841", "reliability": 4}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/23/indias-modi-promises-fast-track-courts-for-exam-fraud-fuelling-protests", "reliability": 4}]}, {"id": "gaza-strikes-july24", "date": "2026-07-24", "country": "Palestine", "category": "Geopolitics", "topics": ["israel-palestine"], "en": {"title": "Israel bombs Gaza after ordering displacement, killing two Palestinians", "summary": "Israeli strikes killed at least two Palestinians in Gaza after the military issued evacuation orders for the same areas it then attacked, an Al Jazeera correspondent reported, deepening a UN-documented pattern of intensifying violence nine months into the nominal ceasefire.", "detail": "The UN human rights office (OHCHR) said it had verified 685 Palestinians killed between October 2025 and mid-April 2026 alone, including 283 women and children, and separately recorded at least 57 deaths between July 13 and 20. The UN warned that 'nowhere is safe for Palestinians in Gaza' given the constantly shifting 'yellow line' and reported Israeli fire on civilians near it, raising concerns of 'war crimes and other possible atrocity crimes.' A UN spokesperson said 67% of Gaza's population faces acute food insecurity, while the UK Foreign Office has urged Israel to lift aid restrictions it says are 'driving disease, water scarcity and decimating health services.'", "terms": [{"match": "yellow line", "id": "yellow-line"}]}, "it": {"title": "Israele bombarda Gaza dopo aver ordinato l'evacuazione, uccidendo due palestinesi", "summary": "I raid israeliani hanno ucciso almeno due palestinesi a Gaza dopo che l'esercito aveva emesso ordini di evacuazione per le stesse zone poi colpite, secondo un corrispondente di Al Jazeera, in un quadro documentato dall'ONU di violenza in intensificazione a nove mesi dal cessate il fuoco nominale.", "detail": "L'Ufficio ONU per i diritti umani (OHCHR) ha dichiarato di aver verificato 685 palestinesi uccisi tra ottobre 2025 e metà aprile 2026, tra cui 283 donne e bambini, registrando separatamente almeno 57 morti tra il 13 e il 20 luglio. L'ONU ha avvertito che \"nessun luogo è sicuro per i palestinesi a Gaza\", data la \"linea gialla\" in continuo mutamento e il fuoco israeliano segnalato contro civili nei suoi pressi, sollevando timori di \"crimini di guerra e altri possibili crimini atroci\". Un portavoce ONU ha detto che il 67% della popolazione di Gaza affronta una grave insicurezza alimentare, mentre il Foreign Office britannico ha esortato Israele a togliere le restrizioni agli aiuti, che a suo dire stanno \"alimentando malattie, scarsità d'acqua e distruggendo i servizi sanitari\".", "terms": [{"match": "linea gialla", "id": "yellow-line"}]}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/24/israel-bombs-gaza-after-displacement-orders-kills-two-palestinians", "reliability": 4}, {"name": "OHCHR (UN Human Rights Office)", "url": "https://www.ohchr.org/en/press-briefing-notes/2026/07/intensified-israeli-attacks-gaza", "reliability": 5}]}, {"id": "ukraine-russia-deep-strikes", "date": "2026-07-23", "country": "Ukraine", "category": "Geopolitics", "topics": ["russia-ukraine"], "en": {"title": "Ukraine and Russia trade deadly deep strikes as front line stays largely frozen", "summary": "Both sides escalated attacks far behind each other's lines: Ukrainian drones killed four people in Russia's Voronezh region, including a 3-year-old boy, while a Russian strike on a food plant in Pavlohrad, Ukraine, killed three and wounded around 19-28 people.", "detail": "Additional deaths were reported in Belgorod, Crimea and Ukraine's Sumy region, where a mortar strike killed a man. Along the front, Russia claimed capturing the village of Bilytske near Pokrovsk, while Ukraine said it repelled 42 Russian assaults near 19 settlements in the same area — illustrating a war now in its fifth year with a largely stalled front line but climbing civilian casualties. Separately, the EU approved its 21st sanctions package against Russia, targeting 218 individuals and entities, over 100 banks and military-industrial producers.", "terms": []}, "it": {"title": "Ucraina e Russia si scambiano attacchi mortali in profondità mentre il fronte resta bloccato", "summary": "Entrambe le parti hanno intensificato gli attacchi ben oltre le rispettive linee: i droni ucraini hanno ucciso quattro persone nella regione russa di Voronezh, incluso un bambino di 3 anni, mentre un attacco russo a un impianto alimentare a Pavlohrad, in Ucraina, ha ucciso tre persone e ferito circa 19-28.", "detail": "Altre vittime sono state segnalate a Belgorod, in Crimea e nella regione ucraina di Sumy, dove un colpo di mortaio ha ucciso un uomo. Sul fronte, la Russia ha rivendicato la conquista del villaggio di Bilytske vicino a Pokrovsk, mentre l'Ucraina ha dichiarato di aver respinto 42 assalti russi vicino a 19 insediamenti nella stessa area — a testimonianza di una guerra ormai al quinto anno, con un fronte in gran parte bloccato ma vittime civili in aumento. Separatamente, l'UE ha approvato il suo 21° pacchetto di sanzioni contro la Russia, che colpisce 218 tra individui ed entità, oltre 100 banche e produttori del complesso militare-industriale.", "terms": []}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/23/several-killed-as-ukraine-russia-trade-attacks-deep-behind-the-front-line", "reliability": 4}, {"name": "Ukrinform", "url": "https://www.ukrinform.net/rubric-ato/4147168-russian-strike-on-pavlohrad-kills-three-injures-19.html", "reliability": 3}]}, {"id": "china-ai-export-controls", "date": "2026-07-21", "country": "China", "category": "Technology", "topics": ["ai"], "en": {"title": "China weighs tighter export controls on its own AI models and chips", "summary": "China's Ministry of Commerce is considering tighter export controls on Chinese AI models and semiconductor technology, aiming to prevent advanced domestic tech and start-ups from being acquired by Western firms, according to Financial Times reporting confirmed by two people involved in the consultations.", "detail": "The proposal marks a reversal in framing from the years-long fight over US restrictions on chip exports to China: Beijing is now weighing controls of its own, aimed at keeping cutting-edge Chinese AI and chip assets from changing hands abroad. It comes as Chinese and US chip and AI firms continue to compete for dominance amid a broader reshuffling of global tech supply chains, including TSMC's expanded US investment and continued swings in chip stocks tied to AI capital-spending questions. No final policy has been adopted; the plan remains at the consultation stage with domestic industry.", "terms": []}, "it": {"title": "La Cina valuta controlli più severi sulle esportazioni dei propri modelli AI e chip", "summary": "Il Ministero del Commercio cinese sta valutando controlli più severi sulle esportazioni di modelli di intelligenza artificiale e tecnologia dei semiconduttori made in China, con l'obiettivo di evitare che tecnologie avanzate e start-up nazionali vengano acquisite da aziende occidentali, secondo quanto riportato dal Financial Times e confermato da due persone coinvolte nelle consultazioni.", "detail": "La proposta segna un'inversione rispetto al confronto pluriennale sulle restrizioni USA alle esportazioni di chip verso la Cina: Pechino sta ora valutando controlli propri, volti a impedire che asset cinesi avanzati nell'AI e nei chip cambino di mano all'estero. Arriva mentre le aziende cinesi e statunitensi di chip e AI continuano a competere per il dominio del settore, in un più ampio riassetto delle catene di fornitura tecnologiche globali, che include l'espansione degli investimenti di TSMC negli USA e le continue oscillazioni dei titoli dei chip legate ai dubbi sulla spesa in conto capitale per l'AI. Nessuna politica definitiva è stata ancora adottata; il piano resta in fase di consultazione con l'industria nazionale.", "terms": []}, "sources": [{"name": "Yahoo Finance (Reuters)", "url": "https://finance.yahoo.com/technology/ai/articles/china-considers-tighter-export-controls-041139427.html", "reliability": 4}, {"name": "TNW (The Next Web)", "url": "https://thenextweb.com/news/china-ai-model-chip-export-controls-ft-report", "reliability": 3}]}, {"id": "measles-2295-full-year", "date": "2026-07-22", "country": "USA", "category": "Medicine", "topics": [], "en": {"title": "US measles cases officially surpass all of 2025 as 35-year record grows", "summary": "The CDC-tracked US measles count reached 2,295 as of July 22 — nine more than the full-year 2025 total — marking the highest annual count in 35 years, with South Carolina, Utah, Texas, Florida and Arizona hit hardest and 34 active outbreaks nationwide.", "detail": "Health officials reiterate that vaccination coverage needs to stay above 95% to sustain herd immunity, and most cases are occurring among the unvaccinated. Measles can cause pneumonia, ear infections and brain inflammation, and kills an estimated 1 to 3 of every 1,000 infected children. The country's measles elimination status, held since 2000, faces a formal review in November 2026; Health Secretary Robert F. Kennedy Jr. recently acknowledged the MMR vaccine is 'the most effective way to prevent measles spread' while describing vaccination as a personal choice.", "terms": [{"match": "measles elimination status", "id": "measles-status"}]}, "it": {"title": "I casi di morbillo negli USA superano ufficialmente l'intero 2025, cresce il record di 35 anni", "summary": "Il conteggio dei casi di morbillo tracciato dal CDC negli USA ha raggiunto 2.295 al 22 luglio — nove in più rispetto al totale dell'intero 2025 — segnando il numero annuale più alto in 35 anni, con South Carolina, Utah, Texas, Florida e Arizona più colpiti e 34 focolai attivi in tutto il paese.", "detail": "I funzionari sanitari ribadiscono che la copertura vaccinale deve restare sopra il 95% per mantenere l'immunità di gregge, e la maggior parte dei casi riguarda persone non vaccinate. Il morbillo può causare polmonite, infezioni all'orecchio e infiammazione cerebrale, e uccide stimativamente 1-3 bambini ogni 1.000 infetti. Lo status di eliminazione del morbillo del paese, in vigore dal 2000, sarà oggetto di una revisione formale a novembre 2026; il segretario alla Salute Robert F. Kennedy Jr. ha di recente riconosciuto che il vaccino MMR è \"il modo più efficace per prevenire la diffusione del morbillo\", pur descrivendo la vaccinazione come una scelta personale.", "terms": [{"match": "status di eliminazione del morbillo", "id": "measles-status"}]}, "sources": [{"name": "Washington Times", "url": "https://www.washingtontimes.com/news/2026/jul/23/us-measles-cases-surpass-2025s-total-according-johns-hopkins/", "reliability": 3}, {"name": "Axios", "url": "https://www.axios.com/2026/07/22/measles-cases-surge-past-last-year", "reliability": 4}]}, {"id": "kyiv-exhibition-strike", "date": "2026-07-24", "country": "Ukraine", "category": "Geopolitics", "topics": ["russia-ukraine"], "en": {"title": "Russian missile strike on Kyiv-area arms exhibition kills 10, wounds around 100", "summary": "A Russian missile struck an arms exhibition venue in Kyiv Oblast, killing at least 10 people and injuring around 100 as Ukraine and Russia traded deep strikes that killed at least 21 people combined across both countries.", "detail": "Ukrainian authorities opened criminal investigations into the strike, which hit a defense-industry event rather than a front-line military target. The attack came amid a broader exchange of long-range strikes: Ukrainian drones sparked a fire at an e-commerce warehouse near St. Petersburg, while other Russian strikes hit targets elsewhere in Ukraine. The frontline itself has remained largely static even as both sides intensify attacks deep behind each other's lines.", "terms": []}, "it": {"title": "Un missile russo colpisce una fiera di armamenti vicino Kiev, 10 morti e circa 100 feriti", "summary": "Un missile russo ha colpito una fiera di armamenti nell'oblast di Kiev, uccidendo almeno 10 persone e ferendone circa 100, mentre Ucraina e Russia si scambiavano attacchi in profondità che hanno causato complessivamente almeno 21 morti nei due paesi.", "detail": "Le autorità ucraine hanno aperto un'indagine penale sull'attacco, che ha colpito un evento dell'industria della difesa e non un obiettivo militare al fronte. L'attacco arriva nel quadro di un più ampio scambio di colpi a lungo raggio: droni ucraini hanno provocato un incendio in un magazzino di e-commerce vicino San Pietroburgo, mentre altri raid russi hanno colpito altri obiettivi in Ucraina. Il fronte resta in gran parte statico anche se entrambe le parti intensificano gli attacchi nelle retrovie avversarie.", "terms": []}, "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-24/russian-missiles-kill-10-at-event-near-kyiv-triggering-probe", "reliability": 5}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/24/at-least-11-killed-in-ukraine-as-moscow-and-kyiv-continue-to-trade-attacks", "reliability": 4}]}, {"id": "pentagon-toll-anomaly", "date": "2026-07-24", "country": "USA", "category": "Geopolitics", "topics": ["us-iran"], "en": {"title": "Pentagon quietly lowers official Iran war death toll from 18 to 14", "summary": "The Pentagon's casualty website dropped its official US troop death toll for the Iran war from 18 to 14 this week, removing four service members killed in Jordan and Iraq, which officials described only as a \"site anomaly.\"", "detail": "The removed names include troops who died after President Trump resumed strikes on July 7 following an earlier ceasefire declaration. Pentagon spokesperson Sean Parnell blamed \"temporary data disruption,\" but the website had not been updated in days and defense officials have not held a press briefing since May. Wounded figures also dropped, from 482 to 420, deepening questions about the transparency of the Pentagon's public casualty reporting nearly three weeks into the renewed conflict.", "terms": []}, "it": {"title": "Il Pentagono abbassa silenziosamente il bilancio ufficiale dei morti nella guerra con l'Iran, da 18 a 14", "summary": "Il sito web delle vittime del Pentagono ha fatto scendere il bilancio ufficiale dei militari USA morti nella guerra con l'Iran da 18 a 14 questa settimana, rimuovendo quattro militari uccisi in Giordania e Iraq, descrivendo il fatto solo come una \"anomalia del sito\".", "detail": "I nomi rimossi includono militari morti dopo che il presidente Trump ha ripreso i raid il 7 luglio, dopo una precedente dichiarazione di cessate il fuoco. Il portavoce del Pentagono Sean Parnell ha attribuito il fatto a una \"interruzione temporanea dei dati\", ma il sito non veniva aggiornato da giorni e i funzionari della Difesa non tengono un briefing con la stampa da maggio. Sono scesi anche i dati sui feriti, da 482 a 420, aumentando i dubbi sulla trasparenza dei bollettini pubblici del Pentagono a quasi tre settimane dalla ripresa del conflitto.", "terms": []}, "sources": [{"name": "CBS News", "url": "https://www.cbsnews.com/news/pentagon-website-4-iran-war-killed-names/", "reliability": 4}, {"name": "Military.com", "url": "https://www.military.com/pentagons-official-iran-war-death-toll-suddenly-drops-from-18-to-14", "reliability": 3}]}, {"id": "tariffs-allies-object", "date": "2026-07-24", "country": "Global", "category": "Economy", "topics": ["mercato-investimenti"], "en": {"title": "US allies reject Trump's forced-labor justification for new global tariffs", "summary": "Australia, New Zealand, the EU, Japan and China pushed back on the Trump administration's new 10-12.5% tariffs on 60 trading partners, calling the forced-labor rationale \"unjustified\" and unsupported by evidence.", "detail": "Australian Trade Minister Don Farrell said Canberra \"takes the issue of modern slavery seriously,\" while New Zealand's PM Christopher Luxon said the US investigation \"did not provide meaningful evidence.\" EU foreign policy chief Kaja Kallas contrasted the bloc's labor standards with those of the US itself. The new tariffs, covering imports responsible for over 99% of US trade, replaced a temporary global 10% rate and rely on a forced-labor legal rationale after the Supreme Court struck down Trump's earlier emergency-powers tariff authority.", "terms": []}, "it": {"title": "Gli alleati USA respingono la giustificazione sul lavoro forzato per i nuovi dazi globali di Trump", "summary": "Australia, Nuova Zelanda, UE, Giappone e Cina hanno respinto i nuovi dazi al 10-12,5% dell'amministrazione Trump su 60 partner commerciali, definendo la motivazione sul lavoro forzato \"ingiustificata\" e priva di prove.", "detail": "Il ministro del Commercio australiano Don Farrell ha detto che Canberra \"prende sul serio il tema della schiavitù moderna\", mentre il premier neozelandese Christopher Luxon ha detto che l'indagine USA \"non ha fornito prove significative\". L'Alta Rappresentante UE Kaja Kallas ha contrapposto gli standard lavorativi del blocco a quelli degli stessi Stati Uniti. I nuovi dazi, che coprono importazioni pari a oltre il 99% del commercio USA, hanno sostituito una tariffa globale provvisoria del 10% e si basano su una motivazione legale sul lavoro forzato dopo che la Corte Suprema aveva bocciato la precedente autorità tariffaria di emergenza di Trump.", "terms": []}, "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/07/24/nx-s1-5906301/us-global-trump-tariffs-reaction", "reliability": 5}, {"name": "Forbes", "url": "https://www.forbes.com/sites/siladityaray/2026/07/24/unjustified-eu-brazil-and-others-criticize-latest-trump-tariffs/", "reliability": 3}]}, {"id": "uk-number10-north", "date": "2026-07-24", "country": "United Kingdom", "category": "Politics", "topics": ["politica-internazionale"], "en": {"title": "PM Burnham opens 'Number 10 North' in Manchester to shift power from London", "summary": "UK Prime Minister Andy Burnham opened a satellite prime ministerial office, \"Number 10 North,\" in Manchester, relocating devolution and local-growth functions away from Westminster as his flagship early policy.", "detail": "Burnham held his first in-person meetings with Scotland's and Wales' first ministers in Glasgow, deliberately excluding Scottish independence from the agenda. The temporary Manchester base, at Heron House, will later move to a government digital campus; former Greater Manchester official Caroline Simpson was appointed to run it. Critics, including devolved administrations, say the initiative currently lacks real fiscal or tax-raising powers, calling it \"Whitehall with a different postcode\" until money and authority actually follow.", "terms": [{"match": "Number 10 North", "id": "number-10-north"}]}, "it": {"title": "Il premier Burnham apre 'Number 10 North' a Manchester per spostare potere da Londra", "summary": "Il primo ministro britannico Andy Burnham ha aperto un ufficio satellite del primo ministro, \"Number 10 North\", a Manchester, spostando le funzioni di decentramento e crescita locale lontano da Westminster come sua prima iniziativa politica di rilievo.", "detail": "Burnham ha tenuto a Glasgow i suoi primi incontri di persona con i primi ministri di Scozia e Galles, escludendo deliberatamente l'indipendenza scozzese dall'agenda. La sede temporanea di Manchester, a Heron House, si trasferirà in seguito in un campus digitale governativo; l'ex funzionaria della Greater Manchester Caroline Simpson è stata nominata per dirigerla. I critici, incluse le amministrazioni decentrate, dicono che l'iniziativa manca al momento di reali poteri fiscali o di tassazione, definendola \"Whitehall con un codice postale diverso\" finché fondi e autorità non seguiranno davvero.", "terms": [{"match": "Number 10 North", "id": "number-10-north"}]}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/economy/2026/7/24/andy-burnhams-number-10-north-changes-the-postcode-but-not-the-politics", "reliability": 4}, {"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-23/burnham-signals-devolution-intent-with-northern-number-10-office", "reliability": 5}]}, {"id": "wangchuk-strike-ends", "date": "2026-07-24", "country": "India", "category": "Social", "topics": [], "en": {"title": "Activist Sonam Wangchuk ends 26-day hunger strike as India's Cockroach protests continue", "summary": "Sonam Wangchuk ended his 26-day hunger strike after negotiations with government ministers, citing concern over \"possible violence,\" while the youth-led Cockroach Janta Party vowed to keep protesting until Education Minister Dharmendra Pradhan resigns.", "detail": "Wangchuk broke his fast in the presence of two federal ministers and after appeals from dozens of lawmakers. Movement founder Abhijeet Dipke said \"we won't let Sonam sir's sacrifice go in vain,\" and organizers planned fresh nationwide demonstrations in solidarity with students injured in the July 20 Parliament march. Core demands — Pradhan's resignation, exam-system reform and compensation for families of students who died by suicide after the exam leaks — remain unmet.", "terms": [{"match": "Sonam Wangchuk", "id": "wangchuk"}, {"match": "Cockroach Janta Party", "id": "cockroach-party"}]}, "it": {"title": "L'attivista Sonam Wangchuk interrompe lo sciopero della fame di 26 giorni, le proteste Cockroach in India continuano", "summary": "Sonam Wangchuk ha interrotto il suo sciopero della fame di 26 giorni dopo negoziati con ministri del governo, citando la preoccupazione per \"possibili violenze\", mentre il movimento giovanile Cockroach Janta Party ha promesso di continuare a protestare finché il ministro dell'Istruzione Dharmendra Pradhan non si dimetterà.", "detail": "Wangchuk ha interrotto il digiuno alla presenza di due ministri federali e dopo appelli di decine di parlamentari. Il fondatore del movimento Abhijeet Dipke ha detto \"non lasceremo che il sacrificio del signor Sonam sia vano\", e gli organizzatori hanno programmato nuove manifestazioni nazionali in solidarietà con gli studenti feriti nella marcia sul Parlamento del 20 luglio. Le richieste principali — dimissioni di Pradhan, riforma del sistema d'esame e risarcimento per le famiglie degli studenti morti suicidi dopo le fughe di notizie sugli esami — restano inevase.", "terms": [{"match": "Sonam Wangchuk", "id": "wangchuk"}, {"match": "Cockroach Janta Party", "id": "cockroach-party"}]}, "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/07/24/nx-s1-5906236/india-wangchuk-hunger-strike-cockroach-protesters", "reliability": 5}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/23/indian-activist-wangchuk-ends-26-day-hunger-strike-over-exam-paper-leaks", "reliability": 4}]}, {"id": "open-weight-ai-letter", "date": "2026-07-24", "country": "USA", "category": "Technology", "topics": ["ai"], "en": {"title": "Nvidia, Microsoft and Meta lead 25-company push for open-weight AI models", "summary": "A coalition of 25 tech companies — including Nvidia, Microsoft, Meta, Palantir and IBM — sent a letter urging US policymakers not to impose \"premature restrictions\" on open-weight AI models, arguing openness strengthens American competitiveness. OpenAI and Anthropic did not sign.", "detail": "The letter frames open-weight models — which can be downloaded, inspected and run by anyone — as a national-security and innovation advantage rather than a risk, amid growing concern that Chinese labs are leading on open-weight releases. Elon Musk publicly endorsed the letter despite not signing it himself. The split highlights a deepening divide in AI strategy: Microsoft and Nvidia favor broad openness, while OpenAI and Anthropic maintain proprietary, closed models for commercial and safety reasons.", "terms": []}, "it": {"title": "Nvidia, Microsoft e Meta guidano una coalizione di 25 aziende per i modelli AI open-weight", "summary": "Una coalizione di 25 aziende tecnologiche — tra cui Nvidia, Microsoft, Meta, Palantir e IBM — ha inviato una lettera che esorta i legislatori USA a non imporre \"restrizioni premature\" sui modelli AI open-weight, sostenendo che l'apertura rafforza la competitività americana. OpenAI e Anthropic non hanno firmato.", "detail": "La lettera presenta i modelli open-weight — scaricabili, ispezionabili ed eseguibili da chiunque — come un vantaggio per la sicurezza nazionale e l'innovazione piuttosto che un rischio, in un contesto di crescente preoccupazione che i laboratori cinesi stiano guidando le release open-weight. Elon Musk ha appoggiato pubblicamente la lettera pur non firmandola lui stesso. La spaccatura evidenzia una divisione sempre più marcata nella strategia sull'AI: Microsoft e Nvidia favoriscono un'ampia apertura, mentre OpenAI e Anthropic mantengono modelli proprietari e chiusi per ragioni commerciali e di sicurezza.", "terms": []}, "sources": [{"name": "CNBC", "url": "https://www.cnbc.com/2026/07/24/nvidia-microsoft-meta-open-weight-ai-models.html", "reliability": 4}, {"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-24/nvidia-microsoft-lead-call-for-open-weight-ai-models-after-kimi", "reliability": 5}]}, {"id": "ebola-drc-2900", "date": "2026-07-24", "country": "DR Congo", "category": "Medicine", "topics": [], "en": {"title": "DR Congo Ebola cases near 3,000 after provincial data review adds hundreds of cases", "summary": "Confirmed Ebola cases in DR Congo jumped to 2,905, with 1,269 deaths, after officials reconciled provincial data from Ituri and North Kivu with national figures, adding more than 300 cases to the count. Confirmed deaths passed 1,000 this week.", "detail": "The World Health Organization said the true scale of the outbreak could be two to four times larger than official figures suggest, given gaps in surveillance in conflict-affected areas. This is DR Congo's 17th Ebola outbreak, caused by the rare Bundibugyo strain, which has a roughly 40% fatality rate and no approved vaccine. The outbreak, declared in mid-May, is already the fastest-spreading Ebola outbreak on record.", "terms": [{"match": "Ebola", "id": "ebola"}]}, "it": {"title": "I casi di Ebola in RD Congo si avvicinano a 3.000 dopo una revisione dei dati provinciali che ne aggiunge centinaia", "summary": "I casi confermati di Ebola in RD Congo sono saliti a 2.905, con 1.269 morti, dopo che le autorità hanno riconciliato i dati provinciali di Ituri e Nord Kivu con le cifre nazionali, aggiungendo oltre 300 casi al conteggio. I morti confermati hanno superato quota 1.000 questa settimana.", "detail": "L'Organizzazione Mondiale della Sanità ha detto che la reale portata del focolaio potrebbe essere da due a quattro volte superiore alle cifre ufficiali, viste le lacune nella sorveglianza nelle aree colpite dal conflitto. È il 17° focolaio di Ebola della RD Congo, causato dal raro ceppo Bundibugyo, che ha un tasso di letalità di circa il 40% e per cui non esiste un vaccino approvato. Il focolaio, dichiarato a metà maggio, è già l'epidemia di Ebola a diffusione più rapida mai registrata.", "terms": [{"match": "Ebola", "id": "ebola"}]}, "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-24/ebola-cases-near-3-000-in-congo-after-provincial-data-review", "reliability": 5}, {"name": "Associated Press (via WTVB)", "url": "https://wtvbam.com/2026/07/24/nearly-3000-confirmed-infected-with-ebola-in-congo-after-data-review/", "reliability": 3}]}, {"id": "measles-2318-surpass-2025", "date": "2026-07-24", "country": "USA", "category": "Medicine", "topics": [], "en": {"title": "US measles cases hit 2,318, a 35-year high, for second record year running", "summary": "US measles cases climbed to 2,318 in 2026, surpassing all of 2025's 2,289 cases and marking the highest annual count since 1991, with South Carolina's 997-case outbreak the largest in 35 years.", "detail": "Kindergarten vaccination rates fell to 92.5% in the 2024-2025 school year, well below the 95% threshold needed to prevent outbreaks. Texas chief epidemiologist Dr. Varun Shetty said official counts are \"almost always an underestimate of what actually occurred.\" Major active outbreaks are also ongoing in Utah and Arizona, and health officials say a formal review of the country's measles elimination status — held since 2000 — could come as soon as November 2026.", "terms": [{"match": "measles elimination status", "id": "measles-status"}]}, "it": {"title": "I casi di morbillo negli USA salgono a 2.318, massimo in 35 anni, per il secondo anno record di fila", "summary": "I casi di morbillo negli USA sono saliti a 2.318 nel 2026, superando l'intero totale del 2025 di 2.289 casi e segnando il conteggio annuale più alto dal 1991, con il focolaio del South Carolina (997 casi) il più grande in 35 anni.", "detail": "La copertura vaccinale tra i bambini in età prescolare è scesa al 92,5% nell'anno scolastico 2024-2025, ben al di sotto della soglia del 95% necessaria per prevenire i focolai. L'epidemiologo capo del Texas Varun Shetty ha detto che i conteggi ufficiali sono \"quasi sempre una sottostima di quanto accaduto realmente\". Focolai attivi importanti proseguono anche in Utah e Arizona, e i funzionari sanitari dicono che una revisione formale dello status di eliminazione del morbillo del paese — in vigore dal 2000 — potrebbe arrivare già a novembre 2026.", "terms": [{"match": "status di eliminazione del morbillo", "id": "measles-status"}]}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/24/us-records-2318-measles-cases-thus-far
