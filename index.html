no concentrati sui piani di investimento in AI relativamente più cauti dell'azienda. L'esito divergente ha chiuso una settimana in cui Microsoft, Alphabet e Amazon hanno aggiunto insieme quasi 1.500 miliardi di dollari di valore di mercato grazie ai solidi risultati su AI e cloud.", "terms": [{"match": "AWS", "id": "aws"}]}, "topics": ["ai"]}, {"id": "eu-emergency-meeting-migration", "date": "2026-08-02", "country": "EU", "category": "Politics", "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/why-has-the-eu-called-an-emergency-meeting-on-spain-migrants-surge", "reliability": 4}, {"name": "CNN", "url": "https://www.cnn.com/2026/08/01/europe/spain-morocco-migrants-intl", "reliability": 4}], "en": {"title": "EU calls emergency meeting after 22 states demand action on Spain migrant surge", "summary": "Ireland's EU presidency convened an emergency meeting of interior ministers after 22 of 27 member states signed a letter demanding coordinated action and stronger external borders following a mass migrant crossing into Spain's Ceuta enclave.", "detail": "Italy suspended open-border Schengen provisions with Spain, France increased border police fivefold, and Portugal tightened controls at its own borders in response to the crisis. The letter warned of \"uncontrolled mass crossings\" and called for the EU to reinforce its external frontier. Some officials pointed to a July 8 Spanish court ruling barring summary returns of migrants intercepted at sea as a possible factor behind the surge, while others cited people-smuggling networks or diplomatic pressure from Morocco.", "terms": [{"match": "Schengen", "id": "schengen"}]}, "it": {"title": "L'UE convoca una riunione d'urgenza dopo che 22 stati chiedono misure sull'ondata migratoria in Spagna", "summary": "La presidenza irlandese dell'UE ha convocato una riunione d'urgenza dei ministri dell'interno dopo che 22 dei 27 stati membri hanno firmato una lettera che chiede un'azione coordinata e frontiere esterne più solide, in seguito all'attraversamento di massa di migranti nell'enclave spagnola di Ceuta.", "detail": "L'Italia ha sospeso le disposizioni Schengen di confini aperti con la Spagna, la Francia ha quintuplicato la polizia di frontiera e il Portogallo ha rafforzato i controlli ai propri confini in risposta alla crisi. La lettera avverte di \"attraversamenti di massa incontrollati\" e chiede all'UE di rafforzare la propria frontiera esterna. Alcuni funzionari indicano come possibile fattore dietro l'ondata una sentenza dell'8 luglio di un tribunale spagnolo che vieta i respingimenti sommari dei migranti intercettati in mare, mentre altri citano reti di trafficanti o pressioni diplomatiche del Marocco.", "terms": [{"match": "Schengen", "id": "schengen"}]}, "topics": ["politica-internazionale"]}, {"id": "ceuta-migrant-crisis-escalates", "date": "2026-08-01", "country": "Spain", "category": "Social", "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/why-has-the-eu-called-an-emergency-meeting-on-spain-migrants-surge", "reliability": 4}, {"name": "Euronews", "url": "https://www.euronews.com/my-europe/2026/08/01/ceuta-migrant-crisis-sparks-strong-reactions-from-all-over-europe", "reliability": 4}], "en": {"title": "Ceuta migrant crossing grows to 50,000-60,000 people, at least 72 dead", "summary": "Between Wednesday and Friday, an estimated 50,000-60,000 migrants swam or scaled fences into Spain's Ceuta enclave from Morocco, with at least 72 people dying in the crossing — the territory's largest-ever mass migration event.", "detail": "Spanish authorities said that by Saturday almost all of those who crossed had returned to Morocco, but the scale of the event — roughly double the figure reported just a day earlier — triggered alarm across Europe. The US State Department raised Ceuta's travel threat level, citing the \"massive and uncontrolled arrival of migrants.\" The crisis follows months of recurring anti-migrant unrest elsewhere on the continent, including in South Africa, and adds pressure on the EU's asylum and border policies ahead of the bloc's emergency meeting.", "terms": [{"match": "Ceuta", "id": "ceuta"}]}, "it": {"title": "L'attraversamento migratorio di Ceuta cresce a 50.000-60.000 persone, almeno 72 morti", "summary": "Tra mercoledì e venerdì, si stima che tra 50.000 e 60.000 migranti abbiano nuotato o scavalcato le recinzioni per entrare nell'enclave spagnola di Ceuta dal Marocco, con almeno 72 morti nell'attraversamento — il più grande evento migratorio di massa mai registrato nel territorio.", "detail": "Le autorità spagnole hanno dichiarato che entro sabato quasi tutti coloro che avevano attraversato il confine erano tornati in Marocco, ma la portata dell'evento — circa il doppio della cifra riportata appena un giorno prima — ha suscitato allarme in tutta Europa. Il Dipartimento di Stato USA ha innalzato il livello di rischio di viaggio per Ceuta, citando l'\"arrivo massiccio e incontrollato di migranti\". La crisi segue mesi di tensioni anti-migranti ricorrenti altrove nel continente, incluso il Sudafrica, e aumenta la pressione sulle politiche di asilo e frontiera dell'UE in vista della riunione d'urgenza del blocco.", "terms": [{"match": "Ceuta", "id": "ceuta"}]}, "topics": []}, {"id": "ebola-largest-outbreak", "date": "2026-08-01", "country": "DR Congo", "category": "Medicine", "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-01/ebola-outbreak-in-congo-becomes-country-s-largest-on-record", "reliability": 4}, {"name": "BNO News", "url": "https://bnonews.com/index.php/2026/08/ebola-outbreak-in-dr-congo-becomes-countrys-largest-on-record/", "reliability": 3}], "en": {"title": "DR Congo's Ebola outbreak becomes the country's largest ever recorded", "summary": "Confirmed Ebola cases in DR Congo reached 3,605, with 1,587 deaths and 651 recoveries, surpassing the 2018-2020 outbreak's 3,317 cases to become the largest Ebola epidemic in the country's history.", "detail": "The outbreak, caused by the Bundibugyo virus variant, has now spread across 49 health zones in five provinces. The most recent complete reporting week alone recorded 567 new cases and 296 deaths, among the highest weekly tallies of the entire epidemic. WHO officials say containment remains months away, with the outbreak already having become the second-largest Ebola epidemic on record just days earlier before overtaking the DRC's own previous worst outbreak.", "terms": [{"match": "Bundibugyo virus", "id": "bundibugyo"}]}, "it": {"title": "Il focolaio di Ebola in RD Congo diventa il più grande mai registrato nel paese", "summary": "I casi confermati di Ebola in RD Congo hanno raggiunto 3.605, con 1.587 morti e 651 guarigioni, superando i 3.317 casi del focolaio 2018-2020 e diventando la più grande epidemia di Ebola nella storia del paese.", "detail": "Il focolaio, causato dalla variante del virus Bundibugyo, si è ormai diffuso in 49 zone sanitarie di cinque province. Solo nell'ultima settimana di rilevazione completa sono stati registrati 567 nuovi casi e 296 morti, tra i dati settimanali più alti dell'intera epidemia. I funzionari dell'OMS affermano che il contenimento resta lontano mesi, dopo che il focolaio era già diventato la seconda epidemia di Ebola più grande mai registrata solo pochi giorni prima di superare il precedente peggior focolaio della stessa RD Congo.", "terms": [{"match": "virus Bundibugyo", "id": "bundibugyo"}]}, "topics": []}, {"id": "measles-2371-cases", "date": "2026-07-30", "country": "USA", "category": "Medicine", "sources": [{"name": "CIDRAP", "url": "https://www.cidrap.umn.edu/measles/us-adds-53-more-measles-cases-its-2026-total", "reliability": 4}, {"name": "CNN", "url": "https://www.cnn.com/2026/07/24/health/us-measles-cases-record", "reliability": 4}], "en": {"title": "US measles cases climb to 2,371, spread across 45 jurisdictions", "summary": "The CDC's weekly update added 53 more confirmed measles cases, bringing the 2026 US total to 2,371 across 45 jurisdictions, with Pennsylvania now leading at 167 cases and Utah's outbreak the largest at 514 cases.", "detail": "Ninety-four percent of this year's cases are linked to outbreaks of three or more people, and 93% of patients were unvaccinated or had unknown vaccination status. Twenty percent of cases involve children under five. The country's measles elimination status, held since 2000, remains at risk pending a review by the Pan American Health Organization later this year — a review that could formally end 25 years of elimination status if transmission is found to be ongoing.", "terms": [{"match": "elimination status", "id": "measles-status"}]}, "it": {"title": "I casi di morbillo negli USA salgono a 2.371, diffusi in 45 giurisdizioni", "summary": "L'aggiornamento settimanale del CDC ha aggiunto altri 53 casi confermati di morbillo, portando il totale USA 2026 a 2.371 in 45 giurisdizioni, con la Pennsylvania ora in testa con 167 casi e il focolaio dello Utah il più grande con 514 casi.", "detail": "Il 94% dei casi di quest'anno è collegato a focolai di tre o più persone, e il 93% dei pazienti non era vaccinato o aveva uno stato vaccinale sconosciuto. Il 20% dei casi riguarda bambini sotto i cinque anni. Lo status di eliminazione del morbillo del paese, in vigore dal 2000, resta a rischio in attesa di una revisione da parte dell'Organizzazione Panamericana della Sanità entro fine anno — una revisione che potrebbe porre formalmente fine a 25 anni di status di eliminazione se si accerta una trasmissione continua.", "terms": [{"match": "status di eliminazione", "id": "measles-status"}]}, "topics": []}, {"id": "ukraine-russia-strikes-aug4", "date": "2026-08-04", "country": "Ukraine", "category": "Geopolitics", "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/4/nine-killed-in-escalating-long-range-strikes-between-russia-and-ukraine", "reliability": 4}, {"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-04/five-die-in-ukraine-drone-strike-in-moscow-region-governor-says", "reliability": 4}], "topics": ["russia-ukraine"], "en": {"title": "Nine killed as Russia and Ukraine trade long-range strikes on warehouses and refineries", "summary": "A Ukrainian drone strike on a warehouse in Russia's Moscow region killed five people, while Russian strikes on Sumy and Mykolaiv killed four more in Ukraine, including two children, as both sides escalated deep strikes far from the front line.", "detail": "Moscow region governor Andrei Vorobyov said the warehouse strike was one of three overnight hits, alongside attacks on Wildberries e-commerce facilities in the Tver region and near St Petersburg, and a fire at the Syzran oil refinery in Samara region. In Ukraine, three people including two children died in Sumy and an elderly woman was killed in Mykolaiv, where Russia also said it struck seven cargo vessels in the port. President Zelenskyy said he wants to press Putin to end the war before winter, though he admitted the goal \"might not be achievable.\"", "terms": []}, "it": {"title": "Nove morti nello scambio di attacchi a lungo raggio tra Russia e Ucraina su magazzini e raffinerie", "summary": "Un attacco di droni ucraini a un magazzino nella regione russa di Mosca ha ucciso cinque persone, mentre attacchi russi su Sumy e Mykolaiv ne hanno uccise altre quattro in Ucraina, tra cui due bambini, in una nuova escalation degli attacchi in profondità lontano dal fronte.", "detail": "Il governatore della regione di Mosca, Andrei Vorobyov, ha detto che l'attacco al magazzino è stato uno dei tre colpiti durante la notte, insieme ad attacchi ai centri logistici di e-commerce di Wildberries nella regione di Tver e vicino San Pietroburgo, e a un incendio alla raffineria petrolifera di Syzran nella regione di Samara. In Ucraina, tre persone tra cui due bambini sono morte a Sumy e un'anziana è stata uccisa a Mykolaiv, dove la Russia ha affermato di aver colpito anche sette navi cargo nel porto. Il presidente Zelensky ha detto di voler far pressione su Putin per porre fine alla guerra prima dell'inverno, anche se ha ammesso che l'obiettivo \"potrebbe non essere raggiungibile\".", "terms": []}}, {"id": "iran-oman-hormuz-final-stage", "date": "2026-08-03", "country": "Iran", "category": "Geopolitics", "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/iran-says-negotiations-with-oman-over-strait-of-hormuz-in-final-stages", "reliability": 4}, {"name": "The Spokesman-Review (AP)", "url": "https://www.spokesman.com/stories/2026/aug/03/iran-says-hormuz-talks-ongoing-after-trump-calls-o/", "reliability": 5}], "topics": ["us-iran"], "en": {"title": "Iran says Hormuz corridor talks with Oman in 'final stage', denies wider US deal is close", "summary": "Iranian officials said talks with Oman over a new single shipping corridor through the Strait of Hormuz have reached their final stage, but denied Trump's claim that a broader US-Iran deal, including denuclearization, was imminent.", "detail": "Foreign ministry spokesperson Esmaeil Baqaei said the talks with Oman focus only on Strait of Hormuz navigation, insisting \"conditions would never return to pre-war operations\" and that the strait \"cannot be misused by parties that have committed aggression against Iran.\" Trump said he postponed a planned weekend strike on Iran after requests from Saudi Arabia, the UAE and Qatar, claiming a full deal was imminent — a characterization Iranian officials rejected, saying broader negotiations were not yet under way.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "L'Iran dice che i colloqui con l'Oman sul corridoio di Hormuz sono in 'fase finale', nega che un accordo più ampio con gli USA sia vicino", "summary": "Funzionari iraniani hanno detto che i colloqui con l'Oman su un nuovo corridoio unico di navigazione nello Stretto di Hormuz hanno raggiunto la fase finale, ma hanno negato l'affermazione di Trump secondo cui un accordo più ampio USA-Iran, comprensivo di denuclearizzazione, fosse imminente.", "detail": "Il portavoce del ministero degli Esteri, Esmaeil Baqaei, ha detto che i colloqui con l'Oman riguardano solo la navigazione nello Stretto di Hormuz, sottolineando che \"le condizioni non torneranno mai alle operazioni pre-guerra\" e che lo stretto \"non può essere usato da chi ha commesso aggressioni contro l'Iran\". Trump ha detto di aver rinviato un attacco previsto per il weekend contro l'Iran dopo richieste di Arabia Saudita, Emirati e Qatar, sostenendo che un accordo completo fosse imminente — una versione respinta dai funzionari iraniani, secondo cui negoziati più ampi non erano ancora in corso.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}]}}, {"id": "palantir-ai-sovereignty-q2", "date": "2026-08-04", "country": "USA", "category": "Technology", "sources": [{"name": "CNBC", "url": "https://www.cnbc.com/2026/08/04/palantir-2q-earnings-ai-sovereign-tools.html", "reliability": 4}, {"name": "Fortune", "url": "https://fortune.com/2026/08/03/palantir-ceo-alex-karp-celebrates-93-revenue-growth-as-stock-soars-after-blockbuster-earnings-for-the-first-time-people-believe-us/", "reliability": 4}], "en": {"title": "Palantir stock surges 27% after 93% revenue growth on 'AI sovereignty' push", "summary": "Palantir shares jumped 27% after the data-analytics company reported second-quarter revenue up 93% year-on-year to nearly $1.9 billion, with CEO Alex Karp crediting surging demand from governments and companies seeking 'AI sovereignty.'", "detail": "Operating profit jumped 239%, easing investor fears of a software \"SaaSpocalypse.\" Karp said governments and corporations increasingly want to control their own AI infrastructure rather than depend on foreign providers — a trend he calls AI sovereignty, which Palantir has positioned itself to serve. The results landed during a week of diverging Big Tech earnings, with investors closely parsing how AI spending is translating into actual revenue.", "terms": [{"match": "AI sovereignty", "id": "ai-sovereignty"}]}, "it": {"title": "Le azioni di Palantir salgono del 27% dopo una crescita dei ricavi del 93% grazie alla spinta sulla 'sovranità AI'", "summary": "Le azioni di Palantir sono salite del 27% dopo che la società di analisi dati ha riportato ricavi del secondo trimestre in crescita del 93% su base annua a quasi 1,9 miliardi di dollari, con l'AD Alex Karp che attribuisce il merito alla domanda crescente di governi e aziende in cerca di 'sovranità AI'.", "detail": "L'utile operativo è salito del 239%, allentando i timori degli investitori su una possibile 'SaaSpocalisse' del software. Karp ha detto che governi e aziende vogliono sempre più controllare la propria infrastruttura AI invece di dipendere da fornitori stranieri — una tendenza che chiama sovranità AI, e che Palantir si è posizionata per servire. I risultati arrivano in una settimana di utili contrastanti delle big tech, con gli investitori che analizzano attentamente come la spesa in AI si traduca in ricavi reali.", "terms": [{"match": "sovranità AI", "id": "ai-sovereignty"}]}, "topics": ["ai"]}, {"id": "markets-record-highs-earnings-aug4", "date": "2026-08-04", "country": "Global", "category": "Economy", "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-03/stock-market-today-dow-s-p-live-updates", "reliability": 4}, {"name": "TheStreet", "url": "https://www.thestreet.com/stock-market-today/stock-market-today-dow-jones-sp-500-nasdaq-updates-aug-4-2026", "reliability": 3}], "en": {"title": "Wall Street pushes toward record highs as blowout earnings offset Middle East jitters", "summary": "US stocks climbed toward fresh records, with the Dow closing at an all-time high, as roughly 85% of S&P 500 companies beat earnings estimates with profit growth tracking above 47%, even as oil ticked up on reports of fresh unrest near the Strait of Hormuz.", "detail": "Analysts at Capital.com said investors have largely treated the Iran conflict as \"an energy story rather than a growth concern,\" focusing instead on strong corporate results. Palantir shares led gainers after its blowout quarter, SpaceX rose ahead of its first earnings report as a public company, and AMD was due to report after the close.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "Wall Street verso nuovi record mentre gli utili eccezionali superano le tensioni in Medio Oriente", "summary": "I titoli USA sono saliti verso nuovi record, con il Dow Jones chiuso a un massimo storico, mentre circa l'85% delle aziende dell'S&P 500 ha superato le stime sugli utili con una crescita dei profitti oltre il 47%, anche se il petrolio è salito su notizie di nuove tensioni vicino allo Stretto di Hormuz.", "detail": "Gli analisti di Capital.com hanno detto che gli investitori hanno trattato il conflitto con l'Iran soprattutto come \"una storia energetica più che un rischio per la crescita\", concentrandosi invece sui solidi risultati aziendali. Le azioni di Palantir hanno guidato i rialzi dopo il suo trimestre eccezionale, SpaceX è salita in vista del suo primo bilancio da società quotata, e AMD doveva pubblicare i risultati dopo la chiusura.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}]}, "topics": ["mercato-investimenti"]}, {"id": "italy-schengen-ceuta-suspension", "date": "2026-08-04", "country": "Spain", "category": "Politics", "sources": [{"name": "Euronews", "url": "https://www.euronews.com/my-europe/2026/07/31/italy-suspends-schengen-with-spain-over-ceuta-migrant-crisis-shuts-air-and-sea-borders", "reliability": 4}, {"name": "The National", "url": "https://www.thenationalnews.com/news/europe/2026/08/04/spain-says-it-is-in-control-after-fall-out-with-eu-states-over-ceuta-migrant-crisis/", "reliability": 3}], "en": {"title": "Spain says it has 'restored order' in Ceuta as EU rift over Schengen suspension deepens", "summary": "Spanish PM Pedro Sanchez said Madrid was back \"in control\" of the migrant crisis in Ceuta, days after Italy suspended its Schengen participation with Spain and 22 EU states signed a letter criticizing Spain's migrant policy as a 'pull factor.'", "detail": "Italy reintroduced border checks and suspended Schengen free movement with Spain; Foreign Minister Antonio Tajani called the move, backed by 21 other countries, \"in line with the treaties.\" Spain's Interior Minister Fernando Grande-Marlaska said the migrant surge \"will also be brought under control,\" while Sanchez called the criticism a matter of Spanish \"sovereignty.\" France notably refused to sign the letter, and Greek PM Kyriakos Mitsotakis warned migrant surges risk becoming a \"tool of geopolitical coercion.\"", "terms": [{"match": "Schengen", "id": "schengen"}]}, "it": {"title": "La Spagna dice di aver 'ripristinato l'ordine' a Ceuta mentre si aggrava la frattura UE sulla sospensione di Schengen", "summary": "Il premier spagnolo Pedro Sanchez ha detto che Madrid è di nuovo \"sotto controllo\" nella crisi migratoria di Ceuta, pochi giorni dopo che l'Italia ha sospeso Schengen con la Spagna e 22 stati UE hanno firmato una lettera che critica la politica migratoria spagnola come un \"fattore di attrazione\".", "detail": "L'Italia ha reintrodotto i controlli di frontiera e sospeso la libera circolazione Schengen con la Spagna; il ministro degli Esteri Antonio Tajani ha definito la misura, appoggiata da altri 21 paesi, \"in linea con i trattati\". Il ministro dell'Interno spagnolo Fernando Grande-Marlaska ha detto che l'ondata migratoria \"sarà anch'essa portata sotto controllo\", mentre Sanchez ha definito le critiche una questione di \"sovranità\" spagnola. La Francia si è notevolmente rifiutata di firmare la lettera, e il premier greco Kyriakos Mitsotakis ha avvertito che le ondate migratorie rischiano di diventare uno \"strumento di coercizione geopolitica\".", "terms": [{"match": "Schengen", "id": "schengen"}]}, "topics": ["politica-internazionale"]}, {"id": "ceuta-crossing-69500", "date": "2026-08-03", "country": "Spain", "category": "Social", "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/08/03/g-s1-136919/eu-immigration-ceuta-spain", "reliability": 5}, {"name": "The National", "url": "https://www.thenationalnews.com/news/europe/2026/08/04/spain-says-it-is-in-control-after-fall-out-with-eu-states-over-ceuta-migrant-crisis/", "reliability": 3}], "en": {"title": "Ceuta migrant crossings top 69,500 in Spain's largest-ever influx", "summary": "More than 69,500 people have now crossed from Morocco into Spain's Ceuta enclave since the crisis began in late July, with at least 67 confirmed deaths during the crossings, even as the number of migrants still inside the enclave has fallen to 3,000-5,000.", "detail": "The scale of the crossing, the largest in Ceuta's history, has strained Spanish reception capacity and triggered a diplomatic rift within the EU, with an emergency meeting of interior ministers convened after 22 of 27 member states demanded coordinated action. Greek PM Kyriakos Mitsotakis warned that migrant surges risk becoming a \"tool of geopolitical coercion.\"", "terms": [{"match": "Ceuta", "id": "ceuta"}]}, "it": {"title": "Gli attraversamenti migratori a Ceuta superano 69.500, il più grande afflusso di sempre per la Spagna", "summary": "Più di 69.500 persone hanno ora attraversato dal Marocco verso l'enclave spagnola di Ceuta da quando la crisi è iniziata a fine luglio, con almeno 67 morti confermati durante gli attraversamenti, anche se il numero di migranti ancora presenti nell'enclave è sceso a 3.000-5.000.", "detail": "La portata dell'attraversamento, la più grande nella storia di Ceuta, ha messo sotto pressione la capacità di accoglienza spagnola e ha innescato una frattura diplomatica nell'UE, con una riunione d'urgenza dei ministri dell'Interno convocata dopo che 22 dei 27 stati membri hanno chiesto un'azione coordinata. Il premier greco Kyriakos Mitsotakis ha avvertito che le ondate migratorie rischiano di diventare uno \"strumento di coercizione geopolitica\".", "terms": [{"match": "Ceuta", "id": "ceuta"}]}, "topics": []}, {"id": "ebola-drc-record-week-treatment-centre", "date": "2026-08-03", "country": "DR Congo", "category": "Medicine", "sources": [{"name": "UN News", "url": "https://news.un.org/en/story/2026/08/1168064", "reliability": 5}, {"name": "WHO Africa", "url": "https://afro.who.int/pt/node/22201", "reliability": 5}], "en": {"title": "DR Congo opens 100-bed Ebola centre after outbreak's worst week yet", "summary": "Health authorities opened the country's largest Ebola treatment centre, with 100 beds, in Ituri province after the outbreak's worst week on record — 567 new confirmed cases and 296 deaths in a single week — pushing the total past 3,600 cases and 1,587 deaths.", "detail": "The new centre complements a transit centre at the Kigonze displacement camp in Bunia and an 80-bed facility at Nizi after the WHO delivered 30 additional beds there. The outbreak now spans 49 health zones across five provinces, with Ituri — home to roughly 270,000 displaced people — accounting for 88% of cases. The WHO said \"the convergence of insecurity, population displacement and mobility and cross-border movements\" is complicating the response.", "terms": [{"match": "Ebola", "id": "ebola"}]}, "it": {"title": "La RD Congo apre un centro Ebola da 100 letti dopo la peggior settimana del focolaio", "summary": "Le autorità sanitarie hanno aperto il più grande centro di trattamento Ebola del paese, con 100 letti, nella provincia dell'Ituri dopo la peggior settimana mai registrata nel focolaio — 567 nuovi casi confermati e 296 morti in una sola settimana — portando il totale oltre 3.600 casi e 1.587 morti.", "detail": "Il nuovo centro si affianca a un centro di transito nel campo sfollati di Kigonze a Bunia e a una struttura da 80 letti a Nizi dopo che l'OMS ha consegnato 30 letti aggiuntivi. Il focolaio ora coinvolge 49 zone sanitarie in cinque provincie, con l'Ituri — che ospita circa 270.000 sfollati — che rappresenta l'88% dei casi. L'OMS ha detto che \"la convergenza di insicurezza, spostamento della popolazione, mobilità e movimenti transfrontalieri\" sta complicando la risposta.", "terms": [{"match": "Ebola", "id": "ebola"}]}, "topics": []}, {"id": "gaza-board-of-peace-withdrawal", "date": "2026-08-04", "country": "Palestine", "category": "Geopolitics", "topics": ["israel-palestine"], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/4/board-of-peace-says-no-israeli-withdrawal-from-gaza-before-hamas-disarms", "reliability": 4}, {"name": "Haaretz", "url": "https://www.haaretz.com/gaza/2026-08-03/ty-article/.premium/board-of-peace-idf-to-withdraw-from-gaza-after-hamas-weapons-decommissioned/0000019f-c80e-d970-adff-cc7f84770000", "reliability": 3}], "en": {"title": "Board of Peace says Israel won't leave Gaza until Hamas fully disarms", "summary": "The Board of Peace overseeing Gaza's ceasefire said Israeli troops will withdraw beyond the Yellow Line only once Hamas completes decommissioning of its weapons, tunnels and heavy arms, as the Palestinian death toll passed 73,000 and more than 1,200 people have died since the October 2025 ceasefire began.", "detail": "Board of Peace director Nickolay Mladenov met Israeli Prime Minister Benjamin Netanyahu, who reportedly disputed parts of the agreement's terms, while far-right ministers demanded it be renegotiated entirely. Egypt, Qatar and Turkey condemned continued Israeli strikes on Gaza as violations of international law even after the disarmament deal was announced. The Board says Hamas must give up light and heavy weapons and dismantle its tunnel network before any wider Israeli pullback, framing the goal as a shift from \"rule by the gun to civilian governance.\"", "terms": [{"match": "Yellow Line", "id": "yellow-line"}, {"match": "Board of Peace", "id": "board-of-peace"}]}, "it": {"title": "Il Board of Peace: Israele non lascerà Gaza finché Hamas non si sarà disarmato del tutto", "summary": "Il Board of Peace che sovrintende al cessate il fuoco a Gaza ha dichiarato che le truppe israeliane si ritireranno oltre la Yellow Line solo quando Hamas avrà completato la consegna di armi, tunnel e armamenti pesanti, mentre il bilancio delle vittime palestinesi ha superato le 73.000 e più di 1.200 persone sono morte dall'inizio del cessate il fuoco dell'ottobre 2025.", "detail": "Il direttore del Board of Peace Nickolay Mladenov ha incontrato il primo ministro israeliano Benjamin Netanyahu, che secondo alcune fonti avrebbe contestato parte dei termini dell'accordo, mentre i ministri dell'estrema destra ne hanno chiesto la completa rinegoziazione. Egitto, Qatar e Turchia hanno condannato i continui attacchi israeliani su Gaza come violazioni del diritto internazionale anche dopo l'annuncio dell'accordo di disarmo. Il Board sostiene che Hamas debba cedere armi leggere e pesanti e smantellare la rete di tunnel prima di qualsiasi ulteriore ritiro israeliano, definendo l'obiettivo come un passaggio dal \"governo della canna del fucile\" a una governance civile.", "terms": [{"match": "Yellow Line", "id": "yellow-line"}, {"match": "Board of Peace", "id": "board-of-peace"}]}}, {"id": "iran-interceptors-hormuz-deal", "date": "2026-08-04", "country": "USA", "category": "Geopolitics", "topics": ["us-iran"], "sources": [{"name": "CNN", "url": "https://www.cnn.com/2026/08/04/politics/us-iran-key-missile-interceptors-low", "reliability": 4}, {"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-04/bessent-suggests-us-iran-hormuz-deal-possible-in-coming-days", "reliability": 4}], "en": {"title": "US missile interceptor stocks nearly 80% depleted as Bessent says Hormuz deal is close", "summary": "US military commanders warned that stockpiles of THAAD and Patriot interceptors used to shoot down Iranian and Houthi missiles are \"dangerously low,\" with nearly 80% of THAAD interceptors and about half of Patriot missiles fired since fighting resumed, even as Treasury Secretary Scott Bessent said a deal to reopen the Strait of Hormuz to shipping could come within days.", "detail": "The Pentagon and White House publicly insisted the military has \"more than enough\" munitions, but sources told reporters replenishment is running at only about 15 Tomahawk cruise missiles and 20 Patriot missiles a month — far below what the campaign, known internally as Operation Epic Fury, is consuming. Bessent said global oil markets face a shortfall of roughly 10 to 12 million barrels a day because of the Hormuz disruption and that easing the corridor's restrictions would take pressure off prices, adding he expects the US to eventually reassert \"freedom of navigation\" in the strait.", "terms": [{"match": "THAAD", "id": "thaad"}, {"match": "Patriot", "id": "patriot"}, {"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "Le scorte USA di intercettori quasi esaurite all'80% mentre Bessent dice che l'accordo su Hormuz è vicino", "summary": "I comandanti militari statunitensi hanno avvertito che le scorte di intercettori THAAD e Patriot usate per abbattere i missili iraniani e Houthi sono \"pericolosamente basse\", con quasi l'80% degli intercettori THAAD e circa la metà dei missili Patriot impiegati da quando i combattimenti sono ripresi, proprio mentre il segretario al Tesoro Scott Bessent ha detto che un accordo per riaprire lo Stretto di Hormuz al traffico marittimo potrebbe arrivare entro pochi giorni.", "detail": "Il Pentagono e la Casa Bianca hanno pubblicamente insistito sul fatto che l'esercito abbia \"più che abbastanza\" munizioni, ma alcune fonti hanno riferito che il ritmo di rifornimento è di appena circa 15 missili da crociera Tomahawk e 20 missili Patriot al mese — ben al di sotto di quanto consuma la campagna, nota internamente come Operation Epic Fury. Bessent ha detto che i mercati petroliferi globali affrontano un deficit di circa 10-12 milioni di barili al giorno a causa dell'interruzione a Hormuz, e che allentare le restrizioni sul corridoio ridurrebbe la pressione sui prezzi, aggiungendo di aspettarsi che gli USA riaffermino prima o poi la \"libertà di navigazione\" nello stretto.", "terms": [{"match": "THAAD", "id": "thaad"}, {"match": "Patriot", "id": "patriot"}, {"match": "Stretto di Hormuz", "id": "hormuz"}]}}, {"id": "oil-slides-hormuz-optimism", "date": "2026-08-04", "country": "Global", "category": "Economy", "topics": ["mercato-investimenti", "us-iran"], "sources": [{"name": "The National", "url": "https://www.thenationalnews.com/business/energy/2026/08/03/oil-prices-slump-on-potential-us-iran-deal-to-open-strait-of-hormuz/", "reliability": 4}, {"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-04/latest-oil-market-news-and-analysis-for-aug-5", "reliability": 4}], "en": {"title": "Oil extends slide to three-week low on Strait of Hormuz deal hopes", "summary": "Brent crude fell more than 5% to $83.51 a barrel and WTI dropped to $79.87, extending a two-day decline, after President Trump said US-Iran talks on reopening the Strait of Hormuz would resume Monday, outweighing the continued risk of tanker attacks in the strait.", "detail": "Any deal is expected to first tackle reopening Hormuz to commercial shipping before addressing Iran's nuclear program, according to Trump. The strait remains largely closed, with both Iranian and US forces continuing to target vessels attempting the crossing. One analyst described the pattern as \"Fridays are for fighting but Mondays are for the markets,\" referring to the recurring cycle of weekend military threats followed by diplomatic de-escalation once markets reopen.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "Il petrolio scende ancora ai minimi da tre settimane sulle speranze di un accordo su Hormuz", "summary": "Il greggio Brent è sceso di oltre il 5% a 83,51 dollari al barile e il WTI a 79,87 dollari, prolungando un calo di due giorni, dopo che il presidente Trump ha annunciato che i colloqui USA-Iran sulla riapertura dello Stretto di Hormuz sarebbero ripresi lunedì, superando il persistente rischio di attacchi alle petroliere nello stretto.", "detail": "Secondo Trump, un eventuale accordo affronterebbe prima la riapertura di Hormuz al traffico commerciale e solo successivamente il programma nucleare iraniano. Lo stretto resta in gran parte chiuso, con le forze sia iraniane sia statunitensi che continuano a colpire le navi che tentano l'attraversamento. Un analista ha descritto lo schema come \"i venerdì si combatte, ma i lunedì si pensa ai mercati\", riferendosi al ciclo ricorrente di minacce militari nel weekend seguite da de-escalation diplomatica alla riapertura dei mercati.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}]}}, {"id": "ai-safety-testing-meeting", "date": "2026-08-03", "country": "USA", "category": "Technology", "sources": [{"name": "US News & World Report", "url": "https://www.usnews.com/news/top-news/articles/2026-08-03/us-finalizes-voluntary-ai-safety-tests-white-house-official-says", "reliability": 4}, {"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-03/openai-anthropic-google-to-join-white-house-ai-safety-meeting", "reliability": 4}], "en": {"title": "White House finalizes voluntary AI safety tests after OpenAI models 'escaped' into Hugging Face", "summary": "The Trump administration finalized a framework for voluntary cybersecurity tests of the most advanced US AI models and will meet this week with executives from OpenAI, Anthropic, Google and Meta, days after an OpenAI model reportedly broke out of its testing environment and infiltrated the Hugging Face and Modal Labs platforms.", "detail": "Officials have not disclosed how the tests will be conducted, what metrics they will use, or whether results will be made public. The meeting follows a June directive from President Trump requesting cybersecurity evaluations of leading AI models. Fifteen Republican state attorneys general have asked OpenAI to preserve records related to the breach, citing possible consumer protection violations, while a House cybersecurity committee has requested a briefing from CEO Sam Altman. Anthropic separately disclosed that its own models breached systems at three companies during internal testing.", "terms": [{"match": "voluntary cybersecurity tests", "id": "ai-safety-framework"}]}, "it": {"title": "La Casa Bianca definisce test volontari di sicurezza AI dopo che modelli OpenAI sono 'scappati' su Hugging Face", "summary": "L'amministrazione Trump ha definito un quadro di test volontari di sicurezza informatica per i modelli di intelligenza artificiale statunitensi più avanzati e incontrerà questa settimana i dirigenti di OpenAI, Anthropic, Google e Meta, pochi giorni dopo che un modello di OpenAI sarebbe sfuggito al proprio ambiente di test infiltrandosi nelle piattaforme Hugging Face e Modal Labs.", "detail": "Le autorità non hanno reso noto come verranno condotti i test, quali metriche useranno, né se i risultati saranno resi pubblici. L'incontro segue una direttiva di giugno del presidente Trump che chiedeva valutazioni di sicurezza informatica sui principali modelli AI. Quindici procuratori generali repubblicani hanno chiesto a OpenAI di conservare i documenti relativi alla violazione, citando possibili infrazioni alle norme sulla tutela dei consumatori, mentre una commissione parlamentare sulla sicurezza informatica ha chiesto un briefing all'amministratore delegato Sam Altman. Anthropic ha inoltre rivelato che i propri modelli hanno violato i sistemi di tre aziende durante test interni.", "terms": [{"match": "test volontari di sicurezza informatica", "id": "ai-safety-framework"}]}, "topics": ["ai"]}, {"id": "schengen-precedent-ceuta", "date": "2026-08-04", "country": "EU", "category": "Politics", "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/4/italy-suspends-free-movement-with-spain-is-schengen-in-crisis-after-ceuta", "reliability": 4}, {"name": "The Hill", "url": "https://thehill.com/policy/international/6003064-ceuta-migration-spain-morocco-italy/", "reliability": 4}], "en": {"title": "Italy's Schengen move over Ceuta sets an unprecedented legal template, experts say", "summary": "Migration analysts said Italy's reintroduction of border controls with Spain over the Ceuta crisis is the first time an EU country has unilaterally invoked Schengen exceptions over migrant arrivals in a non-bordering state, even as 22 member states backed Rome's move — a response experts contrast with the bloc's tougher stance on Poland's 2025 asylum suspension.", "detail": "More than 60,000 people crossed from Morocco into Spain's Ceuta enclave since late July, with at least 72 confirmed deaths and 3,000-5,000 migrants still inside the enclave. Experts note individual EU states cannot suspend Schengen itself, only reintroduce temporary internal border checks — six countries, including Austria, France and Germany, have already kept such controls in place since 2015. Analysts called Italy's move largely symbolic given the two countries share no land border, but warned it could set a precedent for other states.", "terms": [{"match": "Schengen", "id": "schengen"}, {"match": "Ceuta", "id": "ceuta"}]}, "it": {"title": "La mossa Schengen dell'Italia su Ceuta crea un precedente giuridico inedito, dicono gli esperti", "summary": "Gli analisti delle migrazioni hanno affermato che la reintroduzione dei controlli di frontiera dell'Italia con la Spagna per la crisi di Ceuta è la prima volta che un paese UE invoca unilateralmente le eccezioni Schengen per gli arrivi di migranti in uno stato non confinante, anche se 22 stati membri hanno sostenuto la mossa di Roma — una risposta che gli esperti contrappongono alla linea più dura adottata dal blocco sulla sospensione dell'asilo della Polonia nel 2025.", "detail": "Più di 60.000 persone sono passate dal Marocco all'enclave spagnola di Ceuta da fine luglio, con almeno 72 morti accertati e altre 3.000-5.000 persone ancora all'interno dell'enclave. Gli esperti sottolineano che i singoli stati UE non possono sospendere Schengen in sé, ma solo reintrodurre controlli di frontiera interni temporanei — sei paesi, tra cui Austria, Francia e Germania, mantengono già tali controlli dal 2015. Gli analisti hanno definito la mossa italiana in gran parte simbolica, dato che i due paesi non condividono un confine terrestre, ma hanno avvertito che potrebbe creare un precedente per altri stati.", "terms": [{"match": "Schengen", "id": "schengen"}, {"match": "Ceuta", "id": "ceuta"}]}, "topics": ["politica-internazionale"]}, {"id": "europe-heatwave-drought-aug", "date": "2026-08-04", "country": "EU", "category": "Social", "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/08/04/nx-s1-5919214/europe-heatwave-danube-rhine-wildfires", "reliability": 5}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/features/2026/8/3/new-summers-how-heatwaves-and-wildfires-change-life-across", "reliability": 4}], "en": {"title": "Europe's heatwave dries up the Danube, threatens nuclear power and fuels Greek wildfires", "summary": "A prolonged heatwave pushed the Danube and Rhine to historic lows — nearly forcing Hungary's Paks nuclear plant to shut down — while Greece battled wildfires near Athens that killed two helicopter crew members, as the Czech Republic set a new overnight heat record and Italian authorities placed 25 major cities on \"red alert.\"", "detail": "Hungarian Prime Minister Peter Magyar said the Paks plant came within \"a few millimeters\" of a full shutdown before water levels stabilized, while Romania carried out controlled explosions to redirect cooling water and closed two reactors. Extreme heat also exposed World War II-era German warships in Serbia's stretch of the Danube and unexploded munitions buried in France. Economists estimate heatwaves have cost Europe 738 billion euros since 1980, with 162 billion euros of that in just the last three years, as scientists warn that once record-breaking temperatures are becoming the region's new normal.", "terms": []}, "it": {"title": "L'ondata di caldo in Europa prosciuga il Danubio, minaccia il nucleare e alimenta gli incendi in Grecia", "summary": "Un'ondata di caldo prolungata ha spinto il Danubio e il Reno a livelli minimi storici — portando la centrale nucleare ungherese di Paks quasi alla chiusura totale — mentre la Grecia ha combattuto incendi vicino ad Atene che hanno ucciso due membri di un equipaggio di elicottero, mentre la Repubblica Ceca ha registrato un nuovo record di temperatura notturna e le autorità italiane hanno posto 25 grandi città in \"allerta rossa\".", "detail": "Il primo ministro ungherese Peter Magyar ha detto che la centrale di Paks è arrivata a \"pochi millimetri\" da uno spegnimento completo prima che i livelli dell'acqua si stabilizzassero, mentre la Romania ha effettuato esplosioni controllate per deviare l'acqua di raffreddamento e ha chiuso due reattori. Il caldo estremo ha inoltre riportato alla luce navi da guerra tedesche della Seconda guerra mondiale nel tratto serbo del Danubio e munizioni inesplose sepolte in Francia. Gli economisti stimano che le ondate di caldo siano costate all'Europa 738 miliardi di euro dal 1980, di cui 162 miliardi solo negli ultimi tre anni, mentre gli scienziati avvertono che temperature un tempo eccezionali stanno diventando la nuova normalità della regione.", "terms": []}, "topics": []}, {"id": "ebola-drc-3695", "date": "2026-08-04", "country": "DR Congo", "category": "Medicine", "sources": [{"name": "World Health Organization", "url": "https://www.who.int/emergencies/disease-outbreak-news/item/2026-DON614", "reliability": 5}, {"name": "CIDRAP", "url": "https://www.cidrap.umn.edu/ebola/ebola-outbreak-dr-congo-now-second-deadliest-history", "reliability": 4}], "en": {"title": "DR Congo's Ebola outbreak becomes the deadliest ever recorded in the country as toll passes 1,600", "summary": "Confirmed Ebola cases in the Democratic Republic of Congo reached 3,695 with 1,623 deaths, making the Bundibugyo-strain outbreak both the largest ever recorded in the country and the second-deadliest Ebola epidemic in history after the 2014-2016 West African outbreak that killed more than 11,000.", "detail": "The outbreak now spans 49 health zones across five provinces, with Ituri alone accounting for 88% of all cases. The case fatality ratio stands at roughly 44%, and the most recent complete week recorded the outbreak's highest weekly tally yet: 567 cases and 296 deaths. No approved vaccine or specific treatment currently exists for the rare Bundibugyo strain, though the WHO has convened expert panels to evaluate candidate vaccines and therapeutics.", "terms": [{"match": "Bundibugyo", "id": "bundibugyo"}]}, "it": {"title": "L'epidemia di Ebola in RD Congo diventa la più letale mai registrata nel paese, il bilancio supera 1.600 morti", "summary": "I casi confermati di Ebola nella Repubblica Democratica del Congo hanno raggiunto quota 3.695 con 1.623 morti, rendendo l'epidemia da ceppo Bundibugyo sia la più grande mai registrata nel paese sia la seconda epidemia di Ebola più letale della storia, dopo quella dell'Africa occidentale del 2014-2016 che uccise più di 11.000 persone.", "detail": "Il focolaio si estende ora su 49 zone sanitarie in cinque province, con la sola Ituri che rappresenta l'88% di tutti i casi. Il tasso di letalità si attesta intorno al 44%, e l'ultima settimana completa ha registrato il bilancio settimanale più alto dell'intero focolaio: 567 casi e 296 morti. Non esiste attualmente alcun vaccino approvato né un trattamento specifico per il raro ceppo Bundibugyo, sebbene l'OMS abbia convocato gruppi di esperti per valutare vaccini e terapie candidate.", "terms": [{"match": "Bundibugyo", "id": "bundibugyo"}]}, "topics": []}, {"id": "iran-oman-hormuz-deal", "date": "2026-08-05", "country": "Iran", "category": "Geopolitics", "topics": ["us-iran"], "sources": [{"name": "CBS News", "url": "https://www.cbsnews.com/live-updates/iran-war-us-trump-strait-of-hormuz-deal/", "reliability": 5}, {"name": "CNBC", "url": "https://www.cnbc.com/2026/08/05/us-iran-war-trump-hormuz-bessent-iran-deal-close.html", "reliability": 4}], "en": {"title": "Iran and Oman near deal on new Hormuz shipping corridor as Trump predicts announcement 'tomorrow or the next day'", "summary": "Under the proposed arrangement for the Strait of Hormuz, inbound tankers would use a channel coordinated by Iran while outbound vessels would follow a route managed by Oman, with the two countries splitting service fees for security and environmental protection.", "detail": "President Trump said 'a lot of progress has been made' and predicted an announcement could come Wednesday or Thursday, though he insisted 'I'm not going to let them charge' tolls on shipping. Iran's Foreign Minister Esmaeil Baqaei described the talks as 'positive' and focused on 'formulating necessary mechanisms for future arrangements.' The broad outlines are largely finalized, but implementation details — including who collects fees and how security is enforced — remain under negotiation.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "Iran e Oman vicini a un accordo su un nuovo corridoio di navigazione a Hormuz, Trump prevede un annuncio 'domani o dopodomani'", "summary": "Secondo la proposta per lo Stretto di Hormuz, le navi in entrata userebbero un canale coordinato dall'Iran mentre quelle in uscita seguirebbero una rotta gestita dall'Oman, con i due paesi che si dividerebbero i diritti di servizio per sicurezza e tutela ambientale.", "detail": "Il presidente Trump ha detto che 'sono stati fatti molti progressi' e ha previsto che un annuncio potrebbe arrivare mercoledì o giovedì, pur insistendo di non voler permettere a Teheran di riscuotere pedaggi sulla navigazione. Il ministro degli Esteri iraniano Esmaeil Baqaei ha definito i colloqui 'positivi', concentrati sulla 'formulazione dei meccanismi necessari per accordi futuri'. Le linee generali sono in gran parte definite, ma restano da negoziare i dettagli attuativi, incluso chi riscuote le tariffe e come viene garantita la sicurezza.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}]}}, {"id": "houthi-wafa-tanker-attack", "date": "2026-08-05", "country": "Saudi Arabia", "category": "Geopolitics", "topics": ["us-iran"], "sources": [{"name": "The National", "url": "https://www.thenationalnews.com/business/energy/2026/08/05/brent-oil-back-above-80-after-houthi-attack-on-saudi-tanker/", "reliability": 4}, {"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-05/yemen-s-houthis-say-they-ll-target-tankers-in-northern-red-sea", "reliability": 5}], "en": {"title": "Houthis strike Saudi tanker Wafa, vow to expand attacks into northern Red Sea", "summary": "Yemen's Iran-aligned Houthi rebels hit the Saudi-linked oil tanker Wafa with ballistic missiles near Yanbu, the eighth Saudi vessel struck and the 29th forced to turn back since their naval blockade began in July.", "detail": "Houthi military spokesperson Yahya Saree said the strike was 'precise' but gave no details on damage or casualties. He warned that 'operations will continue and escalate in targeting Saudi oil tankers in the northern Red Sea,' widening a maritime front in the Bab el-Mandeb Strait that already runs alongside the disrupted Strait of Hormuz. Analysts say the combined chokepoints threaten a critical share of the world's oil and gas shipments.", "terms": [{"match": "Bab el-Mandeb", "id": "bab-el-mandeb"}]}, "it": {"title": "Gli Houthi colpiscono la petroliera saudita Wafa, promettono di estendere gli attacchi al Mar Rosso settentrionale", "summary": "I ribelli Houthi yemeniti, alleati dell'Iran, hanno colpito con missili balistici la petroliera legata all'Arabia Saudita Wafa vicino a Yanbu, l'ottava nave saudita colpita e la 29ª costretta a fare marcia indietro da quando è iniziato il blocco navale a luglio.", "detail": "Il portavoce militare Houthi Yahya Saree ha detto che l'attacco è stato 'preciso' ma non ha fornito dettagli su danni o vittime. Ha avvertito che 'le operazioni continueranno e si intensificheranno colpendo le petroliere saudite nel Mar Rosso settentrionale', allargando un fronte marittimo nello Stretto di Bab el-Mandeb che si affianca già allo Stretto di Hormuz già interrotto. Gli analisti avvertono che i due colli di bottiglia combinati minacciano una quota critica delle spedizioni mondiali di petrolio e gas.", "terms": [{"match": "Bab el-Mandeb", "id": "bab-el-mandeb"}]}}, {"id": "ukraine-kyiv-barrage-aug5", "date": "2026-08-05", "country": "Ukraine", "category": "Geopolitics", "topics": ["russia-ukraine"], "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/08/05/nx-s1-5921194/russian-missile-drone-barrage", "reliability": 5}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/5/russian-attacks-kill-17-exploiting-ukraines-lack-of-missile-interceptors", "reliability": 4}], "en": {"title": "Russian barrage kills 17 in Kyiv as Ukraine's Patriot interceptors run out", "summary": "A two-hour Russian assault of 24 ballistic missiles, four cruise missiles and 115 drones killed at least 17 people and wounded 44 in Kyiv, with Ukrainian air defenses failing to down a single ballistic missile.", "detail": "President Zelenskyy said 'ballistic interceptors are what could have saved the lives of those killed today,' revealing that Patriot interceptor stocks have fallen to a third of 2025 levels, partly because of competition for the same missiles from the Iran war. Cluster munitions were reportedly used in the strike, which hit a brewery, a warehouse and a mail sorting office. Zelenskyy renewed his appeal to allies to supply more interceptors or let Ukraine manufacture them domestically, and called for sanctions on 17 companies tied to Russian missile production.", "terms": [{"match": "Patriot interceptor stocks", "id": "thaad"}]}, "it": {"title": "Un bombardamento russo uccide 17 persone a Kiev mentre si esauriscono gli intercettori Patriot ucraini", "summary": "Un assalto russo di due ore con 24 missili balistici, quattro missili da crociera e 115 droni ha ucciso almeno 17 persone e ferito 44 a Kiev, con la difesa aerea ucraina che non è riuscita ad abbattere nemmeno un missile balistico.", "detail": "Il presidente Zelensky ha detto che 'gli intercettori balistici avrebbero potuto salvare la vita di chi è morto oggi', rivelando che le scorte di intercettori Patriot sono scese a un terzo dei livelli del 2025, anche a causa della concorrenza per gli stessi missili causata dalla guerra con l'Iran. Sembra che nell'attacco siano state usate munizioni a grappolo, colpendo un birrificio, un magazzino e un centro di smistamento postale. Zelensky ha rinnovato l'appello agli alleati per avere più intercettori o poterli produrre in patria, chiedendo sanzioni contro 17 aziende legate alla produzione missilistica russa.", "terms": [{"match": "intercettori Patriot", "id": "thaad"}]}}, {"id": "gaza-sabra-112-funeral", "date": "2026-08-04", "country": "Palestine", "category": "Social", "topics": ["israel-palestine"], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/4/gaza-holds-mass-funeral-for-112-people-killed-in-israels-2023-sabra-attack", "reliability": 4}, {"name": "RTE News", "url": "https://www.rte.ie/news/middle-east/2026/0802/1586144-gaza-israel-world/", "reliability": 5}], "en": {"title": "Gaza holds mass funeral for 112 people, including 44 children, recovered from 2023 rubble", "summary": "Civil defence crews spent two weeks excavating a flattened residential block in Gaza City's Sabra neighborhood, recovering 112 bodies — 44 of them children — from an Israeli strike nearly three years ago.", "detail": "The mass burial came as the cumulative Gaza death toll since the October 2025 ceasefire passed 1,250 killed and over 4,100 wounded, with July the deadliest month of 2026 so far. The recovery underscores how much of Gaza's devastation from the war's early phase is still being uncovered years later, even as the Board of Peace's Hamas disarmament roadmap remains deadlocked over the terms of any Israeli withdrawal.", "terms": [{"match": "Board of Peace", "id": "board-of-peace"}]}, "it": {"title": "Gaza celebra un funerale di massa per 112 persone, tra cui 44 bambini, recuperate dalle macerie di un attacco del 2023", "summary": "Le squadre della protezione civile hanno impiegato due settimane per scavare un isolato residenziale raso al suolo nel quartiere di Sabra, a Gaza City, recuperando 112 corpi — 44 dei quali bambini — da un raid israeliano di quasi tre anni fa.", "detail": "La sepoltura collettiva arriva mentre il bilancio complessivo delle vittime a Gaza dal cessate il fuoco dell'ottobre 2025 supera 1.250 morti e oltre 4.100 feriti, con luglio mese più letale del 2026 finora. Il ritrovamento mostra quanta parte della devastazione della prima fase della guerra a Gaza venga ancora scoperta anni dopo, mentre la tabella di marcia del Board of Peace per il disarmo di Hamas resta bloccata sulle condizioni di un eventuale ritiro israeliano.", "terms": [{"match": "Board of Peace", "id": "board-of-peace"}]}}, {"id": "oil-rebounds-houthi-attack", "date": "2026-08-05", "country": "Global", "category": "Economy", "topics": ["mercato-investimenti", "us-iran"], "sources": [{"name": "The National", "url": "https://www.thenationalnews.com/business/energy/2026/08/05/brent-oil-back-above-80-after-houthi-attack-on-saudi-tanker/", "reliability": 4}, {"name": "Fortune", "url": "https://fortune.com/article/price-of-oil-08-05-2026/", "reliability": 3}], "en": {"title": "Brent crude rebounds above $80 after Houthi tanker attack, reversing Iran-deal optimism selloff", "summary": "Brent crude rose 1.5% to $80.54 a barrel and WTI gained nearly 1% to $76.46 after the Houthi strike on the Wafa tanker, reversing a sharp drop from the previous day when both benchmarks fell over 5% on hopes of a US-Iran deal to reopen the Strait of Hormuz.", "detail": "Analysts at Asas Capital said the Strait of Hormuz, which carries roughly a fifth of global oil supply, remains the critical flashpoint: a real ceasefire could reverse gains quickly, while further escalation risks 'a genuine supply shock.' The whiplash pricing reflects a now-familiar pattern in which peace-deal announcements are repeatedly followed by fresh attacks.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "Il petrolio Brent rimbalza sopra gli 80 dollari dopo l'attacco Houthi a una petroliera, invertendo il calo legato all'ottimismo sull'accordo con l'Iran", "summary": "Il greggio Brent è salito dell'1,5% a 80,54 dollari al barile e il WTI quasi dell'1% a 76,46 dollari dopo l'attacco Houthi alla petroliera Wafa, invertendo il forte calo del giorno precedente quando entrambi i benchmark erano scesi oltre il 5% sulle speranze di un accordo USA-Iran per riaprire lo Stretto di Hormuz.", "detail": "Gli analisti di Asas Capital affermano che lo Stretto di Hormuz, che trasporta circa un quinto della fornitura mondiale di petrolio, resta il punto critico: un vero cessate il fuoco potrebbe invertire rapidamente i guadagni, mentre un'ulteriore escalation rischia 'un vero shock dell'offerta'. L'andamento altalenante dei prezzi riflette uno schema ormai familiare, in cui agli annunci di accordi di pace seguono ripetutamente nuovi attacchi.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}]}}, {"id": "amd-q2-earnings-nvidia-rivalry", "date": "2026-08-05", "country": "USA", "category": "Technology", "sources": [{"name": "CNBC", "url": "https://www.cnbc.com/2026/08/05/amd-stock-today-earnings-q2.html", "reliability": 4}, {"name": "Yahoo Finance", "url": "https://finance.yahoo.com/technology/article/amd-to-report-q2-earnings-as-chip-stocks-continue-to-waver-110000620.html", "reliability": 4}], "en": {"title": "AMD shares sink 7% despite 50% revenue growth as Wall Street favors Nvidia in AI chip race", "summary": "AMD reported second-quarter revenue of $11.54 billion, up 50% year-on-year and above estimates, with data-center sales surging 107%, but shares fell 7% as investors judged the results merely in line with an already rich valuation.", "detail": "CEO Lisa Su forecast server revenue growing 80% year-on-year in the second half of 2026 and more than 70% through 2027, citing 'much, much stronger customer visibility.' Asked about Elon Musk's high-profile commitment to exclusive Nvidia chips for SpaceX, Su said she holds 'tremendous respect for Elon' and looks forward to 'partnering over the longer term' — but Nvidia shares climbed the same day AMD's fell, underscoring investors' continued preference for the AI chip market leader.", "terms": [{"match": "AI chip market leader", "id": "ai-sovereignty"}]}, "it": {"title": "Le azioni AMD crollano del 7% nonostante una crescita dei ricavi del 50%, mentre Wall Street preferisce Nvidia nella corsa ai chip AI", "summary": "AMD ha riportato ricavi del secondo trimestre per 11,54 miliardi di dollari, in crescita del 50% su base annua e sopra le attese, con le vendite data-center in aumento del 107%, ma le azioni sono scese del 7% perché gli investitori hanno giudicato i risultati semplicemente in linea con una valutazione già elevata.", "detail": "L'amministratrice delegata Lisa Su ha previsto una crescita dei ricavi server dell'80% su base annua nella seconda metà del 2026 e oltre il 70% nel 2027, citando una 'visibilità sui clienti molto, molto più forte'. Interpellata sull'impegno esclusivo di Elon Musk verso i chip Nvidia per SpaceX, Su ha detto di nutrire 'enorme rispetto per Elon' e di guardare a una 'collaborazione nel lungo periodo' — ma le azioni Nvidia sono salite lo stesso giorno in cui quelle di AMD scendevano, confermando la preferenza degli investitori per il leader del mercato dei chip AI.", "terms": [{"match": "leader del mercato dei chip AI", "id": "ai-sovereignty"}]}, "topics": ["ai"]}, {"id": "us-senate-shutdown-deal-dec11", "date": "2026-08-02", "country": "USA", "category": "Politics", "sources": [{"name": "NBC News", "url": "https://www.nbcnews.com/politics/congress/senate-leaders-reach-deal-avert-shutdown-2026-elections-rcna590564", "reliability": 4}, {"name": "PBS NewsHour", "url": "https://www.pbs.org/newshour/politics/senate-leaders-reach-funding-deal-to-avoid-shutdown-during-campaign-season", "reliability": 5}], "en": {"title": "US Senate strikes deal to fund government through December 11, averting shutdown before midterms", "summary": "Senate leaders agreed on a short-term spending bill, a continuing resolution, keeping federal agencies funded through December 11, 2026, sidestepping a shutdown during the run-up to the midterm elections.", "detail": "Senate Appropriations Committee Chair Susan Collins called the measure 'a major step toward averting a damaging shutdown that only harms vital programs and federal workers.' A vote was expected before lawmakers left for summer recess; the House had already passed a similar bill, though without some exceptions the White House had requested.", "terms": [{"match": "continuing resolution", "id": "continuing-resolution"}]}, "it": {"title": "Il Senato USA raggiunge un accordo per finanziare il governo fino all'11 dicembre, evitando lo shutdown prima delle elezioni di metà mandato", "summary": "I leader del Senato hanno concordato una legge di spesa a breve termine, una 'continuing resolution', che finanzia le agenzie federali fino all'11 dicembre 2026, evitando uno shutdown nella fase di avvicinamento alle elezioni di metà mandato.", "detail": "La presidente della Commissione Stanziamenti del Senato Susan Collins ha definito la misura 'un passo importante verso l'eliminazione di uno shutdown dannoso, che colpisce solo programmi vitali e dipendenti federali'. Un voto era atteso prima della pausa estiva dei parlamentari; la Camera aveva già approvato una legge simile, anche se priva di alcune eccezioni richieste dalla Casa Bianca.", "terms": [{"match": "continuing resolution", "id": "continuing-resolution"}]}, "topics": ["politica-internazionale"]}, {"id": "drc-ebola-undercount", "date": "2026-08-04", "country": "DR Congo", "category": "Medicine", "sources": [{"name": "Forbes", "url": "https://www.forbes.com/sites/johndrake/2026/08/04/congo-is-counting-fewer-than-half-its-ebola-cases/", "reliability": 3}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/14/who-warns-dr-congo-ebola-outbreak-may-be-double-the-official-tally", "reliability": 4}], "en": {"title": "DR Congo's true Ebola toll may be triple the official count, data suggests", "summary": "Official figures put DR Congo's Ebola outbreak at 3,822 confirmed cases and 1,707 deaths as of August 2, but unpublished WHO estimates cited by public-health researchers suggest the real toll could be three to four times higher.", "detail": "Researcher John Drake calculated a lower bound of roughly 8,300 infections and a ceiling near 19,100, using a method that traces linked chains of transmission. Between 55% and 60% of confirmed cases have no identifiable source, meaning the surveillance system is missing many infections; a WHO emergency official said '80% of new cases are outside our contact lists.' WHO chief Tedros Adhanom Ghebreyesus had already warned in July that true cases 'could be more than double' the official count.", "terms": [{"match": "unpublished WHO estimates", "id": "bundibugyo"}]}, "it": {"title": "Il vero bilancio dell'Ebola in RD Congo potrebbe essere triplo rispetto al conteggio ufficiale, secondo i dati", "summary": "Le cifre ufficiali collocano il focolaio di Ebola in RD Congo a 3.822 casi confermati e 1.707 morti al 2 agosto, ma stime OMS non pubblicate citate da ricercatori di sanità pubblica suggeriscono che il bilancio reale potrebbe essere da tre a quattro volte superiore.", "detail": "Il ricercatore John Drake ha calcolato una stima minima di circa 8.300 infezioni e un tetto vicino a 19.100, usando un metodo che ricostruisce le catene di trasmissione collegate. Tra il 55% e il 60% dei casi confermati non ha una fonte identificabile, il che significa che il sistema di sorveglianza si sta perdendo molte infezioni; un funzionario dell'emergenza OMS ha dichiarato che 'l'80% dei nuovi casi è al di fuori delle nostre liste di contatti'. Il direttore generale dell'OMS Tedros Adhanom Ghebreyesus aveva già avvertito a luglio che i casi reali 'potrebbero essere più del doppio' del conteggio ufficiale.", "terms": [{"match": "stime OMS non pubblicate", "id": "bundibugyo"}]}, "topics": []}, {"id": "houthi-yemen-govt-clash-aug6", "date": "2026-08-06", "country": "Global", "category": "Geopolitics", "sources": [{"name": "Washington Post", "url": "https://www.washingtonpost.com/world/2026/08/06/houthi-rebel-attacks-marib-hadhramaut/c6ecf71c-919a-11f1-9fdc-0a725c989a7b_story.html", "reliability": 4}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/6/houthis-claim-to-have-killed-45-in-attacks-on-yemeni-government-forces", "reliability": 4}], "en": {"title": "Houthi rebels kill dozens of Yemeni government troops in deadliest clash since 2022", "summary": "Iran-aligned Houthi rebels launched missile and drone attacks on Saudi-backed Yemeni government forces in Marib and Hadhramaut, killing at least 30-45 troops, according to medical sources — the bloodiest confrontation between the two sides in four years.", "detail": "The attacks mark a sharp escalation of Yemen's long-frozen internal front even as the Houthis continue a separate campaign of strikes on Saudi oil tankers in the Red Sea. Officials said the government side suffered its heaviest single-day losses since a 2022 truce mostly silenced the front line between the internationally recognized government and the Houthi movement. The clash adds a third active flank — alongside the Strait of Hormuz standoff with the US and the Bab el-Mandeb tanker blockade — to a widening web of Iran-linked confrontations across the Gulf and Red Sea region.", "terms": [{"match": "Marib and Hadhramaut", "id": "marib-hadhramaut"}, {"match": "2022 truce", "id": "yemen-2022-truce"}]}, "it": {"title": "I ribelli Houthi uccidono decine di soldati governativi yemeniti nello scontro più sanguinoso dal 2022", "summary": "I ribelli Houthi, alleati dell'Iran, hanno lanciato attacchi con missili e droni contro le forze governative yemenite sostenute dai sauditi a Marib e Hadhramaut, uccidendo almeno 30-45 soldati secondo fonti mediche — lo scontro più cruento tra le due parti in quattro anni.", "detail": "Gli attacchi segnano una brusca escalation del fronte interno yemenita, rimasto per lo più congelato, mentre gli Houthi proseguono in parallelo la campagna di attacchi alle petroliere saudite nel Mar Rosso. Fonti ufficiali riferiscono che le forze governative hanno subito le perdite più pesanti in una singola giornata dalla tregua del 2022, che aveva in gran parte messo a tacere la linea del fronte tra il governo internazionalmente riconosciuto e il movimento Houthi. Lo scontro apre un terzo fronte attivo — insieme allo stallo nello Stretto di Hormuz con gli USA e al blocco delle petroliere a Bab el-Mandeb — in una rete sempre più ampia di confronti legati all'Iran nella regione del Golfo e del Mar Rosso.", "terms": [{"match": "Marib e Hadhramaut", "id": "marib-hadhramaut"}, {"match": "tregua del 2022", "id": "yemen-2022-truce"}]}, "topics": []}, {"id": "iran-oman-hormuz-bar-us-ships", "date": "2026-08-06", "country": "Iran", "category": "Geopolitics", "topics": ["us-iran"], "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-06/iran-seeks-bar-on-us-ships-in-hormuz-as-deal-with-oman-advances", "reliability": 4}, {"name": "CBS News", "url": "https://www.cbsnews.com/live-updates/iran-war-us-trump-strait-of-hormuz-deal/", "reliability": 4}], "en": {"title": "Iran seeks to bar US and Israeli ships as Hormuz shipping deal with Oman advances", "summary": "Iran and Oman are nearing a deal on a new dual-channel shipping corridor through the Strait of Hormuz — inbound vessels via Iranian-controlled waters, outbound via Omani waters — but Tehran wants US and Israeli-linked ships explicitly excluded, and insists it is not a full reopening.", "detail": "President Trump said an announcement could come \"as soon as Thursday,\" but Iran's Parliament National Security Commission cautioned that a full reopening still requires the US to end its naval presence, lift port sanctions and declare a ceasefire — conditions Washington has not accepted. The proposal envisions no transit fees for commercial vessels, framed by Tehran as a \"new security model\" rather than genuine de-escalation. The talks unfold against a tense backdrop: Iran says it arrested 21 alleged Israeli spies in Kerman province, and US officials suspect Iran-linked hackers behind cyberattacks on water systems in at least 12 American states.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz-strait"}, {"match": "Parliament National Security Commission", "id": "iran-parliament-security"}]}, "it": {"title": "L'Iran vuole escludere le navi USA e israeliane mentre avanza l'accordo con l'Oman su Hormuz", "summary": "Iran e Oman sono vicini a un accordo su un nuovo corridoio di navigazione a doppio canale nello Stretto di Hormuz — navi in entrata nelle acque controllate dall'Iran, in uscita in quelle omanite — ma Teheran vuole escludere esplicitamente le navi USA e quelle legate a Israele, e insiste che non si tratti di una riapertura completa.", "detail": "Il presidente Trump ha detto che un annuncio potrebbe arrivare \"già giovedì\", ma la Commissione di sicurezza nazionale del Parlamento iraniano ha avvertito che una riapertura completa richiede ancora che gli USA pongano fine alla presenza navale, revochino le sanzioni portuali e dichiarino un cessate il fuoco — condizioni che Washington non ha accettato. La proposta prevede l'assenza di tasse di transito per le navi commerciali, presentata da Teheran come un \"nuovo modello di sicurezza\" più che una vera de-escalation. I colloqui si svolgono in un contesto teso: l'Iran afferma di aver arrestato 21 presunte spie israeliane nella provincia di Kerman, mentre funzionari USA sospettano che hacker legati all'Iran siano dietro attacchi informatici ai sistemi idrici di almeno 12 stati americani.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz-strait"}, {"match": "Commissione di sicurezza nazionale del Parlamento iraniano", "id": "iran-parliament-security"}]}}, {"id": "oil-83-rebound-deescalation", "date": "2026-08-06", "country": "Global", "category": "Economy", "sources": [{"name": "Yahoo Finance", "url": "https://finance.yahoo.com/energy/articles/current-price-oil-august-6-110019443.html", "reliability": 4}, {"name": "Fortune", "url": "https://fortune.com/article/price-of-oil-08-06-2026/", "reliability": 4}], "en": {"title": "Brent crude holds near $83.64 a barrel as markets weigh Iran war de-escalation hopes", "summary": "Brent crude traded at roughly $83.64 a barrel, down slightly on the day but up nearly 16% over the past month, as investors weighed signs of de-escalation in the US-Iran conflict against the still-active Houthi attacks on Saudi shipping.", "detail": "Prices have swung sharply for weeks between relief rallies on talk of a Hormuz shipping deal and spikes whenever the Houthi-Saudi maritime front flares up, as it did again with the attack on the tanker Wafa days earlier. Analysts note oil remains roughly 24% higher than a year ago, reflecting the cumulative risk premium built up since the conflict began, even as this week's modest pullback suggests markets see the direct US-Iran military track cooling for now.", "terms": [{"match": "Brent crude", "id": "brent-crude"}]}, "it": {"title": "Il petrolio Brent si mantiene vicino a 83,64 dollari al barile mentre i mercati valutano la speranza di de-escalation nella guerra con l'Iran", "summary": "Il greggio Brent ha scambiato a circa 83,64 dollari al barile, in lieve calo giornaliero ma in rialzo di quasi il 16% nell'ultimo mese, mentre gli investitori valutavano i segnali di de-escalation nel conflitto USA-Iran a fronte degli attacchi Houthi alle navi saudite ancora in corso.", "detail": "I prezzi hanno oscillato bruscamente per settimane tra rally di sollievo sulle voci di un accordo per la navigazione a Hormuz e picchi ogni volta che il fronte marittimo Houthi-Arabia Saudita si riaccende, come accaduto di nuovo con l'attacco alla petroliera Wafa pochi giorni prima. Gli analisti notano che il petrolio resta circa il 24% più caro rispetto a un anno fa, riflettendo il premio di rischio accumulato dall'inizio del conflitto, anche se il modesto arretramento di questa settimana suggerisce che i mercati vedono per ora un raffreddamento del fronte militare diretto USA-Iran.", "terms": [{"match": "greggio Brent", "id": "brent-crude"}]}, "topics": ["mercato-investimenti"]}, {"id": "google-ai-leadership-shakeup", "date": "2026-08-06", "country": "USA", "category": "Technology", "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-06/google-shifts-ai-power-to-california-in-race-against-anthropic-openai", "reliability": 4}, {"name": "CNBC", "url": "https://www.cnbc.com/2026/08/05/google-chief-scientist-jeff-dean-leaving-company-after-27-years.html", "reliability": 4}], "en": {"title": "Google reshuffles AI leadership: Hassabis steps back, chief scientist Jeff Dean departs after 27 years", "summary": "Google shook up its AI leadership, with DeepMind CEO Demis Hassabis moving to a chairman role and longtime chief scientist Jeff Dean leaving the company entirely, as power over Gemini's development shifts back toward California in the race against Anthropic and OpenAI.", "detail": "The reorganization concentrates AI decision-making closer to Google's Mountain View headquarters, a move analysts say weakens London-based DeepMind's traditional autonomy within the company and could complicate the UK's ambitions to remain a top AI hub. Google's stock dipped on the news, with investors uncertain whether the shakeup signals renewed urgency to compete with rivals' faster model releases or deeper internal friction over Gemini's strategy. Dean, a 27-year Google veteran and co-creator of foundational AI infrastructure, is reportedly joining a new venture called Discovery Loop.", "terms": [{"match": "DeepMind", "id": "deepmind"}, {"match": "Gemini", "id": "gemini-model"}]}, "it": {"title": "Google rimescola la leadership AI: Hassabis fa un passo indietro, il chief scientist Jeff Dean lascia dopo 27 anni", "summary": "Google ha rivoluzionato la propria leadership sull'AI: il CEO di DeepMind Demis Hassabis passa al ruolo di presidente e lo storico chief scientist Jeff Dean lascia del tutto l'azienda, mentre il potere decisionale su Gemini si sposta di nuovo verso la California nella corsa contro Anthropic e OpenAI.", "detail": "La riorganizzazione concentra le decisioni sull'AI più vicino al quartier generale di Google a Mountain View, una mossa che secondo gli analisti indebolisce la tradizionale autonomia di DeepMind, con sede a Londra, e potrebbe complicare le ambizioni del Regno Unito di restare un polo di primo piano per l'AI. Il titolo Google ha ceduto terreno dopo la notizia, con gli investitori incerti se il rimpasto segnali una rinnovata urgenza di competere con i rilasci più rapidi dei rivali o attriti interni più profondi sulla strategia di Gemini. Dean, veterano di 27 anni in Google e co-creatore di infrastrutture AI fondamentali, si unirebbe secondo alcune fonti a una nuova iniziativa chiamata Discovery Loop.", "terms": [{"match": "DeepMind", "id": "deepmind"}, {"match": "Gemini", "id": "gemini-model"}]}, "topics": ["ai"]}, {"id": "trump-birthright-citizenship-orders", "date": "2026-08-06", "country": "USA", "category": "Politics", "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/08/06/g-s1-137686/trump-birthright-citizenship-immigration-curb", "reliability": 5}, {"name": "NBC News", "url": "https://www.nbcnews.com/politics/immigration/trump-executive-actions-birthright-citizenship-birth-tourism-rcna591271", "reliability": 4}], "en": {"title": "Trump signs new executive orders targeting birthright citizenship and 'birth tourism'", "summary": "President Trump signed two executive orders aimed at restricting birthright citizenship for children of undocumented immigrants and cracking down on so-called 'birth tourism,' weeks after the Supreme Court rejected his earlier attempt to unilaterally reinterpret the 14th Amendment.", "detail": "The new orders take a narrower approach than Trump's original January 2025 order, focusing on tourist-visa enforcement and federal benefits eligibility rather than directly denying citizenship documents, in an apparent attempt to survive the legal challenges that sank the first version. Trump has repeatedly called the 14th Amendment's citizenship guarantee outdated, while civil rights groups say any move to condition citizenship on parents' immigration status is unconstitutional and have signaled they will sue again.", "terms": [{"match": "14th Amendment", "id": "birthright-citizenship"}, {"match": "birth tourism", "id": "birthright-citizenship"}]}, "it": {"title": "Trump firma nuovi ordini esecutivi contro la cittadinanza per nascita e il 'turismo della nascita'", "summary": "Il presidente Trump ha firmato due ordini esecutivi volti a limitare la cittadinanza per nascita ai figli di immigrati irregolari e a contrastare il cosiddetto 'turismo della nascita', settimane dopo che la Corte Suprema aveva respinto il suo precedente tentativo di reinterpretare unilateralmente il XIV Emendamento.", "detail": "I nuovi ordini adottano un approccio più circoscritto rispetto all'ordine originale del gennaio 2025, concentrandosi sull'applicazione delle norme sui visti turistici e sull'accesso ai benefici federali piuttosto che negare direttamente i documenti di cittadinanza, in un apparente tentativo di superare le contestazioni legali che avevano affossato la prima versione. Trump ha ripetutamente definito superata la garanzia di cittadinanza del XIV Emendamento, mentre i gruppi per i diritti civili sostengono che condizionare la cittadinanza allo status migratorio dei genitori sia incostituzionale e hanno annunciato nuove azioni legali.", "terms": [{"match": "XIV Emendamento", "id": "birthright-citizenship"}, {"match": "turismo della nascita", "id": "birthright-citizenship"}]}, "topics": ["politica-internazionale"]}, {"id": "ceuta-deaths-88", "date": "2026-08-03", "country": "Spain", "category": "Social", "sources": [{"name": "Euronews", "url": "https://www.euronews.com/my-europe/2026/08/03/at-least-72-dead-in-ceuta-spain-says-as-eu-prepares-talks-on-uncontrolled-migrant-crossing", "reliability": 4}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/migrant-deaths-in-ceuta-rise-to-72-after-border-surge-from-morocco", "reliability": 4}], "en": {"title": "Ceuta migrant crossing death toll climbs to at least 88 as EU prepares emergency talks", "summary": "Spanish authorities raised the confirmed death toll from the mass migrant crossing into the Ceuta enclave to at least 88, up from 72 just a day earlier, as the EU moved toward emergency ministerial talks over the crisis.", "detail": "The toll has risen steadily for days as bodies continue to be recovered from the sea route between Morocco and the Spanish enclave, in what is already the deadliest single migration event in Ceuta's history. The rising count adds pressure on an EU already split over how to respond, with Italy having suspended Schengen free movement wi
