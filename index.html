etail": "Il direttore regionale dell'OMS Mohamed Yakub Janabi ha dichiarato \"stiamo inseguendo il virus, il virus è avanti a noi\", indicando nel ritardo di tre mesi nella rilevazione una delle ragioni principali per cui il focolaio — causato dal raro ceppo Bundibugyo, per cui non esiste ancora un vaccino o una cura approvati — ha superato in velocità di diffusione ogni precedente epidemia di Ebola, compresa quella dell'Africa occidentale del 2014-2016.", "terms": [{"match": "ceppo Bundibugyo", "id": "bundibugyo"}]}}, {"id": "hormuz-tanker-transfers-aug12", "date": "2026-08-12", "country": "Global", "category": "Geopolitics", "topics": ["us-iran"], "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-11/a-dozen-ships-switch-oil-outside-hormuz-as-barrels-keep-flowing", "reliability": 4}, {"name": "CNN", "url": "https://www.cnn.com/2026/08/11/world/live-news/iran-war-trump", "reliability": 4}], "en": {"title": "Oil tankers reroute around Strait of Hormuz as attacks persist", "summary": "With hopes fading for an Iran-Oman deal to secure the Strait of Hormuz, at least a dozen oil tankers are now performing risky ship-to-ship transfers outside the strait to keep crude flowing while avoiding the most dangerous waters.", "detail": "Shipping data shows tankers meeting in safer anchorages near Fujairah and the Gulf of Oman to swap cargoes, adding cost and delay to crude shipments. The workaround follows a string of attacks on vessels near the strait, including Iran's missile strike on an ADNOC-linked tanker on August 8, and comes as talks between Iran and Oman over compensation for reopening the waterway have stalled.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "Le petroliere aggirano lo Stretto di Hormuz mentre gli attacchi continuano", "summary": "Mentre svaniscono le speranze per un accordo tra Iran e Oman per mettere in sicurezza lo Stretto di Hormuz, almeno una dozzina di petroliere effettua ora rischiosi trasferimenti di carico nave-nave al di fuori dello stretto per continuare a far affluire il greggio evitando le acque più pericolose.", "detail": "I dati sul traffico marittimo mostrano petroliere che si incontrano in ancoraggi più sicuri vicino a Fujairah e nel Golfo dell'Oman per scambiarsi i carichi, con un aumento di costi e ritardi nelle spedizioni di greggio. L'espediente segue una serie di attacchi alle navi vicino allo stretto, incluso il missile iraniano contro una petroliera legata ad ADNOC dell'8 agosto, e arriva mentre i negoziati tra Iran e Oman sul risarcimento per la riapertura della via d'acqua sono in stallo.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}]}}, {"id": "gaza-strikes-continue-disarmament-aug12", "date": "2026-08-12", "country": "Palestine", "category": "Geopolitics", "topics": ["israel-palestine"], "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/08/03/g-s1-136877/israel-serious-concerns-hamas-disarmament-deal-trump", "reliability": 5}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/3/israel-defies-trumps-peace-plan-as-it-escalates-deadly-attacks-on-gaza", "reliability": 4}], "en": {"title": "Israel presses on with Gaza strikes despite Hamas disarmament deal", "summary": "Israel says it has 'serious concerns' about the White House-brokered Hamas disarmament agreement, and its forces have continued deadly strikes across Gaza in the days since the deal was announced, drawing accusations that Israel is defying the peace plan it nominally endorsed.", "detail": "Rights monitors and Gaza's health ministry say dozens of Palestinians have been killed in strikes since the disarmament agreement was unveiled, undercutting the ceasefire framework championed by the Trump-backed Board of Peace. Israeli officials argue Hamas has not met verification and handover conditions, while mediators warn the continued strikes risk collapsing the fragile deal entirely.", "terms": [{"match": "Board of Peace", "id": "board-of-peace"}]}, "it": {"title": "Israele prosegue gli attacchi a Gaza nonostante l'accordo di disarmo di Hamas", "summary": "Israele dichiara di avere 'seri dubbi' sull'accordo di disarmo di Hamas mediato dalla Casa Bianca, e le sue forze hanno continuato attacchi mortali in tutta Gaza nei giorni successivi all'annuncio dell'intesa, sollevando accuse di violazione del piano di pace formalmente sottoscritto.", "detail": "Osservatori per i diritti umani e il ministero della Salute di Gaza affermano che decine di palestinesi sono stati uccisi negli attacchi dall'annuncio dell'accordo di disarmo, indebolendo il quadro del cessate il fuoco promosso dal Board of Peace sostenuto da Trump. I funzionari israeliani sostengono che Hamas non abbia rispettato le condizioni di verifica e consegna delle armi, mentre i mediatori avvertono che gli attacchi continui rischiano di far crollare del tutto il fragile accordo.", "terms": [{"match": "Board of Peace", "id": "board-of-peace"}]}}, {"id": "wall-street-tech-selloff-oil-aug12", "date": "2026-08-12", "country": "USA", "category": "Economy", "topics": ["mercato-investimenti", "us-iran"], "sources": [{"name": "CNBC", "url": "https://www.cnbc.com/2026/08/10/stock-market-today-live-updates.html", "reliability": 4}, {"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-11/stock-market-today-dow-s-p-live-updates", "reliability": 4}], "en": {"title": "Wall Street slips on tech selloff as oil climbs on Hormuz risk", "summary": "US stocks edged lower as a tech-sector selloff weighed on the S&P 500 and Nasdaq, while oil prices rose again on growing fears over safety in the Strait of Hormuz, with investors now looking ahead to the next US inflation report for direction.", "detail": "Chipmakers led the tech retreat after mixed earnings signals, while energy shares gained as Brent crude pushed higher on the deteriorating security situation around Hormuz. Analysts said markets remain caught between resilient US economic data and the risk that a prolonged Gulf shipping disruption could reignite inflation just as the Federal Reserve weighs its next move.", "terms": [{"match": "Federal Reserve", "id": "federal-reserve"}]}, "it": {"title": "Wall Street scende per le vendite sul comparto tech mentre il petrolio sale per il rischio Hormuz", "summary": "I titoli azionari statunitensi sono scesi leggermente a causa di vendite nel comparto tecnologico che hanno pesato su S&P 500 e Nasdaq, mentre i prezzi del petrolio sono tornati a salire per i crescenti timori sulla sicurezza dello Stretto di Hormuz, con gli investitori ora concentrati sul prossimo dato sull'inflazione USA.", "detail": "I produttori di chip hanno guidato il ribasso del tech dopo segnali contrastanti sugli utili, mentre i titoli energetici sono saliti con il petrolio Brent in aumento per il peggioramento della sicurezza attorno a Hormuz. Gli analisti affermano che i mercati restano in bilico tra dati economici USA resilienti e il rischio che un'interruzione prolungata del traffico marittimo nel Golfo possa far ripartire l'inflazione proprio mentre la Federal Reserve valuta la prossima mossa.", "terms": [{"match": "Federal Reserve", "id": "federal-reserve"}]}}, {"id": "openai-custom-chip-mass-production-aug12", "date": "2026-08-12", "country": "USA", "category": "Technology", "topics": ["ai"], "sources": [{"name": "TechCrunch", "url": "https://techcrunch.com/2026/06/24/openai-unveils-its-first-custom-chip-built-by-broadcom/", "reliability": 4}, {"name": "Yahoo Finance (Financial Times report)", "url": "https://finance.yahoo.com/news/openai-set-start-mass-production-003906002.html", "reliability": 4}], "en": {"title": "OpenAI moves toward mass production of its own AI chip", "summary": "OpenAI is finalizing the design of its first in-house AI chip, built with Broadcom and manufactured by TSMC, with mass production targeted for 2026 as the company seeks to reduce its heavy dependence on Nvidia hardware.", "detail": "The custom chip, aimed initially at inference workloads rather than training, is part of a broader industry trend of AI labs designing their own silicon — following Google's TPUs and Microsoft's Maia line — to cut costs and secure supply as demand for computing capacity continues to outstrip availability.", "terms": [{"match": "TSMC", "id": "tsmc"}]}, "it": {"title": "OpenAI si avvia verso la produzione di massa del proprio chip AI", "summary": "OpenAI sta finalizzando il progetto del suo primo chip AI interno, sviluppato con Broadcom e prodotto da TSMC, con la produzione di massa prevista per il 2026, mentre l'azienda cerca di ridurre la forte dipendenza dall'hardware Nvidia.", "detail": "Il chip personalizzato, pensato inizialmente per i carichi di lavoro di inferenza più che per l'addestramento, si inserisce in una tendenza più ampia del settore, in cui i laboratori di intelligenza artificiale progettano un proprio silicio — sulla scia dei TPU di Google e della linea Maia di Microsoft — per ridurre i costi e garantirsi la disponibilità di capacità di calcolo, la cui domanda continua a superare l'offerta.", "terms": [{"match": "TSMC", "id": "tsmc"}]}}, {"id": "uk-starmer-labour-crisis-aug12", "date": "2026-08-12", "country": "United Kingdom", "category": "Politics", "topics": ["politica-internazionale"], "sources": [{"name": "PBS NewsHour", "url": "https://www.pbs.org/newshour/world/uk-prime-minister-starmer-averts-a-leadership-challenge-for-now-but-remains-damaged-by-epstein-fallout", "reliability": 5}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/2/10/a-coup-that-never-was-why-uks-starmer-faced-a-major-leadership-challenge", "reliability": 4}], "en": {"title": "Starmer survives Labour leadership challenge but stays weakened", "summary": "UK Prime Minister Keir Starmer has fended off an internal Labour Party leadership challenge for now, but remains politically damaged by the fallout from revelations about senior officials' ties to Jeffrey Epstein, including the resignation of ambassador Peter Mandelson.", "detail": "The challenge, which had been building for months, exposed deep unease within Labour's ranks over Starmer's judgment and handling of the Mandelson affair. Allies say the prime minister has bought himself time, but pressure is expected to resurface if his poll numbers do not recover before the next electoral test.", "terms": [{"match": "Jeffrey Epstein", "id": "epstein-uk-fallout"}]}, "it": {"title": "Starmer resiste alla sfida interna alla leadership laburista ma esce indebolito", "summary": "Il primo ministro britannico Keir Starmer ha per ora respinto una sfida interna alla leadership del Partito Laburista, ma resta politicamente indebolito dalle ricadute delle rivelazioni sui legami di alti funzionari con Jeffrey Epstein, incluse le dimissioni dell'ambasciatore Peter Mandelson.", "detail": "La sfida, che si preparava da mesi, ha messo a nudo un profondo malessere tra le file laburiste riguardo al giudizio di Starmer e alla gestione del caso Mandelson. Gli alleati affermano che il premier si è guadagnato tempo, ma la pressione dovrebbe riemergere se i sondaggi non si riprenderanno prima del prossimo test elettorale.", "terms": [{"match": "Jeffrey Epstein", "id": "epstein-uk-fallout"}]}}, {"id": "europe-wildfires-evacuations-aug12", "date": "2026-08-12", "country": "EU", "category": "Social", "topics": [], "sources": [{"name": "NBC News", "url": "https://www.nbcnews.com/world/europe/europes-wildfire-crisis-shifts-french-return-new-blazes-rcna590350", "reliability": 4}, {"name": "Washington Post", "url": "https://www.washingtonpost.com/world/2026/08/02/wildfires-france-greece-provence-firebreak-evacuation/91dfc95a-8e5c-11f1-9fdc-0a725c989a7b_story.html", "reliability": 4}], "en": {"title": "Wildfires force fresh evacuations in France and Greece amid heatwave", "summary": "New wildfires broke out in southern France and Greece as the region's prolonged heatwave continues, forcing renewed evacuations even as roughly 200,000 people who had earlier fled returned home in France.", "detail": "Firefighters battled fast-moving blazes fanned by strong winds and tinder-dry vegetation, with authorities warning conditions remain extremely volatile after weeks of record heat. The fires come just days after Western Europe logged a new all-time temperature record, part of what meteorologists describe as an increasingly severe summer wildfire season.", "terms": []}, "it": {"title": "Gli incendi costringono a nuove evacuazioni in Francia e Grecia durante l'ondata di calore", "summary": "Nuovi incendi sono scoppiati nel sud della Francia e in Grecia mentre prosegue la prolungata ondata di calore nella regione, costringendo a nuove evacuazioni proprio mentre circa 200.000 persone fuggite in precedenza in Francia facevano ritorno a casa.", "detail": "I vigili del fuoco hanno combattuto incendi in rapida propagazione alimentati da venti forti e vegetazione secchissima, mentre le autorità avvertono che le condizioni restano estremamente instabili dopo settimane di caldo record. Gli incendi arrivano pochi giorni dopo che l'Europa occidentale ha registrato un nuovo record di temperatura assoluto, in quella che i meteorologi descrivono come una stagione degli incendi estivi sempre più severa.", "terms": []}}, {"id": "ebola-drc-outbreak-intensifying-aug12", "date": "2026-08-12", "country": "DR Congo", "category": "Medicine", "topics": [], "sources": [{"name": "MedicalXpress (WHO)", "url": "https://medicalxpress.com/news/2026-08-outbreak-dr-congo.html", "reliability": 3}, {"name": "UN News", "url": "https://news.un.org/en/story/2026/08/1168064", "reliability": 5}], "en": {"title": "WHO says DR Congo's Ebola outbreak is 'intensifying', not slowing", "summary": "The World Health Organization has warned that the record Ebola outbreak in the Democratic Republic of Congo is intensifying rather than coming under control, as a new treatment centre opens in the outbreak's epicentre to try to keep pace with rising case numbers.", "detail": "WHO officials said transmission chains are multiplying faster than response teams can trace them, particularly in remote areas with weak health infrastructure. The new centre, opened with support from international health agencies, adds badly needed isolation and treatment capacity, but officials cautioned it will not be enough on its own to reverse the outbreak's trajectory without faster case detection.", "terms": [{"match": "Ebola", "id": "ebola"}]}, "it": {"title": "L'OMS afferma che il focolaio di Ebola in RD Congo si sta 'intensificando', non rallentando", "summary": "L'Organizzazione Mondiale della Sanità ha avvertito che il focolaio record di Ebola nella Repubblica Democratica del Congo si sta intensificando anziché essere sotto controllo, mentre un nuovo centro di cura apre nell'epicentro del focolaio per cercare di tenere il passo con l'aumento dei casi.", "detail": "I funzionari dell'OMS affermano che le catene di trasmissione si moltiplicano più rapidamente di quanto i team di risposta riescano a tracciarle, in particolare nelle aree remote con infrastrutture sanitarie deboli. Il nuovo centro, aperto con il sostegno di agenzie sanitarie internazionali, aggiunge una capacità di isolamento e cura molto necessaria, ma i funzionari avvertono che da sola non basterà a invertire la traiettoria del focolaio senza un'individuazione più rapida dei casi.", "terms": [{"match": "Ebola", "id": "ebola"}]}}, {"id": "ukraine-izmail-port-strike-aug13", "date": "2026-08-13", "country": "Ukraine", "category": "Geopolitics", "topics": ["russia-ukraine"], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/13/russian-strike-sparks-fire-at-ukraine-port-zelenskyy-seeks-interceptors", "reliability": 4}, {"name": "France 24", "url": "https://www.france24.com/en/europe/20260813-live-russian-attack-sets-ablaze-ukraine-s-izmail-port-infrastructure", "reliability": 4}], "en": {"title": "Russian strike sets Ukraine's Izmail port ablaze as Zelenskyy pleads for interceptors", "summary": "A Russian strike sparked a fire at Ukraine's Izmail port on the Danube, a day after Kyiv hit a major Russian oil port. President Zelenskyy said Ukraine needs 5% of the US Patriot interceptor stockpile to survive the winter, warning supplies are half of last year's levels.", "detail": "Izmail, Ukraine's largest Danube river port near the Romanian border, handles vital grain and commodity exports that bypass the blockaded Black Sea route. Zelenskyy told CNN that Ukraine now has two-and-a-half times fewer interceptors than in 2025, while Russia fires roughly twice as many ballistic missiles per month as before. The shortage has worsened since February 2026, when Washington diverted air-defense supplies toward the US-Israel war on Iran, leaving Kyiv more exposed to the kind of deep strikes hitting its rear infrastructure.", "terms": [{"match": "Izmail port", "id": "izmail-port"}, {"match": "Patriot interceptor", "id": "patriot"}]}, "it": {"title": "Un attacco russo incendia il porto ucraino di Izmail mentre Zelensky chiede intercettori", "summary": "Un attacco russo ha provocato un incendio al porto ucraino di Izmail sul Danubio, un giorno dopo che Kyiv aveva colpito un importante porto petrolifero russo. Il presidente Zelensky ha detto che l'Ucraina ha bisogno del 5% delle scorte statunitensi di intercettori Patriot per superare l'inverno, avvertendo che le forniture sono la metà rispetto all'anno scorso.", "detail": "Izmail, il più grande porto ucraino sul Danubio vicino al confine con la Romania, gestisce esportazioni vitali di grano e materie prime che aggirano la rotta bloccata del Mar Nero. Zelensky ha detto alla CNN che l'Ucraina ha ora due volte e mezzo meno intercettori rispetto al 2025, mentre la Russia lancia circa il doppio dei missili balistici al mese rispetto a prima. La carenza è peggiorata da febbraio 2026, quando Washington ha dirottato le forniture di difesa aerea verso la guerra USA-Israele contro l'Iran, lasciando Kyiv più esposta agli attacchi in profondità contro le sue infrastrutture nelle retrovie.", "terms": [{"match": "porto ucraino di Izmail", "id": "izmail-port"}, {"match": "intercettori Patriot", "id": "patriot"}]}}, {"id": "westbank-qusra-settler-siege-aug13", "date": "2026-08-13", "country": "Palestine", "category": "Geopolitics", "topics": ["israel-palestine"], "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/08/13/g-s1-138574/us-west-bank-settlers", "reliability": 5}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/13/israeli-settlers-besiege-three-palestinian-families-in-occupied-west-bank", "reliability": 4}], "en": {"title": "US ambassador calls Israeli settler siege of West Bank homes an 'act of terror'", "summary": "Extremist Israeli settlers have besieged three Palestinian families inside their homes in Qusra, in the occupied West Bank, for a fourth straight day, prompting the US ambassador to call it a 'horrific act of terror.' Israeli forces have moved to evacuate residents while the settlers refuse to leave.", "detail": "Israeli troops reportedly demolished makeshift settler structures near the besieged homes, but residents said soldiers also told them to leave their own houses rather than removing the settlers first. The US envoy said Washington was 'very' involved in efforts to end the siege. A separate poll found 38% of Jewish Israelis now support annexing the entire West Bank, while 58% expressed skepticism that Hamas will actually disarm under the ceasefire framework.", "terms": [{"match": "Qusra", "id": "qusra"}, {"match": "occupied West Bank", "id": "west-bank"}]}, "it": {"title": "L'ambasciatore USA definisce l'assedio dei coloni israeliani in Cisgiordania un 'atto di terrore'", "summary": "Coloni israeliani estremisti assediano da quattro giorni consecutivi tre famiglie palestinesi nelle loro case a Qusra, in Cisgiordania occupata, spingendo l'ambasciatore statunitense a definirlo un 'orribile atto di terrore'. Le forze israeliane si sono mosse per evacuare i residenti mentre i coloni si rifiutano di andarsene.", "detail": "Le truppe israeliane avrebbero demolito strutture improvvisate dei coloni vicino alle case assediate, ma i residenti affermano che i soldati hanno detto anche a loro di lasciare le proprie abitazioni invece di allontanare prima i coloni. L'inviato statunitense ha detto che Washington è 'molto' coinvolta negli sforzi per porre fine all'assedio. Un sondaggio separato ha rilevato che il 38% degli israeliani ebrei sostiene ora l'annessione dell'intera Cisgiordania, mentre il 58% si è detto scettico sul fatto che Hamas si disarmi realmente nell'ambito del quadro del cessate il fuoco.", "terms": [{"match": "Qusra", "id": "qusra"}, {"match": "Cisgiordania occupata", "id": "west-bank"}]}}, {"id": "sudan-rsf-drone-attacks-aug13", "date": "2026-08-13", "country": "Sudan", "category": "Geopolitics", "topics": [], "sources": [{"name": "The National", "url": "https://www.thenationalnews.com/news/mena/2026/08/12/suspected-rsf-drones-attack-areas-in-sudan-including-khartoum-and-al-obeid/", "reliability": 3}, {"name": "U.S. News & World Report (Reuters)", "url": "https://www.usnews.com/news/world/articles/2026-08-12/rsf-renews-assault-on-sudans-al-obeid-as-drones-strike-capital-witnesses-say", "reliability": 4}], "en": {"title": "Suspected RSF drones strike Khartoum and Al-Obeid for a second straight day", "summary": "Drones believed to belong to Sudan's paramilitary Rapid Support Forces struck Khartoum's Omdurman district, Bahri, Atbara and the city of Al-Obeid, killing at least two people, as Sudan's civil war enters its fourth year with 14 million people displaced and 20 million facing hunger.", "detail": "Residents reported drones flying over the capital before dawn followed by loud explosions and columns of black smoke; in Al-Obeid, the apparent target was a base housing the army's Fifth Infantry Division. The attacks followed the RSF's announced capture of Qayssan in Blue Nile state and army advances in Kordofan the previous month, underlining how the conflict between the Sudanese army and the RSF keeps escalating despite repeated international calls for a ceasefire.", "terms": [{"match": "Rapid Support Forces", "id": "rsf"}]}, "it": {"title": "Presunti droni delle RSF colpiscono Khartoum e Al-Obeid per il secondo giorno consecutivo", "summary": "Droni ritenuti appartenere alle paramilitari Forze di Supporto Rapido del Sudan hanno colpito il distretto di Omdurman a Khartoum, Bahri, Atbara e la città di Al-Obeid, uccidendo almeno due persone, mentre la guerra civile sudanese entra nel suo quarto anno con 14 milioni di sfollati e 20 milioni di persone che affrontano la fame.", "detail": "I residenti hanno riferito di droni sulla capitale prima dell'alba seguiti da forti esplosioni e colonne di fumo nero; ad Al-Obeid l'obiettivo apparente era una base che ospita la Quinta Divisione di Fanteria dell'esercito. Gli attacchi sono seguiti alla presa annunciata di Qayssan nello stato del Nilo Azzurro da parte delle RSF e agli avanzamenti dell'esercito in Kordofan il mese precedente, a conferma di come il conflitto tra l'esercito sudanese e le RSF continui ad aggravarsi nonostante i ripetuti appelli internazionali per un cessate il fuoco.", "terms": [{"match": "Forze di Supporto Rapido", "id": "rsf"}]}}, {"id": "us-cpi-cools-july-aug13", "date": "2026-08-13", "country": "USA", "category": "Economy", "topics": ["mercato-investimenti"], "sources": [{"name": "CNBC", "url": "https://www.cnbc.com/2026/08/12/cpi-inflation-report-july-2026.html", "reliability": 4}, {"name": "CBS News", "url": "https://www.cbsnews.com/news/july-cpi-report-inflation-fed-rates/", "reliability": 4}], "en": {"title": "US inflation cools slightly to 3.4% in July as core prices ease", "summary": "US annual inflation eased to 3.4% in July, down from May's 4.2% peak, giving the Federal Reserve more room to hold interest rates steady in September even as energy prices surged nearly 15% on Strait of Hormuz and Red Sea shipping disruptions.", "detail": "Core inflation, which excludes food and energy, slipped to 2.5% from 2.6% in June. Gasoline prices alone jumped 24.6% annually after crude oil broke above $100 a barrel in late July amid the Gulf shipping crisis. Economist Heather Long said the report 'gives new Fed Chair Kevin Warsh some cover to wait and see what happens this fall,' though one more inflation report lands before the Fed's September 16 decision, and wage growth of 3.2% still trails price increases overall.", "terms": [{"match": "annual inflation", "id": "cpi"}]}, "it": {"title": "L'inflazione USA rallenta leggermente al 3,4% a luglio mentre i prezzi core si allentano", "summary": "L'inflazione annua statunitense è scesa al 3,4% a luglio, dal picco del 4,2% di maggio, dando alla Federal Reserve più margine per mantenere i tassi d'interesse invariati a settembre, anche se i prezzi dell'energia sono balzati di quasi il 15% a causa delle interruzioni del traffico marittimo nello Stretto di Hormuz e nel Mar Rosso.", "detail": "L'inflazione core, che esclude alimentari ed energia, è scesa al 2,5% dal 2,6% di giugno. Solo il prezzo della benzina è salito del 24,6% su base annua dopo che il greggio ha superato i 100 dollari al barile a fine luglio a causa della crisi delle spedizioni nel Golfo. L'economista Heather Long ha detto che il rapporto 'dà al nuovo presidente della Fed Kevin Warsh una copertura per aspettare e vedere cosa succede in autunno', anche se un altro rapporto sull'inflazione arriverà prima della decisione della Fed del 16 settembre, e la crescita salariale del 3,2% resta comunque inferiore all'aumento generale dei prezzi.", "terms": [{"match": "inflazione annua", "id": "cpi"}]}}, {"id": "anthropic-decart-acquisition-aug13", "date": "2026-08-13", "country": "USA", "category": "Technology", "topics": ["ai"], "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-13/anthropic-said-in-talks-to-buy-ai-startup-decart-for-6-billion", "reliability": 4}, {"name": "Fortune", "url": "https://fortune.com/2026/08/13/anthropic-said-in-talks-to-buy-startup-decart-for-6-billion/", "reliability": 4}], "en": {"title": "Anthropic in talks to buy Israeli AI startup Decart for $6 billion", "summary": "Anthropic is negotiating to acquire Decart, an Israeli startup specializing in real-time video AI and chip-efficiency software, for roughly $6 billion — what would be Anthropic's largest deal yet, ahead of a possible IPO.", "detail": "Decart, founded in 2023 by three Israeli engineers, builds 'world models' that simulate physical environments; its Lucy AI model can process live video feeds to generate synthetic footage in real time, used by e-commerce platforms and livestreamers. Anthropic is reportedly most interested in Decart's chip-efficiency technology, which could help its infrastructure absorb more inference demand as it and rivals like OpenAI pour tens to hundreds of billions of dollars into data centers ahead of public listings.", "terms": [{"match": "Decart", "id": "decart-ai"}]}, "it": {"title": "Anthropic tratta l'acquisto della startup israeliana Decart per 6 miliardi di dollari", "summary": "Anthropic sta negoziando l'acquisizione di Decart, una startup israeliana specializzata in intelligenza artificiale video in tempo reale e software di efficienza dei chip, per circa 6 miliardi di dollari — quella che sarebbe la più grande acquisizione mai fatta da Anthropic, in vista di una possibile IPO.", "detail": "Decart, fondata nel 2023 da tre ingegneri israeliani, sviluppa 'modelli del mondo' che simulano ambienti fisici; il suo modello Lucy AI può elaborare flussi video in diretta per generare filmati sintetici in tempo reale, usato da piattaforme di e-commerce e streamer. Anthropic sarebbe interessata soprattutto alla tecnologia di efficienza dei chip di Decart, che potrebbe aiutare la sua infrastruttura ad assorbire più domanda di inferenza, mentre l'azienda e rivali come OpenAI investono decine o centinaia di miliardi di dollari in data center in vista di una quotazione in borsa.", "terms": [{"match": "Decart", "id": "decart-ai"}]}}, {"id": "leavitt-steps-down-aug13", "date": "2026-08-13", "country": "USA", "category": "Politics", "topics": ["politica-internazionale"], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/12/trump-reveals-karoline-leavitt-to-step-down-as-white-house-press-secretary", "reliability": 4}, {"name": "NBC News", "url": "https://www.nbcnews.com/politics/white-house/press-secretary-karoline-leavitt-step-down-end-of-august-rcna592223", "reliability": 4}], "en": {"title": "Karoline Leavitt, youngest-ever White House press secretary, to step down", "summary": "White House press secretary Karoline Leavitt, who became the youngest person to hold the job at 27, will step down at the end of August to spend more time with her newborn daughter, President Trump announced, praising her as a 'phenomenal' spokesperson.", "detail": "Leavitt took maternity leave in late April after the birth of her second child, a daughter named Viviana, and returned to briefings in mid-July before deciding to leave the role entirely. Trump said she would remain 'one of his top outside advisers' and an influential voice within the Republican Party. No successor has yet been named, and the departure adds to a broader wave of staffing changes across Trump's second-term White House.", "terms": [{"match": "White House press secretary", "id": "leavitt-departure"}]}, "it": {"title": "Karoline Leavitt, la più giovane portavoce della Casa Bianca di sempre, lascerà l'incarico", "summary": "La portavoce della Casa Bianca Karoline Leavitt, diventata a 27 anni la persona più giovane a ricoprire questo ruolo, lascerà l'incarico a fine agosto per dedicare più tempo alla figlia appena nata, ha annunciato il presidente Trump, definendola una portavoce 'fenomenale'.", "detail": "Leavitt aveva preso il congedo di maternità a fine aprile dopo la nascita della sua seconda figlia, Viviana, ed era tornata a condurre i briefing a metà luglio prima di decidere di lasciare del tutto l'incarico. Trump ha detto che rimarrà 'una delle sue principali consigliere esterne' e una voce influente all'interno del Partito Repubblicano. Non è stato ancora nominato un successore, e l'uscita si aggiunge a una più ampia ondata di cambiamenti nello staff della Casa Bianca del secondo mandato di Trump.", "terms": [{"match": "portavoce della Casa Bianca", "id": "leavitt-departure"}]}}, {"id": "gaza-cancer-patients-dying-aug13", "date": "2026-08-13", "country": "Palestine", "category": "Social", "topics": ["israel-palestine"], "sources": [{"name": "RNZ", "url": "https://www.rnz.co.nz/news/world/996705/gaza-cancer-patients-face-rising-death-rate-amid-israeli-curbs-doctors-say", "reliability": 4}, {"name": "U.S. News & World Report (Reuters)", "url": "https://www.usnews.com/news/world/articles/2026-08-13/gaza-cancer-patients-face-rising-death-rate-amid-israeli-curbs-doctors-say", "reliability": 4}], "en": {"title": "Gaza's cancer patients are dying at two to three times the pre-war rate, doctors say", "summary": "Doctors in Gaza say cancer patients are now dying at two to three times the rate seen before the war, after Israel's destruction of the strip's only specialized cancer hospital left roughly 17,000 patients without local access to chemotherapy.", "detail": "Physicians describe patients whose tumors have gone untreated for months as treatment options collapsed alongside Gaza's healthcare system; many cannot afford the cost, paperwork or risk of travelling abroad for care through Israeli-controlled crossings. The World Health Organization has repeatedly flagged Gaza's healthcare collapse as one of the least visible consequences of the war, overshadowed by the daily strikes but leaving a growing, uncounted toll among patients with chronic and non-combat illnesses.", "terms": [{"match": "specialized cancer hospital", "id": "gaza-healthcare-collapse"}]}, "it": {"title": "I malati di cancro a Gaza muoiono al doppio o triplo del tasso pre-bellico, dicono i medici", "summary": "I medici a Gaza affermano che i pazienti oncologici muoiono ora a un tasso da due a tre volte superiore rispetto a prima della guerra, dopo che la distruzione da parte israeliana dell'unico ospedale oncologico specializzato della Striscia ha lasciato circa 17.000 pazienti senza accesso locale alla chemioterapia.", "detail": "I medici descrivono pazienti i cui tumori non vengono curati da mesi, mentre le opzioni di trattamento sono crollate insieme al sistema sanitario di Gaza; molti non possono permettersi il costo, la burocrazia o il rischio di viaggiare all'estero per curarsi attraverso i valichi controllati da Israele. L'Organizzazione Mondiale della Sanità ha più volte segnalato il collasso sanitario di Gaza come una delle conseguenze meno visibili della guerra, oscurata dagli attacchi quotidiani ma che lascia un bilancio crescente e non conteggiato tra i pazienti con malattie croniche e non legate ai combattimenti.", "terms": [{"match": "ospedale oncologico specializzato", "id": "gaza-healthcare-collapse"}]}}, {"id": "ebola-drc-2000-deaths-aug13", "date": "2026-08-13", "country": "DR Congo", "category": "Medicine", "topics": [], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/11/drc-ebola-death-toll-passes-2000-amid-fastest-growing-outbreak-on-record", "reliability": 4}, {"name": "NBC News", "url": "https://www.nbcnews.com/world/africa/congo-says-2000-people-died-ebola-outbreak-fastest-growing-record-rcna591872", "reliability": 4}], "en": {"title": "DR Congo's Ebola death toll passes 2,000 in the fastest-growing outbreak on record", "summary": "The Democratic Republic of Congo's Ebola outbreak has passed 2,000 deaths among more than 4,380 confirmed cases, with at least 1,000 deaths in just the last three weeks, as the WHO calls it the fastest-growing outbreak on record in the country.", "detail": "Officials say strikes by unpaid health workers, misinformation and traditional burial practices are complicating containment efforts, and there is still no approved vaccine or treatment for the rare Bundibugyo strain driving the outbreak, though trials are underway. The epidemic remains the second-largest Ebola outbreak in history, behind only the 2014-2016 West African outbreak that killed more than 11,000 people.", "terms": [{"match": "Bundibugyo strain", "id": "bundibugyo"}]}, "it": {"title": "Il bilancio dell'Ebola in RD Congo supera i 2.000 morti nel focolaio a crescita più rapida mai registrato", "summary": "Il focolaio di Ebola nella Repubblica Democratica del Congo ha superato i 2.000 morti su oltre 4.380 casi confermati, con almeno 1.000 decessi solo nelle ultime tre settimane, mentre l'OMS lo definisce il focolaio a crescita più rapida mai registrato nel paese.", "detail": "I funzionari affermano che gli scioperi degli operatori sanitari non pagati, la disinformazione e le pratiche funerarie tradizionali stanno complicando gli sforzi di contenimento, e non esiste ancora un vaccino o un trattamento approvato per il raro ceppo Bundibugyo alla base del focolaio, anche se sono in corso sperimentazioni. L'epidemia resta il secondo più grande focolaio di Ebola della storia, dietro solo a quello dell'Africa occidentale del 2014-2016 che uccise oltre 11.000 persone.", "terms": [{"match": "ceppo Bundibugyo", "id": "bundibugyo"}]}}, {"id": "ustluga-drone-strike-aug14", "date": "2026-08-14", "country": "Russia", "category": "Geopolitics", "topics": ["russia-ukraine"], "sources": [{"name": "Kyiv Independent", "url": "https://kyivindependent.com/port-infrastructure-damaged-in-ukrainian-strike-on-russias-leningrad-oblast-governor-reports/", "reliability": 3}, {"name": "The Moscow Times", "url": "https://www.themoscowtimes.com/2026/08/14/fire-breaks-out-at-ust-luga-port-after-ukrainian-drone-attack-a93495", "reliability": 4}], "en": {"title": "Ukrainian drones spark fire at Russia's Ust-Luga oil port", "summary": "A Ukrainian drone strike hit the Ust-Luga port on Russia's Baltic coast, sparking a fire at the major oil export terminal. Russia's governor said air defenses shot down more than 50 drones over the Leningrad region overnight.", "detail": "Firefighters extinguished the blaze by morning and no casualties were reported, though the governor gave no details on the extent of the damage. The strike is part of Ukraine's sustained campaign against Russian energy infrastructure, which has repeatedly targeted Ust-Luga and other oil terminals to squeeze Moscow's export revenue; the same night also saw strikes on a Wildberries warehouse and a refinery shutdown in Bashkortostan.", "terms": [{"match": "Ust-Luga", "id": "ustluga"}]}, "it": {"title": "Droni ucraini innescano un incendio al porto petrolifero russo di Ust-Luga", "summary": "Un attacco con droni ucraini ha colpito il porto di Ust-Luga sulla costa baltica russa, innescando un incendio nel grande terminal petrolifero. Il governatore russo ha detto che la difesa aerea ha abbattuto oltre 50 droni sulla regione di Leningrado durante la notte.", "detail": "I vigili del fuoco hanno spento l'incendio entro mattina e non sono state segnalate vittime, anche se il governatore non ha fornito dettagli sull'entità dei danni. L'attacco fa parte della campagna ucraina contro le infrastrutture energetiche russe, che ha già colpito più volte Ust-Luga e altri terminal petroliferi per ridurre le entrate da export di Mosca; la stessa notte ha visto anche colpi su un magazzino Wildberries e lo stop di una raffineria in Baschiria.", "terms": [{"match": "Ust-Luga", "id": "ustluga"}]}}, {"id": "sudan-rsf-kurmuk-aug14", "date": "2026-08-14", "country": "Sudan", "category": "Geopolitics", "topics": [], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/13/sudan-army-says-rsf-advance-on-key-town-bordering-ethiopia", "reliability": 4}, {"name": "The National", "url": "https://www.thenationalnews.com/news/mena/2026/08/13/sudans-rsf-says-it-captured-key-town-near-ethiopian-and-south-sudan-borders/", "reliability": 3}], "en": {"title": "Sudan's RSF claims capture of strategic border town of Al Kurmuk", "summary": "Sudan's paramilitary Rapid Support Forces said it captured Al Kurmuk, a town in Blue Nile state near the Ethiopian and South Sudanese borders, pushing out army forces and seizing weapons and ammunition.", "detail": "Al Kurmuk lies less than 140km from the Blue Nile state capital Damazin and about 160km from the Roseires Dam, a key national power source, making the loss strategically significant for the army. Sudan's civil war, now in its fourth year, has killed tens of thousands and displaced roughly 14 million people, with the UN calling it the world's worst humanitarian crisis and around 20 million people facing severe hunger.", "terms": [{"match": "Rapid Support Forces", "id": "rsf"}]}, "it": {"title": "Le RSF sudanesi rivendicano la conquista della città strategica di confine Al Kurmuk", "summary": "Le Rapid Support Forces paramilitari sudanesi affermano di aver conquistato Al Kurmuk, una città dello stato del Nilo Azzurro vicino ai confini con Etiopia e Sud Sudan, respingendo le forze dell'esercito e sequestrando armi e munizioni.", "detail": "Al Kurmuk si trova a meno di 140 km dalla capitale dello stato del Nilo Azzurro, Damazin, e a circa 160 km dalla diga di Roseires, una fonte energetica nazionale chiave, rendendo la perdita strategicamente rilevante per l'esercito. La guerra civile sudanese, ormai al quarto anno, ha ucciso decine di migliaia di persone e sfollato circa 14 milioni di persone; l'ONU la definisce la peggiore crisi umanitaria al mondo, con circa 20 milioni di persone che soffrono la fame grave.", "terms": [{"match": "Rapid Support Forces", "id": "rsf"}]}}, {"id": "us-iran-economic-isolation-aug14", "date": "2026-08-14", "country": "USA", "category": "Economy", "topics": ["mercato-investimenti", "us-iran"], "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-14/us-to-roll-out-economic-isolation-plan-for-iran-next-week", "reliability": 4}, {"name": "The Irish Times", "url": "https://www.irishtimes.com/world/middle-east/2026/08/14/us-to-roll-out-economic-isolation-plan-for-iran-next-week/", "reliability": 4}], "en": {"title": "US Treasury unveils plan for 'unprecedented' economic isolation of Iran", "summary": "Treasury Secretary Scott Bessent said Washington will roll out detailed measures next week for what he called economic isolation of Iran \"like has never been seen,\" alongside a continued naval blockade of Iranian ports. Oil prices dipped on the news, with Brent trading near $87 a barrel.", "detail": "Bessent framed the plan as a 'one-two punch' combining new sanctions with the existing blockade, aiming to pressure Tehran after its economy already suffered from reduced industrial output and curtailed crude exports during the conflict. Talks over reopening the Strait of Hormuz remain stalled, though Iran's foreign minister said a separate shipping arrangement with Oman was 'very close.'", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "Il Tesoro USA annuncia un piano di isolamento economico \"senza precedenti\" per l'Iran", "summary": "Il segretario al Tesoro Scott Bessent ha detto che Washington presenterà la prossima settimana misure dettagliate per quello che ha definito un isolamento economico dell'Iran \"mai visto prima\", insieme al blocco navale dei porti iraniani già in corso. Il prezzo del petrolio è sceso sulla notizia, con il Brent scambiato vicino a 87 dollari al barile.", "detail": "Bessent ha descritto il piano come un \"colpo doppio\" che combina nuove sanzioni con il blocco esistente, per aumentare la pressione su Teheran dopo che la sua economia ha già sofferto per il calo della produzione industriale e delle esportazioni di greggio durante il conflitto. I negoziati per la riapertura dello Stretto di Hormuz restano bloccati, anche se il ministro degli Esteri iraniano ha detto che un accordo separato sulla navigazione con l'Oman è \"molto vicino\".", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}]}}, {"id": "google-pixel11-gemini-aug14", "date": "2026-08-14", "country": "USA", "category": "Technology", "topics": ["ai"], "sources": [{"name": "CNBC", "url": "https://www.cnbc.com/2026/08/12/google-pixel-11-gemini-ai-phone-apple.html", "reliability": 4}, {"name": "TechCrunch", "url": "https://techcrunch.com/2026/08/12/pixel-11-has-few-hardware-changes-and-more-gemini/", "reliability": 4}], "en": {"title": "Google launches Pixel 11 with Gemini AI at its core, taking aim at Apple", "summary": "Google unveiled its Pixel 11 lineup, starting around $899, with only modest hardware changes but far deeper integration of its Gemini AI assistant, which can now handle agentic tasks like booking rides and ordering groceries directly from the phone.", "detail": "The launch intensifies the AI-phone rivalry with Apple, as Google bets that software-driven \"Gemini Intelligence\" features — rather than new chips or cameras — will differentiate its hardware. The Pixel 11 Pro starts at $1,099, with rising component costs contributing to higher prices across the lineup.", "terms": [{"match": "Gemini", "id": "gemini-model"}]}, "it": {"title": "Google lancia il Pixel 11 con Gemini al centro, puntando ad Apple", "summary": "Google ha presentato la gamma Pixel 11, a partire da circa 899 dollari, con cambiamenti hardware modesti ma un'integrazione molto più profonda del suo assistente AI Gemini, ora in grado di gestire compiti agentivi come prenotare corse o ordinare la spesa direttamente dal telefono.", "detail": "Il lancio intensifica la rivalità sugli smartphone AI con Apple, con Google che scommette su funzionalità software di \"Gemini Intelligence\" — più che su nuovi chip o fotocamere — per differenziare il proprio hardware. Il Pixel 11 Pro parte da 1.099 dollari, con l'aumento dei costi dei componenti che contribuisce a prezzi più alti in tutta la gamma.", "terms": [{"match": "Gemini", "id": "gemini-model"}]}}, {"id": "kushner-gaza-trip-aug14", "date": "2026-08-14", "country": "Israel", "category": "Politics", "topics": ["israel-palestine", "politica-internazionale"], "sources": [{"name": "Washington Post", "url": "https://www.washingtonpost.com/politics/2026/08/13/trump-kushner-gaza-board-of-peace-israel/1dd02eae-9778-11f1-9ef9-1be722184483_story.html", "reliability": 4}, {"name": "WTOP News (AP)", "url": "https://wtop.com/world/2026/08/jared-kushner-to-visit-israel-and-egypt-next-week-with-board-of-peace-officials-to-talk-gaza/", "reliability": 5}], "en": {"title": "Kushner to visit Israel and Egypt to push Gaza disarmament plan", "summary": "Jared Kushner will travel to Israel this weekend, joined by Board of Peace officials including Tony Blair, before meeting mediators in Cairo, in his first trip to the region since January, aiming to advance the plan for Hamas disarmament and Gaza reconstruction.", "detail": "The visit comes days after Prime Minister Netanyahu publicly rejected key terms of the Board of Peace's 15-point roadmap, saying Israeli troops will not withdraw until Hamas is fully disarmed. A US official said Washington understands Netanyahu's domestic political pressures as long as he keeps cooperating on the ground, where Israel has reduced strikes and repositioned forces as agreed.", "terms": [{"match": "Board of Peace", "id": "board-of-peace"}]}, "it": {"title": "Kushner in visita in Israele ed Egitto per spingere il piano di disarmo a Gaza", "summary": "Jared Kushner si recherà in Israele questo fine settimana, insieme a funzionari del Board of Peace tra cui Tony Blair, prima di incontrare i mediatori al Cairo, nel suo primo viaggio nella regione da gennaio, per far avanzare il piano di disarmo di Hamas e ricostruzione di Gaza.", "detail": "La visita arriva pochi giorni dopo che il premier Netanyahu ha respinto pubblicamente punti chiave della roadmap in 15 punti del Board of Peace, dicendo che le truppe israeliane non si ritireranno finché Hamas non sarà completamente disarmato. Un funzionario USA ha detto che Washington comprende le pressioni politiche interne di Netanyahu finché continuerà a cooperare sul terreno, dove Israele ha ridotto gli attacchi e riposizionato le forze come concordato.", "terms": [{"match": "Board of Peace", "id": "board-of-peace"}]}}, {"id": "greece-wildfire-sea-evacuation-aug14", "date": "2026-08-14", "country": "EU", "category": "Social", "topics": [], "sources": [{"name": "France 24 (AFP)", "url": "https://www.france24.com/en/live-news/20260813-tourists-rescued-by-boat-as-forest-fire-threatens-greek-beaches", "reliability": 4}, {"name": "Euronews", "url": "https://www.euronews.com/my-europe/2026/08/14/wall-of-fire-forces-sea-evacuation-in-greece-as-wildfires-continue-across-europe", "reliability": 4}], "en": {"title": "Wildfire forces sea evacuation of tourists on Greek beaches as blazes rage across Europe", "summary": "A fast-moving wildfire on Greece's Halkidiki peninsula forced roughly 500 tourists to be evacuated by boat from the resorts of Siviri and Fourka, as similar blazes burned across Croatia, France and the UK amid the continent's prolonged summer heatwave.", "detail": "Two firefighters were hospitalized in Greece, while Croatia's fire displaced more than 1,000 residents and the UK reported several people hospitalized for burns and smoke inhalation. Nearly three-quarters of England is now in drought conditions, and French fire unions have threatened strikes in September over inadequate resources as the wildfire season stretches on.", "terms": [{"match": "Halkidiki", "id": "halkidiki"}]}, "it": {"title": "Un incendio costringe all'evacuazione via mare i turisti sulle spiagge greche mentre le fiamme divampano in Europa", "summary": "Un incendio a rapida propagazione nella penisola greca di Halkidiki ha costretto all'evacuazione via mare circa 500 turisti dalle località di Siviri e Fourka, mentre incendi simili bruciavano in Croazia, Francia e Regno Unito nel mezzo della lunga ondata di caldo estiva del continente.", "detail": "Due vigili del fuoco sono stati ricoverati in Grecia, mentre l'incendio in Croazia ha sfollato oltre 1.000 residenti e nel Regno Unito diverse persone sono state ricoverate per ustioni e inalazione di fumo. Quasi tre quarti dell'Inghilterra si trova ora in condizioni di siccità, e i sindacati dei vigili del fuoco francesi hanno minacciato scioperi a settembre per le risorse insufficienti mentre la stagione degli incendi si prolunga.", "terms": [{"match": "Halkidiki", "id": "halkidiki"}]}}, {"id": "drc-ebola-sixth-province-aug14", "date": "2026-08-14", "country": "DR Congo", "category": "Medicine", "topics": [], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/13/dr-congo-ebola-outbreak-spreads-to-a-sixth-province", "reliability": 4}, {"name": "PBS NewsHour (AP)", "url": "https://www.pbs.org/newshour/world/ebola-outbreak-has-spread-to-new-province-in-congo-the-head-of-africa-cdc-says", "reliability": 5}], "en": {"title": "DR Congo's Ebola outbreak spreads to a sixth province as toll passes 2,100 deaths", "summary": "The Bundibugyo-strain Ebola outbreak in the Democratic Republic of Congo has reached Bas-Uele, its sixth affected province, after a man who traveled from Haut-Uele died in the town of Buta. Confirmed cases now stand at 4,566, with 2,128 deaths.", "detail": "WHO Director-General Tedros Adhanom Ghebreyesus warned the outbreak is \"on track to surpass the deadliest on record,\" which killed more than 11,000 people a decade ago, while Africa CDC head Jean Kaseya cautioned that without a change of course it could last more than a year and become the largest ever. Clinical trials of two treatments and two vaccine candidates specifically designed for the Bundibugyo strain are underway, but none is yet approved.", "terms": [{"match": "Bundibugyo-strain", "id": "bundibugyo"}]}, "it": {"title": "Il focolaio di Ebola in RD Congo si estende a una sesta provincia mentre il bilancio supera 2.100 morti", "summary": "Il focolaio di Ebola del ceppo Bundibugyo nella Repubblica Democratica del Congo ha raggiunto il Bas-Uele, sesta provincia colpita, dopo la morte nella città di Buta di un uomo arrivato dall'Haut-Uele. I casi confermati sono ora 4.566, con 2.128 morti.", "detail": "Il direttore generale dell'OMS Tedros Adhanom Ghebreyesus ha avvertito che il focolaio è \"sulla buona strada per superare il più mortale mai registrato\", che uccise oltre 11.000 persone un decennio fa, mentre il capo di Africa CDC Jean Kaseya ha avvertito che senza un cambio di rotta potrebbe durare più di un anno e diventare il più grande di sempre. Sono in corso sperimentazioni cliniche di due trattamenti e due candidati vaccini progettati appositamente per il ceppo Bundibugyo, ma nessuno è ancora approvato.", "terms": [{"match": "ceppo Bundibugyo", "id": "bundibugyo"}]}}, {"id": "ukraine-mass-drone-strike-aug16", "date": "2026-08-16", "country": "Russia", "category": "Geopolitics", "topics": ["russia-ukraine"], "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/08/16/nx-s1-5933006/ukraine-aerial-attack-6-dead-russia", "reliability": 5}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/16/russian-strikes-kill-ukrainian-woman-as-nato-jet-downs-drone-over-romania", "reliability": 4}], "en": {"title": "Ukraine launches one of its largest drone attacks of the war on Russia", "summary": "Ukraine fired roughly 600 drones at the Moscow region and over 150 more at Rostov, killing six people and sparking fires including a blaze at a Wildberries warehouse near Podolsk. Russia said it downed 822 drones and retaliated with strikes on Kyiv, Sumy and Kryvyi Rih.", "detail": "An 83-year-old man died when a drone hit a home near Moscow, while five more people were killed in the Rostov region; the attack also damaged a railway station and triggered forest fires. Russia's overnight response killed at least three more people in Ukraine and injured dozens, underscoring how both sides keep trading deep strikes far from the front line even as diplomatic efforts for a ceasefire stall.", "terms": [{"match": "Wildberries warehouse", "id": "wildberries"}]}, "it": {"title": "L'Ucraina lancia uno dei più grandi attacchi con droni della guerra contro la Russia", "summary": "L'Ucraina ha lanciato circa 600 droni sulla regione di Mosca e oltre 150 su Rostov, uccidendo sei persone e provocando incendi, tra cui quello in un magazzino Wildberries vicino a Podolsk. La Russia ha detto di aver abbattuto 822 droni e ha risposto con attacchi su Kyiv, Sumy e Kryvyi Rih.", "detail": "Un uomo di 83 anni è morto quando un drone ha colpito una casa vicino a Mosca, mentre altre cinque persone sono state uccise nella regione di Rostov; l'attacco ha anche danneggiato una stazione ferroviaria e innescato incendi boschivi. La risposta russa nella notte ha ucciso almeno altre tre persone in Ucraina e ferito decine di persone, a conferma che entrambe le parti continuano a scambiarsi attacchi in profondità lontano dalla linea del fronte anche mentre gli sforzi diplomatici per un cessate il fuoco restano bloccati.", "terms": [{"match": "magazzino Wildberries", "id": "wildberries"}]}}, {"id": "kushner-hamas-cairo-meeting-aug16", "date": "2026-08-16", "country": "Israel", "category": "Politics", "topics": ["israel-palestine", "politica-internazionale"], "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/08/16/g-s1-138948/kushner-gaza-hamas-netanyahu-egypt-talks", "reliability": 5}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/16/kushner-meets-hamas-in-egypt-to-push-trumps-gaza-plan", "reliability": 4}], "en": {"title": "Kushner meets Hamas leader in Cairo before high-stakes Netanyahu talks", "summary": "US envoy Jared Kushner held a rare direct meeting with Hamas chief Khalil al-Hayya in Cairo, alongside Egyptian, Qatari and Turkish officials, before heading to Israel to press Netanyahu on the stalled Gaza disarmament roadmap.", "detail": "Kushner is set to meet Netanyahu together with former UK prime minister Tony Blair and Board of Peace director Nickolay Mladenov, after Netanyahu publicly rejected the Trump-backed plan. The 15-point roadmap requires Hamas to disarm and Israeli forces to withdraw from Gaza, but talks remain deadlocked: Hamas wants Israel to halt attacks and pull back first, while Netanyahu insists troops will stay until Hamas is fully disarmed, with Israeli forces still controlling roughly 60% of the territory. Saudi Arabia, the UAE, Jordan, Egypt, Qatar and Turkey jointly blamed Israel for obstructing the plan, adding regional pressure ahead of Netanyahu's own election in October.", "terms": [{"match": "Board of Peace", "id": "board-of-peace"}]}, "it": {"title": "Kushner incontra il leader di Hamas al Cairo prima del colloquio decisivo con Netanyahu", "summary": "L'inviato USA Jared Kushner ha avuto un raro incontro diretto con il capo di Hamas Khalil al-Hayya al Cairo, insieme a funzionari egiziani, qatarioti e turchi, prima di recarsi in Israele per fare pressione su Netanyahu sulla road map di disarmo di Gaza rimasta bloccata.", "detail": "Kushner incontrerà Netanyahu insieme all'ex primo ministro britannico Tony Blair e al direttore del Board of Peace Nickolay Mladenov, dopo che Netanyahu ha respinto pubblicamente il piano sostenuto da Trump. La road map in 15 punti richiede che Hamas si disarmi e che le forze israeliane si ritirino da Gaza, ma i negoziati restano in stallo: Hamas vuole che Israele fermi prima gli attacchi e si ritiri, mentre Netanyahu insiste che le truppe resteranno finché Hamas non sarà completamente disarmato, con le forze israeliane che controllano ancora circa il 60% del territorio. Arabia Saudita, Emirati, Giordania, Egitto, Qatar e Turchia hanno accusato congiuntamente Israele di ostacolare il piano, aumentando la pressione regionale in vista delle elezioni di ottobre in Israele.", "terms": [{"match": "Board of Peace", "id": "board-of-peace"}]}}, {"id": "us-canada-tariff-deadline-aug17", "date": "2026-08-17", "country": "Canada", "category": "Economy", "topics": ["mercato-investimenti"], "sources": [{"name": "Washington Post", "url": "https://www.washingtonpost.com/business/2026/08/15/canada-tariffs-trump-deadline/", "reliability": 4}, {"name": "BNN Bloomberg", "url": "https://www.bnnbloomberg.ca/tariffs/2026/08/14/anxious-canadian-firms-bet-trump-will-buckle-ahead-of-50-tariff-deadline/", "reliability": 4}], "en": {"title": "US and Canada race to strike a deal before 50% tariffs hit on August 19", "summary": "With a Trump-imposed deadline just two days away, Canadian and US negotiators are meeting in Washington to try to avert 50% tariffs on roughly $20 billion of Canadian goods, including dairy and down jackets, that would apply even to products meeting CUSMA trade-deal standards.", "detail": "The tariffs, invoked under Section 338 of the 1930 Trade Act, are framed by Washington as retaliation for Canadian provincial bans on US alcohol, Canada's dairy supply-management system and vehicle-import quotas. Canadian officials led by Trade Minister Dominic LeBlanc say talks with US Trade Representative Jamieson Greer have been 'constructive,' but Greer insists Canada must first lift its own retaliatory tariffs. Many Canadian businesses are betting Trump will pull back at the last minute rather than front-loading shipments.", "terms": [{"match": "Section 338", "id": "section-338"}]}, "it": {"title": "USA e Canada corrono per un accordo prima dei dazi al 50% del 19 agosto", "summary": "Con la scadenza imposta da Trump a soli due giorni, i negoziatori canadesi e statunitensi si incontrano a Washington per cercare di evitare dazi al 50% su circa 20 miliardi di dollari di merci canadesi, tra cui latticini e piumini, che si applicherebbero anche ai prodotti conformi agli standard dell'accordo commerciale CUSMA.", "detail": "I dazi, invocati ai sensi della Section 338 del Trade Act del 1930, sono presentati da Washington come ritorsione per i divieti provinciali canadesi sugli alcolici statunitensi, per il sistema canadese di gestione dell'offerta lattiero-casearia e per le quote sulle importazioni di veicoli. I funzionari canadesi, guidati dal ministro del Commercio Dominic LeBlanc, dicono che i colloqui con il rappresentante commerciale USA Jamieson Greer sono stati 'costruttivi', ma Greer insiste che il Canada debba prima revocare i propri dazi di ritorsione. Molte aziende canadesi scommettono che Trump farà marcia indietro all'ultimo momento invece di anticipare le spedizioni.", "terms": [{"match": "Section 338", "id": "section-338"}]}}, {"id": "tsmc-july-revenue-surge-aug10", "date": "2026-08-10", "country": "Taiwan", "category": "Technology", "topics": ["ai"], "sources": [{"name": "CNBC", "url": "https://www.cnbc.com/2026/08/10/tsmc-revenue-surge-ai-chip-big-tech.html", "reliability": 4}, {"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-10/tsmc-sales-rise-45-after-ai-spending-roars-on-despite-jitters", "reliability": 4}], "en": {"title": "TSMC's July revenue jumps 45% as AI chip demand defies market jitters", "summary": "Taiwan Semiconductor Manufacturing Company reported record July sales of NT$467.58 billion (about $15.4 billion), up 44.7% year-on-year, as Apple, Nvidia and other customers kept ordering advanced chips despite growing investor doubts about AI spending.", "detail": "TSMC, the world's largest contract chipmaker and a key supplier for Nvidia and Apple, has repeatedly raised its 2026 revenue and capital-expenditure forecasts this year on surging demand for AI accelerators and advanced packaging. The results add to a string of strong earnings across the chip sector, even as some investors warn that hundreds of billions of dollars in AI infrastructure spending may be outpacing near-term returns.", "terms": [{"match": "TSMC", "id": "tsmc"}]}, "it": {"title": "I ricavi di luglio di TSMC balzano del 45% mentre la domanda di chip AI resiste ai timori di mercato", "summary": "Taiwan Semiconductor Manufacturing Company ha riportato per luglio ricavi record di 467,58 miliardi di NT$ (circa 15,4 miliardi di dollari), in crescita del 44,7% su base annua, poiché Apple, Nvidia e altri clienti hanno continuato a ordinare chip avanzati nonostante i crescenti dubbi degli investitori sulla spesa per l'AI.", "detail": "TSMC, il maggiore produttore di chip su commessa al mondo e fornitore chiave di Nvidia e Apple, ha più volte rivisto al rialzo le sue previsioni di ricavi e investimenti per il 2026 grazie alla domanda crescente di acceleratori AI e packaging avanzato. I risultati si aggiungono a una serie di utili solidi in tutto il settore dei chip, anche se alcuni investitori avvertono che centinaia di miliardi di dollari di spesa in infrastrutture AI potrebbero superare i ritorni a breve termine.", "terms": [{"match": "TSMC", "id": "tsmc"}]}}, {"id": "south-africa-immigrant-exodus-aug08", "date": "2026-08-08", "country": "South Africa", "category": "Social", "topics": [], "sources": [{"name": "ABC News (AP)", "url": "https://abcnews.com/International/wireStory/178000-immigrants-suddenly-fled-deported-south-africa-135482769", "reliability": 5}, {"name": "Washington Times", "url": "https://www.washingtontimes.com/news/2026/aug/8/178000-immigrants-suddenly-fled-deported-south-africa/", "reliability": 3}], "en": {"title": "More than 178,000 immigrants have fled or been deported from South Africa since May", "summary": "Over 178,000 African immigrants — most from Zimbabwe and Malawi — have left South Africa since late May amid a wave of anti-migrant protests, door-to-door intimidation campaigns and roughly 19,000 formal deportations.", "detail": "Vigilante groups blaming migrants for high unemployment and strained public services have carried out threats and attacks, including burning migrants' homes and businesses, culminating in nationwide protests on June 30 that set an informal deadline for undocumented migrants to leave. Most departures have been voluntary repatriations rather than formal deportations, but rights groups say fear of violence is the main driver.", "terms": []}, "it": {"title": "Oltre 178.000 immigrati sono fuggiti o sono stati espulsi dal Sudafrica da maggio", "summary": "Oltre 178.000 immigrati africani — la maggior parte da Zimbabwe e Malawi — hanno lasciato il Sudafrica da fine maggio in mezzo a un'ondata di proteste anti-migranti, campagne di intimidazione porta a porta e circa 19.000 espulsioni formali.", "detail": "Gruppi di vigilantes che incolpano i migranti dell'alta disoccupazione e della pressione sui servizi pubblici hanno compiuto minacce e aggressioni, incendiando case e attività commerciali dei migranti, culminate in proteste nazionali il 30 giugno che hanno fissato una scadenza informale per l'allontanamento dei migranti irregolari. La maggior parte delle partenze sono rimpatri volontari piuttosto che espulsioni formali, ma le organizzazioni per i diritti umani affermano che la paura della violenza è il fattore principale.", "terms": []}}, {"id": "drc-ebola-deadliest-history-aug16", "date": "2026-08-16", "country": "DR Congo", "category": "Medicine", "topics": [], "sources": [{"name": "CNN", "url": "https://edition.cnn.com/2026/08/16/africa/drc-congo-ebola-deadliest-outbreak-latam-intl", "reliability": 4}, {"name": "UPI", "url": "https://www.upi.com/Top_News/World-News/2026/08/16/drc-Ebola-outbreak-update/4271786931290/", "reliability": 4}], "en": {"title": "DR Congo's Ebola outbreak becomes the deadliest in the country's history", "summary": "Confirmed Ebola cases in the Democratic Republic of Congo reached 4,945 with 2,325 deaths, surpassing the 2018-2020 outbreak's toll of 2,299 deaths to become the country's deadliest epidemic on record, UN and health officials said.", "detail": "UN humanitarian coordinator Tom Fletcher said 'Ebola is winning' in DR Congo, noting the Bundibugyo-strain outbreak is now killing someone roughly every 30 minutes. The WHO recorded its highest weekly toll yet — 579 new cases and 304 deaths — in the week of August 3-9, with no approved vaccine or treatment yet available against this viral strain, leaving responders reliant on contact tracing and isolation.", "terms": [{"match": "Bundibugyo-strain", "id": "bundibugyo"}]}, "it": {"title": "Il focolaio di Ebola in RD Congo diventa il più letale nella storia del Paese", "summary": "I casi confermati di Ebola nella Repubblica Democratica del Congo hanno raggiunto quota 4.945 con 2.325 morti, superando il bilancio di 2.299 morti del focolaio 2018-2020 e diventando l'epidemia più letale mai registrata nel Paese, secondo ONU e autorità sanitarie.", "detail": "Il coordinatore umanitario dell'ONU Tom Fletcher ha detto che 'l'Ebola sta vincendo' in RD Congo, notando che il focolaio del ceppo Bundibugyo sta ora uccidendo una persona circa ogni 30 minuti. L'OMS ha registrato il bilancio settimanale più alto finora — 579 nuovi casi e 304 morti — nella settimana del 3-9 agosto, senza ancora un vaccino o un trattamento approvato contro questo ceppo virale, lasciando i soccorritori dipendenti dal tracciamento dei contatti e dall'isolamento.", "terms": [{"match": "ceppo Bundibugyo", "id": "bundibugyo"}]}}, {"id": "us-iran-mou-deadline-oman-aug17", "date": "2026-08-17", "country": "Iran", "category": "Geopolitics", "topics": ["us-iran"], "sources": [{"name": "CBS News", "url": "https://www.cbsnews.com/live-updates/us-iran-war-deal-expired-strait-of-hormuz/", "reliability": 4}, {"name": "CNN", "url": "https://www.cnn.com/2026/08/17/world/live-news/iran-war-trump", "reliability": 4}], "en": {"title": "US-Iran deal deadline expires as Trump threatens to 'bomb' Oman", "summary": "A 60-day US-Iran memorandum of understanding expired Monday with no peace deal reached, as President Trump threatened to bomb Oman if it \"gets in the way\" of reopening the Strait of Hormuz. Traffic through the strait has collapsed to just three vessels a day.", "detail": "The June 18 memorandum had raised hopes of ending the conflict, but Iran said Washington violated it almost immediately after signing. Trump's threat came right after Iran announced a shipping-corridor arrangement with Oman for the Strait of Hormuz that excludes the US. The US Navy has redirected 64 commercial vessels and disabled or boarded several others as part of its blockade, while Iran's army chief has offered a $30,000 bounty for captured or killed American service members.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "Scade la scadenza dell'accordo USA-Iran, Trump minaccia di \"bombardare\" l'Oman", "summary": "Un memorandum d'intesa USA-Iran di 60 giorni è scaduto lunedì senza che si raggiungesse un accordo di pace, mentre il presidente Trump ha minacciato di bombardare l'Oman se \"si mette in mezzo\" alla riapertura dello Stretto di Hormuz. Il traffico nello stretto è crollato a sole tre navi al giorno.", "detail": "Il memorandum del 18 giugno aveva alimentato le speranze di porre fine al conflitto, ma l'Iran ha affermato che Washington lo ha violato quasi subito dopo la firma. La minaccia di Trump è arrivata subito dopo che l'Iran ha annunciato un accordo con l'Oman su un corridoio di navigazione per lo Stretto di Hormuz che esclude gli Stati Uniti. La Marina statunitense ha dirottato 64 navi commerciali e ne ha disabilitate o abbordate diverse altre nell'ambito del suo blocco, mentre il capo dell'esercito iraniano ha offerto una taglia di 30.000 dollari per la cattura o l'uccisione di militari statunitensi.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}]}}, {"id": "yemen-makha-marib-escalation-aug16", "date": "2026-08-16", "country": "Yemen", "category": "Geopolitics", "topics": [], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/16/houthis-launch-new-attacks-on-al-makha-and-marib-as-yemen-conflict-escalates", "reliability": 4}, {"name": "HNGN", "url": "https://www.hngn.com/articles/272756/20260816/yemens-civil-war-reignites-houthi-forces-escalate-attacks-government-positions-taiz.htm", "reliability": 2}], "en": {"title": "Houthis launch new missile and drone attacks on al-Makha and Marib", "summary": "Yemen's Houthi rebels struck residential areas of the Red Sea port of al-Makha and the government-held city of Marib with missiles and drones, killing at least four people and wounding eight, in a fresh escalation of the country's largely frozen civil war.", "detail": "Yemen's military said it responded with 181 operations against Houthi positions across several governorates. Marib hosts more than 2 million internally displaced people, the largest concentration in Yemen, and al-Makha's port has now suspended operations for days. The UN's Yemen envoy has warned the risk of a full relapse into war is the highest since the informal 2022 truce took hold.", "terms": [{"match": "Marib", "id": "marib-hadhramaut"}, {"match": "2022 truce", "id": "yemen-2022-truce"}]}, "it": {"title": "Gli Houthi lanciano nuovi attacchi con missili e droni su al-Makha e Marib", "summary": "I ribelli Houthi dello Yemen hanno colpito con missili e droni quartieri residenziali del porto di al-Makha, sul Mar Rosso, e la città di Marib, controllata dal governo, uccidendo almeno quattro persone e ferendone otto, in una nuova escalation della guerra civile del Paese rimasta finora largamente congelata.", "detail": "L'esercito yemenita ha dichiarato di aver risposto con 181 operazioni contro le posizioni Houthi in diverse province. Marib ospita oltre 2 milioni di sfollati interni, la concentrazione più alta dello Yemen, e il porto di al-Makha ha ormai sospeso le attività da giorni. L'inviato ONU per lo Yemen ha avvertito che il rischio di una ricaduta totale nella guerra è il più alto dalla tregua informale del 2022.", "terms": [{"match": "Marib", "id": "marib-hadhramaut"}, {"match": "tregua informale del 2022", "id": "yemen-2022-truce"}]}}, {"id": "canada-us-tariff-auto-rules-aug17", "date": "2026-08-17", "country": "Canada", "category": "Economy", "topics": ["mercato-investimenti"], "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-17/trump-tariffs-on-canada-auto-rules-block-deal-before-aug-19-deadline", "reliability": 4}, {"name": "BNN Bloomberg", "url": "https://www.bnnbloomberg.ca/tariffs/2026/08/17/the-us-is-on-the-brink-of-putting-new-tariffs-on-canada-follow-live-trade-war-updates/", "reliability": 4}], "en": {"title": "Auto-sector rules block a US-Canada tariff deal two days before deadline", "summary": "Canadian trade minister Dominic LeBlanc met US officials in Washington on Sunday, but disagreements over tariff rates for North American automakers remain the key obstacle to a deal before Trump's 50% tariffs on Canadian goods take effect on August 19.", "detail": "Industry advisers warn that a long-term auto tariff of even 10-15% could force manufacturers to abandon Canadian production, since profit margins average just 6%. Supply management in Quebec's dairy sector, plus steel, aluminum and lumber, remain other contested issues affecting 2.6 million Canadian workers. LeBlanc's office described Sunday's talks as \"constructive,\" adding negotiations are continuing. Trump imposed the original 50% duty under Section 338 of the 1930 Trade Act, the same rarely used \"nuclear option\" provision now hanging over the talks.", "terms": [{"match": "Section 338", "id": "section-338"}]}, "it": {"title": "Le regole del settore auto bloccano l'accordo sui dazi USA-Canada a due giorni dalla scadenza", "summary": "Il ministro del Commercio canadese Dominic LeBlanc ha incontrato funzionari statunitensi a Washington domenica, ma i disaccordi sulle aliquote tariffarie per i produttori di auto nordamericani restano l'ostacolo principale a un accordo prima che i dazi al 50% di Trump sui beni canadesi entrino in vigore il 19 agosto.", "detail": "I consulenti del settore avvertono che una tariffa auto a lungo termine anche solo del 10-15% potrebbe spingere i produttori ad abbandonare la produzione in Canada, dato che i margini di profitto sono in media solo del 6%. La gestione dell'offerta nel settore lattiero-caseario del Quebec, insieme ad acciaio, alluminio e legname, restano altri temi contesi che riguardano 2,6 milioni di lavoratori canadesi. L'ufficio di LeBlanc ha definito i colloqui di domenica \"costruttivi\", aggiungendo che i negoziati proseguono. Trump aveva imposto il dazio originario del 50% ricorrendo alla Section 338 del Trade Act del 1930, la stessa disposizione poco usata, definita \"opzione nucleare\", che ora incombe sui negoziati.", "terms": [{"match": "Section 338", "id": "section-338"}]}}, {"id": "nvidia-sb-energy-openai-aug17", "date": "2026-08-17", "country": "USA", "category": "Technology", "topics": ["ai"], "sources": [{"name": "TechCrunch", "url": "https://techcrunch.com/2026/08/17/nvidia-investing-1-5b-in-softbank-data-center-developer-behind-openai-project/", "reliability": 4}, {"name": "Investing.com (Reuters)", "url": "https://www.investing.com/news/stock-market-news/nvidia-to-invest-15-billion-in-sb-energy-under-openai-data-center-deal-4863156", "reliability": 4}], "en": {"title": "Nvidia invests $1.5 billion in SoftBank's SB Energy to lock in OpenAI compute", "summary": "Nvidia is investing $1.5 billion in SB Energy, the SoftBank-backed developer building a giant Ohio data center campus for OpenAI, and will provide up to $105 billion in credit — securing itself as the exclusive supplier of computing hardware for the site.", "detail": "The PORTS-Pike campus near Cincinnati will initially run at 4.25 gigawatts, potentially scaling to 8 gigawatts, and includes a $33 billion natural-gas power plant built on former Department of Energy uranium-enrichment land. OpenAI is itself an investor in SB Energy alongside SoftBank. Analysts have flagged that Nvidia's growing practice of financing the very companies that buy its chips creates \"circular\" flows of money that draw scrutiny over how real the underlying demand is.", "terms": [{"match": "SB Energy", "id": "sb-energy"}]}, "it": {"title": "Nvidia investe 1,5 miliardi di dollari in SB Energy di SoftBank per assicurarsi la potenza di calcolo di OpenAI", "summary": "Nvidia sta investendo 1,5 miliardi di dollari in SB Energy, la società sostenuta da SoftBank che sta costruendo un enorme campus di data center in Ohio per OpenAI, e fornirà fino a 105 miliardi di dollari di credito, assicurandosi così di essere il fornitore esclusivo dell'hardware di calcolo per il sito.", "detail": "Il campus PORTS-Pike vicino a Cincinnati opererà inizialmente a 4,25 gigawatt, con possibilità di arrivare a 8 gigawatt, e comprende una centrale a gas naturale da 33 miliardi di dollari costruita su un terreno del Dipartimento dell'Energia un tempo usato per l'arricchimento dell'uranio. OpenAI è essa stessa investitrice in SB Energy insieme a SoftBank. Gli analisti hanno segnalato che la crescente pratica di Nvidia di finanziare le stesse aziende che acquistano i suoi chip crea flussi di denaro \"circolari\" che sollevano dubbi su quanto sia reale la domanda sottostante.", "terms": [{"match": "SB Energy", "id": "sb-energy"}]}}, {"id": "india-bjp-recalibrate-cockroach-aug17", "date": "2026-08-17", "country": "India", "category": "Politics", "topics": ["politica-internazionale"], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/17/has-indias-cockroach-movement-forced-modis-bjp-to-recalibrate-agenda", "reliability": 4}, {"name": "ABC News (Australia)", "url": "https://www.abc.net.au/news/2026-07-27/india-cockroach-party-victory-over-narendra-modi-government/106960066", "reliability": 4}], "en": {"title": "Has India's Cockroach movement forced Modi's BJP to recalibrate?", "summary": "Months after the Cockroach Janta Party forced the resignation of India's education minister, analysts say Modi's BJP has responded with a social-media charm offensive rather than real policy change, after losing two of three August by-elections.", "detail": "The ruling party lost the Bankipur (Bihar) and Datia (Madhya Pradesh) by-elections, prompting Modi to post Instagram videos addressing exam-paper leaks and Uttar Pradesh officials to launch school career-counselling sessions aimed at Gen Z voters. Researchers say the shift is about perception management, not substance: the BJP has not proposed policies that \"fundamentally change anything,\" and the party's usual strategy of labelling protesters as anti-national has proven ineffective against the self-mocking, decentralized movement.", "terms": [{"match": "Cockroach Janta Party", "id": "cockroach-party"}]}, "it": {"title": "Il movimento indiano \"Cockroach\" ha costretto il BJP di Modi a ricalibrarsi?", "summary": "Mesi dopo che il Cockroach Janta Party ha costretto alle dimissioni il ministro dell'Istruzione indiano, gli analisti sostengono che il BJP di Modi abbia risposto con un'offensiva di simpatia sui social media piuttosto che con un vero cambiamento politico, dopo aver perso due elezioni suppletive su tre ad agosto.", "detail": "Il partito al governo ha perso le elezioni suppletive di Bankipur (Bihar) e Datia (Madhya Pradesh), spingendo Modi a pubblicare video su Instagram sulle fughe di notizie degli esami e i funzionari dell'Uttar Pradesh a lanciare sessioni di orientamento professionale nelle scuole rivolte agli elettori della Generazione Z. I ricercatori affermano che il cambiamento riguarda la gestione della percezione, non la sostanza: il BJP non ha proposto politiche che \"cambino davvero qualcosa\", e la consueta strategia del partito di etichettare i manifestanti come antinazionali si è rivelata inefficace contro un movimento autoironico e decentralizzato.", "terms": [{"match": "Cockroach Janta Party", "id": "cockroach-party"}]}}, {"id": "ceuta-what-really-happened-aug16", "date": "2026-08-16", "country": "Spain", "category": "Social", "topics": [], "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/08/16/nx-s1-5927053/what-happened-in-ceuta", "reliability": 5}, {"name": "Euronews", "url": "https://www.euronews.com/my-europe/2026/08/02/spanish-government-received-intelligence-warnings-of-ceuta-migrant-surge-days-before-crisi", "reliability": 4}], "en": {"title": "What really triggered the Ceuta migrant crisis? Investigators say we may never know", "summary": "Weeks after more than 70,000 migrants crossed from Morocco into Ceuta, killing over 140 people, reporting shows Spain's government received intelligence warnings days in advance — while the true trigger behind Morocco's loosened border controls remains contested and unresolved.", "detail": "Spanish intelligence reportedly flagged a likely \"gesture of magnanimity\" by Morocco's king around Throne Day, followed by a test wave of nearly 1,000 swimmers, yet reinforcements were not deployed until the crisis was already underway. Some analysts argue Rabat deliberately loosened controls in retaliation for Spanish media investigations into Moroccan intelligence spying, while migrants interviewed on the ground cited simple economic desperation rather than any political calculation — leaving accountability for one of Ceuta's deadliest weeks unresolved.", "terms": [{"match": "Ceuta", "id": "ceuta"}]}, "it": {"title": "Cosa ha davvero scatenato la crisi migratoria di Ceuta? Forse non lo sapremo mai", "summary": "Settimane dopo che oltre 70.000 migranti sono passati dal Marocco a Ceuta, causando la morte di più di 140 persone, alcune inchieste rivelano che il governo spagnolo aveva ricevuto avvisi di intelligence con giorni di anticipo, mentre la vera causa dell'allentamento dei co
