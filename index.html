-in-2026-passing-2025-total", "reliability": 4}, {"name": "CNN", "url": "https://www.cnn.com/2026/07/24/health/us-measles-cases-record", "reliability": 4}]}, {"id": "iran-strikes-pause", "date": "2026-07-25", "country": "Iran", "category": "Geopolitics", "topics": ["us-iran"], "en": {"title": "US pauses strikes on Iran for first time in two weeks", "summary": "The US military did not announce any new strikes on Iran overnight, the first quiet night in the conflict in roughly two weeks, as President Trump signaled talks with Tehran are ongoing even as tensions remain high.", "detail": "It marks the first calm night after 13 consecutive nights of US strikes on Iranian targets. Iranian state media confirmed no new American attacks were reported, though officials cautioned tensions remain high given the parallel Houthi-Saudi escalation in the Red Sea. President Trump said talks with Tehran are ongoing, but analysts noted any pause could be temporary given the unresolved disputes over Iran's nuclear program and the Strait of Hormuz blockade.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "Gli USA sospendono i raid sull'Iran per la prima volta in due settimane", "summary": "L'esercito statunitense non ha annunciato nuovi raid sull'Iran nella notte, la prima notte tranquilla del conflitto in circa due settimane, mentre il presidente Trump segnala che i colloqui con Teheran proseguono anche se le tensioni restano alte.", "detail": "Segna la prima notte di calma dopo 13 notti consecutive di raid statunitensi su obiettivi iraniani. I media di stato iraniani hanno confermato che non sono stati segnalati nuovi attacchi americani, anche se i funzionari avvertono che le tensioni restano alte, viste la parallela escalation Houthi-Arabia Saudita nel Mar Rosso. Il presidente Trump ha detto che i colloqui con Teheran proseguono, ma gli analisti osservano che qualsiasi pausa potrebbe essere temporanea, viste le controversie irrisolte sul programma nucleare iraniano e il blocco dello Stretto di Hormuz.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}]}, "sources": [{"name": "CNN", "url": "https://www.cnn.com/2026/07/25/world/live-news/iran-war-trump", "reliability": 4}, {"name": "Washington Post", "url": "https://www.washingtonpost.com/world/2026/07/25/iran-us-hormuz-strait-war-25-july-2026/db469ab4-880e-11f1-9cec-0fb26676f07e_story.html", "reliability": 5}]}, {"id": "houthi-saudi-trade-strikes", "date": "2026-07-25", "country": "Saudi Arabia", "category": "Geopolitics", "topics": ["us-iran"], "en": {"title": "Houthis and Saudi Arabia trade strikes after Red Sea tanker attack", "summary": "Yemen's Houthi rebels fired missiles and drones at Saudi Arabia after Saudi forces struck the Houthi-held port of Hodeidah in retaliation for an attack on a Red Sea vessel, further widening the maritime front of the Iran war.", "detail": "The exchange began after Houthi forces attacked a vessel in the Red Sea, prompting Saudi airstrikes on the Houthi-controlled port city of Hodeidah. The Houthis, who declared a naval blockade of Saudi shipping on July 20 and struck two Saudi oil tankers on July 23, responded with missile and drone attacks on Saudi territory. The tit-for-tat exchange adds a second active front to the wider US-Iran war, with the Bab el-Mandeb Strait and Strait of Hormuz both now disrupted.", "terms": [{"match": "Bab el-Mandeb Strait", "id": "bab-el-mandeb"}, {"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "Houthi e Arabia Saudita si scambiano attacchi dopo un raid a una petroliera nel Mar Rosso", "summary": "I ribelli Houthi yemeniti hanno lanciato missili e droni contro l'Arabia Saudita dopo che le forze saudite avevano colpito il porto di Hodeidah, controllato dagli Houthi, per rappresaglia contro un attacco a una nave nel Mar Rosso, allargando ulteriormente il fronte marittimo della guerra con l'Iran.", "detail": "Lo scambio è iniziato dopo che le forze Houthi hanno attaccato una nave nel Mar Rosso, spingendo l'Arabia Saudita a effettuare raid aerei sulla città portuale di Hodeidah, controllata dagli Houthi. Gli Houthi, che avevano dichiarato un blocco navale delle navi saudite il 20 luglio e colpito due petroliere saudite il 23 luglio, hanno risposto con attacchi missilistici e di droni sul territorio saudita. Lo scambio di colpi aggiunge un secondo fronte attivo alla più ampia guerra USA-Iran, con lo Stretto di Bab el-Mandeb e lo Stretto di Hormuz ormai entrambi interrotti.", "terms": [{"match": "Stretto di Bab el-Mandeb", "id": "bab-el-mandeb"}, {"match": "Stretto di Hormuz", "id": "hormuz"}]}, "sources": [{"name": "NBC News", "url": "https://www.nbcnews.com/world/middle-east/yemens-houthis-fire-missiles-drones-saudi-arabia-response-strikes-rcna589200", "reliability": 4}, {"name": "CNBC", "url": "https://www.cnbc.com/2026/07/25/saudi-military-strikes-iran-backed-houthi-targets-yemen.html", "reliability": 4}]}, {"id": "gaza-police-chief-killed", "date": "2026-07-25", "country": "Palestine", "category": "Geopolitics", "topics": ["israel-palestine"], "en": {"title": "Israeli strike kills head of northern Gaza police force", "summary": "An Israeli strike killed the head of the Hamas-led police force in northern Gaza along with four others, medics and officials said, as Israel's military said it had targeted several people involved in the October 7, 2023 attack.", "detail": "The Israeli military said the strike targeted individuals involved in the October 7, 2023 attack on Israel, without immediately naming those killed. Gaza's Hamas-run police force has been repeatedly targeted since the October 2025 ceasefire began, part of a broader pattern the UN says has killed dozens of police, teachers and other civil officials this year alone, deepening concerns about the collapse of civil order in the strip.", "terms": []}, "it": {"title": "Un raid israeliano uccide il capo della polizia del nord di Gaza", "summary": "Un raid israeliano ha ucciso il capo della polizia guidata da Hamas nel nord di Gaza insieme ad altre quattro persone, secondo medici e funzionari, mentre l'esercito israeliano ha dichiarato di aver preso di mira diverse persone coinvolte nell'attacco del 7 ottobre 2023.", "detail": "L'esercito israeliano ha dichiarato che il raid ha preso di mira persone coinvolte nell'attacco del 7 ottobre 2023 contro Israele, senza nominare immediatamente le vittime. La forza di polizia di Gaza, gestita da Hamas, è stata ripetutamente presa di mira da quando è iniziato il cessate il fuoco dell'ottobre 2025, parte di uno schema più ampio che secondo l'ONU ha ucciso decine di agenti di polizia, insegnanti e altri funzionari civili solo quest'anno, aggravando i timori per il collasso dell'ordine civile nella Striscia.", "terms": []}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/25/head-of-hamas-led-police-in-northern-gaza-killed-by-israeli-strike", "reliability": 4}, {"name": "Haaretz", "url": "https://www.haaretz.com/gaza/2026-07-25/ty-article/israel-kills-senior-hamas-led-police-official-in-gaza-medics-say/0000019f-9a04-df92-a7ff-be869d010000", "reliability": 4}]}, {"id": "ukraine-holiday-camp-strike", "date": "2026-07-25", "country": "Ukraine", "category": "Geopolitics", "topics": ["russia-ukraine"], "en": {"title": "At least 15 killed as Russia and Ukraine trade strikes, holiday camp hit", "summary": "Russian and Ukrainian attacks killed at least 15 people combined, officials said, with a children's holiday camp among the sites struck, as deep strikes on both sides' rear areas continue alongside a largely frozen front line.", "detail": "Officials on both sides reported casualties from strikes deep behind the front line, with a children's holiday camp among the sites hit in Ukraine. The front itself has remained largely static for weeks even as both Moscow and Kyiv intensify long-range attacks on cities, infrastructure and civilian sites far from the fighting.", "terms": []}, "it": {"title": "Almeno 15 morti negli attacchi incrociati tra Russia e Ucraina, colpita una colonia estiva", "summary": "Gli attacchi russi e ucraini hanno ucciso complessivamente almeno 15 persone, secondo le autorità, con una colonia estiva per bambini tra gli obiettivi colpiti, mentre gli attacchi in profondità nelle retrovie di entrambe le parti continuano accanto a un fronte in gran parte bloccato.", "detail": "Le autorità di entrambe le parti hanno segnalato vittime da attacchi in profondità dietro il fronte, con una colonia estiva per bambini tra i siti colpiti in Ucraina. Il fronte stesso è rimasto in gran parte statico per settimane, anche se sia Mosca sia Kiev intensificano gli attacchi a lungo raggio contro città, infrastrutture e siti civili lontani dai combattimenti.", "terms": []}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/25/at-least-11-killed-in-ukrainian-and-russian-strikes-as-holiday-camp-hit", "reliability": 4}, {"name": "Washington Times", "url": "https://www.washingtontimes.com/news/2026/jul/25/latest-russian-ukrainian-attacks-kill-total-15-people-officials-say/", "reliability": 3}]}, {"id": "india-pradhan-resigns", "date": "2026-07-25", "country": "India", "category": "Politics", "topics": ["politica-internazionale"], "en": {"title": "India's Education Minister Pradhan resigns after weeks of 'Cockroach' protests", "summary": "Education Minister Dharmendra Pradhan resigned following weeks of youth-led protests over exam-paper leaks, a major victory for the Cockroach Janta Party movement, though organizers say other demands remain unmet.", "detail": "Pradhan's resignation marks the movement's biggest concrete win since it began as satire in May, after India's Chief Justice compared unemployed young people to 'cockroaches.' Founder Abhijeet Dipke and other organizers celebrated the announcement but said their remaining demands — compensation for the families of students who died by suicide after exam leaks, and reform of the exam system itself — still need to be met before the protests fully end.", "terms": [{"match": "Cockroach Janta Party", "id": "cockroach-party"}]}, "it": {"title": "Il ministro dell'Istruzione indiano Pradhan si dimette dopo settimane di proteste 'Cockroach'", "summary": "Il ministro dell'Istruzione Dharmendra Pradhan si è dimesso dopo settimane di proteste guidate dai giovani per le fughe di notizie sui test d'esame, una vittoria importante per il movimento Cockroach Janta Party, anche se gli organizzatori dicono che altre richieste restano inevase.", "detail": "Le dimissioni di Pradhan segnano la vittoria concreta più importante del movimento da quando è nato come satira a maggio, dopo che il presidente della Corte Suprema indiana aveva paragonato i giovani disoccupati a 'scarafaggi'. Il fondatore Abhijeet Dipke e altri organizzatori hanno festeggiato l'annuncio, ma hanno detto che le richieste rimanenti — il risarcimento per le famiglie degli studenti morti suicidi dopo le fughe di notizie sugli esami e la riforma del sistema d'esame stesso — devono ancora essere soddisfatte prima che le proteste finiscano del tutto.", "terms": [{"match": "Cockroach Janta Party", "id": "cockroach-party"}]}, "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/07/25/g-s1-135483/india-cockroach-movement", "reliability": 5}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/features/2026/7/25/we-have-done-it-joy-as-cockroach-protests-push-india-minister-out", "reliability": 4}]}, {"id": "ebola-drc-3000", "date": "2026-07-25", "country": "DR Congo", "category": "Medicine", "topics": [], "en": {"title": "DR Congo's Ebola cases surpass 3,000 as first Bundibugyo vaccine begins human trials", "summary": "Confirmed Ebola cases in DR Congo climbed past 3,000, with more than 1,300 deaths, even as the world's first vaccine candidate against the Bundibugyo strain entered human clinical trials in the UK.", "detail": "The DRC's National Institute of Public Health said the outbreak, already the fastest-spreading Ebola epidemic on record, has been worsened by a new strike among health workers in Ituri province over unpaid compensation. The vaccine candidate, developed by Oxford researchers and targeting the rare Bundibugyo strain for which no approved vaccine previously existed, is the first of its kind to reach human trials.", "terms": [{"match": "Ebola cases", "id": "ebola"}]}, "it": {"title": "I casi di Ebola in RD Congo superano 3.000 mentre inizia la sperimentazione umana del primo vaccino Bundibugyo", "summary": "I casi confermati di Ebola in RD Congo hanno superato quota 3.000, con oltre 1.300 morti, mentre il primo vaccino candidato contro il ceppo Bundibugyo è entrato in sperimentazione clinica sull'uomo nel Regno Unito.", "detail": "L'Istituto Nazionale di Sanità Pubblica della RD Congo ha detto che il focolaio, già l'epidemia di Ebola a diffusione più rapida mai registrata, è stato aggravato da un nuovo sciopero degli operatori sanitari nella provincia dell'Ituri per compensi non pagati. Il vaccino candidato, sviluppato da ricercatori di Oxford e mirato al raro ceppo Bundibugyo per cui non esisteva prima alcun vaccino approvato, è il primo del suo genere a raggiungere la sperimentazione umana.", "terms": [{"match": "casi confermati di Ebola", "id": "ebola"}]}, "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/25/ebola-deaths-in-drc-surge-past-1300-as-virus-spreading-like-a-wildfire", "reliability": 4}, {"name": "Washington Post", "url": "https://www.washingtonpost.com/world/2026/07/25/ebola-congo-strike/671b7a28-880a-11f1-9cec-0fb26676f07e_story.html", "reliability": 5}]}, {"id": "us-economy-inflation-risk", "date": "2026-07-25", "country": "USA", "category": "Economy", "topics": ["mercato-investimenti", "us-iran"], "en": {"title": "Iran war and new tariffs push up US gas prices, mortgage rates and inflation risk", "summary": "Rising gas prices linked to the Iran war, combined with new US tariffs, are adding fresh inflationary pressure and pushing up mortgage rates, further complicating the economic outlook the Federal Reserve must weigh.", "detail": "Gas prices have climbed in tandem with oil's surge above $100 a barrel amid the widening Middle East conflict, while mortgage rates have also ticked higher. Economists say the combination of energy-driven inflation and the cumulative effect of tariffs on dozens of countries is testing the resilience of an economy that had, until recently, defied recession fears.", "terms": []}, "it": {"title": "La guerra con l'Iran e i nuovi dazi fanno salire benzina, mutui e rischio inflazione negli USA", "summary": "L'aumento dei prezzi della benzina legato alla guerra con l'Iran, insieme ai nuovi dazi USA, aggiunge nuove pressioni inflazionistiche e fa salire i tassi dei mutui, complicando ulteriormente il quadro economico che la Federal Reserve deve valutare.", "detail": "I prezzi della benzina sono saliti di pari passo con il petrolio, salito sopra i 100 dollari al barile nel contesto dell'allargamento del conflitto in Medio Oriente, mentre anche i tassi dei mutui sono aumentati leggermente. Gli economisti dicono che la combinazione di inflazione energetica e l'effetto cumulativo dei dazi su decine di paesi sta mettendo alla prova la resilienza di un'economia che, fino a poco tempo fa, aveva smentito i timori di recessione.", "terms": []}, "sources": [{"name": "Washington Post", "url": "https://www.washingtonpost.com/business/2026/07/25/iran-war-tariffs-raise-new-risks-resilient-us-economy/", "reliability": 5}, {"name": "NBC News", "url": "https://www.nbcnews.com/business/consumer/iran-war-gas-prices-mortgage-rates-rcna588816", "reliability": 4}]}, {"id": "intel-earnings-beat", "date": "2026-07-24", "country": "USA", "category": "Technology", "topics": ["ai"], "en": {"title": "Intel shares rise on earnings beat and upbeat outlook, though analysts remain split", "summary": "Intel reported a bigger-than-expected second-quarter profit beat and an upbeat third-quarter revenue outlook, sending its shares up roughly 3%, though analysts remain divided over whether the turnaround is durable.", "detail": "Intel posted its seventh consecutive earnings beat, with a stronger-than-expected third-quarter revenue forecast helping shares rise roughly 3% in after-hours trading. Analysts remain split on whether the results reflect a durable turnaround for the chipmaker, which has lagged rivals Nvidia and AMD in the AI accelerator race, or a temporary rebound tied to broader semiconductor demand.", "terms": []}, "it": {"title": "Le azioni Intel salgono dopo utili sopra le attese e previsioni ottimistiche, ma gli analisti restano divisi", "summary": "Intel ha riportato un utile del secondo trimestre superiore alle attese e previsioni di ricavi ottimistiche per il terzo trimestre, facendo salire il titolo di circa il 3%, anche se gli analisti restano divisi sulla solidità della ripresa.", "detail": "Intel ha registrato il suo settimo trimestre consecutivo di utili sopra le attese, con previsioni di ricavi per il terzo trimestre più forti del previsto che hanno contribuito a far salire il titolo di circa il 3% nelle contrattazioni after-hours. Gli analisti restano divisi sul fatto che i risultati riflettano una svolta duratura per il produttore di chip, rimasto indietro rispetto ai rivali Nvidia e AMD nella corsa agli acceleratori AI, oppure un rimbalzo temporaneo legato alla domanda più ampia di semiconduttori.", "terms": []}, "sources": [{"name": "CNBC", "url": "https://www.cnbc.com/2026/07/24/intel-reported-a-huge-earnings-beat-analysts-remain-on-the-fence-.html", "reliability": 4}, {"name": "Yahoo Finance", "url": "https://finance.yahoo.com/markets/stocks/articles/intel-rises-3-q2-earnings-131615708.html", "reliability": 3}]}, {"id": "iran-pause-offramp", "date": "2026-07-27", "country": "Iran", "category": "Geopolitics", "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/07/27/g-s1-135611/can-the-u-s-and-iran-take-the-off-ramp", "reliability": 5}, {"name": "CNN", "url": "https://us.cnn.com/2026/07/26/world/live-news/iran-war-trump", "reliability": 4}], "topics": ["us-iran"], "en": {"title": "US and Iran hold off on strikes for a third day as both sides eye an exit ramp", "summary": "Washington and Tehran extended a rare pause in direct strikes into a third day, with US officials signaling the quiet is meant to give diplomacy room to work. Analysts caution the pause remains fragile and either side could resume attacks quickly.", "detail": "The pause follows nearly two weeks of near-nightly US strikes on Iranian military and energy targets and Iranian retaliation across the Gulf. Trump administration officials said Iran has signaled it would keep its own forces standing down if the American halt holds, while stressing no formal agreement has been signed. Israeli officials, according to reporting, remain skeptical that a lasting deal is close and expect Washington could be pulled back into the conflict if talks stall. The pause has already been credited with easing pressure on oil markets and shipping through the Strait of Hormuz.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "USA e Iran sospendono gli attacchi per un terzo giorno mentre entrambe le parti cercano una via d'uscita", "summary": "Washington e Teheran hanno prolungato per un terzo giorno una rara pausa negli attacchi diretti, con funzionari USA che segnalano come la calma serva a dare spazio alla diplomazia. Gli analisti avvertono che la tregua resta fragile e che entrambe le parti potrebbero riprendere gli attacchi rapidamente.", "detail": "La pausa arriva dopo quasi due settimane di attacchi USA quasi quotidiani contro obiettivi militari ed energetici iraniani e di rappresaglie iraniane in tutto il Golfo. Funzionari dell'amministrazione Trump affermano che l'Iran avrebbe segnalato l'intenzione di mantenere ferme le proprie forze se la sospensione americana reggerà, pur sottolineando che non è stato firmato alcun accordo formale. Secondo alcune fonti, i funzionari israeliani restano scettici sul fatto che un accordo duraturo sia vicino e si aspettano che Washington possa essere ricoinvolta nel conflitto se i colloqui si arenano. La pausa ha già contribuito ad alleggerire la pressione sui mercati petroliferi e sul traffico marittimo nello Stretto di Hormuz.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}]}}, {"id": "netanyahu-trump-dc-meeting", "date": "2026-07-27", "country": "Israel", "category": "Geopolitics", "sources": [{"name": "U.S. News & World Report (AP)", "url": "https://www.usnews.com/news/world/articles/2026-07-24/netanyahu-to-meet-with-trump-in-washington-on-tuesday-pms-office-says", "reliability": 5}, {"name": "Axios", "url": "https://www.axios.com/2026/07/24/trump-netanyahu-white-house-iran", "reliability": 4}], "topics": ["israel-palestine", "us-iran"], "en": {"title": "Netanyahu heads to Washington for high-stakes White House meeting with Trump", "summary": "Israeli Prime Minister Benjamin Netanyahu is traveling to Washington for a Tuesday meeting with President Trump, as officials on both sides weigh their next moves in the Iran war and address tensions over the Gaza ceasefire.", "detail": "The visit, confirmed by Netanyahu's office, comes as the US and Iran observe a rare pause in direct strikes and as Israel continues to face international criticism over repeated ceasefire violations in Gaza. Trump has previously said Netanyahu \"knows who the boss is,\" underscoring friction beneath the allies' public unity. Officials say the two leaders are expected to discuss whether to extend the Iran pause, coordinate on regional security in the Gulf, and address the mounting Palestinian death toll in Gaza.", "terms": []}, "it": {"title": "Netanyahu vola a Washington per un incontro cruciale alla Casa Bianca con Trump", "summary": "Il primo ministro israeliano Benjamin Netanyahu si reca a Washington per un incontro martedì con il presidente Trump, mentre i funzionari di entrambe le parti valutano le prossime mosse nella guerra con l'Iran e affrontano le tensioni sul cessate il fuoco a Gaza.", "detail": "La visita, confermata dall'ufficio di Netanyahu, arriva mentre USA e Iran osservano una rara pausa negli attacchi diretti e mentre Israele continua a subire critiche internazionali per le ripetute violazioni del cessate il fuoco a Gaza. Trump aveva in precedenza dichiarato che Netanyahu \"sa chi è il capo\", sottolineando l'attrito sotto l'apparente unità tra alleati. Secondo alcuni funzionari, i due leader dovrebbero discutere se prolungare la pausa sull'Iran, coordinare la sicurezza regionale nel Golfo e affrontare il crescente bilancio delle vittime palestinesi a Gaza.", "terms": []}}, {"id": "ukraine-kyiv-strike-july26", "date": "2026-07-26", "country": "Ukraine", "category": "Geopolitics", "sources": [{"name": "Washington Post", "url": "https://www.washingtonpost.com/world/2026/07/26/russia-ukraine-war-kyiv-strike-attack-missiles-drones/3e081c1e-88f4-11f1-8912-d71e69d679d7_story.html", "reliability": 4}, {"name": "Kyiv Independent", "url": "https://kyivindependent.com/kyiv-attack-july-26-2026/", "reliability": 3}], "topics": ["russia-ukraine"], "en": {"title": "Russian ballistic missiles hit Kyiv apartment block as deep strikes continue on both sides", "summary": "A Russian ballistic missile strike hit a residential building in Kyiv, killing two people, while Ukrainian drone strikes on a Russian-held area killed four more, officials said, as the war's pattern of strikes far from the front line persists.", "detail": "Ukrainian officials said emergency crews worked through the night after missiles struck a multi-story apartment building in the capital. Separately, Ukrainian drones hit a Russian-occupied area, killing four people according to Moscow-installed officials, underscoring how both sides continue exchanging long-range strikes even as the front line itself remains largely static. The attacks came as global attention was focused on the parallel US-Iran de-escalation, drawing less coverage than earlier strikes on the capital this month.", "terms": []}, "it": {"title": "Missili balistici russi colpiscono un palazzo residenziale a Kiev mentre proseguono gli attacchi in profondità da entrambe le parti", "summary": "Un attacco russo con missili balistici ha colpito un edificio residenziale a Kiev, uccidendo due persone, mentre attacchi con droni ucraini su un'area sotto controllo russo hanno ucciso altre quattro persone, secondo quanto riferito dalle autorità, mentre prosegue lo schema di attacchi lontani dalla linea del fronte.", "detail": "Le autorità ucraine hanno riferito che le squadre di soccorso hanno lavorato tutta la notte dopo che i missili hanno colpito un edificio residenziale a più piani nella capitale. Separatamente, droni ucraini hanno colpito un'area occupata dai russi, uccidendo quattro persone secondo i funzionari filorussi insediati localmente, a conferma di come entrambe le parti continuino a scambiarsi attacchi a lungo raggio anche se la linea del fronte resta in gran parte statica. Gli attacchi sono avvenuti mentre l'attenzione globale era concentrata sulla parallela de-escalation USA-Iran, ricevendo meno copertura mediatica rispetto ai precedenti attacchi alla capitale questo mese.", "terms": []}}, {"id": "oil-tumbles-iran-pause", "date": "2026-07-26", "country": "Global", "category": "Economy", "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-26/oil-tumbles-as-us-and-iran-pause-military-strikes-markets-wrap", "reliability": 4}, {"name": "CNBC", "url": "https://www.cnbc.com/2026/07/27/oil-price-wti-brent-slide-as-iran-reportedly-may-halt-attacks.html", "reliability": 4}], "topics": ["mercato-investimenti", "us-iran"], "en": {"title": "Oil tumbles up to 7% as US and Iran pause military strikes", "summary": "Crude prices dropped sharply — Brent and WTI both sliding as much as 6-7% — after the US and Iran extended their pause in direct strikes, with Iran reportedly signaling it could halt attacks entirely if the American pause holds.", "detail": "The selloff unwound much of the risk premium built into oil markets since the conflict pushed Brent above $100 a barrel earlier this month. Traders welcomed signs that shipping through the Strait of Hormuz and the Bab el-Mandeb Strait could normalize, though analysts cautioned prices remain highly sensitive to any resumption of hostilities. The dollar also eased against major currencies as the immediate war-risk premium faded from markets.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}, {"match": "Bab el-Mandeb Strait", "id": "bab-el-mandeb"}]}, "it": {"title": "Il petrolio crolla fino al 7% mentre USA e Iran sospendono gli attacchi militari", "summary": "I prezzi del greggio sono scesi bruscamente — con Brent e WTI in calo fino al 6-7% — dopo che USA e Iran hanno prolungato la pausa negli attacchi diretti, con l'Iran che secondo alcune fonti avrebbe segnalato la disponibilità a fermare del tutto gli attacchi se la pausa americana reggerà.", "detail": "Il ribasso ha eliminato gran parte del premio di rischio incorporato nei mercati petroliferi da quando il conflitto aveva spinto il Brent sopra i 100 dollari al barile all'inizio del mese. Gli operatori hanno accolto con favore i segnali di una possibile normalizzazione del traffico marittimo nello Stretto di Hormuz e nello Stretto di Bab el-Mandeb, anche se gli analisti avvertono che i prezzi restano estremamente sensibili a un'eventuale ripresa delle ostilità. Anche il dollaro si è indebolito rispetto alle principali valute, mentre il premio di rischio legato alla guerra si è affievolito sui mercati.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}, {"match": "Stretto di Bab el-Mandeb", "id": "bab-el-mandeb"}]}}, {"id": "ai-earnings-selloff", "date": "2026-07-26", "country": "USA", "category": "Technology", "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-26/big-tech-earnings-slam-into-a-market-in-revolt-over-ai-spending", "reliability": 4}, {"name": "Fortune", "url": "https://fortune.com/2026/07/26/big-tech-earnings-meta-microsoft-apple-amazon-market-revolt-ai-spending/", "reliability": 3}], "topics": ["ai"], "en": {"title": "Big Tech earnings collide with investor revolt over AI spending", "summary": "Meta, Microsoft, Apple and Amazon reported quarterly results this week straight into a market increasingly skeptical of ballooning AI capital spending, with investors punishing even earnings beats when capex guidance climbed further.", "detail": "The reaction extends a pattern seen with Alphabet's results days earlier, when shares fell despite a revenue beat after the company raised its AI capex guidance. Analysts say investors are no longer rewarding growth alone and are instead demanding clearer evidence that hundreds of billions of dollars in AI infrastructure spending will pay off, a shift that could reshape how the industry justifies its investment plans in the coming quarters.", "terms": []}, "it": {"title": "Gli utili delle grandi aziende tecnologiche si scontrano con la rivolta degli investitori sulla spesa per l'AI", "summary": "Meta, Microsoft, Apple e Amazon hanno pubblicato i risultati trimestrali questa settimana proprio mentre il mercato si mostra sempre più scettico verso la crescita esponenziale della spesa in conto capitale per l'AI, con gli investitori che penalizzano anche i risultati sopra le attese quando le previsioni di capex salgono ulteriormente.", "detail": "La reazione prosegue lo schema già visto pochi giorni prima con i risultati di Alphabet, il cui titolo era sceso nonostante utili sopra le attese dopo l'aumento delle previsioni di capex per l'AI. Secondo gli analisti, gli investitori non premiano più la sola crescita, ma chiedono prove più chiare che le centinaia di miliardi di dollari investiti nell'infrastruttura AI produrranno un ritorno concreto, un cambiamento che potrebbe ridefinire il modo in cui il settore giustifica i propri piani di investimento nei prossimi trimestri.", "terms": []}}, {"id": "ebola-drc-3200", "date": "2026-07-27", "country": "DR Congo", "category": "Medicine", "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/27/ebola-infections-in-dr-congo-surge-to-3200-with-1405-deaths", "reliability": 4}, {"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-27/ebola-cases-in-congo-reach-3-200-as-outbreak-nears-second-largest-on-record", "reliability": 4}], "topics": [], "en": {"title": "DR Congo's Ebola outbreak nears second-largest on record as cases hit 3,200", "summary": "Confirmed Ebola cases in the Democratic Republic of Congo reached 3,200, with 1,405 deaths, health authorities said, putting the outbreak on track to become the second-largest Ebola epidemic ever recorded.", "detail": "The case fatality rate has hovered around 44%, among the highest of any recent Ebola outbreak, as the Bundibugyo strain continues to spread faster than health workers can contain it across Ituri and North Kivu provinces. Only the 2013-2016 West African epidemic, which killed more than 11,000 people, has been larger. Health officials say the pace of spread — reaching this scale in roughly three months — remains unprecedented, even as a new vaccine candidate for the Bundibugyo strain entered human trials in the UK last week.", "terms": []}, "it": {"title": "Il focolaio di Ebola in RD Congo si avvicina al secondo posto per gravità nella storia con 3.200 casi", "summary": "I casi confermati di Ebola nella Repubblica Democratica del Congo hanno raggiunto quota 3.200, con 1.405 morti, secondo le autorità sanitarie, portando il focolaio sulla soglia di diventare la seconda epidemia di Ebola più grave mai registrata.", "detail": "Il tasso di letalità si aggira intorno al 44%, tra i più alti di qualsiasi recente focolaio di Ebola, mentre il ceppo Bundibugyo continua a diffondersi più velocemente di quanto gli operatori sanitari riescano a contenerlo nelle province di Ituri e Nord Kivu. Solo l'epidemia dell'Africa occidentale del 2013-2016, che uccise oltre 11.000 persone, è stata più grave. I funzionari sanitari affermano che il ritmo della diffusione — che ha raggiunto questa scala in circa tre mesi — resta senza precedenti, anche se un nuovo vaccino candidato contro il ceppo Bundibugyo è entrato la scorsa settimana in sperimentazione umana nel Regno Unito.", "terms": []}}, {"id": "india-cockroach-after-resignation", "date": "2026-07-26", "country": "India", "category": "Politics", "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/26/what-next-for-indias-cockroach-movement-after-education-minister-sacked", "reliability": 4}, {"name": "CBC News", "url": "https://www.cbc.ca/news/world/india-cockroach-protest-9.7282141", "reliability": 4}], "topics": ["politica-internazionale"], "en": {"title": "India's 'Cockroach' protesters press on after forcing out education minister", "summary": "The youth-led Cockroach Janta Party movement says it will keep pushing for further accountability even after claiming its biggest win — the resignation of Education Minister Dharmendra Pradhan over exam-paper leaks.", "detail": "Organizers say Pradhan's departure is a milestone but not the end goal, with demands still including an independent probe into the leaks and reforms to India's exam system. Analysts say the movement's rapid growth from an online joke into a force that toppled a cabinet minister has unsettled Prime Minister Narendra Modi's government and could inspire similar youth mobilizations elsewhere.", "terms": [{"match": "Cockroach Janta Party", "id": "cockroach-party"}]}, "it": {"title": "I manifestanti indiani del movimento 'Cockroach' continuano dopo aver ottenuto le dimissioni del ministro dell'Istruzione", "summary": "Il movimento giovanile Cockroach Janta Party afferma che continuerà a chiedere ulteriore responsabilità anche dopo aver rivendicato la sua vittoria più grande: le dimissioni del ministro dell'Istruzione Dharmendra Pradhan per la fuga di notizie sui test d'esame.", "detail": "Gli organizzatori affermano che le dimissioni di Pradhan sono una tappa importante ma non l'obiettivo finale, con richieste che includono ancora un'indagine indipendente sulle fughe di notizie e riforme del sistema di esami indiano. Secondo gli analisti, la rapida crescita del movimento, da scherzo online a forza capace di far cadere un ministro, ha scosso il governo del primo ministro Narendra Modi e potrebbe ispirare mobilitazioni giovanili simili altrove.", "terms": [{"match": "Cockroach Janta Party", "id": "cockroach-party"}]}}, {"id": "iran-strikes-resume-weekend", "date": "2026-08-01", "country": "Iran", "category": "Geopolitics", "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-31/trump-orders-attacks-on-iran-as-soon-as-this-weekend-wsj-says", "reliability": 4}, {"name": "CBS News", "url": "https://www.cbsnews.com/news/us-israel-iran-war-energy-related-targets-trump/", "reliability": 4}], "topics": ["us-iran"], "en": {"title": "Trump orders fresh strikes on Iran, aiming to force Tehran's surrender", "summary": "President Trump has ordered new US-Israeli strikes on Iranian energy infrastructure, possibly starting this weekend, with officials saying the goal is to force Tehran to surrender. The pause in fighting that had held for several days appears to be ending.", "detail": "According to the Wall Street Journal, Trump gave the order during a Camp David cabinet meeting, telling aides \"we'll be hitting them very hard\" and \"I think we just want to win.\" CBS News reported the US and Israel are coordinating a bombing campaign against power plants and refineries, with discussions about cutting electricity to Tehran entirely. Officials want strikes completed before markets open Monday. Some White House aides reportedly oppose the plan, and Trump had not given final approval as of Friday afternoon. Press Secretary Karoline Leavitt said \"the United States will win, and Iran will not have a nuclear weapon.\"", "terms": [{"match": "Camp David", "id": "irgc"}, {"match": "energy infrastructure", "id": "hormuz"}]}, "it": {"title": "Trump ordina nuovi attacchi contro l'Iran, punta a forzare la resa di Teheran", "summary": "Il presidente Trump ha ordinato nuovi attacchi USA-Israele contro le infrastrutture energetiche iraniane, forse già questo weekend, con funzionari che dicono che l'obiettivo è forzare la resa di Teheran. La pausa nei combattimenti durata alcuni giorni sembra finita.", "detail": "Secondo il Wall Street Journal, Trump ha dato l'ordine durante una riunione del gabinetto a Camp David, dicendo ai collaboratori \"li colpiremo molto duramente\" e \"penso che vogliamo solo vincere\". CBS News ha riportato che USA e Israele stanno coordinando una campagna di bombardamenti contro centrali elettriche e raffinerie, con discussioni su come tagliare del tutto l'elettricità a Teheran. I funzionari vogliono completare gli attacchi prima dell'apertura dei mercati lunedì. Alcuni collaboratori della Casa Bianca si opporrebbero al piano, e Trump non aveva ancora dato l'approvazione finale venerdì pomeriggio. La portavoce Karoline Leavitt ha detto che \"gli Stati Uniti vinceranno, e l'Iran non avrà un'arma nucleare\".", "terms": [{"match": "Camp David", "id": "irgc"}, {"match": "infrastrutture energetiche", "id": "hormuz"}]}}, {"id": "kyiv-barrage-aug1", "date": "2026-08-01", "country": "Ukraine", "category": "Geopolitics", "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-01/russia-hits-kyiv-with-horrific-missile-barrage-killing-nine", "reliability": 4}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/russian-missile-attack-kills-three-in-ukraines-kyiv", "reliability": 4}], "topics": ["russia-ukraine"], "en": {"title": "Russian missile barrage kills nine in Kyiv, second major attack in a week", "summary": "A Russian ballistic missile barrage struck Kyiv early Saturday, killing at least nine people and wounding 28, including four children, in the second major attack on the capital this week.", "detail": "Kyiv Mayor Vitali Klitschko said a residential building in the Shevchenkivskyi district was partially destroyed, its lower floors collapsing and trapping residents, while warehouses caught fire elsewhere in the city and power outages hit several districts. The strike followed a Thursday attack in which a suspected Russian missile landed in Poland, killing nine people. Ukraine says it is running low on interceptors for its Patriot air-defense batteries, and President Zelenskyy is pressing Washington for permission to build Patriot missiles domestically.", "terms": [{"match": "Patriot air-defense", "id": "hormuz"}]}, "it": {"title": "Bombardamento missilistico russo uccide nove persone a Kiev, secondo grave attacco in una settimana", "summary": "Un bombardamento missilistico balistico russo ha colpito Kiev sabato mattina presto, uccidendo almeno nove persone e ferendone 28, tra cui quattro bambini, nel secondo grave attacco alla capitale in una settimana.", "detail": "Il sindaco di Kiev Vitali Klitschko ha detto che un edificio residenziale nel distretto di Shevchenkivskyi è stato parzialmente distrutto, con i piani inferiori crollati intrappolando i residenti, mentre magazzini hanno preso fuoco altrove in città e si sono registrate interruzioni di corrente in diversi quartieri. L'attacco segue quello di giovedì, in cui un sospetto missile russo è caduto in Polonia uccidendo nove persone. L'Ucraina afferma di avere scorte in esaurimento di intercettori per le batterie di difesa aerea Patriot, e il presidente Zelensky sta facendo pressione su Washington per ottenere il permesso di costruire missili Patriot in patria.", "terms": [{"match": "difesa aerea Patriot", "id": "hormuz"}]}}, {"id": "hamas-disarmament-roadmap", "date": "2026-07-31", "country": "Palestine", "category": "Politics", "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/31/gaza-board-of-peace-announces-hamas-disarmament-agreement-what-we-know", "reliability": 4}, {"name": "The Hill", "url": "https://thehill.com/policy/international/6002266-hamas-disarmament-roadmap-unveiled/", "reliability": 3}], "topics": ["israel-palestine", "politica-internazionale"], "en": {"title": "Board of Peace unveils 15-point roadmap to disarm Hamas and withdraw Israeli forces", "summary": "The Board of Peace announced a phased agreement for Hamas to surrender its weapons in Gaza in exchange for an Israeli military withdrawal, though Israel has not formally accepted the plan and Hamas has attached conditions.", "detail": "Under the roadmap, Hamas must prepare a full weapons inventory within 14 days, with disarmament completed over roughly 200 to 300 days, overseen by a new Palestinian National Committee, an international verification commission and a roughly 5,000-strong International Stabilization Force. Gaza would be governed by a technocratic committee under the Board of Peace, whose founding board includes former UK PM Tony Blair, Jared Kushner and Secretary of State Marco Rubio, with Trump as its chair. Hamas said its compliance depends on Israel honoring its own withdrawal commitments, and analysts note more than 1,100 Palestinians have been killed since October 2025 despite the nominal ceasefire, raising doubts about implementation.", "terms": [{"match": "Board of Peace", "id": "yellow-line"}, {"match": "International Stabilization Force", "id": "yellow-line"}]}, "it": {"title": "Il Board of Peace presenta una tabella di marcia in 15 punti per disarmare Hamas e ritirare le forze israeliane", "summary": "Il Board of Peace ha annunciato un accordo graduale per far consegnare le armi a Hamas a Gaza in cambio di un ritiro militare israeliano, anche se Israele non ha ancora accettato formalmente il piano e Hamas ha posto delle condizioni.", "detail": "Secondo la tabella di marcia, Hamas deve preparare un inventario completo delle armi entro 14 giorni, con il disarmo completato in circa 200-300 giorni, sotto la supervisione di un nuovo Comitato Nazionale Palestinese, una commissione di verifica internazionale e una Forza Internazionale di Stabilizzazione di circa 5.000 uomini. Gaza sarebbe governata da un comitato tecnocratico sotto la supervisione del Board of Peace, il cui consiglio fondatore include l'ex premier britannico Tony Blair, Jared Kushner e il Segretario di Stato Marco Rubio, con Trump come presidente. Hamas ha detto che il rispetto dell'accordo dipende dal fatto che Israele onori i propri impegni di ritiro, e gli analisti notano che più di 1.100 palestinesi sono stati uccisi dall'ottobre 2025 nonostante il cessate il fuoco nominale, il che solleva dubbi sull'attuazione.", "terms": [{"match": "Board of Peace", "id": "yellow-line"}, {"match": "Forza Internazionale di Stabilizzazione", "id": "yellow-line"}]}}, {"id": "oil-jumps-90-iran-threat", "date": "2026-07-29", "country": "Global", "category": "Economy", "sources": [{"name": "CNBC", "url": "https://www.cnbc.com/2026/07/29/oil-prices-today-brent-wti-iran-us-hormuz.html", "reliability": 4}, {"name": "World Oil", "url": "https://worldoil.com/news/2026/7/29/oil-surges-above-90-as-trump-warns-of-new-strikes-on-iran/", "reliability": 3}], "topics": ["mercato-investimenti", "us-iran"], "en": {"title": "Brent crude jumps nearly 8% back above $90 as Trump threatens to 'hit Iran hard'", "summary": "Brent crude surged almost 8% to reclaim the $90-a-barrel level after President Trump threatened a forceful new strike on Iran, reversing the sharp price drop triggered by the earlier days-long pause in fighting.", "detail": "Traders priced in renewed risk to Gulf oil flows after Trump's threat, coming just before the Federal Reserve's rate decision. The rally reflects how closely energy markets are now tracking the on-again, off-again US-Iran conflict, with prices swinging double digits within days depending on whether a truce appears to be holding or collapsing.", "terms": [{"match": "Federal Reserve", "id": "fed"}]}, "it": {"title": "Il petrolio Brent balza di quasi l'8% tornando sopra i 90 dollari mentre Trump minaccia di 'colpire duramente l'Iran'", "summary": "Il greggio Brent è salito di quasi l'8% tornando sopra i 90 dollari al barile dopo che il presidente Trump ha minacciato un nuovo attacco deciso contro l'Iran, invertendo il forte calo dei prezzi causato dalla pausa nei combattimenti durata alcuni giorni.", "detail": "I trader hanno scontato un rinnovato rischio per i flussi di petrolio del Golfo dopo la minaccia di Trump, arrivata poco prima della decisione sui tassi della Federal Reserve. Il rally riflette quanto da vicino i mercati energetici seguano ormai il conflitto USA-Iran, alternato tra tregua e ripresa dei combattimenti, con i prezzi che oscillano di doppia cifra nell'arco di pochi giorni a seconda che la tregua sembri reggere o crollare.", "terms": [{"match": "Federal Reserve", "id": "fed"}]}}, {"id": "big-tech-earnings-week", "date": "2026-07-31", "country": "USA", "category": "Technology", "sources": [{"name": "CNBC", "url": "https://www.cnbc.com/2026/07/31/apple-aapl-amazon-amzn-stock-today.html", "reliability": 4}, {"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-31/amazon-microsoft-results-show-ai-spending-spree-remains-solid", "reliability": 4}], "en": {"title": "Alphabet, Amazon and Microsoft add nearly $1.5 trillion in value as AI spending bet pays off", "summary": "Big Tech's earnings week ended with Microsoft, Amazon and Alphabet adding almost $1.5 trillion in combined market value, as strong cloud and AI results eased investor fears that massive AI capital spending would not pay off. Apple and Meta shares slid instead.", "detail": "Microsoft and Amazon both posted double-digit stock gains for the week on robust cloud growth, convincing investors that heavy AI infrastructure investment is translating into revenue. Apple shares fell as its results disappointed relative to peers, and Meta shares dropped after its own capex guidance renewed concerns about spending discipline, capping a volatile earnings season in which every report was scrutinized for signs the roughly $600 billion AI investment wave is justified.", "terms": [{"match": "AI capital spending", "id": "hormuz"}]}, "it": {"title": "Alphabet, Amazon e Microsoft aggiungono quasi 1.500 miliardi di dollari di valore, la scommessa sull'AI ripaga", "summary": "La settimana degli utili delle Big Tech si è chiusa con Microsoft, Amazon e Alphabet che hanno aggiunto quasi 1.500 miliardi di dollari di valore di mercato combinato, mentre solidi risultati su cloud e AI hanno attenuato i timori degli investitori che l'enorme spesa in conto capitale sull'AI non ripagasse. Le azioni di Apple e Meta sono invece scese.", "detail": "Microsoft e Amazon hanno entrambe registrato guadagni a doppia cifra in borsa nella settimana grazie alla solida crescita del cloud, convincendo gli investitori che i pesanti investimenti in infrastrutture AI si stanno traducendo in ricavi. Le azioni Apple sono scese perché i risultati hanno deluso rispetto ai concorrenti, mentre quelle di Meta sono calate dopo che le sue previsioni di capex hanno riacceso i timori sulla disciplina di spesa, chiudendo una stagione di utili volatile in cui ogni resoconto è stato esaminato per capire se l'ondata di investimenti sull'AI da circa 600 miliardi di dollari sia giustificata.", "terms": [{"match": "investimenti in infrastrutture AI", "id": "hormuz"}]}, "topics": ["ai"]}, {"id": "ceuta-migrant-crisis", "date": "2026-08-01", "country": "Spain", "category": "Social", "sources": [{"name": "The National", "url": "https://www.thenationalnews.com/news/mena/2026/07/31/spain-sends-troops-to-secure-ceuta-enclave-after-nearly-50000-migrants-swim-from-morocco/", "reliability": 3}, {"name": "Euronews", "url": "https://www.euronews.com/my-europe/2026/08/01/ceuta-migrant-crisis-sparks-strong-reactions-from-all-over-europe", "reliability": 4}], "en": {"title": "Spain sends troops to Ceuta after nearly 50,000 migrants cross from Morocco", "summary": "Around 49,000 migrants crossed from Morocco into Spain's North African enclave of Ceuta by swimming or breaching the border fence, with at least 19 people drowning, prompting Spain to deploy troops and triggering a diplomatic row across Europe.", "detail": "Spain sent 200 specialized police officers and 60 troops to secure Ceuta, and Prime Minister Pedro Sanchez planned to visit the enclave. Madrid blamed a court ruling that blocked the immediate expulsion of sea arrivals and said it would try to fast-track deportations. Italian Prime Minister Giorgia Meloni threatened to suspend the Schengen open-borders agreement with Spain, and France asked for tighter controls at its border with Spain, prompting Madrid to summon Italy's ambassador and accuse Rome of \"partisan demagoguery\" instead of European solidarity. The European Commission offered assistance through its border agency Frontex.", "terms": [{"match": "Schengen", "id": "irgc"}]}, "it": {"title": "La Spagna invia truppe a Ceuta dopo l'arrivo di quasi 50.000 migranti dal Marocco", "summary": "Circa 49.000 migranti sono passati dal Marocco all'enclave spagnola nordafricana di Ceuta a nuoto o sfondando la barriera di confine, con almeno 19 morti annegati, spingendo la Spagna a schierare le truppe e scatenando uno scontro diplomatico in Europa.", "detail": "La Spagna ha inviato 200 agenti di polizia specializzati e 60 militari per mettere in sicurezza Ceuta, e il primo ministro Pedro Sanchez ha programmato una visita all'enclave. Madrid ha attribuito la colpa a una sentenza giudiziaria che ha bloccato l'espulsione immediata degli arrivi via mare e ha detto che cercherà di accelerare i rimpatri. La premier italiana Giorgia Meloni ha minacciato di sospendere l'accordo di Schengen sulla libera circolazione con la Spagna, e la Francia ha chiesto controlli più rigidi al confine con la Spagna, spingendo Madrid a convocare l'ambasciatore italiano e ad accusare Roma di \"demagogia di parte\" invece di solidarietà europea. La Commissione Europea ha offerto assistenza tramite l'agenzia di frontiera Frontex.", "terms": [{"match": "Schengen", "id": "irgc"}]}, "topics": []}, {"id": "ebola-drc-1500-uganda-free", "date": "2026-07-30", "country": "DR Congo", "category": "Medicine", "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/30/congos-ebola-death-toll-passes-1500-as-it-struggles-to-halt-spread", "reliability": 4}, {"name": "Associated Press (via KSAT)", "url": "https://www.ksat.com/news/world/2026/07/30/congo-says-the-death-toll-in-fastest-growing-ebola-outbreak-has-passed-1500/", "reliability": 5}], "en": {"title": "DR Congo's Ebola deaths pass 1,500 as Uganda is declared free of the virus", "summary": "The Democratic Republic of Congo's Ebola outbreak has reached 3,442 confirmed cases and 1,521 deaths, a 50% jump in fatalities in a single week, even as neighboring Uganda declared itself Ebola-free after 42 days with no new cases.", "detail": "The Bundibugyo strain, the rarest Ebola variant, is concentrated in Ituri province, which accounts for nearly 90% of cases, though five other provinces including the city of Kisangani have reported infections. Africa CDC director-general Jean Kaseya said 63% of confirmed deaths in the last two weeks happened outside treatment centers, largely due to unsafe handling of bodies by residents. No proven vaccine exists for this strain, and decades of armed conflict have weakened the health system; a July 15 attack on a hospital temporarily displaced international responders. Uganda, by contrast, discharged its last patient in mid-June and was declared free of the outbreak on July 28 after completing the 42-day monitoring period.", "terms": [{"match": "Bundibugyo strain", "id": "ebola"}, {"match": "Africa CDC", "id": "ebola"}]}, "it": {"title": "I morti per Ebola in RD Congo superano 1.500 mentre l'Uganda viene dichiarata libera dal virus", "summary": "Il focolaio di Ebola nella Repubblica Democratica del Congo ha raggiunto 3.442 casi confermati e 1.521 morti, un balzo del 50% dei decessi in una sola settimana, mentre la vicina Uganda si è dichiarata libera da Ebola dopo 42 giorni senza nuovi casi.", "detail": "Il ceppo Bundibugyo, la variante più rara di Ebola, è concentrato nella provincia di Ituri, che rappresenta quasi il 90% dei casi, anche se altre cinque province, tra cui la città di Kisangani, hanno segnalato infezioni. Il direttore generale dell'Africa CDC Jean Kaseya ha detto che il 63% dei decessi confermati nelle ultime due settimane è avvenuto fuori dai centri di trattamento, in gran parte per la gestione non sicura dei corpi da parte dei residenti. Non esiste un vaccino comprovato per questo ceppo, e decenni di conflitto armato hanno indebolito il sistema sanitario; un attacco a un ospedale il 15 luglio ha temporaneamente allontanato il personale internazionale. L'Uganda, al contrario, ha dimesso il suo ultimo paziente a metà giugno ed è stata dichiarata libera dal focolaio il 28 luglio dopo aver completato il periodo di monitoraggio di 42 giorni.", "terms": [{"match": "ceppo Bundibugyo", "id": "ebola"}, {"match": "Africa CDC", "id": "ebola"}]}, "topics": []}, {"id": "gaza-medicine-warehouse-strike", "date": "2026-08-01", "country": "Palestine", "category": "Geopolitics", "topics": ["israel-palestine"], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/1/israeli-strikes-kill-four-across-gaza-destroy-medical-supply-warehouse", "reliability": 4}, {"name": "The Times of Israel", "url": "https://www.timesofisrael.com/liveblog-august-2-2026/", "reliability": 3}], "en": {"title": "Israeli strikes destroy Gaza medicine warehouses, kill four, days after Hamas disarmament deal", "summary": "Israeli strikes destroyed two of four medicine storage facilities attached to Al-Aqsa Martyrs Hospital in Deir el-Balah and killed at least four Palestinians elsewhere in Gaza, part of a pattern that has killed more than 1,200 people since the October 2025 ceasefire began.", "detail": "The warehouse strike came just days after Hamas and other Palestinian factions signed a US-brokered 15-point disarmament roadmap that Washington called a 'breakthrough.' Gaza's Health Ministry called the destruction of the medicine stores a 'heinous crime,' saying the occupation uses the destruction of medical supplies 'as a tool of war.' Separate strikes hit Gaza City's Sheikh Radwan neighborhood, Deir el-Balah, and an area near a school in al-Mawasi, damaging shelters and tents housing displaced families. Israel's military said its operations target Hamas militants, while rights monitors say the ceasefire, technically in place since October 10, 2025, is being violated on a near-daily basis.", "terms": [{"match": "October 2025 ceasefire", "id": "yellow-line"}]}, "it": {"title": "Raid israeliani distruggono i magazzini di medicinali a Gaza, quattro morti, pochi giorni dopo l'accordo di disarmo di Hamas", "summary": "Attacchi israeliani hanno distrutto due dei quattro depositi di medicinali collegati all'ospedale Al-Aqsa Martyrs a Deir el-Balah e ucciso almeno quattro palestinesi altrove a Gaza, parte di un modello che ha causato oltre 1.200 morti dall'inizio del cessate il fuoco di ottobre 2025.", "detail": "L'attacco ai magazzini è arrivato pochi giorni dopo che Hamas e altre fazioni palestinesi hanno firmato una tabella di marcia in 15 punti per il disarmo, mediata dagli USA e definita da Washington una 'svolta storica'. Il Ministero della Salute di Gaza ha definito la distruzione dei depositi di medicinali un 'crimine efferato', affermando che l'occupazione usa la distruzione delle forniture mediche 'come strumento di guerra'. Attacchi separati hanno colpito il quartiere di Sheikh Radwan a Gaza City, Deir el-Balah e un'area vicino a una scuola ad al-Mawasi, danneggiando rifugi e tende che ospitano famiglie sfollate. L'esercito israeliano ha detto che le sue operazioni colpiscono miliziani di Hamas, mentre gli osservatori per i diritti umani affermano che il cessate il fuoco, tecnicamente in vigore dal 10 ottobre 2025, viene violato quasi quotidianamente.", "terms": [{"match": "cessate il fuoco di ottobre 2025", "id": "yellow-line"}]}}, {"id": "china-taiwan-maritime-patrols", "date": "2026-07-29", "country": "China", "category": "Geopolitics", "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/29/china-puts-squeeze-on-taiwan-with-new-maritime-patrols", "reliability": 4}, {"name": "Hong Kong Free Press", "url": "https://hongkongfp.com/2026/07/08/china-signals-new-normal-with-coast-guard-patrols-off-eastern-taiwan/", "reliability": 4}], "en": {"title": "China ramps up coast guard patrols around Taiwan in what analysts call a 'boa constrictor' strategy", "summary": "Chinese coastguard vessels sharply increased patrols east of Taiwan, requesting vessel origin and destination information in what analysts warn could be a rehearsal for a future blockade; Taiwan logged 55 Chinese coastguard sightings in June, up from 30 in May.", "detail": "The UK, Germany and France issued a joint statement opposing the patrols, and US Secretary of State Marco Rubio said Washington 'disagrees' with them, though analysts note the US may be distracted by the war with Iran. Taiwan imports nearly all of its energy, making it especially vulnerable to any future blockade of the strait separating it from mainland China, which claims the self-governed island as its own territory.", "terms": [{"match": "blockade", "id": "taiwan-patrols"}]}, "it": {"title": "La Cina intensifica le pattuglie della guardia costiera attorno a Taiwan, secondo gli analisti una strategia 'a costrittore'", "summary": "Le navi della guardia costiera cinese hanno aumentato bruscamente le pattuglie a est di Taiwan, chiedendo informazioni su origine e destinazione delle navi, in quella che gli analisti temono possa essere una prova generale per un futuro blocco navale; Taiwan ha registrato 55 avvistamenti della guardia costiera cinese a giugno, contro i 30 di maggio.", "detail": "Regno Unito, Germania e Francia hanno pubblicato una dichiarazione congiunta contro le pattuglie, e il Segretario di Stato USA Marco Rubio ha detto che Washington 'non è d'accordo', anche se gli analisti notano che gli USA potrebbero essere distratti dalla guerra con l'Iran. Taiwan importa quasi tutta la propria energia, il che la rende particolarmente vulnerabile a un eventuale blocco dello stretto che la separa dalla Cina continentale, la quale rivendica l'isola autogovernata come proprio territorio.", "terms": [{"match": "blocco navale", "id": "taiwan-patrols"}]}, "topics": []}, {"id": "fed-holds-rates-july29", "date": "2026-07-29", "country": "USA", "category": "Economy", "sources": [{"name": "CNBC", "url": "https://www.cnbc.com/2026/07/29/fed-rate-decision-july-2026.html", "reliability": 4}, {"name": "CNN", "url": "https://www.cnn.com/2026/07/29/business/live-news/federal-reserve-interest-rate-07-29-26", "reliability": 4}], "en": {"title": "Divided Federal Reserve holds interest rates steady as three officials dissent", "summary": "The Federal Reserve kept its benchmark interest rate unchanged at its July meeting, but three officials publicly dissented from the decision, an unusually visible split as policymakers weigh inflation risks from the Iran war and new tariffs against a cooling labor market.", "detail": "The rate hold keeps borrowing costs at their current level heading into an August jobs report investors are watching closely for signs of labor-market weakness. Fed Chair Jerome Powell acknowledged the committee remains divided over whether tariff- and oil-driven price pressure or a slowing economy poses the bigger risk, with markets now pricing in the possibility of a rate cut at the Fed's next meeting in September.", "terms": [{"match": "Federal Reserve", "id": "fed"}]}, "it": {"title": "La Federal Reserve divisa mantiene i tassi invariati, tre membri dissentono", "summary": "La Federal Reserve ha mantenuto invariato il tasso di riferimento nella riunione di luglio, ma tre membri hanno pubblicamente dissentito dalla decisione, una spaccatura insolitamente visibile mentre i responsabili della politica monetaria valutano i rischi inflazionistici della guerra con l'Iran e dei nuovi dazi contro un mercato del lavoro in raffreddamento.", "detail": "Il mantenimento dei tassi lascia il costo del denaro invariato in vista del rapporto sull'occupazione di agosto, che gli investitori seguono con attenzione per segnali di debolezza del mercato del lavoro. Il presidente della Fed Jerome Powell ha riconosciuto che il comitato resta diviso su cosa rappresenti il rischio maggiore, se la pressione sui prezzi guidata da dazi e petrolio o un'economia in rallentamento, mentre i mercati ora scontano la possibilità di un taglio dei tassi alla prossima riunione della Fed a settembre.", "terms": [{"match": "Federal Reserve", "id": "fed"}]}, "topics": ["mercato-investimenti"]}, {"id": "samsung-broadcom-chip-deal", "date": "2026-07-25", "country": "Global", "category": "Technology", "sources": [{"name": "CNBC", "url": "https://www.cnbc.com/2026/07/25/samsung-electronics-wins-200-billion-broadcom-ai-chip-partnership.html", "reliability": 4}, {"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-07-25/samsung-inks-200-billion-chip-supply-with-broadcom", "reliability": 4}], "en": {"title": "Samsung locks in $200 billion Broadcom AI chip deal as shortage warnings stretch to 2028", "summary": "Samsung Electronics secured a $200 billion partnership to supply AI chips to Broadcom through 2030, reserving up to 70% of its memory production capacity, as the company warned that a severe global AI chip shortage could persist until 2028.", "detail": "The deal underscores how memory chipmakers are racing to lock in long-term AI supply contracts even as questions mount over whether current AI infrastructure spending is sustainable. Samsung's semiconductor division reported record profits driven by AI memory demand in its latest quarterly results, even as its smartphone unit posted its first-ever operating loss. Rival SK Hynix also posted record earnings in the same period, while Samsung separately advanced its foundry ambitions through the Broadcom deal.", "terms": [{"match": "AI chip shortage", "id": "hbm-shortage"}]}, "it": {"title": "Samsung si assicura un accordo da 200 miliardi di dollari con Broadcom mentre gli avvertimenti sulla carenza di chip si estendono al 2028", "summary": "Samsung Electronics si è assicurata una partnership da 200 miliardi di dollari per fornire chip AI a Broadcom fino al 2030, riservando fino al 70% della propria capacità produttiva di memorie, mentre l'azienda ha avvertito che una grave carenza globale di chip AI potrebbe persistere fino al 2028.", "detail": "L'accordo sottolinea come i produttori di memorie stiano correndo ad assicurarsi contratti di fornitura AI a lungo termine, anche mentre crescono i dubbi sulla sostenibilità degli attuali livelli di spesa in infrastrutture AI. La divisione semiconduttori di Samsung ha riportato profitti record trainati dalla domanda di memorie per l'AI nell'ultimo trimestre, anche se la divisione smartphone ha registrato la sua prima perdita operativa di sempre. Anche la rivale SK Hynix ha registrato utili record nello stesso periodo, mentre Samsung ha portato avanti separatamente le proprie ambizioni nella fonderia grazie all'accordo con Broadcom.", "terms": [{"match": "carenza globale di chip AI", "id": "hbm-shortage"}]}, "topics": ["ai"]}, {"id": "trump-patriot-license-reversal", "date": "2026-07-31", "country": "USA", "category": "Politics", "topics": ["politica-internazionale", "russia-ukraine"], "sources": [{"name": "CNBC", "url": "https://www.cnbc.com/2026/07/31/trump-ukraine-patriot-missile-license-russia.html", "reliability": 4}, {"name": "ABC News", "url": "https://abcnews.com/Politics/reversal-trump-agreed-grant-ukraine-licenses-produce-patriot/story?id=135266819", "reliability": 4}], "en": {"title": "Trump reverses course, says US has not agreed to let Ukraine produce Patriot missiles", "summary": "President Trump said the United States has 'not agreed to' grant Ukraine licenses to manufacture its own Patriot air-defense missiles, reversing an earlier public promise, just as a Russian barrage overwhelmed Kyiv's dwindling Patriot interceptor supply.", "detail": "The reversal came days after Ukrainian President Volodymyr Zelensky pitched anti-drone technology to Trump while seeking a domestic license to produce Patriots, and just before a Russian missile and drone barrage on Kyiv killed nine people on August 1 — Ukraine intercepted only one of 27 incoming ballistic missiles, which officials attributed to a shortage of Patriot interceptors. Trump said he still has doubts about the transfer, without fully explaining his reasoning.", "terms": [{"match": "Patriot air-defense missiles", "id": "patriot"}]}, "it": {"title": "Trump fa marcia indietro: gli USA non hanno accettato di far produrre missili Patriot all'Ucraina", "summary": "Il presidente Trump ha detto che gli Stati Uniti 'non hanno accettato' di concedere all'Ucraina le licenze per produrre autonomamente i propri missili antiaerei Patriot, facendo marcia indietro rispetto a una precedente promessa pubblica, proprio mentre un bombardamento russo travolgeva le scorte di intercettori Patriot ormai scarse di Kiev.", "detail": "La marcia indietro è arrivata pochi giorni dopo che il presidente ucraino Volodymyr Zelensky aveva proposto a Trump tecnologia anti-drone chiedendo in cambio una licenza nazionale per produrre i Patriot, e poco prima che un bombardamento russo di missili e droni su Kiev uccidesse nove persone il 1° agosto: l'Ucraina ha intercettato solo uno dei 27 missili balistici in arrivo, cosa che i funzionari hanno attribuito alla carenza di intercettori Patriot. Trump ha detto di avere ancora dubbi sul trasferimento, senza spiegarne appieno le ragioni.", "terms": [{"match": "missili antiaerei Patriot", "id": "patriot"}]}}, {"id": "europe-heatwave-wildfires-aug", "date": "2026-07-29", "country": "EU", "category": "Social", "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/28/france-and-spain-brace-for-heatwave-that-could-worsen-raging-wildfires", "reliability": 4}, {"name": "CNN", "url": "https://www.cnn.com/2026/07/29/world/live-news/france-spain-wildfires-heat-wave", "reliability": 4}], "en": {"title": "France and Spain brace for new heatwave as wildfires continue to burn", "summary": "Southern Europe faced a fresh heatwave with temperatures forecast above 40°C, threatening to reignite wildfires that were only just stabilizing across France and Spain, as forecasters warned of a 'warmer-than-normal' August across the continent.", "detail": "The new heat dome follows weeks of extreme temperatures that have already fueled destructive wildfires and drought across the Mediterranean. Emergency services in both countries kept firefighting crews on high alert as winds and dry vegetation raised the risk of new blazes, continuing a pattern of increasingly severe and frequent European heatwaves that the WHO had already flagged as a growing public health emergency earlier in the summer.", "terms": []}, "it": {"title": "Francia e Spagna si preparano a una nuova ondata di caldo mentre gli incendi continuano a bruciare", "summary": "L'Europa meridionale ha affrontato una nuova ondata di caldo con temperature previste oltre i 40°C, con il rischio di far ripartire gli incendi appena stabilizzati in Francia e Spagna, mentre i meteorologi avvertivano di un agosto 'più caldo della norma' in tutto il continente.", "detail": "La nuova cupola di calore segue settimane di temperature estreme che hanno già alimentato incendi distruttivi e siccità nel Mediterraneo. I servizi di emergenza di entrambi i paesi hanno mantenuto le squadre antincendio in stato di massima allerta, mentre vento e vegetazione secca aumentavano il rischio di nuovi roghi, proseguendo un modello di ondate di caldo europee sempre più severe e frequenti che l'OMS aveva già segnalato come una crescente emergenza di salute pubblica all'inizio dell'estate.", "terms": []}, "topics": []}, {"id": "ebola-drc-second-largest", "date": "2026-07-31", "country": "DR Congo", "category": "Medicine", "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/7/31/dr-congo-ebola-epidemic-becomes-worlds-second-largest-outbreak", "reliability": 4}, {"name": "CNN", "url": "https://edition.cnn.com/2026/07/31/health/ebola-outbreak-congo", "reliability": 4}], "en": {"title": "DR Congo's Ebola outbreak becomes the second-largest ever recorded", "summary": "Confirmed Ebola cases in the Democratic Republic of Congo reached 3,532 with 1,556 deaths, surpassing the country's 2018-2020 outbreak to become the second-largest Ebola epidemic on record after the 2014-2016 West African outbreak.", "detail": "UN World Food Programme official Carl Skau called it 'the fastest spreading Ebola epidemic that we have ever seen,' with Africa CDC estimating the outbreak killed five times as many people in its first three months as previous outbreaks reached at the same stage. The rare Bundibugyo strain, for which no vaccine is approved, is spreading across five provinces, and the WHO estimates the true case count could be four times higher than official figures due to gaps in surveillance. Africa CDC says $1.4 billion is needed to contain the outbreak.", "terms": [{"match": "Bundibugyo strain", "id": "ebola"}]}, "it": {"title": "Il focolaio di Ebola in RD Congo diventa il secondo più grande mai registrato", "summary": "I casi confermati di Ebola nella Repubblica Democratica del Congo hanno raggiunto 3.532, con 1.556 morti, superando il focolaio 2018-2020 del paese e diventando la seconda epidemia di Ebola più grande mai registrata dopo quella dell'Africa occidentale del 2014-2016.", "detail": "Carl Skau, funzionario del World Food Programme dell'ONU, l'ha definita 'l'epidemia di Ebola in più rapida diffusione mai vista', con l'Africa CDC che stima come il focolaio abbia ucciso cinque volte più persone nei primi tre mesi rispetto ai focolai precedenti allo stesso stadio. Il raro ceppo Bundibugyo, per cui non esiste un vaccino approvato, si sta diffondendo in cinque province, e l'OMS stima che il numero reale di casi potrebbe essere quattro volte superiore alle cifre ufficiali a causa di lacune nella sorveglianza. L'Africa CDC afferma che servono 1,4 miliardi di dollari per contenere il focolaio.", "terms": [{"match": "ceppo Bundibugyo", "id": "ebola"}]}, "topics": []}, {"id": "iran-deal-talks-monday", "date": "2026-08-03", "country": "Iran", "category": "Geopolitics", "topics": ["us-iran"], "sources": [{"name": "CBS News", "url": "https://www.cbsnews.com/live-updates/iran-war-us-trump-strait-of-hormuz-kuwait-jordan-air-base/", "reliability": 5}, {"name": "Washington Post", "url": "https://www.washingtonpost.com/world/2026/08/02/trump-cancels-iran-attack-citing-progress-deal-tehran-israel-alert/", "reliability": 4}], "en": {"title": "Trump cancels planned Iran strike, sets Monday for renewed talks", "summary": "President Trump said he called off a planned new US attack on Iran, citing progress toward a deal and a request from Gulf allies, and announced that negotiations with Tehran would resume Monday.", "detail": "Trump said the \"parameters of a deal\" had been agreed and that Gulf states had asked Washington to hold off on further strikes while talks continue. The reversal follows a week in which the US and Israel had reportedly planned a fresh wave of strikes on Iranian energy infrastructure. Tehran, for its part, warned it would respond \"decisively\" to any renewed US aggression even as it signaled openness to the Monday talks. The on-again, off-again pattern of strikes and diplomacy has defined the conflict since it reignited in late July.", "terms": [{"match": "Gulf allies", "id": "gulf-allies"}]}, "it": {"title": "Trump annulla l'attacco pianificato contro l'Iran, colloqui rinnovati lunedì", "summary": "Il presidente Trump ha dichiarato di aver annullato un nuovo attacco pianificato contro l'Iran, citando progressi verso un accordo e una richiesta degli alleati del Golfo, annunciando che i negoziati con Teheran riprenderanno lunedì.", "detail": "Trump ha detto che i \"parametri di un accordo\" sono stati concordati e che gli stati del Golfo avevano chiesto a Washington di sospendere ulteriori attacchi mentre proseguono i colloqui. La marcia indietro segue una settimana in cui USA e Israele avrebbero pianificato una nuova ondata di attacchi contro le infrastrutture energetiche iraniane. Teheran, dal canto suo, ha avvertito che risponderebbe in modo \"decisivo\" a qualsiasi nuova aggressione USA, pur segnalando apertura ai colloqui di lunedì. Lo schema altalenante di attacchi e diplomazia caratterizza il conflitto da quando si è riacceso a fine luglio.", "terms": [{"match": "alleati del Golfo", "id": "gulf-allies"}]}}, {"id": "gaza-strikes-aug2", "date": "2026-08-02", "country": "Palestine", "category": "Geopolitics", "topics": ["israel-palestine"], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/2/israel-kills-five-in-gaza-despite-trumps-hamas-disarmament-plan", "reliability": 4}, {"name": "NBC News", "url": "https://www.nbcnews.com/world/gaza/israeli-strikes-kill-nine-gaza-israeli-minister-no-deal-rcna590436", "reliability": 4}], "en": {"title": "Israeli strikes kill 18 in Gaza as minister rules out halt to attacks", "summary": "Israeli strikes across Gaza killed at least 18 Palestinians, medics said, just days after the Board of Peace announced a Hamas disarmament roadmap, as an Israeli minister said there was no deal to stop the attacks.", "detail": "The strikes hit multiple areas of the strip and came despite the disarmament agreement unveiled on July 31, underscoring how fragile the ceasefire framework remains. An Israeli minister told reporters no formal decision had been made to halt military operations while the disarmament process is negotiated. Rights groups say the pattern of near-daily strikes has continued largely unabated since the nominal ceasefire took hold months ago.", "terms": [{"match": "Board of Peace", "id": "board-of-peace"}]}, "it": {"title": "Raid israeliani uccidono 18 persone a Gaza, il ministro esclude lo stop agli attacchi", "summary": "Raid israeliani in varie zone di Gaza hanno ucciso almeno 18 palestinesi, secondo i soccorritori, pochi giorni dopo che il Board of Peace ha annunciato una tabella di marcia per il disarmo di Hamas, mentre un ministro israeliano ha escluso un accordo per fermare gli attacchi.", "detail": "I raid hanno colpito diverse zone della Striscia nonostante l'accordo di disarmo annunciato il 31 luglio, a conferma della fragilità del quadro del cessate il fuoco. Un ministro israeliano ha dichiarato ai giornalisti che non è stata presa alcuna decisione formale per fermare le operazioni militari mentre prosegue la trattativa sul disarmo. Le organizzazioni per i diritti umani segnalano che il ritmo quasi quotidiano degli attacchi è proseguito pressoché invariato da mesi, da quando è entrato in vigore il cessate il fuoco nominale.", "terms": [{"match": "Board of Peace", "id": "board-of-peace"}]}}, {"id": "oil-tumbles-iran-deal", "date": "2026-08-03", "country": "Global", "category": "Economy", "topics": ["mercato-investimenti", "us-iran"], "sources": [{"name": "CNBC", "url": "https://www.cnbc.com/2026/08/03/oil-prices-today-wti-brent-hormuz-trump-iran.html", "reliability": 5}, {"name": "ABC News", "url": "https://abcnews.com/Business/wireStory/oil-prices-drop-after-trump-orders-us-forces-135313011", "reliability": 4}], "en": {"title": "Oil tumbles to three-week low after Trump halts Iran strike plans", "summary": "Crude prices fell roughly 5-6% to a three-week low, with WTI dropping toward $81 a barrel, after Trump said he had called off a planned strike on Iran and ordered US forces to hold back while talks resume.", "detail": "The reversal in oil prices mirrors the sharp swings seen throughout the conflict: crude has surged past $100 a barrel during periods of active fighting and tumbled whenever a pause or diplomatic opening emerged. Traders said the latest drop reflects reduced fears of a disruption to shipping through the Strait of Hormuz, though analysts cautioned the relief could prove short-lived given how quickly the war has escalated and de-escalated in recent weeks.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}]}, "it": {"title": "Il petrolio crolla ai minimi da tre settimane dopo lo stop di Trump all'attacco all'Iran", "summary": "I prezzi del greggio sono scesi di circa il 5-6% ai minimi da tre settimane, con il WTI vicino a 81 dollari al barile, dopo che Trump ha dichiarato di aver annullato un attacco pianificato contro l'Iran e ordinato alle forze USA di attendere la ripresa dei colloqui.", "detail": "L'inversione dei prezzi del petrolio rispecchia le forti oscillazioni viste durante tutto il conflitto: il greggio ha superato i 100 dollari al barile nei periodi di combattimenti attivi ed è crollato ogni volta che è emersa una pausa o un'apertura diplomatica. Gli operatori di mercato affermano che il calo riflette il timore ridotto di un'interruzione del traffico marittimo nello Stretto di Hormuz, anche se gli analisti avvertono che il sollievo potrebbe essere di breve durata, vista la rapidità con cui la guerra si è alternata tra escalation e de-escalation nelle ultime settimane.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}]}}, {"id": "apple-amazon-earnings-diverge", "date": "2026-07-31", "country": "USA", "category": "Technology", "sources": [{"name": "Yahoo Finance", "url": "https://finance.yahoo.com/markets/stocks/articles/amazon-apple-beat-earnings-head-223100755.html", "reliability": 4}, {"name": "CNBC", "url": "https://www.cnbc.com/2026/07/31/apple-aapl-amazon-amzn-stock-today.html", "reliability": 5}], "en": {"title": "Amazon soars, Apple slips as both beat earnings but investors diverge on AI strategy", "summary": "Amazon shares jumped as much as 12% and Apple fell around 4-8% even though both companies beat quarterly earnings estimates, as investors rewarded Amazon's AWS cloud growth while questioning Apple's AI positioning.", "detail": "Amazon reported $200.6 billion in quarterly revenue with AWS sales up 36.7% to $42.2 billion, its fastest growth in 18 quarters. Apple posted a record quarter for iPhone revenue and beat consensus estimates, yet its shares fell as investors focused on the company's comparatively cautious AI investment plans. The split outcome capped a week in which Microsoft, Alphabet and Amazon collectively added nearly $1.5 trillion in market value on strong AI and cloud results.", "terms": [{"match": "AWS", "id": "aws"}]}, "it": {"title": "Amazon vola, Apple scivola: entrambe battono le attese ma gli investitori divergono sull'AI", "summary": "Le azioni Amazon sono salite fino al 12% e quelle Apple sono scese di circa il 4-8%, pur avendo entrambe superato le stime trimestrali, con gli investitori che hanno premiato la crescita del cloud AWS di Amazon mentre mettevano in dubbio il posizionamento AI di Apple.", "detail": "Amazon ha riportato ricavi trimestrali per 200,6 miliardi di dollari, con le vendite AWS in crescita del 36,7% a 42,2 miliardi, la crescita più rapida in 18 trimestri. Apple ha registrato un trimestre record per i ricavi dell'iPhone e ha superato le stime di consenso, ma il titolo è comunque sceso perché gli investitori si so
