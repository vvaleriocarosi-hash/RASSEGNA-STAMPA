itle": "Un attacco israeliano distrugge un magazzino di aiuti a Gaza con scorte per bambini malnutriti", "summary": "Un attacco israeliano ha distrutto un magazzino umanitario a Gaza che conservava scorte nutrizionali per bambini, donne incinte e madri che allattano, mentre altri attacchi nella Striscia hanno ucciso sette palestinesi.", "detail": "Il magazzino, gestito dalle organizzazioni umanitarie Medical Aid for Palestinians (MAP) e Ard El Insan, è stato colpito durante la notte, seppellendo gli aiuti alimentari sotto le macerie. Il ministero della Salute di Gaza ha avvertito di un 'collasso totale' dei beni di prima necessità, con solo 12 delle circa 34 stazioni di ossigeno ancora operative; il funzionario sanitario Munir al-Bursh ha dichiarato che 'se questa fornitura di ossigeno si interrompe, queste persone moriranno'. Gli attacchi sono avvenuti nonostante il cessate il fuoco nominale dell'ottobre 2025 e pochi giorni dopo che il presidente Trump aveva pubblicamente esortato Israele a limitare gli attacchi a Gaza.", "terms": [{"match": "Medical Aid for Palestinians (MAP)", "id": "gaza-healthcare-collapse"}]}}, {"id": "canada-retaliatory-tariffs-effective-aug23", "date": "2026-08-23", "country": "Canada", "category": "Economy", "topics": ["mercato-investimenti"], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/23/canada-to-hit-us-with-retaliatory-tariffs-as-trade-war-escalates", "reliability": 4}, {"name": "NPR", "url": "https://www.npr.org/2026/08/22/nx-s1-5941584/us-canada-tariffs", "reliability": 5}], "en": {"title": "Canada announces retaliatory tariffs on US goods, effective September 8", "summary": "Prime Minister Mark Carney said Canada will match Washington's 50% tariffs 'dollar for dollar' with new duties on US steel, dairy, appliances, agricultural equipment, pulp, paper and electronics, set to take effect September 8.", "detail": "The move follows the collapse of last-minute trade talks and the lapse of Trump's deadline, after which the US imposed 50% tariffs on roughly $20 billion of Canadian goods. Invoked under the same tariff logic as the earlier Section 338 US measures, Carney's move follows the collapse of last-minute trade talks. 'You're at war when you get attacked. We got attacked,' Carney said, adding 'Canada has what the world wants, and we will not allow any nation to determine our future.' US Trade Representative Jamieson Greer countered that Canada had 'declined to finalize the trade deal' after making 'new demands.'", "terms": [{"match": "Section 338", "id": "section-338"}]}, "it": {"title": "Il Canada annuncia dazi di ritorsione sui beni statunitensi, in vigore dall'8 settembre", "summary": "Il primo ministro Mark Carney ha detto che il Canada replicherà ai dazi del 50% imposti da Washington 'dollaro per dollaro' con nuovi dazi su acciaio, latticini, elettrodomestici, macchinari agricoli, pasta di legno, carta ed elettronica statunitensi, in vigore dall'8 settembre.", "detail": "La mossa arriva dopo il fallimento dei negoziati commerciali dell'ultimo minuto e la scadenza dell'ultimatum di Trump, dopo la quale gli USA hanno imposto dazi del 50% su circa 20 miliardi di dollari di beni canadesi. Invocata nella stessa logica dei precedenti dazi USA ai sensi della Section 338, la mossa di Carney arriva dopo il fallimento dei negoziati commerciali dell'ultimo minuto. 'Sei in guerra quando vieni attaccato. Noi siamo stati attaccati,' ha detto Carney, aggiungendo che 'il Canada ha ciò che il mondo vuole, e non permetteremo a nessuna nazione di decidere il nostro futuro.' Il rappresentante commerciale USA Jamieson Greer ha ribattuto che il Canada aveva 'rifiutato di finalizzare l'accordo commerciale' dopo aver avanzato 'nuove richieste'.", "terms": [{"match": "Section 338", "id": "section-338"}]}}, {"id": "nvidia-q2-fy27-earnings-aug26", "date": "2026-08-26", "country": "USA", "category": "Technology", "topics": ["ai"], "sources": [{"name": "CNBC", "url": "https://www.cnbc.com/2026/08/26/nvidia-nvda-earnings-report-q2-2027-live-updates.html", "reliability": 4}, {"name": "Fortune", "url": "https://fortune.com/2026/08/26/nvidia-q2-growth-results-jensen-huang/", "reliability": 3}], "en": {"title": "Nvidia posts record $96 billion quarter, Huang forecasts 70% revenue growth for fiscal 2028", "summary": "Nvidia reported record second-quarter revenue of roughly $96 billion, more than double a year earlier, and gave a rare year-ahead forecast of 70% revenue growth for fiscal 2028, seeking to quiet fears of an AI spending bubble.", "detail": "The bullish guidance, far above analyst estimates, would put Nvidia on track to become the tech industry's second-largest company by revenue. Gross margins came under pressure from soaring memory-chip costs, underscoring the same high-bandwidth-memory shortage that has weighed on rivals like Micron. CEO Jensen Huang framed the forecast as a direct rebuttal to investors worried that 'circular financing' between AI firms is inflating demand.", "terms": [{"match": "high-bandwidth-memory shortage", "id": "hbm-shortage"}]}, "it": {"title": "Nvidia registra un trimestre record da 96 miliardi di dollari, Huang prevede una crescita dei ricavi del 70% per l'anno fiscale 2028", "summary": "Nvidia ha riportato ricavi record nel secondo trimestre per circa 96 miliardi di dollari, più del doppio rispetto a un anno prima, e ha fornito una rara previsione a un anno di crescita dei ricavi del 70% per l'anno fiscale 2028, cercando di placare i timori di una bolla della spesa sull'IA.", "detail": "Le previsioni ottimistiche, ben al di sopra delle stime degli analisti, porterebbero Nvidia a diventare la seconda azienda tech per ricavi. I margini lordi hanno subito pressioni per l'impennata dei costi dei chip di memoria, sottolineando la stessa carenza di memoria ad alta larghezza di banda che ha pesato su rivali come Micron. L'amministratore delegato Jensen Huang ha presentato la previsione come una risposta diretta agli investitori preoccupati che il 'finanziamento circolare' tra aziende IA stia gonfiando artificialmente la domanda.", "terms": [{"match": "carenza di memoria ad alta larghezza di banda", "id": "hbm-shortage"}]}}, {"id": "trump-saudi-nuclear-deal-aug25", "date": "2026-08-25", "country": "Saudi Arabia", "category": "Politics", "topics": ["politica-internazionale"], "sources": [{"name": "U.S. News & World Report (AP)", "url": "https://www.usnews.com/news/world/articles/2026-08-25/trump-has-submitted-civil-nuclear-agreement-with-saudi-arabia-to-congress-for-review-ap-sources-say", "reliability": 5}, {"name": "France 24 (AFP)", "url": "https://www.france24.com/en/americas/20260826-trump-saudi-civil-nuclear-agreement-congress", "reliability": 4}], "en": {"title": "Trump sends Saudi nuclear deal to Congress, ties it to Israel recognition", "summary": "The Trump administration submitted a 30-year civil nuclear cooperation agreement with Saudi Arabia to Congress, but says the deal will only move forward if Riyadh joins the Abraham Accords and recognizes Israel.", "detail": "The deal, negotiated in July, would let US firms — chiefly Westinghouse — build AP1000 reactors in the kingdom worth tens of billions of dollars. Congress has 90 session days to object before it automatically takes effect. Unlike the UAE's 2009 civil nuclear agreement, it does not bar Saudi Arabia from enriching uranium or reprocessing nuclear waste, drawing criticism from nonproliferation experts. Saudi Arabia has said it will not normalize ties with Israel without 'an irreversible path' to Palestinian statehood — a position Israeli PM Netanyahu has flatly rejected.", "terms": [{"match": "Abraham Accords", "id": "abraham-accords"}]}, "it": {"title": "Trump invia al Congresso l'accordo nucleare con l'Arabia Saudita, legato al riconoscimento di Israele", "summary": "L'amministrazione Trump ha sottoposto al Congresso un accordo di cooperazione nucleare civile trentennale con l'Arabia Saudita, ma la Casa Bianca afferma che l'intesa procederà solo se Riyadh aderirà agli Accordi di Abramo e riconoscerà Israele.", "detail": "L'accordo, negoziato a luglio, permetterebbe ad aziende statunitensi — soprattutto Westinghouse — di costruire reattori AP1000 nel regno per un valore di decine di miliardi di dollari. Il Congresso ha 90 giorni di seduta per opporsi prima che entri automaticamente in vigore. A differenza dell'accordo nucleare civile del 2009 con gli Emirati Arabi Uniti, questo non vieta all'Arabia Saudita di arricchire uranio o riprocessare scorie nucleari, suscitando critiche da esperti di non proliferazione. L'Arabia Saudita ha detto che non normalizzerà i rapporti con Israele senza 'un percorso irreversibile' verso uno Stato palestinese — posizione che il premier israeliano Netanyahu ha respinto categoricamente.", "terms": [{"match": "Accordi di Abramo", "id": "abraham-accords"}]}}, {"id": "india-patna-protest-aug25", "date": "2026-08-25", "country": "India", "category": "Social", "topics": [], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/25/india-police-clash-with-protesters-a-month-after-gen-z-demonstrations", "reliability": 4}, {"name": "The Tribune (India)", "url": "https://www.tribuneindia.com/news/india/students-cops-face-off-in-patna-during-march-to-cms-residence-over-bpsc-exams/", "reliability": 3}], "en": {"title": "Indian police clash with job-seeking protesters in Patna, a month after Gen Z marches", "summary": "Police used water cannon and batons against thousands of protesters marching on the Bihar chief minister's residence over stalled civil-service exam recruitment, a month after youth-led Gen Z demonstrations shook Delhi.", "detail": "Demonstrators, many of them exam candidates, broke through security barriers demanding transparency and speed in recruitment, echoing the grievances that fuelled the Cockroach Janta Party movement over exam-paper leaks. At least 25 protesters were detained and later released; Bihar's government, run by PM Modi's party, said it was 'listening to every student's voice,' while similar unrest has surfaced in other states including Karnataka.", "terms": [{"match": "Cockroach Janta Party", "id": "cockroach-party"}]}, "it": {"title": "La polizia indiana scontra con manifestanti in cerca di lavoro a Patna, un mese dopo le marce Gen Z", "summary": "La polizia ha usato cannoni ad acqua e manganelli contro migliaia di manifestanti diretti verso la residenza del capo del governo del Bihar per le assunzioni bloccate nei concorsi pubblici, un mese dopo le manifestazioni giovanili Gen Z che avevano scosso Delhi.", "detail": "I manifestanti, molti dei quali candidati ai concorsi, hanno sfondato le barriere di sicurezza chiedendo trasparenza e rapidità nelle assunzioni, echeggiando le rivendicazioni che avevano alimentato il movimento Cockroach Janta Party sulle fughe di notizie sui test d'esame. Almeno 25 manifestanti sono stati fermati e poi rilasciati; il governo del Bihar, guidato dal partito del premier Modi, ha detto di 'ascoltare la voce di ogni studente', mentre proteste simili sono emerse in altri stati, tra cui il Karnataka.", "terms": [{"match": "Cockroach Janta Party", "id": "cockroach-party"}]}}, {"id": "drc-ebola-funding-crisis-aug21", "date": "2026-08-21", "country": "DR Congo", "category": "Medicine", "topics": [], "sources": [{"name": "UN News", "url": "https://news.un.org/en/story/2026/08/1168182", "reliability": 5}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/21/ebola-outbreak-growing-faster-%E2%81%A0%E2%81%A0wider-as-drc-death-toll-passes-2500-un", "reliability": 4}], "en": {"title": "UN warns DR Congo's Ebola response funding will run out within weeks", "summary": "UN senior Ebola coordinator Julien Harneis warned emergency-response funding is nearly exhausted, as the outbreak passed 5,290 cases and 2,516 deaths and continues to grow 'exponentially.'", "detail": "Harneis said half of all deaths in the Bundibugyo-strain outbreak had occurred in just the previous 20 days, warning 'the outbreak is growing faster and wider than the response' and 'every delay makes this epidemic deadlier.' Security has also deteriorated: healthcare workers and ambulances have been attacked by youths in several affected communities, on top of 43 health-worker deaths already recorded among some 160 infected.", "terms": [{"match": "Bundibugyo", "id": "bundibugyo"}]}, "it": {"title": "L'ONU avverte che i fondi per la risposta all'Ebola in RD Congo si esauriranno entro poche settimane", "summary": "Il coordinatore ONU senior per l'Ebola Julien Harneis ha avvertito che i finanziamenti per la risposta d'emergenza sono quasi esauriti, mentre l'epidemia ha superato 5.290 casi e 2.516 morti e continua a crescere 'in modo esponenziale'.", "detail": "Harneis ha detto che metà di tutti i decessi dell'epidemia da ceppo Bundibugyo si sono verificati solo negli ultimi 20 giorni, avvertendo che 'l'epidemia cresce più velocemente e più ampiamente della risposta' e che 'ogni ritardo rende questa epidemia più letale'. Anche la sicurezza è peggiorata: operatori sanitari e ambulanze sono stati attaccati da giovani in diverse comunità colpite, oltre ai 43 decessi tra il personale sanitario già registrati su circa 160 contagiati.", "terms": [{"match": "Bundibugyo", "id": "bundibugyo"}]}}, {"id": "nepal-tibet-flash-floods-aug26", "date": "2026-08-26", "country": "Nepal", "category": "Social", "topics": [], "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/08/26/g-s1-140211/nepal-china-floods", "reliability": 5}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/26/at-least-eight-killed-in-nepal-flash-floods-that-swept-away-villages-roads", "reliability": 4}], "en": {"title": "Flash floods from Himalayan glacial collapse kill over 160 in Nepal, hundreds missing on Tibet border", "summary": "A glacial collapse triggered flash floods and mudslides along the Nepal-Tibet border, killing at least 162 people in Nepal and leaving 558 missing in Tibet, including 260 foreign nationals, after water levels rose nine metres in just 30 minutes.", "detail": "The US Geological Survey recorded a magnitude 5.2 ice-rock avalanche that blocked a glacial river before releasing a sudden surge downstream, devastating Syapru Besi and Timure in Nepal's Rasuwa district and Gyirong county across the border in Tibet. Missing persons in Tibet include 133 Indian pilgrims, 47 Americans, 34 Australians, 33 British and 24 Canadians. It is the second time in 14 months the same river system has flooded catastrophically — a 2025 flood on the same border destroyed the Nepal-China 'Friendship Bridge' — as scientists say Himalayan glacier ice-loss rates have doubled since 2000.", "terms": [{"match": "glacial collapse", "id": "glof"}]}, "it": {"title": "Inondazioni improvvise da un collasso glaciale himalayano uccidono oltre 160 persone in Nepal, centinaia i dispersi al confine col Tibet", "summary": "Un collasso glaciale ha innescato inondazioni improvvise e frane lungo il confine tra Nepal e Tibet, uccidendo almeno 162 persone in Nepal e lasciando 558 dispersi in Tibet, tra cui 260 cittadini stranieri, dopo che il livello dell'acqua è salito di nove metri in soli 30 minuti.", "detail": "Il servizio geologico statunitense (USGS) ha registrato una valanga di ghiaccio e roccia di magnitudo 5.2 che ha bloccato un fiume glaciale prima di rilasciare un'improvvisa ondata a valle, devastando Syapru Besi e Timure nel distretto di Rasuwa in Nepal e la contea di Gyirong dall'altra parte del confine in Tibet. Tra i dispersi in Tibet figurano 133 pellegrini indiani, 47 americani, 34 australiani, 33 britannici e 24 canadesi. È la seconda volta in 14 mesi che lo stesso sistema fluviale si allaga in modo catastrofico — un'alluvione del 2025 sullo stesso confine aveva distrutto il 'Ponte dell'Amicizia' tra Nepal e Cina — mentre gli scienziati affermano che il tasso di perdita di ghiaccio dei ghiacciai himalayani è raddoppiato dal 2000.", "terms": [{"match": "collasso glaciale", "id": "glof"}]}}, {"id": "nepal-tibet-floods-death-toll-aug27", "date": "2026-08-27", "country": "Nepal", "category": "Social", "topics": [], "sources": [{"name": "CNBC", "url": "https://www.cnbc.com/2026/08/27/hundreds-missing-after-flood-hits-nepal-tibet-border-157-bodies-recovered.html", "reliability": 4}, {"name": "ABC News (Australia)", "url": "https://www.abc.net.au/news/2026-08-27/nepal-flooding-live-updates-australians-missing/107082946", "reliability": 4}], "en": {"title": "Nepal flood death toll reaches 160 as rescuers recover 157 bodies, hundreds still missing", "summary": "A day after the glacial flash flood on the Nepal-Tibet border, rescuers have recovered 157 bodies and the confirmed death toll has reached 160, with hundreds of people — including 34 Australians and 33 Americans — still unaccounted for.", "detail": "Search-and-rescue teams are struggling to reach the worst-hit areas of Rasuwa district as damaged roads and unstable terrain hamper access, while helicopters remain grounded in parts of the disaster zone. Foreign governments, including Australia and the United States, are working with Nepali authorities to trace missing citizens among the hundreds of tourists and pilgrims who were in the area when the glacial collapse struck.", "terms": [{"match": "glacial flash flood", "id": "glof"}]}, "it": {"title": "Il bilancio delle vittime dell'alluvione in Nepal sale a 160 morti, recuperati 157 corpi, centinaia ancora dispersi", "summary": "Un giorno dopo l'inondazione improvvisa di origine glaciale al confine tra Nepal e Tibet, i soccorritori hanno recuperato 157 corpi e il bilancio confermato delle vittime è salito a 160, con centinaia di persone — tra cui 34 australiani e 33 americani — ancora disperse.", "detail": "Le squadre di ricerca e soccorso faticano a raggiungere le aree più colpite del distretto di Rasuwa a causa di strade danneggiate e terreno instabile, mentre gli elicotteri restano a terra in alcune zone del disastro. I governi stranieri, tra cui quello australiano e quello statunitense, stanno collaborando con le autorità nepalesi per rintracciare i cittadini dispersi tra le centinaia di turisti e pellegrini presenti nella zona al momento del collasso glaciale.", "terms": [{"match": "collasso glaciale", "id": "glof"}]}}, {"id": "nvidia-stock-slips-despite-beat-aug27", "date": "2026-08-27", "country": "USA", "category": "Economy", "topics": ["mercato-investimenti"], "sources": [{"name": "Invezz", "url": "https://invezz.com/news/2026/08/26/nvidia-stock-slips-1-despite-beating-earnings-expectations-and-raising-guidance/", "reliability": 3}, {"name": "CNBC", "url": "https://www.cnbc.com/2026/08/26/nvidia-nvda-earnings-report-q2-2027-live-updates.html", "reliability": 4}], "en": {"title": "Nvidia shares slip despite record earnings as Wall Street questions AI valuations", "summary": "Nvidia stock fell roughly 1% in after-hours trading even after revenue surged 106% year-on-year to $96.2 billion and the company projected $108 billion in third-quarter sales, as investors weighed renewed concerns about AI-sector valuations.", "detail": "Net income more than doubled to $53.95 billion and both revenue and earnings beat analyst estimates, but the muted stock reaction underscored lingering doubts about whether massive AI infrastructure spending can keep paying off. Analysts pointed to worries that Nvidia's web of investment deals across the AI ecosystem could amount to 'circular financing' that leaves the industry more exposed if spending momentum slows, even as the company's own guidance called for continued 70% growth into fiscal 2028.", "terms": [{"match": "circular financing", "id": "ai-sovereignty"}]}, "it": {"title": "Le azioni Nvidia scendono nonostante utili record, mentre Wall Street dubita delle valutazioni sull'IA", "summary": "Il titolo Nvidia è sceso di circa l'1% nelle contrattazioni after-hours anche dopo che i ricavi sono balzati del 106% su base annua a 96,2 miliardi di dollari e l'azienda ha previsto vendite per 108 miliardi nel terzo trimestre, mentre gli investitori valutavano rinnovate preoccupazioni sulle valutazioni del settore IA.", "detail": "L'utile netto è più che raddoppiato a 53,95 miliardi di dollari e sia i ricavi sia gli utili hanno superato le stime degli analisti, ma la reazione contenuta del titolo ha confermato i dubbi persistenti sul fatto che l'enorme spesa in infrastrutture IA possa continuare a ripagare. Gli analisti hanno segnalato timori che la rete di accordi di investimento di Nvidia nell'ecosistema IA possa configurare un 'finanziamento circolare' che espone maggiormente il settore in caso di rallentamento della spesa, anche se le previsioni della stessa azienda indicano una crescita continua del 70% per l'anno fiscale 2028.", "terms": [{"match": "finanziamento circolare", "id": "ai-sovereignty"}]}}, {"id": "israel-uk-gaza-center-expulsion-aug27", "date": "2026-08-27", "country": "Israel", "category": "Politics", "topics": ["israel-palestine", "politica-internazionale"], "sources": [{"name": "Arab News (FT)", "url": "https://www.arabnews.com/node/2655978/middle-east", "reliability": 3}, {"name": "Ynet", "url": "https://www.ynetnews.com/article/s15szhtpfx", "reliability": 3}], "en": {"title": "Israel reportedly weighs expelling British officials from Gaza coordination center", "summary": "Israel is considering expelling British officials — and possibly other European representatives — from the International Gaza Support Center, the multinational hub overseeing the US-brokered ceasefire, according to a Financial Times report.", "detail": "The report, first published by the Financial Times citing unnamed sources, said Reuters was unable to independently verify the account. The coordination center was set up to help implement the ceasefire and Gaza reconstruction plan; a British expulsion would mark a significant rift between Israel and one of the plan's key European backers, at a moment when the UK has already threatened Israel with sanctions over the West Bank E1 settlement tender.", "terms": [{"match": "International Gaza Support Center", "id": "board-of-peace"}]}, "it": {"title": "Israele valuterebbe l'espulsione di funzionari britannici dal centro di coordinamento per Gaza", "summary": "Secondo un'inchiesta del Financial Times, Israele starebbe valutando di espellere funzionari britannici — e possibilmente altri rappresentanti europei — dall'International Gaza Support Center, l'hub multinazionale che sovrintende al cessate il fuoco mediato dagli Stati Uniti.", "detail": "Il resoconto, pubblicato per primo dal Financial Times citando fonti anonime, non è stato verificato in modo indipendente da Reuters, come precisato dalla stessa agenzia. Il centro di coordinamento è stato istituito per aiutare ad attuare il cessate il fuoco e il piano di ricostruzione di Gaza; un'espulsione britannica segnerebbe una frattura significativa tra Israele e uno dei principali sostenitori europei del piano, in un momento in cui il Regno Unito aveva già minacciato Israele di sanzioni per il bando relativo all'insediamento E1 in Cisgiordania.", "terms": [{"match": "International Gaza Support Center", "id": "board-of-peace"}]}}, {"id": "italy-fuel-decree-aug26", "date": "2026-08-26", "country": "Italy", "category": "Politics", "topics": ["politica-italiana"], "sources": [{"name": "Euronews Italia", "url": "https://it.euronews.com/my-europe/2026/08/26/cdm-approva-decreto-carburanti-taglio-delle-accise-prorogato-fino-al-5-settembre", "reliability": 4}, {"name": "Agenpress", "url": "https://www.agenpress.it/2026/08/27/consiglio-dei-ministri-del-26-agosto-ecco-i-provvedimenti-adottati/", "reliability": 3}], "en": {"title": "Italian cabinet extends fuel-price discount and moves to unblock Ex Ilva waste management", "summary": "Italy's Council of Ministers, chaired by PM Giorgia Meloni, held a brief post-summer session extending the 17-cent-per-litre discount on diesel until September 5 and approving a decree to unblock waste-management operations at the former Ilva steelworks.", "detail": "The fuel decree extends the existing discount — split between a 14-cent excise-duty cut and a 3-cent VAT reduction, worth about €130 million — and extends a related tax credit for trucking firms; gasoline is not covered. Separately, a decree changes the financial-guarantee rules for state-run strategic industrial sites so Ex Ilva's waste and landfill operations, halted since August 20 by the environment ministry, can resume while the plant's sale process continues. The cabinet also gave preliminary approval to standard-needs calculations for local governments and backed Rome's bid to host the World Athletics Championships.", "terms": [{"match": "Ex Ilva", "id": "ex-ilva"}]}, "it": {"title": "Il governo italiano proroga lo sconto sui carburanti e sblocca la gestione rifiuti dell'ex Ilva", "summary": "Il Consiglio dei Ministri italiano, presieduto dalla premier Giorgia Meloni, in una breve seduta post-estiva ha prorogato fino al 5 settembre lo sconto di 17 centesimi al litro sul gasolio e approvato un decreto per sbloccare la gestione dei rifiuti negli stabilimenti dell'ex Ilva.", "detail": "Il decreto carburanti proroga lo sconto già in vigore — diviso tra un taglio di 14 centesimi di accisa e 3 centesimi di IVA, per circa 130 milioni di euro — ed estende il relativo credito d'imposta per le imprese di autotrasporto; la benzina non è coperta. Separatamente, un decreto modifica le regole delle garanzie finanziarie per gli impianti industriali strategici di proprietà pubblica, così che le attività di gestione rifiuti e discariche dell'ex Ilva, bloccate dal 20 agosto dal ministero dell'Ambiente, possano riprendere mentre prosegue il processo di vendita dello stabilimento. Il consiglio ha anche dato il via libera preliminare ai fabbisogni standard per gli enti locali e sostenuto la candidatura di Roma per i Campionati Mondiali di atletica leggera.", "terms": [{"match": "ex Ilva", "id": "ex-ilva"}]}}, {"id": "colleferro-femicide-aug19", "date": "2026-08-19", "country": "Italy", "category": "Cronaca Italiana", "topics": ["violenza-donne"], "sources": [{"name": "Il Fatto Quotidiano", "url": "https://www.ilfattoquotidiano.it/2026/08/19/femminicidio-colleferro-il-marito-confessa-la-vittima-morta-tra-le-braccia-della-figlia-il-sindaco-segnali-sfuggiti/8482343/", "reliability": 3}, {"name": "LaPresse", "url": "https://www.lapresse.it/cronaca/2026/08/18/donna-uccisa-a-colleferro-fermato-un-uomo/", "reliability": 3}], "en": {"title": "Husband confesses to killing wife in front of their child in Colleferro, near Rome", "summary": "Joanna Roussi, a 50-year-old Polish mother of five, was stabbed to death by her husband Mohamed Habib Rouissi, 69, at their home in Colleferro, near Rome, in front of their 9-year-old son; she died in the arms of their 20-year-old daughter, who raised the alarm.", "detail": "Rouissi confessed after being detained by police, saying he had stabbed his wife four times in the throat before fleeing and discarding the knife. The mayor of Colleferro said warning signs had gone unheeded and described it as the town's first femicide in recent memory. All five children were placed in protective care. The case is one of at least four femicides recorded in Italy within a 48-hour span, according to local reporting, as the country works through a new standalone femicide offence, article 577-bis of the penal code, introduced in December 2025.", "terms": [{"match": "article 577-bis of the penal code", "id": "femicide-law-it"}]}, "it": {"title": "Marito confessa di aver ucciso la moglie davanti al figlio a Colleferro, vicino Roma", "summary": "Joanna Roussi, 50 anni, madre polacca di cinque figli, è stata uccisa a coltellate dal marito Mohamed Habib Rouissi, 69 anni, nella loro casa di Colleferro, vicino Roma, davanti al figlio di 9 anni; è morta tra le braccia della figlia ventenne, che ha dato l'allarme.", "detail": "Rouissi ha confessato dopo essere stato fermato dalla polizia, dicendo di aver colpito la moglie quattro volte alla gola prima di fuggire gettando il coltello. Il sindaco di Colleferro ha detto che erano sfuggiti segnali della situazione, definendolo il primo femminicidio della storia recente della città. I cinque figli sono stati affidati a una struttura protetta. Il caso è uno di almeno quattro femminicidi registrati in Italia nell'arco di 48 ore, secondo la stampa locale, mentre il paese applica il nuovo reato autonomo di femminicidio, l'articolo 577-bis del codice penale, introdotto nel dicembre 2025.", "terms": [{"match": "articolo 577-bis del codice penale", "id": "femicide-law-it"}]}}, {"id": "ottawa-femicide-aug24", "date": "2026-08-24", "country": "Canada", "category": "Cronaca Internazionale", "topics": ["violenza-donne"], "sources": [{"name": "CP24 (CTV News)", "url": "https://www.cp24.com/news/canada/2026/08/24/ottawa-police-identify-27-year-old-woman-killed-in-alleged-weekend-femicide/", "reliability": 4}, {"name": "CBC News", "url": "https://www.cbc.ca/news/canada/ottawa/woman-death-investigated-femicide-ottawa-9.7318688", "reliability": 5}], "en": {"title": "Ottawa police identify 27-year-old woman killed in weekend femicide", "summary": "Kesi Fevrier, 27, was found dead at a home in Ottawa's Lowertown neighbourhood over the weekend; police are investigating her death as a femicide, the city's third of 2026 and ninth homicide overall.", "detail": "Officers were first called to a single-vehicle collision near Papineauville, Quebec, shortly before 1am Saturday, where a 34-year-old man, Kingsley Nwude, was found injured; Fevrier was later found dead inside a home on Guigues Avenue. Police have not disclosed the relationship between the two or filed charges, and say there is no ongoing threat to public safety. Ottawa police define femicide as the killing of women and girls because of their gender.", "terms": [{"match ion with an actual strike on two Saudi tankers.", "it": "Gli Houthi danno seguito alla dichiarazione di blocco navale con un attacco concreto a due petroliere saudite."}, {"from": "houthi-tankers-attack", "to": "oil-surge-100", "category": "Economy", "en": "The tanker attack is the direct trigger for oil's jump above $100 a barrel.", "it": "L'attacco alle petroliere è la causa diretta del balzo del petrolio sopra i 100 dollari al barile."}, {"from": "trump-tariffs-canada", "to": "us-tariffs-60-countries", "category": "Economy", "en": "Trump's tariff offensive broadens from single-country levies to a sweeping 60-country action.", "it": "L'offensiva tariffaria di Trump si allarga da dazi su singoli paesi a un'azione ad ampio raggio su 60 paesi."}, {"from": "brazil-tariffs-25", "to": "us-tariffs-60-countries", "category": "Economy", "en": "Country-specific tariffs on Brazil are followed by a much broader forced-labor tariff action covering 60 countries.", "it": "Ai dazi specifici sul Brasile segue un'azione tariffaria molto più ampia sul lavoro forzato che coinvolge 60 paesi."}, {"from": "india-gandhi-detained", "to": "india-modi-fast-track-courts", "category": "Social", "en": "Modi's fast-track courts offer, made after Gandhi's brief detention, is rejected by protesters as insufficient.", "it": "L'offerta di tribunali accelerati di Modi, arrivata dopo il breve fermo di Gandhi, viene respinta dai manifestanti come insufficiente."}, {"from": "gaza-family-killed-sabra", "to": "gaza-strikes-july24", "category": "Geopolitics", "en": "The pattern of deadly strikes on displaced Gaza civilians continues, this time after Israel's own evacuation orders.", "it": "Il modello di attacchi mortali contro civili sfollati a Gaza continua, questa volta dopo gli stessi ordini di evacuazione israeliani."}, {"from": "odesa-ship-strike", "to": "ukraine-russia-deep-strikes", "category": "Geopolitics", "en": "Deep strikes on both sides' rear areas continue, with fresh deaths in Russia's Voro // init calendar to month of most recent item

/* ============ HELPERS ============ */
function catColor(cat){ return CATS[cat] || '#888'; }
function catLabel(cat){
  const labels = DATA.categoryLabels && DATA.categoryLabels[currentLang];
  return (labels && labels[cat]) || cat;
}
function connColor(conn){
  if(conn.category === 'ViolenzaDonne') return SPECIAL_COLORS['violenza-donne'] || '#D6336C';
  return catColor(conn.category);
}
function placeLabel(key){
  const p = PLACES[key];
  if(!p) return key;
  return p[currentLang] || p.en || key;
}
function initials(country){
  if(!country) return '??';
  const words = country.replace(/[^A-Za-z ]/g,'').split(' ').filter(Boolean);
  if(words.length>=2) return (words[0][0]+words[1][0]).toUpperCase();
  return country.substring(0,2).toUpperCase();
}
function fmtDate(dateStr){
  const d = new Date(dateStr+'T00:00:00Z');
  const months = t('months');
  return d.getUTCDate()+' '+months[d.getUTCMonth()]+' '+d.getUTCFullYear();
}
function reliabilityStars(n){
  n = Math.max(0,Math.min(5, Math.round(n||0)));
  let html = '<span class="stars">';
  for(let i=0;i<5;i++){
    html += i<n ? '★' : '<span class="off">★</span>';
  }
  html += '</span>';
  return html;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function sourcesRowHtml(it, inline){
  const srcs = it.sources || [];
  let html = '<div class="sources-row">';
  srcs.forEach(s=>{
    html += '<div class="source-item">'
      + '<a class="source-link" target="_blank" rel="noopener" href="'+escapeHtml(s.url)+'">'+escapeHtml(s.name)+'</a>'
      + reliabilityStars(s.reliability)
      + '</div>';
  });
  html += '</div>';
  return html;
}

/* ============ CARD (shared by Feed + Daily Update) ============ */
function createPostCard(it){
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.id = it.id;
  const loc = it[currentLang] || it.en;
  const color = catColor(it.category);
  card.innerHTML = `
    <div class="card-head">
      <div class="avatar">${initials(it.country)}</div>
      <div class="card-head-meta">
        <div class="card-country">${escapeHtml(placeLabel(it.country) || it.country)}</div>
        <div class="card-date">${fmtDate(it.date)}</div>
      </div>
      <div class="cat-chip"><span class="cat-dot" style="background:${color}"></span>${escapeHtml(catLabel(it.category))}</div>
    </div>
    <h3>${escapeHtml(loc.title)}</h3>
    <div class="summary">${highlightSummaryFor(it, loc)}</div>
    <div class="card-footer">${sourcesRowHtml(it)}</div>
  `;
  card.addEventListener('click', function(e){
    if(e.target.closest('.term')){
      openDrawer(e.target.closest('.term').dataset.term);
      return;
    }
    if(e.target.closest('.source-link')){
      return; // let default link behaviour happen
    }
    openModal(it.id);
  });
  return card;
}
function highlightSummaryFor(it, loc){
  let text = escapeHtml(loc.summary || '');
  const terms = loc.terms || [];
  terms.forEach(term=>{
    if(!term.match) return;
    const escM = escapeHtml(term.match);
    const idx = text.indexOf(escM);
    if(idx !== -1){
      text = text.slice(0,idx) + '<mark class="term" data-term="'+term.id+'">' + escM + '</mark>' + text.slice(idx+escM.length);
    }
  });
  return text;
}

/* ============ ROW-LIMITED "VIEW ALL" RENDERING ============
   Renders `items` into `containerEl` using `renderItemFn(item)` -> DOM node.
   By default only shows as many items as fit in the first CSS row of the
   container (measured from actual layout, via matching offsetTop), then
   reveals a "View all" button that expands to the full list. State of
   expansion is tracked by the caller via isExpandedFn/toggleFn so it can
   survive re-renders (e.g. language switch). */
function renderRowLimited(containerEl, btnEl, items, isExpanded, onToggle, renderItemFn){
  containerEl.innerHTML = '';
  if(!items || items.length===0){
    containerEl.innerHTML = '<div class="empty-msg">'+t('noResults')+'</div>';
    if(btnEl) btnEl.style.display = 'none';
    return;
  }
  items.forEach(it=> containerEl.appendChild(renderItemFn(it)));
  if(!btnEl) return;
  const children = Array.from(containerEl.children);
  let rowLimit = children.length;
  if(children.length>1){
    const firstTop = children[0].offsetTop;
    let count = 0;
    for(const c of children){
      if(Math.abs(c.offsetTop-firstTop) < 2) count++; else break;
    }
    rowLimit = count || children.length;
  }
  if(items.length <= rowLimit){
    btnEl.style.display = 'none';
    return;
  }
  if(!isExpanded){
    children.slice(rowLimit).forEach(c=>{ c.style.display = 'none'; });
  }
  btnEl.style.display = 'inline-block';
  btnEl.classList.toggle('expanded', !!isExpanded);
  btnEl.textContent = isExpanded ? t('viewLess') : (t('viewAll')+' ('+items.length+')');
  btnEl.onclick = onToggle;
}

function buildTopNav(){

  allPill.className = 'pill' + (state.category===null ? ' active' : '');

    state.category=null; state.date=null; state.feedExpanded=false;
    renderFilteredSections();
    document.getElementById('feed-section').scrollIntoView({behavior:'smooth'});
  });
  nav.appendChild(allPill);

  CAT_KEYS.forEach(cat=>{
    const pill = document.createElement('button');
    pill.className = 'pill' + (state.category===cat ? ' active' : '');
    pill.innerHTML = '<span class="cat-dot" style="background:'+catColor(cat)+'"></span>'+escapeHtml(catLabel(cat));
    pill.addEventListener('click', ()=>{
      // Category pills jump straight to the (filtered) Feed section —
      // deliberately NOT via/through the Daily Update section.
      state.category = (state.category===cat) ? null : cat;
      state.feedExpanded = false;
      renderFilteredSections();
      document.getElementById('feed-section').scrollIntoView({behavior:'smooth'});
    });
    nav.appendChild(pill);
  });

  const dailyPill = document.createElement('button');
  dailyPill.className = 'pill daily';
  dailyPill.textContent = t('navDaily');
  dailyPill.addEventListener('click', ()=>{
    document.getElementById('daily-section').scrollIntoView({behavior:'smooth'});
  });
  nav.appendChild(dailyPill);
}

/* ============ DAILY UPDATE ============ */
function buildTopicTabs(){
  const wrap = document.getElementById('topic-tabs');
  const btnEl = document.getElementById('topic-tabs-viewall');
  wrap.classList.toggle('expanded', !!state.tabsExpanded);
  renderRowLimited(wrap, btnEl, TOPICS, state.tabsExpanded, ()=>{
    state.tabsExpanded = !state.tabsExpanded;
    buildTopicTabs();
  }, (topic)=>{
    const btn = document.createElement('button');
    btn.className = 'topic-tab' + (state.topic===topic.id ? ' active' : '');
    const loc = topic[currentLang] || topic.en;
    const count = ITEMS.filter(it=>(it.topics||[]).includes(topic.id)).length;
    btn.innerHTML = '<span class="tt-name">'+escapeHtml(loc.label)+'</span><span class="tt-count">'+count+' '+ (currentLang==='en'?'stories':'notizie') +'</span>';
    btn.addEventListener('click', ()=>{
      state.topic = topic.id;
      buildTopicTabs();
      buildDailyFeed();
    });
    return btn;
  });
}
function buildDailyFeed(){
  const descEl = document.getElementById('topic-desc');
  const feedEl = document.getElementById('daily-feed');
  const btnEl = document.getElementById('daily-feed-viewall');
  const topic = TOPICS.find(tp=>tp.id===state.topic);
  if(!topic){ descEl.textContent=''; feedEl.innerHTML=''; btnEl.style.display='none'; return; }
  descEl.textContent = (topic[currentLang]||topic.en).description;
  const items = ITEMS.filter(it => (it.topics||[]).includes(topic.id));
  const expanded = !!state.dailyExpanded[topic.id];
  renderRowLimited(feedEl, btnEl, items, expanded, ()=>{
    state.dailyExpanded[topic.id] = !state.dailyExpanded[topic.id];
    buildDailyFeed();
  }, createPostCard);
}

/* ============ FEED ============ */
function filteredItems(){
  return ITEMS.filter(it=>{
    if(state.category && it.category !== state.category) return false;
    if(state.date && it.date !== state.date) return false;
    return true;
  });
}
function buildFeed(){
  const feedEl = document.getElementById('feed');
  const btnEl = document.getElementById('feed-viewall');
  const items = filteredItems();
  document.getElementById('feed-sub').textContent = (state.category || state.date) ? t('feedSubFiltered') : t('feedSub');
  renderRowLimited(feedEl, btnEl, items, state.feedExpanded, ()=>{
    state.feedExpanded = !state.feedExpanded;
    buildFeed();
  }, createPostCard);
}

/* ============ CALENDAR ============ */
function itemsOnDate(dateStr){
  return ITEMS.filter(it=> it.date===dateStr && (!state.category || it.category===state.category));
}
function buildCalendar(){
  const grid = document.getElementById('cal-grid');
  grid.innerHTML = '';
  const label = document.getElementById('cal-label');
  const months = t('months');
  label.textContent = months[state.calMonth]+' '+state.calYear;

  t('day').forEach(d=>{
    const el = document.createElement('div');
    el.className='cal-dow';
    el.textContent = d;
    grid.appendChild(el);
  });

  const firstOfMonth = new Date(Date.UTC(state.calYear, state.calMonth, 1));
  let startDow = firstOfMonth.getUTCDay(); // 0=Sun
  startDow = (startDow===0) ? 6 : startDow-1; // convert to Mon=0
  const daysInMonth = new Date(Date.UTC(state.calYear, state.calMonth+1, 0)).getUTCDate();

  for(let i=0;i<startDow;i++){
    const el = document.createElement('div');
    el.className='cal-day empty';
    grid.appendChild(el);
  }
  for(let day=1; day<=daysInMonth; day++){
    const mm = String(state.calMonth+1).padStart(2,'0');
    const dd = String(day).padStart(2,'0');
    const dateStr = state.calYear+'-'+mm+'-'+dd;
    const dayItems = ITEMS.filter(it=>it.date===dateStr);
    const el = document.createElement('div');
    el.className = 'cal-day' + (dayItems.length? ' has-items':'') + (state.date===dateStr? ' selected':'');
    const cats = [...new Set(dayItems.map(it=>it.category))];
    el.innerHTML = '<div class="cal-daynum">'+day+'</div><div class="cal-dots">'+
      cats.map(c=>'<span class="cal-dot" style="background:'+catColor(c)+'"></span>').join('') +'</div>';
    if(dayItems.length){
      el.addEventListener('click', ()=>{
        state.date = (state.date===dateStr) ? null : dateStr;
        state.feedExpanded = false;
        renderFilteredSections();
      });
    }
    grid.appendChild(el);
  }

  document.getElementById('cal-reset').style.display = state.date ? 'inline-block' : 'none';
  document.getElementById('cal-reset').textContent = t('calReset');
}
function calPrev(){
  state.calMonth--;
  if(state.calMonth<0){ state.calMonth=11; state.calYear--; }
  buildCalendar();
}
function calNext(){
  state.calMonth++;
  if(state.calMonth>11){ state.calMonth=0; state.calYear++; }
  buildCalendar();
}

/* ============ MAP ============ */
let mapTooltip;
function buildMap(){
  const wrap = document.getElementById('map-wrap');
  wrap.innerHTML = '<svg id="map-svg"></svg>';
  const svg = document.getElementById('map-svg');

  if(!D3_AVAILABLE){
    wrap.innerHTML = '<div class="map-fallback">🗺️ '+t('mapFallback')+'</div>';
    buildLegend();
    return;
  }

  try{
    const width = wrap.clientWidth || 900;
    const height = wrap.clientHeight || 480;
    const d3svg = d3.select(svg).attr('viewBox','0 0 '+width+' '+height);
    d3svg.selectAll('*').remove();

    const projection = d3.geoNaturalEarth1().scale(width/6.2).translate([width/2, height/2+10]);
    const path = d3.geoPath(projection);

    const g = d3svg.append('g');

    fetch('https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json')
      .then(r=>r.json())
      .then(topo=>{
        const land = topojson.feature(topo, topo.objects.countries);
        g.append('g').selectAll('path').data(land.features).enter().append('path')
          .attr('d', path)
          .attr('fill', '#EDEAE0')
          .attr('stroke', '#D8D4C8')
          .attr('stroke-width', 0.6);
        drawPinsAndLines(g, projection);
      })
      .catch(()=>{
        // still draw pins even if land geometry fails
        drawPinsAndLines(g, projection);
      });

    if(!mapTooltip){
      mapTooltip = document.createElement('div');
      mapTooltip.className = 'map-tooltip';
      wrap.appendChild(mapTooltip);
    } else if(!wrap.contains(mapTooltip)){
      wrap.appendChild(mapTooltip);
    }
  }catch(err){
    wrap.innerHTML = '<div class="map-fallback">🗺️ '+t('mapFallback')+'</div>';
  }
  buildLegend();
}

function drawPinsAndLines(g, projection){
  if(!D3_AVAILABLE) return;
  // connection lines
  const lineLayer = g.append('g').attr('class','conn-layer');
  CONNECTIONS.forEach(conn=>{
    const a = ITEMS_BY_ID[conn.from];
    const b = ITEMS_BY_ID[conn.to];
    if(!a || !b) return;
    const pa = PLACES[a.country];
    const pb = PLACES[b.country];
    if(!pa || !pb) return;
    const p1 = projection([pa.lon, pa.lat]);
    const p2 = projection([pb.lon, pb.lat]);
    if(!p1||!p2) return;
    const isSpecial = conn.category === 'ViolenzaDonne';
    lineLayer.append('line')
      .attr('x1',p1[0]).attr('y1',p1[1]).attr('x2',p2[0]).attr('y2',p2[1])
      .attr('stroke', connColor(conn))
      .attr('stroke-width', isSpecial ? 2.2 : 1.3)
      .attr('stroke-dasharray','4,3')
      .attr('opacity', isSpecial ? 0.9 : 0.55);
  });

  const pinLayer = g.append('g').attr('class','pin-layer');
  Object.keys(PLACES).forEach(key=>{
    const p = PLACES[key];
    const pos = projection([p.lon, p.lat]);
    if(!pos) return;
    const countItems = ITEMS.filter(it=>it.country===key);
    if(countItems.length===0) return;
    const mainCat = countItems[0].category;
    const pin = pinLayer.append('g')
      .attr('class','map-pin')
      .attr('transform','translate('+pos[0]+','+pos[1]+')');
    pin.append('circle')
      .attr('r', 5+Math.min(countItems.length,10))
      .attr('fill', catColor(mainCat))
      .attr('fill-opacity', 0.85);
    pin.append('text').attr('x',9).attr('y',3).text(placeLabel(key));
    pin.on('click', ()=> selectCountry(key));
    pin.on('mousemove', (evt)=> showMapTooltip(evt, key, countItems.length));
    pin.on('mouseleave', hideMapTooltip);
  });
}

function showMapTooltip(evt, key, count){
  if(!mapTooltip) return;
  const wrap = document.getElementById('map-wrap');
  const rect = wrap.getBoundingClientRect();
  mapTooltip.innerHTML = '<b>'+escapeHtml(placeLabel(key))+'</b><br>'+count+' '+(currentLang==='en'?'stories':'notizie');
  mapTooltip.style.left = (evt.clientX - rect.left + 12)+'px';
  mapTooltip.style.top = (evt.clientY - rect.top + 12)+'px';
  mapTooltip.style.opacity = '1';
}
function hideMapTooltip(){
  if(mapTooltip) mapTooltip.style.opacity='0';
}

function selectCountry(key){
  // scroll to feed and could be extended; kept simple & safe for both D3 and non-D3 paths.
  document.getElementById('feed-section').scrollIntoView({behavior:'smooth'});
}

function buildLegend(){
  const legend = document.getElementById('map-legend');

  CAT_KEYS.forEach(cat=>{
    const el = document.createElement('div');
    el.className='item';
    el.innerHTML = '<span class="cat-dot" style="background:'+catColor(cat)+'"></span>'+escapeHtml(catLabel(cat));

/* ============ TIMELINE ============ */
function buildTimeline(){
  const wrap = document.getElementById('tl-wrap');
  wrap.innerHTML = '';
  const countries = [...new Set(ITEMS.map(it=>it.country))];
  if(ITEMS.length===0) return;
  const dates = ITEMS.map(it=> new Date(it.date+'T00:00:00Z').getTime());
  const minD = Math.min(...dates), maxD = Math.max(...dates);
  const span = Math.max(1, maxD-minD);

  countries.forEach(country=>{
    const lane = document.createElement('div');
    lane.className='tl-lane';
    const label = document.createElement('div');
    label.className='tl-lane-label';
    label.textContent = placeLabel(country) || country;
    lane.appendChild(label);
    const track = document.createElement('div');
    track.className='tl-track';
    ITEMS.filter(it=>it.country===country).forEach(it=>{
      const d = new Date(it.date+'T00:00:00Z').getTime();
      const pct = ((d-minD)/span)*100;
      const dot = document.createElement('div');
      dot.className='tl-dot';
      dot.style.left = 'calc('+pct+'% - 7px)';
      dot.style.background = catColor(it.category);
      dot.title = (it[currentLang]||it.en).title + ' — ' + fmtDate(it.date);
      dot.addEventListener('click', ()=> openModal(it.id));
      track.appendChild(dot);
    });
    lane.appendChild(track);
    wrap.appendChild(lane);
  });
}

    el.addEventListener('click', (e)=>{ e.stopPropagation(); openDrawer(el.dataset.term); });
  });
  document.getElementById('overlay').classList.add('open');
}
function closeModal(){
  document.getElementById('overlay').classList.remove('open');
}

/* ============ DRAWER ============ */
function openDrawer(termId){
  const dd = DEEPDIVES[termId];
  const body = document.getElementById('drawer-body');
  if(!dd){
    body.innerHTML = '<div class="tag">'+ (currentLang==='en'?'Glossary':'Glossario') +'</div><h3>'+escapeHtml(termId)+'</h3><p>—</p>';
  } else {
    const loc = dd[currentLang] || dd.en;
    body.innerHTML = '<div class="tag">'+ (currentLang==='en'?'Glossary':'Glossario') +'</div><h3>'+escapeHtml(loc.title)+'</h3><p>'+escapeHtml(loc.text)+'</p>';
  }
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer(){
  document.getElementById('drawer').classList.remove('open');
}

/* ============ STATIC TEXT ============ */
function renderStaticText(){
  document.getElementById('hero-title').textContent = t('heroTitle');
  document.getElementById('hero-sub').textContent = t('heroSub');
  document.getElementById('stat-items').textContent = ITEMS.length;
  document.getElementById('stat-items-label').textContent = t('statItems');
  document.getElementById('stat-places').textContent = Object.keys(PLACES).length;
  document.getElementById('stat-places-label').textContent = t('statPlaces');
  document.getElementById('stat-connections').textContent = CONNECTIONS.length;
  document.getElementById('stat-connections-label').textContent = t('statConnections');
  document.getElementById('daily-title').textContent = t('dailyTitle');
  document.getElementById('feed-title').textContent = t('feedTitle');
  document.getElementById('cal-title').textContent = t('calTitle');
  document.getElementById('map-title').textContent = t('mapTitle');
  document.getElementById('map-sub').textContent = t('mapSub');
  document.getElementById('tl-title').textContent = t('tlTitle');
  document.getElementById('footer-text').textContent = t('footer');
  document.title = t('heroTitle')+' — Rassegna Stampa Inglese';
}

/* ============ RENDER ORCHESTRATION ============ */
function renderFilteredSections(){
  buildTopNav();
  buildFeed();
  buildCalendar();
}
function renderAll(){
  renderStaticText();
  buildTopNav();
  buildTopicTabs();
  buildDailyFeed();
  buildFeed();
  buildCalendar();
  buildMap();
  buildTimeline();
}

/* ============ LANG SWITCH ============ */
function setLang(lang){
  if(currentLang===lang) return;
  currentLang = lang;
  document.getElementById('lang-en').classList.toggle('active', lang==='en');
  document.getElementById('lang-it').classList.toggle('active', lang==='it');
  renderAll();
}
document.getElementById('lang-en').addEventListener('click', ()=>setLang('en'));
document.getElementById('lang-it').addEventListener('click', ()=>setLang('it'));

/* ============ CALENDAR NAV / RESET ============ */
document.getElementById('cal-prev').addEventListener('click', calPrev);
document.getElementById('cal-next').addEventListener('click', calNext);
document.getElementById('cal-reset').addEventListener('click', ()=>{ state.date=null; state.feedExpanded=false; renderFilteredSections(); });

/* ============ MODAL / DRAWER OVERLAY CLOSE ============ */
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id==='overlay') closeModal();
});

/* expose to window for inline onclick handlers */
window.closeModal = closeModal;
window.closeDrawer = closeDrawer;
window.openModal = openModal;
window.openDrawer = openDrawer;
window.selectCountry = selectCountry;

/* ============ D3 readiness check (async CDN load) ============ */
function recheckD3(){
  D3_AVAILABLE = !!(window.d3 && window.topojson && !window.__D3_FAILED && !window.__TOPOJSON_FAILED);
}

/* ============ INIT ============ */
let __initialized = false;
function initOnce(){
  if(__initialized) return;
  __initialized = true;
  recheckD3();
  renderAll();
}
window.addEventListener('load', initOnce);
// safety fallback in case 'load' already fired before this script ran, or never fires
if(document.readyState==='complete'){
  initOnce();
} else {
  setTimeout(initOnce, 3000);
}

})();
</script>
</body>
</html>
