ntrolli di frontiera marocchini resta contestata e irrisolta.", "detail": "Secondo alcune fonti, l'intelligence spagnola aveva segnalato un probabile \"gesto di magnanimità\" del re del Marocco in occasione della Festa del Trono, seguito da un'ondata di prova di quasi 1.000 nuotatori, ma i rinforzi non sono stati schierati fino a quando la crisi non era già in corso. Alcuni analisti sostengono che Rabat abbia deliberatamente allentato i controlli come ritorsione per le inchieste dei media spagnoli sullo spionaggio dei servizi segreti marocchini, mentre i migranti intervistati sul campo hanno citato la semplice disperazione economica piuttosto che un calcolo politico, lasciando irrisolta la questione delle responsabilità per una delle settimane più letali nella storia di Ceuta.", "terms": [{"match": "Ceuta", "id": "ceuta"}]}}, {"id": "drc-ebola-fatality-rate-46-aug17", "date": "2026-08-17", "country": "DR Congo", "category": "Medicine", "topics": [], "sources": [{"name": "CIDRAP (University of Minnesota)", "url": "https://www.cidrap.umn.edu/ebola/ebola-outbreak-now-deadliest-ever-dr-congo-death-rate-reaches-46", "reliability": 4}, {"name": "UN News", "url": "https://news.un.org/en/story/2026/08/1168154", "reliability": 5}], "en": {"title": "DR Congo's Ebola case-fatality rate doubles to 46% as contact tracing collapses", "summary": "The case-fatality rate of DR Congo's record Ebola outbreak has doubled from about 20% in early June to 46% by mid-August, even though the virus itself has not become more lethal — health workers say a collapse in contact tracing is the real driver.", "detail": "DR Congo's contact-tracing system now reaches only about 10% of expected contacts, meaning most new cases go untracked until patients are found dead in their communities, beyond the reach of supportive care such as IV fluids that improve survival odds. The outbreak, now at 4,945 cases and 2,325 deaths across six provinces, remains without any approved vaccine or treatment for the Bundibugyo strain driving it.", "terms": [{"match": "Bundibugyo strain", "id": "bundibugyo"}]}, "it": {"title": "Il tasso di letalità dell'Ebola in RD Congo raddoppia al 46% mentre crolla il tracciamento dei contatti", "summary": "Il tasso di letalità del focolaio record di Ebola in RD Congo è raddoppiato da circa il 20% di inizio giugno al 46% di metà agosto, anche se il virus in sé non è diventato più letale: gli operatori sanitari affermano che la vera causa è il collasso del tracciamento dei contatti.", "detail": "Il sistema di tracciamento dei contatti della RD Congo raggiunge ormai solo circa il 10% dei contatti previsti, il che significa che la maggior parte dei nuovi casi non viene monitorata finché i pazienti non vengono trovati morti nelle loro comunità, fuori dalla portata di cure di supporto come i fluidi endovenosi che migliorano le probabilità di sopravvivenza. Il focolaio, ormai a 4.945 casi e 2.325 morti in sei province, resta privo di un vaccino o trattamento approvato contro il ceppo Bundibugyo che lo sta alimentando.", "terms": [{"match": "ceppo Bundibugyo", "id": "bundibugyo"}]}}, {"id": "uae-iran-missile-alert-aug18", "date": "2026-08-18", "country": "UAE", "category": "Geopolitics", "topics": ["us-iran"], "sources": [{"name": "The National", "url": "https://www.thenationalnews.com/news/uae/2026/08/18/uae-air-defence-systems-respond-to-missile-threat/", "reliability": 4}, {"name": "Euronews", "url": "https://www.euronews.com/2026/08/18/uae-issues-alert-warning-of-potential-missile-threats", "reliability": 4}], "en": {"title": "UAE says Iran fired two missiles at its territory, first alert in months", "summary": "The UAE Ministry of Defence said two ballistic missiles were launched from Iran toward the country on Tuesday, with one falling in Emirati territorial waters, triggering emergency phone alerts in Dubai and Sharjah before an all-clear was issued.", "detail": "It was the UAE's first missile alert since a false alarm in July, and came hours after President Trump said no talks were currently underway with Tehran and renewed his threat to bomb Oman if it 'gets in the way' of reopening the Strait of Hormuz. The UAE's Ministry of Defence said it 'remained on high alert and fully prepared to deal with any threats,' while urging residents to rely only on official sources for information. Iran did not immediately confirm or deny launching the missiles.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}, {"match": "Ministry of Defence", "id": "irgc"}]}, "it": {"title": "Gli Emirati: l'Iran ha lanciato due missili contro il suo territorio, primo allarme in mesi", "summary": "Il ministero della Difesa degli Emirati ha dichiarato che due missili balistici sono stati lanciati dall'Iran verso il Paese martedì, con uno caduto nelle acque territoriali emiratine, facendo scattare allarmi telefonici d'emergenza a Dubai e Sharjah prima del cessato allarme.", "detail": "È stato il primo allarme missilistico degli Emirati da un falso allarme di luglio, ed è arrivato poche ore dopo che il presidente Trump aveva dichiarato che al momento non erano in corso trattative con Teheran, rinnovando la minaccia di bombardare l'Oman se 'si mette in mezzo' alla riapertura dello Stretto di Hormuz. Il ministero della Difesa emiratino ha detto di essere 'in massima allerta e pienamente pronto ad affrontare qualsiasi minaccia', invitando i residenti a fare affidamento solo su fonti ufficiali. L'Iran non ha immediatamente confermato né smentito il lancio dei missili.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}, {"match": "ministero della Difesa", "id": "irgc"}]}}, {"id": "gaza-port-cafe-strike-aug18", "date": "2026-08-18", "country": "Palestine", "category": "Geopolitics", "topics": ["israel-palestine"], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/18/israeli-strike-reported-to-kill-at-least-six-in-gaza-city", "reliability": 4}, {"name": "RTE News", "url": "https://www.rte.ie/news/middle-east/2026/0818/1588427-gaza-israel/", "reliability": 4}], "en": {"title": "Israeli strike on Gaza City cafe kills six, including a child", "summary": "An Israeli strike hit a crowded cafe in an area functioning as a displacement camp near Gaza City's port, killing at least six people and wounding 14, medics said, as ceasefire negotiations remain deadlocked.", "detail": "Israel's military said it had targeted 'a gathering of several Hamas commanders who were planning attacks,' but provided no evidence, and Hamas condemned the strike as 'blatant disregard' for ceasefire calls from mediators. Israel currently occupies roughly 60% of Gaza, and negotiations remain stuck on a fundamental impasse: Hamas wants an Israeli withdrawal before it disarms, while Netanyahu insists on disarmament first. A recent visit by US envoy Jared Kushner failed to break the deadlock.", "terms": [{"match": "ceasefire negotiations", "id": "board-of-peace"}, {"match": "US envoy Jared Kushner", "id": "board-of-peace"}]}, "it": {"title": "Attacco israeliano su un caffè a Gaza City uccide sei persone, tra cui un bambino", "summary": "Un attacco israeliano ha colpito un caffè affollato in un'area utilizzata come campo profughi vicino al porto di Gaza City, uccidendo almeno sei persone e ferendone 14, secondo i soccorritori, mentre i negoziati sul cessate il fuoco restano bloccati.", "detail": "L'esercito israeliano ha dichiarato di aver colpito 'un raduno di diversi comandanti di Hamas che stavano pianificando attacchi', senza fornire prove, e Hamas ha condannato l'attacco come un 'palese disprezzo' per gli appelli al cessate il fuoco dei mediatori. Israele occupa attualmente circa il 60% di Gaza, e i negoziati restano bloccati su un'impasse fondamentale: Hamas chiede un ritiro israeliano prima di disarmare, mentre Netanyahu insiste sul disarmo come condizione preliminare. Una recente visita dell'inviato statunitense Jared Kushner non è riuscita a sbloccare lo stallo.", "terms": [{"match": "negoziati sul cessate il fuoco", "id": "board-of-peace"}, {"match": "inviato statunitense Jared Kushner", "id": "board-of-peace"}]}}, {"id": "canada-us-tariff-deadline-aug18", "date": "2026-08-18", "country": "Canada", "category": "Economy", "topics": ["mercato-investimenti"], "sources": [{"name": "BNN Bloomberg", "url": "https://www.bnnbloomberg.ca/tariffs/2026/08/18/carney-and-trump-speak-on-phone-as-deadline-approaches-for-50-per-cent-tariffs/", "reliability": 4}, {"name": "CTV News", "url": "https://www.ctvnews.ca/world/trumps-tariffs/article/pm-carney-says-tone-with-us-already-quite-firm-as-trade-talks-continue/", "reliability": 4}], "en": {"title": "Carney and Trump speak by phone hours before Canada's 50% tariff deadline", "summary": "Canadian Prime Minister Mark Carney and US President Trump spoke by phone as negotiators raced to strike a deal before 50% tariffs on roughly $20 billion of Canadian goods take effect just after midnight on August 19.", "detail": "Trade Minister Dominic LeBlanc met US officials in Washington and said afterward 'our job is not yet done,' describing the talks as intense but constructive. Carney said Canada's negotiating tone was 'quite firm' and that his government has contingency plans to 'cover all eventualities' if the tariffs go ahead. The US Chamber of Commerce warned the tariffs would 'damage both economies' and risk 13 million American jobs tied to trade under the continental agreement.", "terms": []}, "it": {"title": "Carney e Trump si sentono al telefono poche ore prima della scadenza dei dazi al 50% per il Canada", "summary": "Il primo ministro canadese Mark Carney e il presidente statunitense Trump si sono sentiti al telefono mentre i negoziatori correvano per raggiungere un accordo prima che i dazi al 50% su circa 20 miliardi di dollari di merci canadesi entrino in vigore poco dopo la mezzanotte del 19 agosto.", "detail": "Il ministro del Commercio Dominic LeBlanc ha incontrato funzionari statunitensi a Washington e ha dichiarato in seguito che 'il nostro lavoro non è ancora finito', descrivendo i colloqui come intensi ma costruttivi. Carney ha detto che il tono negoziale del Canada è 'piuttosto fermo' e che il suo governo ha piani di emergenza per 'coprire tutte le eventualità' se i dazi entreranno in vigore. La Camera di Commercio USA ha avvertito che i dazi 'danneggerebbero entrambe le economie' mettendo a rischio 13 milioni di posti di lavoro americani legati al commercio nell'ambito dell'accordo continentale.", "terms": []}}, {"id": "openai-nvidia-deal-scaledback-aug18", "date": "2026-08-18", "country": "USA", "category": "Technology", "topics": ["ai"], "sources": [{"name": "Fortune", "url": "https://fortune.com/2026/08/18/openai-data-center-deal-with-nvidia-comes-in-145-billion-lower-than-reportedsignaling-concerns-of-artificial-demand-for-chips/", "reliability": 4}, {"name": "TechCrunch", "url": "https://techcrunch.com/2026/08/17/nvidia-investing-1-5b-in-softbank-data-center-developer-behind-openai-project/", "reliability": 4}], "en": {"title": "OpenAI-Nvidia Ohio data center deal shrinks to $105 billion amid AI spending worries", "summary": "Nvidia's payment guarantee for OpenAI's data center campus in Pike County, Ohio came in at up to $105 billion, far below the $250 billion floated in July, as investors grow wary of 'circular' financing propping up AI chip demand.", "detail": "The figure was cut first to 'less than $120 billion' in mid-August before settling at $105 billion, a $145 billion reduction from the original reported ceiling. Nvidia's stock fell roughly 4.5% in July when the higher numbers surfaced, on concerns the company is effectively financing demand for its own chips. The deal follows Nvidia's separate $1.5 billion investment in SoftBank's SB Energy, the developer building the same Ohio campus for OpenAI.", "terms": [{"match": "SB Energy", "id": "sb-energy"}]}, "it": {"title": "L'accordo Ohio tra OpenAI e Nvidia si riduce a 105 miliardi di dollari tra i timori sulla spesa AI", "summary": "La garanzia di pagamento di Nvidia per il campus data center di OpenAI a Pike County, Ohio, si è fissata fino a 105 miliardi di dollari, ben al di sotto dei 250 miliardi ipotizzati a luglio, mentre gli investitori diventano diffidenti verso il finanziamento 'circolare' che sostiene la domanda di chip AI.", "detail": "La cifra è stata prima tagliata a 'meno di 120 miliardi di dollari' a metà agosto, per poi assestarsi a 105 miliardi, una riduzione di 145 miliardi rispetto al tetto originariamente riportato. Il titolo Nvidia era sceso di circa il 4,5% a luglio quando erano emerse le cifre più alte, per il timore che l'azienda stesse di fatto finanziando la domanda dei propri chip. L'accordo segue l'investimento separato di Nvidia da 1,5 miliardi di dollari in SB Energy di SoftBank, la società che sta costruendo lo stesso campus in Ohio per OpenAI.", "terms": [{"match": "SB Energy", "id": "sb-energy"}]}}, {"id": "trump-approval-record-low-aug17", "date": "2026-08-17", "country": "USA", "category": "Politics", "topics": ["politica-internazionale", "us-iran"], "sources": [{"name": "U.S. News & World Report (Reuters)", "url": "https://www.usnews.com/news/world/articles/2026-08-17/exclusive-trump-approval-falls-to-33-lowest-of-his-presidency-reuters-ipsos-poll-finds", "reliability": 5}, {"name": "The Hill", "url": "https://thehill.com/homenews/administration/6034097-trump-approval-lowest-point/", "reliability": 4}], "en": {"title": "Trump's approval rating falls to 33%, the lowest of his presidency", "summary": "A new Reuters/Ipsos poll found President Trump's approval rating has dropped to 33%, the lowest point of his second term, as 80% of respondents say they expect the Iran war to keep dragging on.", "detail": "The poll shows approval sliding roughly two points over the past two weeks, with the drop most pronounced among independents. Analysts point to war fatigue over the unresolved conflict with Iran, persistent inflation worries and the stalled Strait of Hormuz shipping dispute as key drags on Trump's standing three months before the midterm elections.", "terms": [{"match": "Iran war", "id": "hormuz"}]}, "it": {"title": "L'indice di gradimento di Trump scende al 33%, il più basso della sua presidenza", "summary": "Un nuovo sondaggio Reuters/Ipsos mostra che l'indice di gradimento del presidente Trump è sceso al 33%, il punto più basso del suo secondo mandato, mentre l'80% degli intervistati si aspetta che la guerra con l'Iran continui a trascinarsi.", "detail": "Il sondaggio mostra un calo di circa due punti nelle ultime due settimane, più marcato tra gli indipendenti. Gli analisti indicano la stanchezza per il conflitto irrisolto con l'Iran, le persistenti preoccupazioni per l'inflazione e la disputa irrisolta sulla navigazione nello Stretto di Hormuz come i principali fattori che pesano sulla popolarità di Trump a tre mesi dalle elezioni di midterm.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}]}}, {"id": "south-africa-xenophobia-economic-cost-aug08", "date": "2026-08-08", "country": "South Africa", "category": "Social", "topics": [], "sources": [{"name": "The New Humanitarian", "url": "https://www.thenewhumanitarian.org/analysis/2026/08/05/south-africa-feels-economic-cost-anti-migrant-xenophobia", "reliability": 4}, {"name": "allAfrica", "url": "https://allafrica.com/stories/202608060042.html", "reliability": 3}], "en": {"title": "South Africa's anti-migrant campaign starts to hit its own economy", "summary": "Months of xenophobic intimidation are emptying out migrant-run spaza shops and draining farm labour, with analysts warning the crackdown is costing South Africa jobs, trade and up to $42 billion in African commerce.", "detail": "South Africa's roughly 3 million migrants make up under 4% of the population, but spaza shops — small informal retailers largely run by Somali and Ethiopian traders — support close to 3 million jobs and over 5% of GDP; many have been looted or torched. Sugar and horticulture farms report losing most of their migrant workforce overnight, and bus operators serving cross-border traders report passenger numbers down 30%. 'This is organised, but we don't know who is behind it,' one Somali wholesaler told reporters, as the exodus documented earlier this month continues.", "terms": [{"match": "spaza shops", "id": "spaza-shops"}]}, "it": {"title": "La campagna anti-migranti del Sudafrica inizia a colpire la propria economia", "summary": "Mesi di intimidazioni xenofobe stanno svuotando gli spaza shop gestiti da migranti e prosciugando la manodopera agricola, con gli analisti che avvertono come la repressione stia costando al Sudafrica posti di lavoro, commercio e fino a 42 miliardi di dollari di scambi africani.", "detail": "I circa 3 milioni di migranti in Sudafrica rappresentano meno del 4% della popolazione, ma gli spaza shop — piccoli negozi informali gestiti in gran parte da commercianti somali ed etiopi — sostengono quasi 3 milioni di posti di lavoro e oltre il 5% del PIL; molti sono stati saccheggiati o incendiati. Le fattorie di canna da zucchero e orticoltura segnalano di aver perso gran parte della manodopera migrante da un giorno all'altro, e gli operatori di autobus che servono i commercianti transfrontalieri registrano un calo del 30% dei passeggeri. 'È organizzato, ma non sappiamo chi ci sia dietro', ha detto ai giornalisti un grossista somalo, mentre continua l'esodo documentato all'inizio del mese.", "terms": [{"match": "spaza shop", "id": "spaza-shops"}]}}, {"id": "drc-ebola-global-emergency-aug18", "date": "2026-08-18", "country": "DR Congo", "category": "Medicine", "topics": [], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/18/congo-ebola-outbreak-global-emergency-as-infections-pass-5000-who", "reliability": 4}, {"name": "UN News", "url": "https://news.un.org/en/story/2026/08/1168154", "reliability": 5}], "en": {"title": "DR Congo's Ebola outbreak declared a global emergency as cases top 5,000", "summary": "The WHO held an emergency meeting on August 18 over DR Congo's Ebola outbreak, now confirmed at over 5,000 cases and more than 2,320 deaths, warning the epidemic remains 'far from being under control.'", "detail": "WHO Director-General Tedros Adhanom Ghebreyesus said the outbreak 'had a big head start, and we are still playing catch-up,' urging the international community for more assistance. Genetic analysis suggests the Bundibugyo-strain outbreak, officially declared on May 17, actually began spreading in February. No approved vaccine or treatment exists yet, though experimental candidates are in trials in the UK and production has started in India.", "terms": [{"match": "Bundibugyo-strain", "id": "bundibugyo"}]}, "it": {"title": "Il focolaio di Ebola in RD Congo dichiarato emergenza globale mentre i casi superano i 5.000", "summary": "L'OMS ha tenuto una riunione d'emergenza il 18 agosto sul focolaio di Ebola in RD Congo, ormai confermato a oltre 5.000 casi e più di 2.320 morti, avvertendo che l'epidemia resta 'lontana dall'essere sotto controllo'.", "detail": "Il direttore generale dell'OMS Tedros Adhanom Ghebreyesus ha detto che il focolaio 'ha avuto un grande vantaggio di partenza, e siamo ancora in rincorsa', chiedendo maggiore assistenza alla comunità internazionale. Le analisi genetiche suggeriscono che il focolaio del ceppo Bundibugyo, dichiarato ufficialmente il 17 maggio, sia in realtà iniziato a diffondersi già a febbraio. Non esiste ancora un vaccino o un trattamento approvato, anche se candidati sperimentali sono in fase di sperimentazione nel Regno Unito e la produzione è iniziata in India.", "terms": [{"match": "ceppo Bundibugyo", "id": "bundibugyo"}]}}, {"id": "gaza-strikes-kushner-tension-aug19", "date": "2026-08-19", "country": "Palestine", "category": "Geopolitics", "topics": ["israel-palestine"], "sources": [{"name": "Washington Post", "url": "https://www.washingtonpost.com/world/2026/08/19/gaza-israel-war-kushner-talks-trump-netanyahu/eea06114-9bd0-11f1-9cc4-2dc9b46e2d5c_story.html", "reliability": 4}, {"name": "The Times of Israel", "url": "https://www.timesofisrael.com/liveblog-august-19-2026/", "reliability": 4}], "en": {"title": "Israeli strike near Gaza port kills six as Kushner-Netanyahu talks expose rift", "summary": "An Israeli strike on what the IDF called a meeting of Hamas commanders near Gaza City's port killed six people, days after Jared Kushner urged Netanyahu to limit strikes to imminent threats. The episode cast fresh doubt on ceasefire progress.", "detail": "The strike came just after Kushner's extended talks with Netanyahu, in which US officials pressed Israel to stop targeting alleged October 7 attackers and to release Gaza police recruits needed for the planned international stabilization force. Netanyahu resisted both requests, according to officials briefed on the meeting. No formal ceasefire collapse was declared, but the disagreement underscores how far apart Washington and Israel remain on implementing the Board of Peace roadmap for Gaza's post-war governance.", "terms": [{"match": "Board of Peace", "id": "board-of-peace"}]}, "it": {"title": "Attacco israeliano vicino al porto di Gaza uccide sei persone, tensioni tra Kushner e Netanyahu", "summary": "Un attacco israeliano su quella che l'IDF ha definito una riunione di comandanti di Hamas vicino al porto di Gaza City ha ucciso sei persone, pochi giorni dopo che Jared Kushner aveva esortato Netanyahu a limitare gli attacchi alle minacce imminenti. L'episodio getta nuovi dubbi sui progressi del cessate il fuoco.", "detail": "L'attacco è arrivato subito dopo i lunghi colloqui di Kushner con Netanyahu, nei quali i funzionari americani hanno spinto Israele a smettere di colpire presunti autori dell'attacco del 7 ottobre e a rilasciare le reclute di polizia di Gaza necessarie per la prevista forza internazionale di stabilizzazione. Secondo fonti informate sull'incontro, Netanyahu ha respinto entrambe le richieste. Non è stato dichiarato un formale collasso del cessate il fuoco, ma il disaccordo sottolinea quanto Washington e Israele restino distanti sull'attuazione della road map del Board of Peace per la governance di Gaza nel dopoguerra.", "terms": [{"match": "Board of Peace", "id": "board-of-peace"}]}}, {"id": "iran-oman-hormuz-stalemate-aug19", "date": "2026-08-19", "country": "Iran", "category": "Geopolitics", "topics": ["us-iran"], "sources": [{"name": "CBS News", "url": "https://www.cbsnews.com/live-updates/us-iran-war-deal-expired-strait-of-hormuz/", "reliability": 4}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/17/trump-demands-iran-put-up-the-white-flag-of-surrender-as-mou-expires", "reliability": 4}], "en": {"title": "Iran war remains in stalemate as Trump renews threat to bomb Oman", "summary": "With the 60-day US-Iran memorandum expired and no deal reached, President Trump repeated his threat to bomb Oman if it 'gets in the way' of reopening the Strait of Hormuz, while Tehran insisted talks over a shipping corridor with Muscat were nearly finished.", "detail": "Trump called on Iran to raise 'the white flag of surrender,' language Tehran rejected outright. Iranian officials maintain that a Hormuz corridor deal with Oman — under which Iran would manage inbound traffic and Oman outbound traffic — is close, but insist the strait will not fully reopen without US compensation for its strikes and a lifting of the naval blockade. Gulf states, still rattled by the missile alert Iran triggered against the UAE on August 18, are pressing both sides to de-escalate.", "terms": [{"match": "Strait of Hormuz", "id": "hormuz"}, {"match": "Gulf states", "id": "gulf-allies"}]}, "it": {"title": "La guerra in Iran resta in stallo mentre Trump rinnova la minaccia di bombardare l'Oman", "summary": "Scaduto il memorandum USA-Iran di 60 giorni senza un accordo, il presidente Trump ha ripetuto la minaccia di bombardare l'Oman se \"si mette in mezzo\" alla riapertura dello Stretto di Hormuz, mentre Teheran insiste che i colloqui con Mascate su un corridoio marittimo sono quasi conclusi.", "detail": "Trump ha invitato l'Iran ad alzare \"la bandiera bianca della resa\", parole respinte categoricamente da Teheran. I funzionari iraniani sostengono che un accordo sul corridoio di Hormuz con l'Oman — in base al quale l'Iran gestirebbe il traffico in entrata e l'Oman quello in uscita — sia vicino, ma insistono che lo stretto non riaprirà del tutto senza un risarcimento americano per gli attacchi subiti e la fine del blocco navale. Gli Stati del Golfo, ancora scossi dall'allarme missilistico lanciato dall'Iran contro gli Emirati il 18 agosto, spingono entrambe le parti a de-escalare.", "terms": [{"match": "Stretto di Hormuz", "id": "hormuz"}, {"match": "Stati del Golfo", "id": "gulf-allies"}]}}, {"id": "uk-summons-israel-e1-settlement-aug19", "date": "2026-08-19", "country": "United Kingdom", "category": "Politics", "topics": ["israel-palestine", "politica-internazionale"], "sources": [{"name": "GOV.UK (UK Foreign Office)", "url": "https://www.gov.uk/government/news/foreign-secretary-statement-on-government-of-israel-launch-of-a-tender-for-the-e1-settlement-project", "reliability": 5}, {"name": "Bangkok Post", "url": "https://www.bangkokpost.com/world/3304950/uk-summons-israeli-envoy-over-west-bank-settlement-project", "reliability": 3}], "en": {"title": "UK summons Israeli envoy, threatens sanctions over E1 settlement tender", "summary": "Foreign Secretary Ed Miliband called Israel's newly launched tender for the E1 settlement 'an unacceptable and destructive act' that risks cutting the West Bank off from East Jerusalem, summoning Israel's charge d'affaires and threatening targeted sanctions.", "detail": "Miliband said the E1 project threatens the viability of a two-state solution by physically separating the northern and southern West Bank from Jerusalem, and announced the UK would pursue 'a comprehensive set of measures,' including sanctions against those driving settlement expansion. The move follows years of UK and EU objections to E1 construction, which Israel had shelved under international pressure before reviving the tender in 2025-2026.", "terms": [{"match": "E1 settlement", "id": "e1-settlement"}, {"match": "West Bank", "id": "west-bank"}]}, "it": {"title": "Il Regno Unito convoca l'ambasciatore israeliano e minaccia sanzioni per il bando E1", "summary": "Il ministro degli Esteri Ed Miliband ha definito il nuovo bando israeliano per l'insediamento E1 \"un atto inaccettabile e distruttivo\" che rischia di tagliare fuori la Cisgiordania da Gerusalemme Est, convocando l'incaricato d'affari israeliano e minacciando sanzioni mirate.", "detail": "Miliband ha dichiarato che il progetto E1 minaccia la fattibilità di una soluzione a due Stati separando fisicamente la Cisgiordania settentrionale e meridionale da Gerusalemme, e ha annunciato che il Regno Unito adotterà \"un insieme completo di misure\", incluse sanzioni contro chi promuove l'espansione degli insediamenti. La mossa segue anni di obiezioni britanniche ed europee alla costruzione di E1, che Israele aveva accantonato sotto pressione internazionale prima di rilanciare il bando nel 2025-2026.", "terms": [{"match": "insediamento E1", "id": "e1-settlement"}, {"match": "Cisgiordania", "id": "west-bank"}]}}, {"id": "canada-us-tariff-extension-aug19", "date": "2026-08-19", "country": "Canada", "category": "Economy", "topics": ["mercato-investimenti"], "sources": [{"name": "BNN Bloomberg", "url": "https://www.bnnbloomberg.ca/tariffs/2026/08/19/trump-extends-tariff-deadline-as-canada-us-attempt-to-hammer-out-deal-live-updates-here/", "reliability": 4}, {"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-19/anxious-manufacturers-await-canada-us-deal-to-avoid-50-tariffs", "reliability": 4}], "en": {"title": "Trump pauses 50% Canada tariffs for three days as deal nears completion", "summary": "President Trump paused the 50% tariffs on Canadian goods that were due to take effect at midnight, saying the two countries have a 'DEAL' subject to finalizing paperwork, giving negotiators three more days.", "detail": "The threatened tariffs, invoked under Section 338 of the 1930 Trade Act, would have hit roughly $20 billion of Canadian goods including dairy, cement and hockey sticks. Talks stalled for weeks over auto-sector rules of origin, with Trade Minister Dominic LeBlanc pushing to protect products already covered under the CUSMA agreement. Canadian manufacturers welcomed the reprieve but remained anxious the deal could still collapse before the new deadline.", "terms": [{"match": "Section 338", "id": "section-338"}]}, "it": {"title": "Trump sospende per tre giorni i dazi del 50% sul Canada mentre l'accordo si avvicina", "summary": "Il presidente Trump ha sospeso i dazi del 50% sui prodotti canadesi che sarebbero scattati a mezzanotte, dicendo che i due Paesi hanno un \"ACCORDO\" in attesa della finalizzazione dei documenti, concedendo ai negoziatori altri tre giorni.", "detail": "I dazi minacciati, invocati ai sensi della Section 338 del Trade Act del 1930, avrebbero colpito circa 20 miliardi di dollari di merci canadesi, tra cui latticini, cemento e bastoni da hockey. I colloqui erano in stallo da settimane sulle regole di origine per il settore auto, con il ministro del Commercio Dominic LeBlanc che spingeva per proteggere i prodotti già coperti dall'accordo CUSMA. I produttori canadesi hanno accolto con favore la tregua, ma restano preoccupati che l'accordo possa ancora saltare prima della nuova scadenza.", "terms": [{"match": "Section 338", "id": "section-338"}]}}, {"id": "nvidia-h200-china-aug19", "date": "2026-08-19", "country": "China", "category": "Technology", "topics": ["ai"], "sources": [{"name": "Engadget", "url": "https://www.engadget.com/2239738/china-reportedly-allows-bytedance-tencent-import-10000-h200-chips/", "reliability": 4}, {"name": "Business Standard", "url": "https://www.business-standard.com/world-news/china-allows-limited-nvidia-h200-shipments-why-is-beijing-easing-curbs-126081900438_1.html", "reliability": 3}], "en": {"title": "Nvidia's H200 chips start flowing into China as Beijing eases import curbs", "summary": "ByteDance and Tencent have each received around 10,000 Nvidia H200 AI chips in the first sizable shipments to reach China, after Beijing eased its own restrictions on imports even as roughly ten approved Chinese firms can buy up to 75,000 units apiece.", "detail": "The shipments follow a December 2025 US deal letting Nvidia sell H200s to approved Chinese buyers in exchange for sharing 25% of the revenue with Washington. China had been wary of dependence on foreign chips and continues to steer some approved shipments to Hong Kong rather than the mainland, even as it now allows limited imports to keep pace with domestic AI development.", "terms": [{"match": "H200 AI chips", "id": "h200-export-controls"}]}, "it": {"title": "I chip H200 di Nvidia iniziano ad arrivare in Cina mentre Pechino allenta i limiti alle importazioni", "summary": "ByteDance e Tencent hanno ricevuto ciascuna circa 10.000 chip AI H200 di Nvidia, le prime spedizioni consistenti arrivate in Cina, dopo che Pechino ha allentato le proprie restrizioni sulle importazioni, mentre circa dieci aziende cinesi approvate possono acquistare fino a 75.000 unità ciascuna.", "detail": "Le spedizioni seguono un accordo del dicembre 2025 con gli Stati Uniti che consente a Nvidia di vendere H200 ad acquirenti cinesi approvati in cambio della condivisione del 25% dei ricavi con Washington. La Cina era stata cauta sulla dipendenza da chip stranieri e continua a indirizzare parte delle spedizioni approvate verso Hong Kong invece che sulla terraferma, pur consentendo ora importazioni limitate per non restare indietro nello sviluppo dell'AI nazionale.", "terms": [{"match": "chip AI H200", "id": "h200-export-controls"}]}}, {"id": "hyundai-strike-south-korea-aug19", "date": "2026-08-19", "country": "South Korea", "category": "Social", "topics": [], "sources": [{"name": "UPI", "url": "https://www.upi.com/Top_News/World-News/2026/08/19/kia-hyundai-motor-union-strike/8271787179820/", "reliability": 4}, {"name": "Korea JoongAng Daily", "url": "https://www.koreajoongangdaily.com/business/hyundai-motor-union-plans-first-full-strike-in-10-years-as-wage-talks-hit-impasse/12831070", "reliability": 3}], "en": {"title": "Hyundai Motor union launches first full-day strike in 10 years over wages", "summary": "Hyundai Motor's union began a five-day campaign of partial walkouts building to its first complete, full-shift strike since 2016, after wage talks broke down over pay, bonuses, retirement age and reinstating dismissed workers.", "detail": "The union is demanding a monthly base-pay rise of about 149,600 won ($106), a bonus worth 30% of 2025 net profit, a bonus increase to 800% of monthly base pay, reinstatement of dismissed members and a higher retirement age. Management disputes the bonus, reinstatement and retirement demands as falling outside standard wage bargaining. Earlier partial strikes have already cost an estimated 22.8 billion won in lost production, and Kia, part of the same group, faces its own first strike in six years.", "terms": []}, "it": {"title": "Il sindacato Hyundai Motor lancia il primo sciopero a giornata piena in 10 anni per i salari", "summary": "Il sindacato di Hyundai Motor ha avviato una campagna di cinque giorni di scioperi parziali che culminerà nel primo sciopero completo, a turno pieno, dal 2016, dopo che i negoziati salariali sono falliti su paga, bonus, età pensionabile e reintegro dei licenziati.", "detail": "Il sindacato chiede un aumento della paga base mensile di circa 149.600 won (106 dollari), un bonus pari al 30% dell'utile netto 2025, un aumento del bonus fino all'800% della paga base mensile, il reintegro dei membri licenziati e un innalzamento dell'età pensionabile. L'azienda contesta le richieste su bonus, reintegro ed età pensionabile ritenendole estranee alla normale contrattazione salariale. I precedenti scioperi parziali sono già costati una perdita di produzione stimata in 22,8 miliardi di won, e anche Kia, dello stesso gruppo, affronta il suo primo sciopero in sei anni.", "terms": []}}, {"id": "drc-ebola-5000-cases-aug19", "date": "2026-08-19", "country": "DR Congo", "category": "Medicine", "topics": [], "sources": [{"name": "The Washington Post (AP)", "url": "https://www.washingtonpost.com/world/2026/08/19/congo-ebola-outbreak-cases/8ba3db76-9ba4-11f1-9cc4-2dc9b46e2d5c_story.html", "reliability": 4}, {"name": "NPR", "url": "https://www.npr.org/2026/08/19/g-s1-139164/congo-ebola-outbreak", "reliability": 5}], "en": {"title": "Congo's Ebola outbreak tops 5,000 cases, spreading three times faster than 2014-16 epidemic", "summary": "DR Congo's Ebola outbreak has reached 5,021 cases and 2,378 deaths, a 47.4% fatality rate that hits 70% in North Kivu, with WHO chief Tedros warning the epidemic 'is far from being under control.'", "detail": "Health officials say the outbreak is spreading roughly three times faster than the 2014-2016 West African epidemic, the deadliest on record. There is still no approved vaccine or treatment for the Bundibugyo strain driving the outbreak. Most new cases are turning up outside monitored populations, while attacks on health workers, poor infrastructure, armed-group threats and displacement are letting the virus outrun contact-tracing teams.", "terms": [{"match": "Bundibugyo strain", "id": "bundibugyo"}]}, "it": {"title": "L'epidemia di Ebola in Congo supera i 5.000 casi, diffondendosi tre volte più veloce di quella del 2014-16", "summary": "L'epidemia di Ebola nella RD Congo ha raggiunto 5.021 casi e 2.378 morti, un tasso di letalità del 47,4% che sale al 70% nel Nord Kivu, mentre il direttore generale dell'OMS Tedros avverte che l'epidemia \"è ben lontana dall'essere sotto controllo\".", "detail": "Le autorità sanitarie affermano che l'epidemia si sta diffondendo circa tre volte più velocemente di quella dell'Africa occidentale del 2014-2016, la più letale mai registrata. Non esiste ancora un vaccino o un trattamento approvato per il ceppo Bundibugyo che guida l'epidemia. La maggior parte dei nuovi casi emerge al di fuori delle popolazioni monitorate, mentre attacchi agli operatori sanitari, infrastrutture carenti, minacce di gruppi armati e sfollamenti permettono al virus di superare in velocità le squadre di tracciamento dei contatti.", "terms": [{"match": "ceppo Bundibugyo", "id": "bundibugyo"}]}}, {"id": "us-iran-economic-dday-aug24", "date": "2026-08-24", "country": "Iran", "category": "Geopolitics", "topics": ["us-iran"], "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/08/24/g-s1-139743/treasury-secretary-scott-bessent-to-unveil-new-economic-sanctions-on-iran", "reliability": 5}, {"name": "Euronews", "url": "https://www.euronews.com/business/2026/08/24/us-threatens-iran-with-economic-d-day-as-markets-await-sanctions-announcement", "reliability": 4}], "en": {"title": "Bessent unveils \"economic D-Day\" sanctions plan against Iran", "summary": "US Treasury Secretary Scott Bessent announced a sweeping new sanctions package against Iran, calling it an \"economic D-Day\" and \"the single greatest financial offensive ever marshalled against an adversary,\" aimed at any country still buying Iranian oil.", "detail": "The measures target governments and banks — not just companies — that keep Iranian cash flowing, with China, which buys roughly 90% of Iran's oil exports, the main intended target. Iran's security chief Mohsen Rezaei vowed retaliation \"in a seismic manner,\" threatening that not a single drop of oil would leave the Gulf if the pressure continues and calling any country that joins the campaign a target. The Iranian rial slid to a record low against the dollar as inflation in Iran approaches 90%, while Brent crude eased about 2% to near $91.50 a barrel on profit-taking.", "terms": [{"match": "economic D-Day", "id": "economic-dday"}]}, "it": {"title": "Bessent presenta il piano di sanzioni \"D-Day economico\" contro l'Iran", "summary": "Il Segretario al Tesoro USA Scott Bessent ha annunciato un nuovo, ampio pacchetto di sanzioni contro l'Iran, definendolo un \"D-Day economico\" e \"la più grande offensiva finanziaria mai lanciata contro un avversario\", rivolto a qualsiasi Paese continui ad acquistare petrolio iraniano.", "detail": "Le misure puntano a governi e banche — non solo aziende — che mantengono in circolo la liquidità iraniana, con la Cina, che acquista circa il 90% delle esportazioni petrolifere iraniane, come bersaglio principale. Il capo della sicurezza iraniano Mohsen Rezaei ha promesso ritorsioni \"in modo sismico\", minacciando che non uscirà più una sola goccia di petrolio dal Golfo se la pressione continuerà, e definendo bersaglio qualsiasi Paese si unisca alla campagna. Il rial iraniano è sceso a un minimo record contro il dollaro mentre l'inflazione in Iran si avvicina al 90%, mentre il Brent è sceso di circa il 2% a quasi 91,50 dollari al barile per prese di profitto.", "terms": [{"match": "D-Day economico", "id": "economic-dday"}]}}, {"id": "gaza-kites-strikes-aug23", "date": "2026-08-23", "country": "Palestine", "category": "Geopolitics", "topics": ["israel-palestine"], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/23/israeli-air-strike-near-gaza-refugee-camp-kills-one-person-and-injures-two", "reliability": 4}, {"name": "UPI", "url": "https://www.upi.com/Top_News/World-News/2026/08/23/Netanyahu-issues-threat-Hamas-over-kites-floating/9821787528452/", "reliability": 4}], "en": {"title": "Israel kills three in Gaza as Netanyahu threatens strikes over kite launches", "summary": "Israeli strikes killed at least three Palestinians in Gaza, including a 4-year-old child, as Prime Minister Netanyahu and Defense Minister Katz warned of intensified attacks unless children's kites and balloons launched from Gaza stop.", "detail": "Strikes hit a warehouse in az-Zawayda, areas on Salah al-Din Street, al-Shujaiyya and Khan Younis, wounding several more including a journalist. The Israeli military said it found nothing suspicious on the kites, but Netanyahu and Katz said in a joint statement the IDF would \"act to increase targeted strikes\" and evacuate populations from launch areas. Hamas spokesman Hazem Qassem dismissed the kites as \"children's toys\" and called the threats \"fabricated pretexts\" for continued attacks. At least 1,286 Palestinians have been killed since the October 2025 ceasefire began, part of a toll that has now passed 73,400 since the war started. The strikes come as the Board of Peace's Hamas disarmament roadmap remains stalled.", "terms": [{"match": "Board of Peace", "id": "board-of-peace"}]}, "it": {"title": "Israele uccide tre persone a Gaza, Netanyahu minaccia attacchi per il lancio di aquiloni", "summary": "Attacchi israeliani hanno ucciso almeno tre palestinesi a Gaza, tra cui un bambino di 4 anni, mentre il premier Netanyahu e il ministro della Difesa Katz minacciano attacchi più intensi se non cesseranno i lanci di aquiloni e palloncini dei bambini da Gaza.", "detail": "Gli attacchi hanno colpito un magazzino ad az-Zawayda, zone di Salah al-Din Street, al-Shujaiyya e Khan Younis, ferendo diverse altre persone tra cui un giornalista. L'esercito israeliano ha detto di non aver trovato nulla di sospetto sugli aquiloni, ma Netanyahu e Katz hanno dichiarato congiuntamente che l'IDF \"agirà per intensificare gli attacchi mirati\" ed evacuerà la popolazione dalle zone di lancio. Il portavoce di Hamas Hazem Qassem ha liquidato gli aquiloni come \"giocattoli per bambini\" definendo le minacce \"pretesti fabbricati\" per giustificare nuovi attacchi. Almeno 1.286 palestinesi sono stati uccisi dall'inizio del cessate il fuoco di ottobre 2025, in un bilancio complessivo che ha ormai superato i 73.400 morti dall'inizio della guerra. Gli attacchi arrivano mentre la road map del Board of Peace per il disarmo di Hamas resta in stallo.", "terms": [{"match": "Board of Peace", "id": "board-of-peace"}]}}, {"id": "ukraine-putin-warning-aug22", "date": "2026-08-22", "country": "Ukraine", "category": "Geopolitics", "topics": ["russia-ukraine"], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/22/russian-strikes-kill-6-people-in-ukraine-day-after-shopping-complex-attack", "reliability": 4}, {"name": "The Moscow Times", "url": "https://www.themoscowtimes.com/2026/08/21/russian-double-tap-strike-on-shopping-mall-in-ukraine-kills-15-and-wounds-130-a93557", "reliability": 4}], "en": {"title": "Putin warns of 'far more destructive' strikes as Ukraine mourns mall attack", "summary": "A day after a Russian double-tap drone strike on a shopping mall in Kryvyi Rih killed 16 people and wounded around 130, fresh Russian strikes killed at least 7 more across Ukraine while Ukrainian attacks on Russia killed 10, and President Putin warned retaliation would be \"far more painful and far more destructive.\"", "detail": "Putin said Ukraine \"opened this Pandora's box itself\" by targeting Russian economic infrastructure with deep drone strikes, framing Moscow's response as proportionate escalation. Both sides are increasingly hitting economic targets far from the front line rather than just military ones. France pledged $58 million in humanitarian aid and Germany $12 million for Ukrainian energy defense as European allies moved to speed up military aid deliveries, including air-defense systems, as winter approaches with Ukraine's Patriot interceptor stocks running low.", "terms": [{"match": "Patriot interceptor", "id": "patriot"}]}, "it": {"title": "Putin minaccia attacchi \"molto più distruttivi\" mentre l'Ucraina piange l'attacco al centro commerciale", "summary": "Un giorno dopo un attacco russo con droni \"a doppio colpo\" su un centro commerciale a Kryvyi Rih che ha ucciso 16 persone e ferito circa 130, nuovi attacchi russi hanno ucciso almeno altre 7 persone in tutta l'Ucraina mentre gli attacchi ucraini in Russia ne hanno uccise 10, e il presidente Putin ha avvertito che la ritorsione sarà \"molto più dolorosa e molto più distruttiva\".", "detail": "Putin ha detto che l'Ucraina \"ha aperto da sola questo vaso di Pandora\" colpendo le infrastrutture economiche russe con attacchi di droni in profondità, presentando la risposta di Mosca come un'escalation proporzionata. Entrambe le parti colpiscono sempre più spesso obiettivi economici lontani dal fronte anziché solo militari. La Francia ha promesso 58 milioni di dollari di aiuti umanitari e la Germania 12 milioni per la difesa energetica ucraina, mentre gli alleati europei si muovono per accelerare le consegne di aiuti militari, compresi i sistemi di difesa aerea, con l'avvicinarsi dell'inverno e le scorte ucraine di intercettori Patriot in esaurimento.", "terms": [{"match": "intercettori Patriot", "id": "patriot"}]}}, {"id": "canada-us-tariff-retaliation-aug22", "date": "2026-08-22", "country": "Canada", "category": "Economy", "topics": ["mercato-investimenti"], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/23/canada-us-and-tit-for-tat-tariffs-how-will-it-impact-their-economies", "reliability": 4}, {"name": "CBS News", "url": "https://www.cbsnews.com/news/u-s-set-to-impose-50-percent-tariffs-on-canada-after-failed-talks/", "reliability": 4}], "en": {"title": "Canada vows 'dollar for dollar' retaliation as US-Canada tariff talks collapse", "summary": "Trade negotiations between Canada and the US broke down, prompting Prime Minister Mark Carney to announce Canada would match Washington's 50% tariffs on roughly $20 billion of Canadian goods with retaliatory measures of its own, \"dollar for dollar.\"", "detail": "The US tariffs, covering more than 500 product categories including dairy, lumber and manufactured goods, apply even to items that meet the CUSMA trade-deal's rules of origin. Canada's retaliatory tariffs on US steel, dairy, appliances and farm equipment are set to take effect September 8. Roughly 73% of Canada's exports go to the US, worth about $409 billion a year, but the goods actually hit by the new tariffs represent only around 5% of total Canadian exports. Economists warned that costs, unemployment and consumer prices will still rise on both sides of the border, hitting the alcohol and dairy sectors hardest. The US tariffs remain grounded in Section 338 of the 1930 Trade Act, the rarely used provision Trump invoked in July.", "terms": [{"match": "Section 338", "id": "section-338"}]}, "it": {"title": "Il Canada promette ritorsioni \"dollaro per dollaro\" dopo il crollo dei negoziati sui dazi con gli USA", "summary": "I negoziati commerciali tra Canada e Stati Uniti sono falliti, spingendo il premier Mark Carney ad annunciare che il Canada risponderà ai dazi del 50% imposti da Washington su circa 20 miliardi di dollari di merci canadesi con proprie misure di ritorsione, \"dollaro per dollaro\".", "detail": "I dazi USA, che coprono oltre 500 categorie di prodotti tra cui latticini, legname e beni manufatti, si applicano anche a prodotti conformi alle regole d'origine dell'accordo commerciale CUSMA. I dazi di ritorsione del Canada su acciaio, latticini, elettrodomestici e macchinari agricoli statunitensi entreranno in vigore l'8 settembre. Circa il 73% delle esportazioni canadesi va verso gli USA, per un valore di circa 409 miliardi di dollari l'anno, ma i beni effettivamente colpiti dai nuovi dazi rappresentano solo circa il 5% delle esportazioni totali canadesi. Gli economisti avvertono che costi, disoccupazione e prezzi al consumo aumenteranno comunque su entrambi i lati del confine, colpendo soprattutto i settori degli alcolici e dei latticini. I dazi USA restano fondati sulla Section 338 del Trade Act del 1930, la disposizione raramente usata invocata da Trump a luglio.", "terms": [{"match": "Section 338", "id": "section-338"}]}}, {"id": "nvidia-price-hikes-aug22", "date": "2026-08-22", "country": "USA", "category": "Technology", "topics": ["ai"], "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-22/nvidia-customers-notified-about-ai-related-price-hikes-above-15", "reliability": 4}, {"name": "CNBC", "url": "https://www.cnbc.com/2026/08/22/nvidia-customers-reportedly-warned-about-ai-related-price-hikes-.html", "reliability": 4}], "en": {"title": "Nvidia warns customers of AI server price hikes above 15%", "summary": "Nvidia has told its biggest customers to expect price increases of more than 15% on AI servers built around its upcoming Vera Rubin and Grace Blackwell platforms, as soaring memory-chip costs squeeze the AI supply chain.", "detail": "The increases are driven largely by a global shortage of high-bandwidth memory (HBM) and DRAM, as memory makers prioritize AI customers over other buyers, pushing component costs sharply higher industry-wide. The move comes as scrutiny intensifies over whether roughly $600 billion in annual AI capital spending by Big Tech is sustainable, with investors increasingly wary of \"circular\" financing arrangements propping up chip demand between suppliers, cloud providers and AI labs like OpenAI.", "terms": [{"match": "high-bandwidth memory", "id": "hbm-shortage"}]}, "it": {"title": "Nvidia avverte i clienti di rincari oltre il 15% sui server AI", "summary": "Nvidia ha comunicato ai suoi maggiori clienti di aspettarsi aumenti di prezzo superiori al 15% sui server AI basati sulle prossime piattaforme Vera Rubin e Grace Blackwell, mentre l'impennata dei costi dei chip di memoria mette sotto pressione la filiera dell'intelligenza artificiale.", "detail": "Gli aumenti sono dovuti in gran parte a una carenza globale di memoria ad alta larghezza di banda (HBM) e DRAM, poiché i produttori di memoria danno priorità ai clienti AI rispetto agli altri acquirenti, facendo salire nettamente i costi dei componenti in tutto il settore. La mossa arriva mentre cresce lo scrutinio su quanto sia sostenibile la spesa in conto capitale per l'AI di Big Tech, pari a circa 600 miliardi di dollari l'anno, con investitori sempre più diffidenti verso accordi di finanziamento \"circolari\" che sostengono artificialmente la domanda di chip tra fornitori, cloud provider e laboratori AI come OpenAI.", "terms": [{"match": "memoria ad alta larghezza di banda", "id": "hbm-shortage"}]}}, {"id": "trump-carlson-maga-split-aug22", "date": "2026-08-22", "country": "USA", "category": "Politics", "topics": ["politica-internazionale", "us-iran"], "sources": [{"name": "Newsweek", "url": "https://www.newsweek.com/donald-trump-roasts-tucker-carlson-new-maga-party-poll-12355575", "reliability": 3}, {"name": "The Hill", "url": "https://thehill.com/homenews/administration/6045142-trump-insults-republicans-over-beef/", "reliability": 4}], "en": {"title": "Trump brands Tucker Carlson, Greene and Massie 'LOSERS ALL' as MAGA split widens", "summary": "President Trump lashed out at Tucker Carlson, former Rep. Marjorie Taylor Greene and Rep. Thomas Massie on Truth Social, calling them \"LOSERS ALL,\" after the trio met at Carlson's Maine home to discuss a breakaway \"America First\" political movement.", "detail": "The rift traces back to the February 2026 Iran war, which Carlson and allies see as fought for Israel's benefit rather than American interests; Carlson has not spoken to Trump since visiting the Oval Office that month. Greene resigned from Congress and Massie lost a primary, both citing disputes with Trump including over releasing the Epstein files. Polling shows Carlson far behind Vice President Vance and Secretary Rubio for the 2028 Republican nomination, with only about 1.6% support, though a Gallup poll found 62% of Americans believe a third party is needed.", "terms": [{"match": "Iran war", "id": "hormuz"}]}, "it": {"title": "Trump bolla Tucker Carlson, Greene e Massie come \"TUTTI PERDENTI\" mentre la spaccatura MAGA si allarga", "summary": "Il presidente Trump ha attaccato su Truth Social Tucker Carlson, l'ex deputata Marjorie Taylor Greene e il deputato Thomas Massie, definendoli \"TUTTI PERDENTI\", dopo che il trio si è incontrato nella casa di Carlson nel Maine per discutere un movimento politico scissionista \"America First\".", "detail": "La frattura risale alla guerra in Iran di febbraio 2026, che Carlson e i suoi alleati considerano combattuta a beneficio di Israele più che degli interessi americani; Carlson non parla con Trump da quando visitò lo Studio Ovale quel mese. Greene si è dimessa dal Congresso e Massie ha perso una primaria, entrambi citando contrasti con Trump anche sul rilascio dei file Epstein. I sondaggi danno Carlson molto indietro rispetto al vicepresidente Vance e al segretario Rubio per la nomination repubblicana 2028, con solo circa l'1,6% di consensi, anche se un sondaggio Gallup ha rilevato che il 62% degli americani ritiene necessario un terzo partito.", "terms": [{"match": "guerra in Iran", "id": "hormuz"}]}}, {"id": "hyundai-full-strike-aug22", "date": "2026-08-22", "country": "South Korea", "category": "Social", "topics": [], "sources": [{"name": "Manila Times (AFP)", "url": "https://www.manilatimes.net/2026/08/22/business/foreign-business/hyundais-south-korean-union-stages-first-full-strike/2409933", "reliability": 3}, {"name": "KED Global", "url": "https://www.kedglobal.com/labor-union/newsView/ked202608210001", "reliability": 3}], "en": {"title": "Hyundai's 40,000-strong union stages first full-day strike in a decade", "summary": "Around 40,000 Hyundai Motor union members walked off the job in South Korea's first full-day strike at the company in ten years, after wage talks collapsed over pay, retirement age and job protection against AI and automation.", "detail": "Roughly 3,000 workers rallied at Hyundai's Seoul headquarters. Previous partial walkouts since late July had already disrupted production of about 55,200 vehicles worth over 2.3 trillion won ($1.67 billion). The union is demanding a higher mandatory retirement age above 60, bonuses raised from 750% to 800% of monthly base salary, and safeguards for workers as the industry shifts toward automation and robotics. Hyundai said it remains \"committed to finding solutions through dialogue.\" The strike reflects a wider rise in labor activism in South Korea since the election of pro-labor President Lee Jae-myung.", "terms": [{"match": "AI and automation", "id": "hbm-shortage"}]}, "it": {"title": "Il sindacato Hyundai, 40.000 lavoratori, lancia il primo sciopero a giornata piena in dieci anni", "summary": "Circa 40.000 iscritti al sindacato Hyundai Motor hanno incrociato le braccia nel primo sciopero a giornata piena dell'azienda in Corea del Sud da dieci anni, dopo il fallimento dei negoziati salariali su retribuzioni, età pensionabile e tutela del lavoro di fronte ad automazione e intelligenza artificiale.", "detail": "Circa 3.000 lavoratori si sono radunati nella sede di Seoul di Hyundai. Precedenti scioperi parziali da fine luglio avevano già interrotto la produzione di circa 55.200 veicoli per un valore di oltre 2.300 miliardi di won (1,67 miliardi di dollari). Il sindacato chiede un innalzamento dell'età pensionabile obbligatoria oltre i 60 anni, bonus aumentati dal 750% all'800% dello stipendio base mensile, e garanzie per i lavoratori mentre il settore si sposta verso automazione e robotica. Hyundai ha dichiarato di restare \"impegnata a trovare soluzioni attraverso il dialogo\". Lo sciopero riflette una più ampia crescita dell'attivismo sindacale in Corea del Sud dopo l'elezione del presidente filo-sindacale Lee Jae-myung.", "terms": [{"match": "automazione e intelligenza artificiale", "id": "hbm-shortage"}]}}, {"id": "drc-ebola-ervebo-vaccine-aug20", "date": "2026-08-20", "country": "DR Congo", "category": "Medicine", "topics": [], "sources": [{"name": "Associated Press (via PBS NewsHour)", "url": "https://www.pbs.org/newshour/health/congo-to-receive-70000-doses-of-ervebo-ebola-vaccine-which-was-effective-in-past-outbreaks", "reliability": 4}, {"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/20/dr-congo-to-receive-70000-doses-of-ervebo-vaccine-as-ebola-infections-surge", "reliability": 4}], "en": {"title": "DR Congo to receive 70,000 doses of Ervebo vaccine, unproven against this Ebola strain", "summary": "The Democratic Republic of Congo will receive 70,000 doses of the Ervebo Ebola vaccine — 20,000 for a Phase 3 clinical trial and 50,000 for frontline health workers — even though the vaccine is licensed only against a different Ebola species than the Bundibugyo strain driving this outbreak.", "detail": "As of the allocation, the outbreak had reached 5,208 confirmed cases and 2,476 deaths across six provinces, a 47.5% case-fatality rate that climbs to 70% in harder-to-reach parts of North Kivu — making it the fastest-growing Ebola outbreak on record, spreading roughly three times faster than the 2014-2016 West African epidemic. The WHO said \"it is not known whether Ervebo may be protective against the Bundibugyo virus in humans,\" underscoring why clinical-trial data is needed. Gavi, the vaccine alliance, is funding $7 million for shipment and $6 million for vaccination efforts in high-risk areas.", "terms": [{"match": "Ervebo", "id": "ervebo-vaccine"}, {"match": "Bundibugyo strain", "id": "bundibugyo"}]}, "it": {"title": "La RD Congo riceverà 70.000 dosi del vaccino Ervebo, non provato contro questo ceppo di Ebola", "summary": "La Repubblica Democratica del Congo riceverà 70.000 dosi del vaccino anti-Ebola Ervebo — 20.000 per uno studio clinico di Fase 3 e 50.000 per gli operatori sanitari in prima linea — anche se il vaccino è autorizzato solo contro una specie di Ebola diversa dal ceppo Bundibugyo che guida questa epidemia.", "detail": "Al momento dell'assegnazione, l'epidemia aveva raggiunto 5.208 casi confermati e 2.476 morti in sei province, un tasso di letalità del 47,5% che sale al 70% nelle zone più difficili da raggiungere del Nord Kivu — rendendola l'epidemia di Ebola in più rapida crescita mai registrata, che si diffonde circa tre volte più velocemente di quella dell'Africa occidentale del 2014-2016. L'OMS ha dichiarato che \"non si sa se Ervebo possa essere protettivo contro il virus Bundibugyo nell'uomo\", sottolineando perché servano dati da studi clinici. Gavi, l'alleanza per i vaccini, finanzia 7 milioni di dollari per la spedizione e 6 milioni per gli sforzi di vaccinazione nelle aree ad alto rischio.", "terms": [{"match": "Ervebo", "id": "ervebo-vaccine"}, {"match": "ceppo Bundibugyo", "id": "bundibugyo"}]}}, {"id": "gaza-strikes-four-aug24", "date": "2026-08-24", "country": "Palestine", "category": "Geopolitics", "topics": ["israel-palestine"], "sources": [{"name": "Associated Press (via Click2Houston)", "url": "https://www.click2houston.com/news/world/2026/08/24/2-children-among-4-killed-in-gaza-a-week-after-us-asked-israel-to-curb-attacks/", "reliability": 5}, {"name": "Haaretz", "url": "https://www.haaretz.com/israel-news/israel-security/2026-08-25/ty-article-live/two-children-among-four-people-killed-in-gaza-strikes-officials-say/000001a0-3656-dfc3-abf8-b656da950000", "reliability": 4}], "en": {"title": "Israeli strikes kill four in Gaza, including two children, a week after US urged restraint", "summary": "Israeli strikes and tank fire hit the Bureij and Shati refugee camps, Gaza City, Deir al-Balah and Khan Younis, killing at least four Palestinians, including two children aged 4 and 10.", "detail": "The strikes came exactly one week after US envoy Jared Kushner met Prime Minister Netanyahu and reportedly asked him to draw down Israel's attacks in Gaza as part of the Board of Peace roadmap. Israel said it targeted Hamas weapons storage sites, including some located in mosques, and described the strikes as responses to ceasefire violations. Palestinian officials said the strikes hit civilian infrastructure. Gaza's health ministry says roughly 1,288 Palestinians have been killed by Israeli fire since the nominal ceasefire began in October 2025.", "terms": [{"match": "Board of Peace roadmap", "id": "board-of-peace"}, {"match": "Jared Kushner", "id": "board-of-peace"}]}, "it": {"title": "Attacchi israeliani uccidono quattro persone a Gaza, tra cui due bambini, una settimana dopo l'appello USA alla moderazione", "summary": "Attacchi israeliani e colpi di carro armato hanno colpito i campi profughi di Bureij e Shati, Gaza City, Deir al-Balah e Khan Younis, uccidendo almeno quattro palestinesi, tra cui due bambini di 4 e 10 anni.", "detail": "Gli attacchi arrivano esattamente una settimana dopo che l'inviato USA Jared Kushner ha incontrato il premier Netanyahu chiedendogli, secondo fonti, di ridurre gli attacchi israeliani a Gaza nell'ambito della road map del Board of Peace. Israele ha dichiarato di aver colpito depositi di armi di Hamas, alcuni situati in moschee, definendo gli attacchi risposte a violazioni del cessate il fuoco. I funzionari palestinesi sostengono che i raid abbiano colpito infrastrutture civili. Il ministero della Salute di Gaza stima che circa 1.288 palestinesi siano stati uccisi dal fuoco israeliano dall'inizio del cessate il fuoco nominale nell'ottobre 2025.", "terms": [{"match": "road map del Board of Peace", "id": "board-of-peace"}, {"match": "Jared Kushner", "id": "board-of-peace"}]}}, {"id": "ukraine-independence-day-strikes-aug24", "date": "2026-08-24", "country": "Ukraine", "category": "Geopolitics", "topics": ["russia-ukraine"], "sources": [{"name": "The Kyiv Independent", "url": "https://kyivindependent.com/russia-attacks-ukraine-with-72-drones-ballistic-missile-on-independence-day/", "reliability": 3}, {"name": "U.S. News & World Report (AP)", "url": "https://www.usnews.com/news/world/articles/2026-08-24/burnham-and-european-leaders-arrive-in-kyiv-as-ukraine-marks-independence-day", "reliability": 4}], "en": {"title": "Russia strikes Ukraine on its 35th Independence Day as European leaders visit Kyiv", "summary": "Russia fired 72 drones and a ballistic missile at Ukraine overnight on Independence Day, killing three people, as UK Prime Minister Andy Burnham and other European leaders arrived in Kyiv to show solidarity.", "detail": "Ukrainian air defenses intercepted 48 of the drones, but 24 Shahed drones and the missile struck ten locations, killing people in Donetsk, Kherson and Dnipropetrovsk oblasts and wounding several others, including a child. During his visit, Burnham announced plans to share Storm Shadow missile blueprints with Ukraine to help it build its own long-range strike capability, and European officials pressed Washington on releasing more Patriot interceptors from US stockpiles.", "terms": [{"match": "Storm Shadow missile", "id": "storm-shadow"}, {"match": "Patriot interceptors", "id": "patriot"}]}, "it": {"title": "La Russia colpisce l'Ucraina nel giorno del 35° anniversario dell'indipendenza mentre i leader europei visitano Kyiv", "summary": "La Russia ha lanciato 72 droni e un missile balistico sull'Ucraina nella notte del giorno dell'Indipendenza, uccidendo tre persone, mentre il premier britannico Andy Burnham e altri leader europei arrivavano a Kyiv per un gesto di solidarietà.", "detail": "La difesa aerea ucraina ha intercettato 48 droni, ma 24 droni Shahed e il missile hanno colpito dieci località, uccidendo persone nelle regioni di Donetsk, Kherson e Dnipropetrovsk e ferendone diverse altre, tra cui un bambino. Durante la visita, Burnham ha annunciato l'intenzione di condividere con l'Ucraina i progetti dei missili Storm Shadow per aiutarla a costruire una propria capacità di attacco a lungo raggio, mentre i funzionari europei hanno fatto pressione su Washington per ottenere più intercettori Patriot dalle scorte statunitensi.", "terms": [{"match": "missili Storm Shadow", "id": "storm-shadow"}, {"match": "intercettori Patriot", "id": "patriot"}]}}, {"id": "scotus-mail-voting-aug24", "date": "2026-08-24", "country": "USA", "category": "Politics", "topics": ["politica-internazionale"], "sources": [{"name": "NPR", "url": "https://www.npr.org/2026/08/24/nx-s1-5909592/trump-mail-voting-order-supreme-court", "reliability": 5}, {"name": "NBC News", "url": "https://www.nbcnews.com/politics/supreme-court/supreme-court-hands-preliminary-win-trump-mail-ballots-executive-order-rcna590120", "reliability": 4}], "en": {"title": "Supreme Court lets Trump's mail-in ballot restrictions move forward ahead of midterms", "summary": "The Supreme Court handed the Trump administration a preliminary win, allowing parts of an executive order restricting mail-in balloting to proceed while litigation continues, months before the midterm elections.", "detail": "The order targets rules on ballot deadlines and identification requirements for mail-in voting, which Trump has long claimed—without evidence—is prone to fraud. Lower courts had blocked parts of the order; the Supreme Court's decision lets those provisions take effect for now. Democratic-leaning states and voting-rights groups warned the ruling could complicate voting for millions of Americans who rely on mail ballots ahead of the November midterms.", "terms": [{"match": "midterm elections", "id": "continuing-resolution"}]}, "it": {"title": "La Corte Suprema consente di procedere con le restrizioni di Trump al voto per posta prima delle elezioni di metà mandato", "summary": "La Corte Suprema ha concesso all'amministrazione Trump una vittoria preliminare, permettendo che parti di un ordine esecutivo che limita il voto per posta procedano mentre il contenzioso prosegue, mesi prima delle elezioni di metà mandato.", "detail": "L'ordine riguarda le regole sulle scadenze per l'invio delle schede e i requisiti di identificazione per il voto per posta, che Trump sostiene da tempo — senza prove — sia soggetto a frodi. I tribunali inferiori avevano bloccato parte dell'ordine; la decisione della Corte Suprema consente per ora a quelle disposizioni di entrare in vigore. Gli stati a guida democratica e i gruppi per i diritti di voto avvertono che la sentenza potrebbe complicare il voto per milioni di americani che dipendono dalle schede postali in vista delle elezioni di midterm di novembre.", "terms": [{"match": "elezioni di metà mandato", "id": "continuing-resolution"}]}}, {"id": "lula-trump-tariff-call-aug21", "date": "2026-08-21", "country": "Brazil", "category": "Economy", "topics": ["mercato-investimenti"], "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-21/lula-calls-trump-to-seek-renewed-talks-over-us-tariffs-on-brazil", "reliability": 4}, {"name": "WHBL (Reuters)", "url": "https://whbl.com/2026/08/21/lula-trump-discuss-tariffs-in-phone-call-brazil-says/", "reliability": 4}], "en": {"title": "Lula calls Trump seeking renewed talks over US tariffs on Brazil", "summary": "Brazilian President Luiz Inacio Lula da Silva phoned Donald Trump to push for a resumption of negotiations over the 25-40% US tariffs weighing on Brazilian exports, with Trump saying officials from both sides should meet soon.", "detail": "The call is the highest-level contact between the two leaders since Brazil began exploring retaliatory options earlier in August. Brasilia says the tariffs, imposed after a Section 301 investigation, have hit sectors from steel to coffee and threaten October's presidential election dynamics, as Lula seeks a fourth term partly on a platform of defending national economic sovereignty against Washington.", "terms": [{"match": "Section 301 investigation", "id": "section-301"}]}, "it": {"title": "Lula telefona a Trump per chiedere la ripresa dei negoziati sui dazi USA al Brasile", "summary": "Il presidente brasiliano Luiz Inacio Lula da Silva ha telefonato a Donald Trump per sollecitare la ripresa dei negoziati sui dazi USA del 25-40% che pesano sulle esportazioni brasiliane; Trump ha detto che i funzionari dei due Paesi dovrebbero incontrarsi presto.", "detail": "La telefonata è il contatto di più alto livello tra i due leader da quando il Brasile ha iniziato a esplorare opzioni di ritorsione all'inizio di agosto. Brasilia sostiene che i dazi, imposti dopo un'indagine ai sensi della Section 301, abbiano colpito settori che vanno dall'acciaio al caffè e minaccino le dinamiche delle elezioni presidenziali di ottobre, mentre Lula punta a un quarto mandato puntando in parte sulla difesa della sovranità economica nazionale contro Washington.", "terms": [{"match": "indagine ai sensi della Section 301", "id": "section-301"}]}}, {"id": "micron-nvidia-week-aug24", "date": "2026-08-24", "country": "USA", "category": "Technology", "topics": ["ai"], "sources": [{"name": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-08-24/us-futures-drop-as-investors-prep-for-busy-week-nvidia-earnings", "reliability": 4}, {"name": "The Motley Fool", "url": "https://www.fool.com/investing/2026/08/24/nasdaq-slips-as-micron-falls-starting-nvidia-week/", "reliability": 3}], "en": {"title": "Nasdaq slips as Micron falls 6% heading into Nvidia's earnings week", "summary": "US tech stocks retreated, with Micron shares dropping about 6-7%, as investors braced for Nvidia's closely watched quarterly results on August 26 and the Federal Reserve's Jackson Hole gathering.", "detail": "Micron's slide came despite the memory-chip maker already having its 2026 output sold out, reflecting broader investor jitters over whether soaring AI capital spending will keep paying off. Nvidia's results are seen as a bellwether for the entire AI trade, with analysts split between confidence in continued chip demand and growing worries about high-bandwidth-memory shortages inflating costs across the supply chain.", "terms": [{"match": "high-bandwidth-memory shortages", "id": "hbm-shortage"}]}, "it": {"title": "Il Nasdaq scivola mentre Micron perde il 6% in vista della settimana degli utili di Nvidia", "summary": "I titoli tecnologici USA sono arretrati, con le azioni Micron in calo di circa il 6-7%, mentre gli investitori si preparavano ai risultati trimestrali di Nvidia molto attesi del 26 agosto e al simposio della Federal Reserve a Jackson Hole.", "detail": "Il calo di Micron è arrivato nonostante il produttore di chip di memoria abbia già venduto tutta la produzione 2026, riflettendo il nervosismo più ampio degli investitori sul fatto che la crescente spesa in conto capitale per l'IA continuerà a ripagare. I risultati di Nvidia sono visti come un indicatore per l'intero comparto AI, con gli analisti divisi tra fiducia nella domanda di chip e crescenti preoccupazioni per la carenza di memoria ad alta larghezza di banda che gonfia i costi lungo la catena di fornitura.", "terms": [{"match": "carenza di memoria ad alta larghezza di banda", "id": "hbm-shortage"}]}}, {"id": "hyundai-wage-deal-aug25", "date": "2026-08-25", "country": "South Korea", "category": "Social", "topics": [], "sources": [{"name": "France 24 (AFP)", "url": "https://www.france24.com/en/live-news/20260824-hyundai-union-back-in-wage-talks-after-rare-full-day-strike", "reliability": 4}, {"name": "KFGO (Yonhap)", "url": "https://kfgo.com/2026/08/24/hyundai-motors-union-reaches-tentative-wage-deal-with-management-yonhap-reports/", "reliability": 3}], "en": {"title": "Hyundai union reaches tentative wage deal, ending its first full strike in a decade", "summary": "Hyundai Motor's South Korean union reached a tentative agreement with management, including a monthly base pay rise, a bonus worth 400% of base salary, and 500 new technical hires through 2028, ending the standoff that produced the company's first full-day strike since 2016.", "detail": "The deal also extends the retirement age beyond 60 without a pay cut for those extra years, pending a legal amendment, and commits both sides to further talks on job protections as Hyundai—owner of robotics firm Boston Dynamics—prepares to deploy humanoid robots at its Georgia plant from 2028. The union had walked out after rejecting management's earlier offer, demanding stronger safeguards against automation and higher bonuses tied to record profits.", "terms": [{"match": "Boston Dynamics", "id": "boston-dynamics"}]}, "it": {"title": "Il sindacato Hyundai raggiunge un accordo salariale provvisorio, chiudendo il primo sciopero pieno in dieci anni", "summary": "Il sindacato sudcoreano di Hyundai Motor ha raggiunto un accordo provvisorio con l'azienda, che prevede un aumento dello stipendio base mensile, un bonus pari al 400% dello stipendio base e 500 nuove assunzioni tecniche entro il 2028, ponendo fine allo scontro che aveva prodotto il primo sciopero a giornata piena dell'azienda dal 2016.", "detail": "L'accordo estende inoltre l'età pensionabile oltre i 60 anni senza taglio salariale per gli anni aggiuntivi, in attesa di una modifica di legge, e impegna entrambe le parti a proseguire i colloqui sulle tutele occupazionali, mentre Hyundai — proprietaria della società di robotica Boston Dynamics — si prepara a impiegare robot umanoidi nel suo stabilimento in Georgia a partire dal 2028. Il sindacato aveva incrociato le braccia dopo aver respinto la precedente offerta dell'azienda, chiedendo tutele più forti contro l'automazione e bonus più alti legati ai profitti record.", "terms": [{"match": "Boston Dynamics", "id": "boston-dynamics"}]}}, {"id": "drc-ebola-100days-aug24", "date": "2026-08-24", "country": "DR Congo", "category": "Medicine", "topics": [], "sources": [{"name": "UN News", "url": "https://news.un.org/en/story/2026/08/1168195", "reliability": 5}, {"name": "WHO Regional Office for Africa", "url": "https://www.afro.who.int/countries/democratic-republic-of-congo/news/over-5200-cases-recorded-democratic-republic-congocrosses100-days-ebola-outbreak-declaration", "reliability": 5}], "en": {"title": "DR Congo's record Ebola outbreak passes 100 days, with 5,515 cases and 2,642 deaths", "summary": "One hundred days after being declared, DR Congo's Bundibugyo-strain Ebola outbreak has reached 5,515 confirmed cases and 2,642 deaths, a roughly 48% fatality rate, WHO chief Tedros Adhanom Ghebreyesus said the epidemic can still be brought under control.", "detail": "The response has scaled up sharply — testing capacity grew from one to 19 laboratories, treatment beds from under 10 to more than 1,300, and contact tracing coverage from 9% to 84% — but roughly 60% of deaths still occur outside treatment centers, reflecting how insecurity and displacement in eastern DR Congo keep blocking early detection. The UN is now pushing to raise surveillance coverage to 95% and expand treatment capacity to 3,000 beds.", "terms": [{"match": "Bundibugyo-strain Ebola outbreak", "id": "bundibugyo"}, {"match": "Tedros Adhanom Ghebreyesus", "id": "ebola"}]}, "it": {"title": "L'epidemia record di Ebola in RD Congo supera i 100 giorni, con 5.515 casi e 2.642 morti", "summary": "Cento giorni dopo la dichiarazione, l'epidemia di Ebola da ceppo Bundibugyo in RD Congo ha raggiunto 5.515 casi confermati e 2.642 morti, un tasso di letalità di circa il 48%; il direttore dell'OMS Tedros Adhanom Ghebreyesus ha detto che l'epidemia può ancora essere portata sotto controllo.", "detail": "La risposta è stata potenziata in modo netto — la capacità di test è passata da un laboratorio a 19, i posti letto per il trattamento da meno di 10 a oltre 1.300, e la copertura del tracciamento dei contatti dal 9% all'84% — ma circa il 60% dei decessi avviene ancora fuori dai centri di trattamento, segno di come l'insicurezza e gli sfollamenti nell'est della RD Congo continuino a ostacolare la diagnosi precoce. Le Nazioni Unite spingono ora per portare la copertura della sorveglianza al 95% e ampliare la capacità di trattamento a 3.000 posti letto.", "terms": [{"match": "epidemia di Ebola da ceppo Bundibugyo", "id": "bundibugyo"}, {"match": "Tedros Adhanom Ghebreyesus", "id": "ebola"}]}}, {"id": "ukraine-wildberries-strike-aug26", "date": "2026-08-26", "country": "Russia", "category": "Geopolitics", "topics": ["russia-ukraine"], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/economy/2026/8/26/ukrainian-drone-attacks-kill-3-as-fire-destroys-wildberries-warehouse", "reliability": 4}, {"name": "The Moscow Times", "url": "https://www.themoscowtimes.com/2026/08/26/3-killed-in-russia-as-ukraine-sets-wildberries-warehouse-and-oil-refinery-ablaze-a93577", "reliability": 4}], "en": {"title": "Ukrainian drones destroy Wildberries warehouse in Russia's Tambov region, kill three", "summary": "A large Ukrainian drone attack set ablaze a Wildberries e-commerce warehouse in Kotovsk, Tambov region, destroying roughly 100,000 square metres, while separate strikes killed three people in Lipetsk and Belgorod.", "detail": "Russia said its air defences intercepted 426 drones overnight, including some aimed at an oil refinery, as Kyiv kept up its campaign against companies it accuses of supplying the Russian military — a charge Wildberries and Moscow deny. It is the second time in three weeks Ukraine has hit a Wildberries logistics hub deep inside Russia, after an August 7 strike on a facility near Yekaterinburg 2,000km from the front line, part of a broader pattern of long-range strikes on Russian energy and logistics infrastructure that has also targeted the Ust-Luga oil port.", "terms": [{"match": "Wildberries", "id": "wildberries"}]}, "it": {"title": "I droni ucraini distruggono un magazzino Wildberries nella regione russa di Tambov, tre morti", "summary": "Un ampio attacco di droni ucraini ha incendiato un magazzino dell'e-commerce Wildberries a Kotovsk, regione di Tambov, distruggendo circa 100.000 metri quadrati, mentre attacchi separati hanno ucciso tre persone a Lipetsk e Belgorod.", "detail": "La Russia ha detto che le sue difese aeree hanno intercettato 426 droni nella notte, alcuni diretti contro una raffineria di petrolio, mentre Kyiv prosegue la sua campagna contro aziende che accusa di rifornire l'esercito russo — accusa respinta sia da Wildberries sia da Mosca. È la seconda volta in tre settimane che l'Ucraina colpisce un polo logistico Wildberries in profondità nel territorio russo, dopo l'attacco del 7 agosto a un impianto vicino Yekaterinburg, a 2.000 km dal fronte, parte di un più ampio schema di attacchi a lungo raggio contro infrastrutture energetiche e logistiche russe che ha già preso di mira anche il porto petrolifero di Ust-Luga.", "terms": [{"match": "Wildberries", "id": "wildberries"}]}}, {"id": "gaza-aid-warehouse-strike-aug25", "date": "2026-08-25", "country": "Palestine", "category": "Geopolitics", "topics": ["israel-palestine"], "sources": [{"name": "Al Jazeera", "url": "https://www.aljazeera.com/news/2026/8/25/seven-killed-in-gaza-as-israeli-strike-destroys-aid-supply-warehouse", "reliability": 4}, {"name": "The National", "url": "https://www.thenationalnews.com/news/uk/2026/08/25/infant-food-warehouse-in-gaza-destroyed-by-israeli-strike/", "reliability": 3}], "en": {"title": "Israeli strike destroys Gaza aid warehouse storing supplies for malnourished children", "summary": "An Israeli strike destroyed a humanitarian warehouse in Gaza storing nutrition supplies for children, pregnant women and nursing mothers, as separate strikes across the strip killed seven Palestinians.", "detail": "The warehouse, run by aid groups Medical Aid for Palestinians (MAP) and Ard El Insan, was hit overnight, burying food aid under rubble. Gaza's Health Ministry warned of a 'complete collapse' of basic necessities, with only 12 of roughly 34 oxygen stations still operating; health official Dr Munir al-Bursh said 'if this oxygen supply stops, these people will die.' The strikes came despite the nominal October 2025 ceasefire and days after President Trump had publicly urged Israel to curb its attacks in Gaza.", "terms": [{"match": "Medical Aid for Palestinians (MAP)", "id": "gaza-healthcare-collapse"}]}, "it": {"t
